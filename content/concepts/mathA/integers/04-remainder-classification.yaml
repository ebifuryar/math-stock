id: it-remainder-classification
kind: method
title: 割り算の原理と余りによる整数の分類
body: |
  整数 $a$ と正の整数 $b$ に対して
  $$a=bq+r,\qquad 0\leqq r<b$$
  を満たす整数 $q,\ r$ がただ1組存在する（$q$ を商、$r$ を余りという）。

  したがって、すべての整数は $k$ を整数として、例えば
  $$3k,\quad 3k+1,\quad 3k+2$$
  のいずれか1つの形に表せる。「すべての整数 $n$ について〜」を示すときは、**余りのすべての場合**を漏れなく調べる（$3k+2$ の代わりに $3k-1$ と書いてもよい）。

  よく使う結果: $n^2$ を $3$ で割った余りは $0$ か $1$、$n^2$ を $4$ で割った余りは $0$ か $1$、奇数の平方を $8$ で割った余りは $1$。また、連続する $m$ 個の整数の積は $m!$ の倍数（$2$ 個なら偶数、$3$ 個なら $6$ の倍数）。

  （補足: 「$a$ と $b$ を $m$ で割った余りが等しい」ことを $a\equiv b\pmod{m}$ と書く記法（合同式）もある。）
prerequisites: [it-divisor-prime]
