author:
  intent: |
    同じ被積分関数・同じ区間で「定積分の値」と「面積」を続けて問い、符号付きの量と正の量を区別できるかをみる。(2) で $\dfrac{9}{2}$、(3) で $-\dfrac{9}{2}$ と答える（あるいは両方同じ符号にする）受験者を、空欄の符号で識別できる。(1) は積分定数を条件から決める基本操作の確認。
  assessedAbilities: [知識・技能]
  curriculumRefs: ["数学II (5) ア(ウ) 不定積分と定積分", "数学II (5) イ(イ) 定積分を用いた面積"]
  variations:
    - 区間を $-1\leqq x\leqq 3$ にして、$x$ 軸の上下にまたがる部分の面積（分けて積分）を問う。
