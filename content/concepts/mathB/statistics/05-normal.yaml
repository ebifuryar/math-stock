id: st-normal
kind: method
title: 正規分布・標準化と二項分布の正規近似
body: |
  確率密度関数が $f(x)=\dfrac{1}{\sqrt{2\pi}\,\sigma}e^{-\frac{(x-m)^2}{2\sigma^2}}$ である分布を **正規分布** $N(m,\ \sigma^2)$ という。$E(X)=m$、$\sigma(X)=\sigma$ で、グラフは直線 $x=m$ に関して対称な釣り鐘形。$N(m,\ \sigma^2)$ の第2成分は **分散** であることに注意する（$N(100,\ 4)$ なら標準偏差は $2$）。

  **標準化**：$X$ が $N(m,\ \sigma^2)$ に従うとき
  $$Z=\frac{X-m}{\sigma}$$
  は **標準正規分布** $N(0,\ 1)$ に従う。平均を引いてから標準偏差で割る。

  **正規分布表** は $p(z_0)=P(0\leqq Z\leqq z_0)$ の値を与える。対称性から

  - $P(Z\geqq z_0)=0.5-p(z_0)$、$P(Z\leqq -z_0)=0.5-p(z_0)$
  - $P(-z_0\leqq Z\leqq z_0)=2p(z_0)$。特に $P(|Z|\leqq 1.96)=0.95$、$P(|Z|\leqq 2.58)\fallingdotseq 0.99$

  表の値そのものは「$0$ から $z_0$ まで」の確率なので、求める範囲を図に描いてから $0.5$ との和・差をとる。

  **二項分布の正規近似**：$X$ が $B(n,\ p)$ に従うとき、$n$ が大きければ $X$ は近似的に $N(np,\ np(1-p))$ に従う。したがって $Z=\dfrac{X-np}{\sqrt{np(1-p)}}$ は近似的に $N(0,\ 1)$ に従う。
prerequisites: [st-continuous, st-binomial]
