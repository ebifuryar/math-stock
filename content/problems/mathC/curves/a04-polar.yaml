author:
  intent: |
    極座標と直交座標の相互変換を、点・直線・円・2次曲線の各段階で確認する。(1) は偏角の象限判断で、$\tan$ だけで決めて $\dfrac{\pi}{6}$ とすると (2) の直線も原点の反対側の直線 $\sqrt{3}\,x+y-4=0$ になり、誤りが連鎖する構成にした。(4) は離心率の読み取りと焦点が極にあることの確認で、極方程式 $r=\dfrac{\ell}{1+e\cos\theta}$ の意味を理解しているかをみる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(ウ) 極座標の意味及び曲線が極方程式で表されること]
  variations:
    - 極方程式 $r=\dfrac{2}{1+\cos\theta}$ を直交座標で表し、放物線 $y^2=-4(x-1)$ となることを確かめさせる。
    - 極座標で表された2点 $\left(2,\ \dfrac{\pi}{6}\right),\ \left(4,\ \dfrac{5}{6}\pi\right)$ と極を頂点とする三角形の面積を求めさせる。
