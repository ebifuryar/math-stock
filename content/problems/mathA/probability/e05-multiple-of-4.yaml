author:
  intent: |
    「$4$ の倍数」を素因数 $2$ の個数に翻訳し、余事象を適切に分類できるかをみる。$4$ の目を「偶数」とひとまとめにして「偶数がちょうど1回」（確率 $n\left(\dfrac{1}{2}\right)^n$）を除く誤り、(ii) で係数 $n$ を落とす誤り、$4$ の倍数を「偶数が2回以上」と同一視して $4$ の目1回の場合を落とす誤りなどを、採点基準 r2・r4 で識別する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: ["数学A (2) イ(ア) 確率とその基本的な法則", "数学A (2) イ(イ) 独立な試行と確率（反復試行）"]
  variations:
    - 「積が $6$ の倍数となる確率」に変え、$2$ の倍数と $3$ の倍数の包除原理 $1-\left(\dfrac{1}{2}\right)^n-\left(\dfrac{2}{3}\right)^n+\left(\dfrac{1}{3}\right)^n$ を使わせる。
    - 「積が $8$ の倍数となる確率」に拡張し、素因数 $2$ の個数が $2$ 個の場合の分類を加えさせる。
  notes: $n=1,2,3$ の値 $\dfrac{1}{6},\ \dfrac{5}{12},\ \dfrac{5}{8}$ は全数検査で確認済み。
