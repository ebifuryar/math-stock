id: it-integer-solutions
kind: method
title: 整数解の絞り込み（積の形・不等式・余り）
body: |
  方程式の整数解を求める基本手段は次の3つ。

  1. **積の形に変形**: $xy-2x-3y=0 \iff (x-3)(y-2)=6$ のように「(整数)×(整数)=定数」にして約数の組を調べる。負の約数の組も忘れずに検討する。
  2. **不等式で範囲を絞る**: $x\leqq y\leqq z$ などの大小関係を仮定し、$xyz=x+y+z\leqq 3z$ から $xy\leqq 3$ のように有限個の候補に絞る。対称な式では大小を仮定してよい（最後に並べ替えを考える）。
  3. **余りに注目**: 平方数を $3,\ 4,\ 8$ で割った余りは限られる（$n^2\equiv 0,1\pmod 4$ など）ので、両辺の余りが一致しないことから解がないことを示せる。

  $x^2-y^2=N$ は $(x+y)(x-y)=N$ とし、$x+y$ と $x-y$ の偶奇が一致することも使う。
prerequisites: [it-prime-factorization, it-remainder-classification]
