id: m2-el-e05
level: exam
format: written
title: 指数方程式の実数解の個数
stem: |
  $a$ を定数とする。$x$ についての方程式
  $$9^x-2a\cdot 3^x+2a+3=0$$
  について、次の問いに答えよ。

  (1) 異なる2つの実数解をもつような $a$ の値の範囲を求めよ。

  (2) ただ1つの実数解をもつような $a$ の値の範囲を求めよ。
modelAnswer: |
  $t=3^x$ とおくと $t>0$ であり、$t>0$ を満たす $t$ の値1つに対して $x=\log_3 t$ がただ1つ定まる。方程式は
  $$t^2-2at+2a+3=0\quad\cdots(*)$$
  となるので、もとの方程式の実数解の個数は、$(*)$ の **正の解** の個数に等しい。

  $g(t)=t^2-2at+2a+3$ とおく。$y=g(t)$ のグラフは下に凸で、軸は $t=a$、$g(0)=2a+3$、$(*)$ の判別式を $D$ とすると $\dfrac{D}{4}=a^2-2a-3=(a+1)(a-3)$。

  **(1)** $(*)$ が異なる2つの正の解をもつ条件は
  - $\dfrac{D}{4}=(a+1)(a-3)>0$ より $a<-1,\ 3<a$
  - 軸について $a>0$
  - $g(0)=2a+3>0$ より $a>-\dfrac{3}{2}$

  共通部分をとって **$a>3$**。

  **(2)** $(*)$ がただ1つの正の解をもつのは、次のいずれかの場合である。

  (i) 正の解と負の解を1つずつもつ場合: $g(0)<0$ より $2a+3<0$、すなわち $a<-\dfrac{3}{2}$。

  (ii) $t=0$ を解にもつ場合: $a=-\dfrac{3}{2}$ のとき $(*)$ は $t^2+3t=0$ で、解は $t=0,\ -3$。正の解はないので不適。

  (iii) 重解をもつ場合: $D=0$ より $a=-1,\ 3$。重解は $t=a$ なので、$a=3$ のとき $t=3>0$ で適し、$a=-1$ のとき $t=-1<0$ で不適。

  なお $g(0)>0$ かつ $D>0$ のときは、2解の積 $2a+3$ が正なので2解は同符号であり、正の解は0個か2個になる。

  以上より **$a<-\dfrac{3}{2},\ a=3$**。
rubric:
  - id: r1
    criterion: $t=3^x$ とおいて $t>0$ を明示し、$t$ と $x$ が1対1に対応することから「正の解 $t$ の個数」に言いかえている
    points: 2
    keywords: ["t>0", "3^x", "正の解"]
  - id: r2
    criterion: (1) で判別式・軸・$g(0)$ の3条件を立て、$a>3$ を得ている
    points: 3
    keywords: ["(a+1)(a-3)", "2a+3", "a>3"]
  - id: r3
    criterion: (2) で $g(0)<0$ のとき正の解がちょうど1つになることから $a<-\frac{3}{2}$ を得ている
    points: 2
    keywords: ["-3/2", "g(0)<0"]
  - id: r4
    criterion: (2) で重解の場合を調べ、$a=3$ は適し $a=-1$ は不適と判断している
    points: 2
    keywords: ["重解", "a=3", "a=-1"]
  - id: r5
    criterion: $a=-\frac{3}{2}$（$t=0$ が解）を除外したうえで、$a<-\frac{3}{2},\ a=3$ と結論している
    points: 1
    keywords: ["t=0", "a=3"]
solution: |
  $t=3^x$ の置き換えで「実数解の個数」を「$t>0$ の範囲の解の個数」に言いかえ、2次方程式の解の配置の問題に帰着させる。(2) は「正と負に1つずつ」「重解が正」の2通りに加え、境界 $g(0)=0$ の場合（$t=0$ は $3^x$ の値にならない）を個別に確認する。$t>0$ を無視すると、(1) で判別式だけの $a<-1,\ 3<a$ と答えてしまう。
concepts: [el-substitution, el-exp-function]
misconceptions: [mc-el-substitution-range, mc-root-location-insufficient]
targetSeconds: 600
irt: { expectedCorrectRate: 0.25, discrimination: 1.5 }
author:
  intent: |
    指数方程式を置き換えで2次方程式に直したとき、「$t>0$ の範囲の解の個数」という解の配置の問題に翻訳できるかをみる。(2) では場合分けの網羅性（正負1つずつ・重解・$t=0$ が解になる境界）を問い、答えだけ合っている答案と、境界の場合まで論理的に検討した答案を採点基準で区別できるよう設計した。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学II (3) ア(イ) 指数関数の値の変化やグラフの特徴, 数学II (3) イ(イ) 指数関数及び対数関数の式とグラフの関係]
  variations:
    - 実数解をもたない $a$ の範囲を問い、(1)(2) の補集合として求めさせる。
    - '$t=3^x$ の代わりに $t=\log_3 x$（$t$ は実数全体）で同じ係数の方程式を作り、解の個数の条件がどう変わるか比較させる。'