id: cg-two-circles
kind: property
title: 2円の位置関係と2円の交点を通る図形
body: |
  半径 $r_1,\ r_2$（$r_1>r_2$）の2円の中心間の距離を $d$ とすると

  | 位置関係 | 条件 |
  | --- | --- |
  | 離れている | $d>r_1+r_2$ |
  | 外接する | $d=r_1+r_2$ |
  | 2点で交わる | $r_1-r_2<d<r_1+r_2$ |
  | 内接する | $d=r_1-r_2$ |
  | 一方が他方の内部 | $d<r_1-r_2$ |

  **2円の交点を通る図形（束）**: 2円 $f(x,y)=0,\ g(x,y)=0$ が2点で交わるとき、定数 $k$ を用いた
  $$f(x,y)+k\,g(x,y)=0$$
  は2交点を通る図形を表す（2交点の座標を代入すると $0+k\cdot 0=0$ が成り立つから）。
  - $k=-1$ のとき（$f,\ g$ とも $x^2+y^2$ の係数を $1$ にそろえた場合）、2次の項が消えて **2交点を通る直線（共通弦を含む直線）** になる。
  - $k\neq-1$ のときは2交点を通る円。ただしこの形では円 $g=0$ 自身は表せない。
  - 求めたい円がもう1点を通る条件などから $k$ を決める。$f=0$ と共通弦の直線 $h=0$ を使い $f+th=0$ としてもよい。
prerequisites: [cg-circle-equation]
