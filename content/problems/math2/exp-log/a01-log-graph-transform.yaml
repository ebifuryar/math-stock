id: m2-el-a01
level: applied
format: choice
title: 対数関数のグラフの移動
stem: |
  関数 $y=\log_{\frac{1}{2}}(2x-4)$ のグラフは、関数 $y=\log_2 x$ のグラフをどのように移動したものか。正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $y$ 軸に関して対称移動し、さらに $x$ 軸方向に $2$、$y$ 軸方向に $-1$ だけ平行移動したもの
    misconception: mc-el-base-less-than-one
    rationale: |
      指数関数で $y=\left(\frac{1}{2}\right)^x=2^{-x}$ が $y=2^x$ と $y$ 軸対称であることを、対数関数にそのまま当てはめている。$\log_{\frac{1}{2}}x=-\log_2 x$ なので、対数では **$x$ 軸** に関して対称。この移動では定義域が $x<2$ となり、元の関数の定義域 $x>2$ と一致しない。
  - id: "2"
    text: $x$ 軸に関して対称移動し、さらに $x$ 軸方向に $4$、$y$ 軸方向に $-1$ だけ平行移動したもの
    rationale: |
      $2x-4$ の定数項を見て $x$ 軸方向の移動量を $4$ としている。$2x-4=2(x-2)$ とくくり、係数 $2$ は $\log$ の外に出して $y$ 軸方向の移動に回すので、$x$ 軸方向の移動量は $2$。
  - id: "3"
    text: $x$ 軸に関して対称移動し、さらに $x$ 軸方向に $2$、$y$ 軸方向に $1$ だけ平行移動したもの
    rationale: |
      $\log_{\frac{1}{2}}2=1$ と符号を誤っている。$\left(\frac{1}{2}\right)^{-1}=2$ より $\log_{\frac{1}{2}}2=-1$ なので、$y$ 軸方向の移動量は $-1$。
  - id: "4"
    text: $x$ 軸に関して対称移動し、さらに $x$ 軸方向に $2$、$y$ 軸方向に $-1$ だけ平行移動したもの
    rationale: |
      正解。$y=\log_{\frac{1}{2}}(2x-4)=-\log_2(x-2)-1$ と変形できる。
answer: "4"
solution: |
  底を $2$ に変換し、$2x-4=2(x-2)$ とくくる。
  $$y=\log_{\frac{1}{2}}(2x-4)=\frac{\log_2 2(x-2)}{\log_2\frac{1}{2}}=-\{1+\log_2(x-2)\}=-\log_2(x-2)-1$$

  $y=\log_2 x$ を $x$ 軸に関して対称移動すると $y=-\log_2 x$。これを $x$ 軸方向に $2$、$y$ 軸方向に $-1$ だけ平行移動すると
  $$y+1=-\log_2(x-2),\quad\text{すなわち}\quad y=-\log_2(x-2)-1$$
  となり、一致する。
concepts: [el-log-function, el-change-of-base]
misconceptions: [mc-el-base-less-than-one]
targetSeconds: 180
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    底を $\frac{1}{2}$ から $2$ に変換し、真数の係数を $\log$ の外に出して $y$ 軸方向の平行移動に直す、という2段階の式変形ができるかをみる。誤答①は指数関数と対数関数の対称軸の混同、②は真数の係数の処理、③は $\log_{\frac{1}{2}}2$ の符号に対応し、どの変形でつまずいたかを特定できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (3) ア(エ) 対数関数の値の変化やグラフの特徴, 数学II (3) イ(イ) 指数関数及び対数関数の式とグラフの関係]
  variations:
    - $y=\log_2(8x)$ と $y=\log_2 x+3$ が同じグラフであることを、平行移動の向きと合わせて問う。
    - "グラフが通る点や漸近線（例として直線 $x=2$）を答えさせるマーク式にする。"
