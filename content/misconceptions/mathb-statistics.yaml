- id: mc-st-sample-sd
  title: 標本平均の標準偏差を σ のまま使う（√n で割らない）
  description: |
    標本平均 $\overline{X}$ の標準偏差を母標準偏差 $\sigma$ のまま使う、$\dfrac{\sigma}{n}$ や $\dfrac{\sigma^2}{n}$ とする。その結果、信頼区間の幅や検定の $Z$ の値が大きく狂う。また「個々のデータの散らばり」と「標本平均の散らばり」を区別せず、信頼区間を「母集団のデータの95%が入る範囲」と読む、標本を $4$ 倍にすれば区間の幅も $\dfrac{1}{4}$ になると考える。
  cause: |
    $V(\overline{X})=\dfrac{\sigma^2}{n}$ を、「独立な $n$ 個の和の分散は $n\sigma^2$、それを $\dfrac{1}{n}$ 倍すると分散は $\dfrac{1}{n^2}$ 倍」という導出から理解しておらず、分散と標準偏差のどちらに $n$ が掛かるのかがあいまいになっている。母集団の分布と標本平均の分布という2つの分布を区別して意識していない。
  remedyConcepts: [st-sample-mean, st-estimation]
- id: mc-st-linear-variance
  title: V(aX+b) に b を残す・a を2乗しない
  description: |
    $V(aX+b)$ を $aV(X)+b$、$a^2V(X)+b$、$aV(X)$ などとする。標準偏差を $a\,\sigma(X)$（$a<0$ で負）とする。$V(3X-n)$ のように定数項が文字でも同様の誤りが起こる。
  cause: |
    「期待値は $aE(X)+b$」という形をそのまま分散にも当てはめている。分散は偏差の2乗の期待値であり、偏差が $a(X-m)$ になって $b$ は打ち消され、2乗すると $a^2$ 倍になる、という出発点に戻って確かめていない。
  remedyConcepts: [st-linear-sum, da-linear-transform]
- id: mc-st-sum-variance
  title: 和・差の分散を独立性の確認なしに足す・引く
  description: |
    独立でない確率変数に対して $V(X+Y)=V(X)+V(Y)$ を使う（非復元抽出で2枚引いた和、指標の和で各指標が独立でない場合、$X+X=2X$ を $V(X)+V(X)$ とする）。逆に、独立なのに差の分散を $V(X-Y)=V(X)-V(Y)$ とする、標準偏差どうしを足す。
  cause: |
    「和の期待値は常に和」と「和の分散が和になるのは独立なときだけ」を区別せず、同じ形の公式として覚えている。分散の和の公式が、展開したときの交差項 $2E\left((X-m_X)(Y-m_Y)\right)$ が独立性によって $0$ になることから出てくることを理解していない。差の場合も $(-1)^2=1$ 倍で足されることを、1次式の公式から導いていない。
  remedyConcepts: [st-linear-sum, st-binomial]
- id: mc-st-standardize
  title: 標準化で平均を引き忘れる・分散で割る
  description: |
    $N(m,\ \sigma^2)$ に従う $X$ の標準化を $\dfrac{X}{\sigma}$ や $\dfrac{X-m}{\sigma^2}$ とする。$N(100,\ 4)$ の $4$ を標準偏差と読む。正規分布表の値 $p(z_0)$ を、求める確率そのもの（$P(Z\geqq z_0)$ など）として答える。
  cause: |
    標準化が「平均を $0$ にずらし（$-m$）、標準偏差を $1$ にそろえる（$\div\sigma$）」という2段階の変換であることを、1次式の期待値・分散の公式と結びつけていない。$N(m,\ \sigma^2)$ の記法の第2成分が分散であることや、表の値が $0$ から $z_0$ までの面積であることを、図を描いて確認する習慣がない。
  remedyConcepts: [st-normal, st-linear-sum]
- id: mc-st-ci-interpretation
  title: 信頼区間を「母平均が95%の確率で入る区間」と解釈する
  description: |
    得られた信頼区間について「母平均 $m$ は95%の確率でこの区間にある」と述べる。あるいは「母集団の95%のデータがこの区間に入る」「標本平均の95%がこの区間に入る」と読む。信頼区間に $m_0$ が含まれることを「母平均は $m_0$ であると確かめられた」と解釈する。
  cause: |
    母平均は定数で、確率的に変動するのは標本から作られる区間の側であることを理解していない。「信頼度95%」を、区間の作り方（手続き）の性質ではなく、1つの具体的な区間についての確率として読んでいる。区間推定と仮説検定の関係（含まれる＝棄却されない）を「正しいと示された」と取り違えている。
  remedyConcepts: [st-estimation, st-hypothesis-test]
- id: mc-st-one-two-sided
  title: 両側検定と片側検定の取り違え
  description: |
    「異なるといえるか」という主張に片側の棄却域（$Z\geqq 1.64$ や片側の確率 $0.05$）を使う、または「大きいといえるか」に両側の $1.96$ を使う。両側検定で片側の確率だけを有意水準 $0.05$ と比べる。データを見てから、棄却されやすい側の片側検定に切りかえる。
  cause: |
    対立仮説の形（$\neq$ か $>$・$<$ か）が棄却域を決めるという手順を意識せず、「有意水準5%なら $1.96$」と数値だけで覚えている。有意水準が「帰無仮説が正しいのに棄却してしまう確率」であり、両側検定ではそれを両側に $2.5\%$ ずつ割り振るという意味を理解していない。
  remedyConcepts: [st-hypothesis-test, st-normal]
- id: mc-st-density-point
  title: 確率密度関数で P(X=a) を f(a) とする
  description: |
    連続型確率変数について、$P(X=a)=f(a)$ とする、$f(x)$ の値そのものを確率とみなして足し合わせる、$P(a\leqq X\leqq b)$ と $P(a<X<b)$ を区別して端点の分を足し引きする。$f(a)>1$ になると矛盾だと考える。
  cause: |
    離散型の確率分布表（値ごとの確率）のイメージを連続型にそのまま持ち込んでいる。連続型では確率は区間上の **面積（積分）** で与えられ、1点の幅は $0$ なので確率も $0$ になることを理解していない。
  remedyConcepts: [st-continuous]
- id: mc-st-binomial-variance
  title: 二項分布の分散 np(1-p) を np とする
  description: |
    $B(n,\ p)$ の分散を $np$、標準偏差を $\sqrt{np}$ とする（$1-p$ を掛け忘れる）。正規近似で $Z=\dfrac{X-np}{\sqrt{np}}$ と標準化してしまう。分散を $np^2$ や $n(1-p)$ とするのも同類。
  cause: |
    平均 $np$ の形からの類推で分散を覚えており、「1回の試行の分散 $p(1-p)$ を $n$ 個独立に足す」という導出を経ていない。$p=\dfrac{1}{2}$ のような例だけで練習していると、$np$ と $np(1-p)$ の違いに気づきにくい。
  remedyConcepts: [st-binomial, st-linear-sum]
