author:
  intent: |
    回転体ではない立体の体積を「断面積の積分」として組み立てられるか、断面の形を不等式から正しく読み取れるかをみる。(2) は $x=a\sin\theta$ 型の置換で、$dt=\cos\theta\,d\theta$ を掛け忘れると係数や次数がずれ（$\displaystyle\int\sin^2\theta\cos\theta\,d\theta$ になり $\pi$ が出ない）、偶関数の性質を使わないと係数イが $2$ になることで識別できる。(3) は切り方を変えると断面が長方形から放物線で囲まれた図形に変わることを確かめさせ、「切り方によらず体積は同じ」という検算の発想を育てる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (3) イ(イ) 定積分を用いた面積・体積・曲線の長さ", "数学III (3) ア(イ) 置換積分法・部分積分法"]
  variations:
    - 2つの円柱 $x^2+y^2\leqq 1,\ x^2+z^2\leqq 1$ の共通部分の体積（$\dfrac{16}{3}$）を、断面が正方形になることから求めさせる。
    - 高さを $0\leqq z\leqq|x|$ に変え（体積 $\dfrac{4}{3}$）、断面の形と計算の違いを比べさせる。
