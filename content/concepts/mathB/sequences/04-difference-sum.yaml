id: sq-difference-sum
kind: theorem
title: 階差数列、和と一般項の関係
body: |
  **階差数列**: 数列 $\{a_n\}$ の階差数列を $b_n=a_{n+1}-a_n$ とすると
  $$n\geqq 2\ \text{のとき}\quad a_n=a_1+\sum_{k=1}^{n-1}b_k$$
  $a_1$ から $a_n$ までに階差を足す回数は $n-1$ 回なので、和の上端は $n-1$ である。この式は $n\geqq 2$ で導いたものなので、得られた式が $n=1$ のときも成り立つか（$a_1$ に一致するか）を必ず確かめる。

  **和と一般項**: 初項から第 $n$ 項までの和を $S_n$ とすると
  $$a_1=S_1,\qquad n\geqq 2\ \text{のとき}\quad a_n=S_n-S_{n-1}$$
  $S_{n-1}$ は $n\geqq 2$ でしか意味をもたないので、$n=1$ は別に扱う。たとえば $S_n=n^2+2n+3$ なら $a_1=6$、$n\geqq 2$ で $a_n=2n+1$ となり、$n=1$ のときは一致しない。

  漸化式に $S_n$ が含まれるときは、$n$ を $n+1$ に変えた式との差をとって $a_{n+1}=S_{n+1}-S_n$ を用いると、$S_n$ を消去できる。
prerequisites: [sq-sigma]
