author:
  intent: |
    「異なる3つの実数解」を「極値をもち、極値が異符号」と翻訳し、極値をもつ条件（$a>0$、等号なし）を落とさずに論証できるかをみる。$a=0$ のとき $f'(0)=0$ だが極値ではないこと、極大値が常に正なので条件が極小値だけに帰着することを、答案として明確に書けるかで上位層を識別する。後半の正の解の個数は $f(0)$ の符号という追加の観察を要求し、グラフの概形を正確に描けているかを確かめる。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: ["数学II (5) イ(ア) 導関数を用いた関数の考察（方程式の実数解の個数）"]
  variations:
    - 「ちょうど2つの異なる実数解をもつ」とき（$a=1$、解は $x=1$（重解）と $x=-2$）を問う。
    - $x^3-3ax+2=0$ の3つの解がすべて $-2$ 以上となる条件など、解の配置と組み合わせる。
