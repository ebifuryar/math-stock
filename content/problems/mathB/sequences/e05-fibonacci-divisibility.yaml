id: mb-sq-e05
level: exam
format: written
title: フィボナッチ数列の整除性と数学的帰納法
stem: |
  数列 $\{a_n\}$ を
  $$a_1=1,\qquad a_2=1,\qquad a_{n+2}=a_{n+1}+a_n\quad(n=1,\ 2,\ 3,\ \cdots)$$
  で定める。

  (1) すべての自然数 $n$ について、$a_{n+5}=5a_{n+1}+3a_n$ が成り立つことを示せ。

  (2) すべての自然数 $n$ について、$a_{5n}$ は $5$ の倍数であることを、数学的帰納法を用いて証明せよ。
modelAnswer: |
  漸化式より $a_1,\ a_2$ が整数なので、$a_{n+2}=a_{n+1}+a_n$ から順にすべての $a_n$ は整数である。

  (1) 漸化式を繰り返し用いて、$a_{n+2},\ a_{n+3},\ \cdots$ を $a_{n+1}$ と $a_n$ で表す。
  $$
  \begin{aligned}
  a_{n+2}&=a_{n+1}+a_n\\
  a_{n+3}&=a_{n+2}+a_{n+1}=2a_{n+1}+a_n\\
  a_{n+4}&=a_{n+3}+a_{n+2}=3a_{n+1}+2a_n\\
  a_{n+5}&=a_{n+4}+a_{n+3}=5a_{n+1}+3a_n
  \end{aligned}
  $$
  よって、すべての自然数 $n$ について $a_{n+5}=5a_{n+1}+3a_n$ が成り立つ。

  (2) 「$a_{5n}$ は $5$ の倍数である」を $(*)$ とし、数学的帰納法で示す。

  (I) $n=1$ のとき。$a_3=2,\ a_4=3,\ a_5=5$ より $a_5=5$ は $5$ の倍数であり、$(*)$ は成り立つ。

  (II) $n=k$ のとき $(*)$ が成り立つ、すなわち整数 $M$ を用いて $a_{5k}=5M$ と表せると仮定する。(1) の等式で $n=5k$ とすると
  $$a_{5(k+1)}=a_{5k+5}=5a_{5k+1}+3a_{5k}=5a_{5k+1}+15M=5(a_{5k+1}+3M)$$
  $a_{5k+1}+3M$ は整数なので、$a_{5(k+1)}$ は $5$ の倍数である。よって $n=k+1$ のときも $(*)$ は成り立つ。

  (I), (II) より、すべての自然数 $n$ について $a_{5n}$ は $5$ の倍数である。
rubric:
  - id: r1
    criterion: (1) で漸化式を繰り返し用い、$a_{n+3},\ a_{n+4}$ を経由して $a_{n+5}=5a_{n+1}+3a_n$ を正しく導いている
    points: 2
    keywords: ["2a_{n+1}+a_n", "3a_{n+1}+2a_n"]
  - id: r2
    criterion: (2) の出発点として $a_5=5$ を計算し、$n=1$ で成り立つことを確認している
    points: 2
    keywords: ["a_5=5", "n=1"]
  - id: r3
    criterion: 仮定を「$a_{5k}=5M$（$M$ は整数）」のように式で表している
    points: 2
    keywords: ["a_{5k}=5", "整数"]
  - id: r4
    criterion: (1) を $n=5k$ に適用し、$a_{5k+5}=5(a_{5k+1}+3M)$ と仮定を用いて変形している
    points: 2
    keywords: ["a_{5k+5}", "5a_{5k+1}+3a_{5k}"]
  - id: r5
    criterion: $a_{5k+1}+3M$ が整数であること（すべての $a_n$ が整数であること）に触れ、帰納法の結論を明記している
    points: 2
    keywords: ["整数", "5の倍数"]
solution: |
  (1) は漸化式を4回使うだけでよい。係数 $1,\ 1,\ 2,\ 3,\ 5$ と $1,\ 1,\ 2,\ 3$ にこの数列自身が現れる（$a_{n+m}=a_ma_{n+1}+a_{m-1}a_n$ の $m=5$ の場合）。

  (2) は (1) の式で $n=5k$ とすれば、$a_{5k+5}$ の $5a_{5k+1}$ の部分は常に $5$ の倍数なので、残る $3a_{5k}$ が $5$ の倍数であることだけが必要になる。これが帰納法の仮定で保証される。$a_{5k+1}$ が整数であることは、漸化式の形から明らか（答案ではひとこと触れる）。
