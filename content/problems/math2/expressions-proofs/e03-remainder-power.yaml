id: m2-ep-e03
level: exam
format: mark
title: 累乗を重複因数を含む式で割った余り
stem: |
  (1) $x^{10}$ を $(x-1)^2$ で割った余りは
  $$\boxed{\text{アイ}}\,x-\boxed{\text{ウ}}$$
  である。

  (2) $x^{10}$ を $(x-1)^2(x+1)$ で割った余りは
  $$\boxed{\text{エ}}\,x^2-\boxed{\text{オ}}$$
  である。
blanks:
  - { label: アイ, answer: "10" }
  - { label: ウ, answer: "9" }
  - { label: エ, answer: "5" }
  - { label: オ, answer: "4" }
solution: |
  (1) $x=(x-1)+1$ とみて二項定理で展開すると
  $$x^{10}=\{(x-1)+1\}^{10}=(x-1)^{10}+\cdots+{}_{10}\mathrm{C}_8(x-1)^2+{}_{10}\mathrm{C}_9(x-1)+1$$
  $(x-1)^2$ 以上の項はすべて $(x-1)^2$ で割り切れるので、余りは
  $$10(x-1)+1=10x-9$$

  （別解）$x^{10}-1=(x-1)(x^9+x^8+\cdots+1)$ で、$x^9+\cdots+1$ を $x-1$ で割った余りは $10$ なので $x^9+\cdots+1=(x-1)S(x)+10$。よって $x^{10}=(x-1)^2S(x)+10(x-1)+1$。

  (2) $(x-1)^2(x+1)$ で割った商を $Q(x)$、余りを $R(x)$（2次以下）とする。
  $$x^{10}=(x-1)^2(x+1)Q(x)+R(x)$$
  $R(x)$ を $(x-1)^2$ で割った余りは、$x^{10}$ を $(x-1)^2$ で割った余り $10x-9$ に等しいので
  $$R(x)=a(x-1)^2+10x-9$$
  とおける。$x=-1$ を代入すると $(-1)^{10}=1=4a-19$ より $a=5$。
  $$R(x)=5(x-1)^2+10x-9=5x^2-4$$
  検算: $x=1$ で $1$、$x=-1$ で $1$ となり、$x^{10}$ の値と一致する。
concepts: [ep-factor-theorem, ep-binomial-theorem, ep-identity]
misconceptions: [mc-ep-remainder-degree]
targetSeconds: 420
irt: { expectedCorrectRate: 0.3, discrimination: 1.4 }
author:
  intent: |
    重複因数 $(x-1)^2$ で割った余りは、$x=1$ の代入だけでは条件が1つしか得られないことに気づき、二項定理（$x=(x-1)+1$）や因数分解で余りを決められるかをみる。(2) では「3次式で割った余りは2次以下」と次数を正しく設定したうえで、(1) の結果を $a(x-1)^2+10x-9$ の形で再利用できるかを問う。余りを1次式とおくと3条件に対して未知数が足りず、(2) の形に合わない。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (1) ア(オ) 因数定理, 数学II (1) ア(イ) 多項式の除法, 数学II (1) ア(ア) 三次の乗法公式及び因数分解の公式（二項定理）]
  variations:
    - $x^n$ を $(x-1)^2$ で割った余り $nx-(n-1)$ を一般の $n$ で求めさせる。
    - $x^{10}$ を $(x-2)^2$ で割った余りを、$x=(x-2)+2$ と分けて求めさせる。
