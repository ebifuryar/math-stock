id: ne-linear-inequality
kind: method
title: 1次不等式（連立・文字係数・整数解）
body: |
  **不等式の性質**: 両辺に同じ数を加えても、正の数を掛けても（割っても）不等号の向きは変わらない。**負の数** を掛ける（割る）と向きが逆になる。

  **連立不等式**: それぞれの解を数直線上に図示し、共通部分をとる。

  **文字係数** $ax>b$: 係数 $a$ の符号で場合分けする。
  - $a>0$ なら $x>\dfrac{b}{a}$、$a<0$ なら $x<\dfrac{b}{a}$
  - $a=0$ なら $0\cdot x>b$ となり、$b<0$ のときすべての実数、$b\geqq 0$ のとき解なし

  符号の分からない式で両辺を割ったり「約分」したりしてはいけない。

  **整数解の個数**: 解の区間を数直線にかき、条件を満たす整数を具体的に並べる。そのうえで「端の整数を含むか」「その外側の整数を含まないか」を、端点が整数に一致する場合（等号）まで確かめる。
prerequisites: [ne-real-numbers]
