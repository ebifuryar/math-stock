id: ne-factorization
kind: method
title: 因数分解の手順
body: |
  因数分解は展開の逆の操作である。次の順に検討する。

  1. **共通因数** をくくり出す。
  2. **公式** $a^2\pm 2ab+b^2=(a\pm b)^2$、$a^2-b^2=(a+b)(a-b)$ を使う。
  3. **たすき掛け**: $acx^2+(ad+bc)x+bd=(ax+b)(cx+d)$。$x^2$ の係数と定数項の分け方を並べ、「たすき」に掛けた和が $x$ の係数になる組を探す。
  4. **置き換え**: 共通な式を $A$ とおく。$(x+1)(x+2)(x+3)(x+4)$ のように、組合せを工夫して共通部分を作ることもある。
  5. **文字が2つ以上** あるときは、最も次数の低い文字（同じなら1つの文字）について降べきの順に整理し、定数項（他の文字の式）を先に因数分解してからたすき掛けを行う。

  最後に、各因数がこれ以上分解できないかを確認し、展開して元の式に戻ることを検算する。
prerequisites: [ne-expansion]
