id: m2-cg-s05
level: school
format: written
title: 円と直線が共有点をもつ条件
stem: |
  $k$ を定数とする。円 $x^2+y^2=5$ と直線 $y=2x+k$ が共有点をもつような $k$ の値の範囲を求めよ。また、円と直線が接するときの $k$ の値と、そのときの接点の座標を求めよ。
modelAnswer: |
  直線を一般形に直すと $2x-y+k=0$。円の中心 $(0,\ 0)$ と直線の距離を $d$ とすると
  $$d=\frac{|2\cdot 0-0+k|}{\sqrt{2^2+(-1)^2}}=\frac{|k|}{\sqrt{5}}$$
  円の半径は $\sqrt{5}$ なので、共有点をもつ条件は $d\leqq\sqrt{5}$、すなわち
  $$\frac{|k|}{\sqrt{5}}\leqq\sqrt{5}\iff |k|\leqq 5\iff -5\leqq k\leqq 5$$

  接するのは $d=\sqrt{5}$、すなわち $k=\pm 5$ のとき。

  接点は、$y=2x+k$ を $x^2+y^2=5$ に代入した $5x^2+4kx+k^2-5=0$ の重解である。
  - $k=5$ のとき $5x^2+20x+20=5(x+2)^2=0$ より $x=-2$、$y=2\cdot(-2)+5=1$。接点 $(-2,\ 1)$
  - $k=-5$ のとき $5x^2-20x+20=5(x-2)^2=0$ より $x=2$、$y=2\cdot 2-5=-1$。接点 $(2,\ -1)$

  よって **$-5\leqq k\leqq 5$。接するのは $k=5$（接点 $(-2,\ 1)$）と $k=-5$（接点 $(2,\ -1)$）**。
rubric:
  - id: r1
    criterion: 直線を $2x-y+k=0$ と一般形に直し、中心と直線の距離 $\dfrac{|k|}{\sqrt{5}}$ を正しく求めている（判別式を用いる場合は $5x^2+4kx+k^2-5=0$ を正しく導いている）
    points: 3
    keywords: ["2x-y+k=0", "|k|/√5", "5x^2+4kx+k^2-5=0"]
  - id: r2
    criterion: 共有点をもつ条件を $d\leqq$ 半径（または $D\geqq 0$）と等号を含めて立て、$-5\leqq k\leqq 5$ を得ている
    points: 3
    keywords: ["-5≤k≤5", "|k|≤5"]
  - id: r3
    criterion: 接するときを $d=$ 半径（または $D=0$）として $k=\pm 5$ を求めている
    points: 2
    keywords: ["k=5", "k=-5", "±5"]
  - id: r4
    criterion: 接点 $(-2,\ 1)$（$k=5$）と $(2,\ -1)$（$k=-5$）を、対応する $k$ とともに正しく求めている
    points: 2
    keywords: ["(-2,1)", "(2,-1)"]
solution: |
  円と直線の位置関係は「中心と直線の距離 $d$ と半径 $r$ の大小」で判定するのが速い。「共有点をもつ」は接する場合を含むので $d\leqq r$。接点は、代入してできる2次方程式の重解として求めるか、中心から直線に下ろした垂線の足として求める（中心 $(0,0)$ を通り傾き $-\dfrac{1}{2}$ の直線 $y=-\dfrac{1}{2}x$ との交点）。
concepts: [cg-circle-line, cg-point-line-distance]
misconceptions: [mc-cg-distance-formula]
targetSeconds: 360
irt: { expectedCorrectRate: 0.65, discrimination: 1.1 }
author:
  intent: |
    円と直線の位置関係を、距離による方法・判別式による方法のどちらでも答案として書けるかをみる。「共有点をもつ」の等号の扱い、$y=2x+k$ を一般形に直さずに公式へ入れる誤り、接点の求め方の3点を、採点基準で独立に評価できるようにしている。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (2) ア(ウ) 円と直線の位置関係]
  variations:
    - 円が切り取る弦の長さが $2\sqrt{3}$ になる $k$ を求めさせる（$d$ と三平方の定理）。
    - 直線の傾きを文字にし、定点 $(0,\ 5)$ を通る直線が円と共有点をもつ傾きの範囲を求めさせる。
