author:
  intent: |
    実数係数の方程式では共役複素数も解になることを使い、「2数を解とする2次方程式」「整式の除法」「余りが $0$ という恒等式の条件」を順につなげられるかを、共通テスト型の誘導でみる。(1) で和の符号を誤って $x^2+2x+5$ とすると、以降の除法がすべて狂い、ウ・エオ が整数にならない。除法の筆算を正確に実行できるかも、余りの係数 $2a+b-1,\ 5-5a$ を通して確認する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (1) ア(オ) 因数定理と簡単な高次方程式, 数学II (1) ア(エ) 解と係数の関係, 数学II (1) ア(イ) 多項式の除法]
  variations:
    - 解 $1+2i$ の代わりに $2-i$ を与え、定数項も未知数にして、もう1つの条件（$P(1)=$ 定数など）を加える。
    - 4次方程式 $x^4+ax^3+bx^2+cx+d=0$ が $1+i$ と $2i$ を解にもつ場合を扱う。
