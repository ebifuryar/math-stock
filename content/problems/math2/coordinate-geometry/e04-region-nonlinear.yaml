id: m2-cg-e04
level: exam
format: mark
title: 三角形の領域でのいろいろな式の最大・最小
stem: |
  連立不等式
  $$2x+y\geqq 5,\qquad x\leqq 4,\qquad y\leqq 5$$
  の表す領域を $D$ とする。$D$ は3点 $(4,\ -3),\ (0,\ 5),\ (4,\ 5)$ を頂点とする三角形の周および内部である。点 $(x,\ y)$ が $D$ を動くとき、次の値を求めよ。

  (1) $x-y$ の最大値は $\boxed{\text{ア}}$、最小値は $\boxed{\text{イウ}}$ である。

  (2) $x^2+y^2$ は、$(x,\ y)=(\boxed{\text{エ}},\ \boxed{\text{オ}})$ のとき最小値 $\boxed{\text{カ}}$ をとり、最大値は $\boxed{\text{キク}}$ である。

  (3) $\dfrac{y}{x+1}$ の最大値は $\boxed{\text{ケ}}$、最小値は $\dfrac{\boxed{\text{コサ}}}{\boxed{\text{シ}}}$ である。
blanks:
  - { label: ア, answer: "7" }
  - { label: イウ, answer: "-5" }
  - { label: エ, answer: "2" }
  - { label: オ, answer: "1" }
  - { label: カ, answer: "5" }
  - { label: キク, answer: "41" }
  - { label: ケ, answer: "5" }
  - { label: コサ, answer: "-3" }
  - { label: シ, answer: "5" }
solution: |
  (1) $x-y=k$ とおくと $y=x-k$（傾き $1$）。境界の傾きは $-2$（$2x+y=5$）、$x=4$ は縦、$y=5$ は横。$y$ 切片 $-k$ が最小になるのは頂点 $(4,\ -3)$ を通るときで $k=7$、最大になるのは頂点 $(0,\ 5)$ を通るときで $k=-5$。最大値 $7$、最小値 $-5$。

  (2) $x^2+y^2=r^2$ は原点を中心とする半径 $r$ の円。原点は $2\cdot 0+0<5$ より $D$ の外にあり、$D$ に最も近い点は原点から直線 $2x+y=5$ に下ろした垂線の足。垂線 $y=\dfrac{1}{2}x$ との交点は $(2,\ 1)$ で、これは辺上（$(4,\ -3)$ と $(0,\ 5)$ の中点）にある。よって最小値は $2^2+1^2=5$（点と直線の距離 $\dfrac{5}{\sqrt{5}}=\sqrt{5}$ の2乗）。

  最大は原点から最も遠い頂点で、$(4,\ -3)$ で $25$、$(0,\ 5)$ で $25$、$(4,\ 5)$ で $41$ より最大値 $41$。

  (3) $\dfrac{y}{x+1}$ は点 $(-1,\ 0)$ と点 $(x,\ y)$ を結ぶ直線の傾き（$D$ では $x\geqq 0$ なので $x+1>0$）。$D$ は三角形なので、傾きは頂点で最大・最小となる。
  - $(4,\ -3)$: $-\dfrac{3}{5}$、$(0,\ 5)$: $5$、$(4,\ 5)$: $1$

  最大値 $5$、最小値 $-\dfrac{3}{5}$。
concepts: [cg-region, cg-point-line-distance, cg-line-equation]
misconceptions: [mc-cg-extremum-vertex-only]
targetSeconds: 600
