id: pr-permutation
kind: formula
title: 順列・円順列・重複順列
body: |
  - **順列**: 異なる $n$ 個から $r$ 個を取り出して1列に並べる並べ方は
  $${}_n\mathrm{P}_r=n(n-1)(n-2)\cdots(n-r+1)=\frac{n!}{(n-r)!}$$
  特に ${}_n\mathrm{P}_n=n!$、$0!=1$ と定める。
  - **円順列**: 異なる $n$ 個を円形に並べる並べ方は、回転して一致するものを同じとみて $(n-1)!$ 通り。1つを固定して残りを並べると考える。
  - **重複順列**: 異なる $n$ 個から重複を許して $r$ 個を取り出して並べる並べ方は $n^r$ 通り。$r$ 人を2つの部屋 $A,\ B$ に分ける方法は $2^r$ 通りで、空室を許さなければ $2^r-2$ 通り。

  「隣り合う」ものは1つにまとめて並べ、まとめた中の並べ方を掛ける。「隣り合わない」ものは、他を先に並べてその間や両端に入れる。円形の場合は先に並べた $k$ 個の間は $k$ か所（両端がない）。
prerequisites: [pr-set-count]
