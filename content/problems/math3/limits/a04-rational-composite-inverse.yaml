id: m3-lm-a04
level: applied
format: mark
title: 分数関数の合成関数・逆関数と不等式
stem: |
  関数 $f(x)=\dfrac{x+3}{x-1}$、$g(x)=2x-1$ について考える。

  (1) $f(x)=\boxed{\text{ア}}+\dfrac{\boxed{\text{イ}}}{x-1}$ と変形できるので、$y=f(x)$ のグラフの漸近線は直線 $x=\boxed{\text{ウ}}$ と直線 $y=\boxed{\text{エ}}$ である。

  (2) 合成関数は
  $$(f\circ g)(x)=\frac{x+\boxed{\text{オ}}}{x-\boxed{\text{カ}}},\qquad (g\circ f)(x)=\frac{x+\boxed{\text{キ}}}{x-\boxed{\text{ク}}}$$
  である。

  (3) 逆関数は
  $$f^{-1}(x)=\frac{x+\boxed{\text{ケ}}}{x-\boxed{\text{コ}}}$$
  であり、$f^{-1}(x)$ は $f(x)$ と一致する。

  (4) 不等式 $f(x)\geqq x$ の解は
  $$x\leqq\boxed{\text{サシ}},\qquad \boxed{\text{ス}}<x\leqq\boxed{\text{セ}}$$
  である。
blanks:
  - { label: ア, answer: "1" }
  - { label: イ, answer: "4" }
  - { label: ウ, answer: "1" }
  - { label: エ, answer: "1" }
  - { label: オ, answer: "1" }
  - { label: カ, answer: "1" }
  - { label: キ, answer: "7" }
  - { label: ク, answer: "1" }
  - { label: ケ, answer: "3" }
  - { label: コ, answer: "1" }
  - { label: サシ, answer: "-1" }
  - { label: ス, answer: "1" }
  - { label: セ, answer: "3" }
solution: |
  (1) $x+3=(x-1)+4$ より $f(x)=1+\dfrac{4}{x-1}$。漸近線は $x=1,\ y=1$。

  (2) $(f\circ g)(x)=f(g(x))=\dfrac{(2x-1)+3}{(2x-1)-1}=\dfrac{2x+2}{2x-2}=\dfrac{x+1}{x-1}$。

  $(g\circ f)(x)=g(f(x))=2\cdot\dfrac{x+3}{x-1}-1=\dfrac{2x+6-(x-1)}{x-1}=\dfrac{x+7}{x-1}$。

  $f\circ g$ は「先に $g$、あとで $f$」であり、$f\circ g\neq g\circ f$。

  (3) $y=\dfrac{x+3}{x-1}$ を $x$ について解くと $y(x-1)=x+3$ より $x(y-1)=y+3$。$y\neq 1$（値域）なので $x=\dfrac{y+3}{y-1}$。$x,\ y$ を入れ替えて $f^{-1}(x)=\dfrac{x+3}{x-1}$（定義域 $x\neq 1$）。これは $f(x)$ と同じ関数で、グラフが直線 $y=x$ に関して対称である（漸近線の交点 $(1,\ 1)$ が $y=x$ 上にある）ことに対応する。実際 $f(f(x))=x$ となる。

  (4) 分母 $x-1$ の符号に注意して移項する。
  $$\frac{x+3}{x-1}-x=\frac{x+3-x(x-1)}{x-1}=\frac{-(x^2-2x-3)}{x-1}=-\frac{(x+1)(x-3)}{x-1}\geqq 0$$
  すなわち $\dfrac{(x+1)(x-3)}{x-1}\leqq 0$。符号を調べると、$x\leqq -1$ または $1<x\leqq 3$（$x=1$ は除く）。

  グラフで見ると、双曲線 $y=f(x)$ と直線 $y=x$ は $x=-1,\ 3$ で交わり、双曲線が直線より上（または交点）にあるのは $x\leqq -1$ と $1<x\leqq 3$。
