id: vc-space-vector
kind: method
title: 空間座標と空間ベクトル
body: |
  **空間座標** $\mathrm{A}(x_1,y_1,z_1),\ \mathrm{B}(x_2,y_2,z_2)$ の距離は $\sqrt{(x_2-x_1)^2+(y_2-y_1)^2+(z_2-z_1)^2}$。成分・内積・内分点・面積公式 $\dfrac{1}{2}\sqrt{|\vec a|^2|\vec b|^2-(\vec a\cdot\vec b)^2}$ は平面と同じ形で使える。

  **平面上にある条件** 一直線上にない3点 $\mathrm{A},\ \mathrm{B},\ \mathrm{C}$ について、点 $\mathrm{P}$ が平面 $\mathrm{ABC}$ 上にある条件は
  $$\overrightarrow{\mathrm{AP}}=s\overrightarrow{\mathrm{AB}}+t\overrightarrow{\mathrm{AC}}\iff\overrightarrow{\mathrm{OP}}=x\overrightarrow{\mathrm{OA}}+y\overrightarrow{\mathrm{OB}}+z\overrightarrow{\mathrm{OC}}\quad(x+y+z=1)$$
  **係数の和が1** という条件を必ず付ける。平面が $\mathrm{O}$ を通る場合（平面 $\mathrm{OBC}$ など）は「$\overrightarrow{\mathrm{OA}}$ の係数が $0$」となる。

  **直線と平面の交点** 直線上の点を1つの文字で表し（例: $\overrightarrow{\mathrm{OK}}=k\overrightarrow{\mathrm{OG}}$）、それを平面を張る点の位置ベクトルで書き直して係数の和 $=1$ とおく。

  **平面への垂線** $\overrightarrow{\mathrm{OH}}$ が平面 $\mathrm{ABC}$ に垂直 $\iff\overrightarrow{\mathrm{OH}}\cdot\overrightarrow{\mathrm{AB}}=0$ かつ $\overrightarrow{\mathrm{OH}}\cdot\overrightarrow{\mathrm{AC}}=0$（平面上の平行でない2つのベクトルに垂直）。

  **四面体の体積** $V=\dfrac{1}{3}\times(\text{底面積})\times(\text{高さ})$。高さは垂線の足を求めるか、点の位置ベクトルの係数から高さの比を読む。
prerequisites: [vc-intersection, vc-triangle-area, gm-solid-figures]
