author:
  intent: |
    2次曲線と直線の位置関係を判別式で判定し、答案として書けるかをみる。「共有点をもつ」の等号の扱い、代入後の係数計算、重解から接点を求める処理を採点基準で独立に評価する。円の場合の「中心と直線の距離」を楕円に誤用して $\dfrac{|k|}{\sqrt{2}}\leqq 2$ などとする答案は r2 以降で得点できない設計にしている。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(ア) 2次曲線と直線の位置関係]
  variations:
    - 直線が楕円によって切り取られる線分の長さが最大になる $k$ を求めさせる（$k=0$）。
    - 双曲線 $x^2-y^2=1$ と直線 $y=2x+k$ で同様に問う。
