id: pr-probability-basics
kind: definition
title: 確率の定義と基本性質（加法定理・余事象）
body: |
  試行の根元事象が **どれも同様に確からしい** とき、全事象 $U$ と事象 $A$ について
  $$P(A)=\frac{n(A)}{n(U)}$$
  と定める。同様に確からしくするために、さいころ・玉・人などは **すべて区別して** 数えるのが原則（例: 2個のさいころの目の和は、和そのものではなく $36$ 通りの目の組を根元事象にとる）。

  - $0\leqq P(A)\leqq 1$、$P(\varnothing)=0$、$P(U)=1$
  - **加法定理**: $A$ と $B$ が排反（$A\cap B=\varnothing$）なら $P(A\cup B)=P(A)+P(B)$。一般には
  $$P(A\cup B)=P(A)+P(B)-P(A\cap B)$$
  - **余事象の確率**: $P(\overline{A})=1-P(A)$。「少なくとも1つ」「〜でない」は余事象で考えると見通しがよい。「少なくとも1回 $A$」の余事象は「1回も $A$ でない」であり、「すべて $A$」ではない。
  - **最大値・最小値の確率**: 「最大値が $k$」$=$「すべて $k$ 以下」から「すべて $k-1$ 以下」を除いたもの。
prerequisites: [pr-set-count, pr-combination]
