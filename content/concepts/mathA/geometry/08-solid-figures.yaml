id: gm-solid-figures
kind: property
title: 空間図形と多面体
body: |
  **2直線の位置関係**: 1点で交わる／平行／ねじれの位置（同一平面上にない）。

  **直線と平面の垂直**: 直線 $\ell$ が平面 $\alpha$ 上の交わる2直線に垂直なら $\ell\perp\alpha$ であり、このとき $\ell$ は $\alpha$ 上のすべての直線に垂直。

  **三垂線の定理**: 平面 $\alpha$ 上に直線 $\ell$ と $\ell$ 上にない点 $\mathrm{A}$ があり、$\alpha$ 上にない点 $\mathrm{O}$ について $\mathrm{OA}\perp\alpha$ とする。$\ell$ 上の点 $\mathrm{H}$ について、$\mathrm{AH}\perp\ell$ ならば $\mathrm{OH}\perp\ell$。（逆に $\mathrm{OH}\perp\ell$ ならば $\mathrm{AH}\perp\ell$。）

  **2平面のなす角**: 交線 $\ell$ 上の点から、各平面内で $\ell$ に垂直な半直線を引いたときの角。

  **オイラーの多面体定理**: 凸多面体の頂点の数 $v$、辺の数 $e$、面の数 $f$ について
  $$v-e+f=2$$
  - 辺・頂点を「各面の辺数・頂点数の合計」から数えるときは、1本の辺は2つの面に、1つの頂点はそこに集まる面の数だけ重複して数えられるので、その数で割る。
  - 正多面体は、正四面体・正六面体・正八面体・正十二面体・正二十面体の5種類しかない。
