author:
  intent: |
    確率密度関数の条件（全面積が $1$）、確率を積分（面積）で求めること、期待値・分散の積分による計算を一通り確認する。オで $P(X=1)$ を問い、離散型の感覚で $f(1)=\dfrac{1}{2}$ と答える誤りを識別する。$f(x)$ を1次関数にして、(2) は三角形・台形の面積でも検算できるようにした。
  assessedAbilities: [知識・技能]
  curriculumRefs: ["数学B (2) ア(ウ) 連続型確率変数と確率密度関数"]
  variations:
    - '$P(X\leqq c)=\frac{1}{2}$ となる $c$（中央値 $\sqrt{2}$）を求めさせ、期待値 $\frac{4}{3}$ との違いを考えさせる。'
    - '$f(x)=a(2-x)$ に変えて同じ量を求めさせ、期待値が $\frac{2}{3}$ になることと対称性を確認させる。'
