id: mc-vc-e04
level: exam
format: mark
title: 球面と直線の位置関係
stem: |
  座標空間において、球面
  $$S:\ x^2+y^2+z^2-2x-4y+2z-3=0$$
  と、2点 $\mathrm{A}(-2,\ -2,\ 3),\ \mathrm{B}(0,\ 0,\ 2)$ を通る直線 $\ell$ を考える。

  (1) $S$ の中心 $\mathrm{C}$ の座標は $(\boxed{\text{ア}},\ \boxed{\text{イ}},\ \boxed{\text{ウエ}})$、半径は $\boxed{\text{オ}}$ である。また、$S$ と $xy$ 平面の交わりは、半径 $\boxed{\text{カ}}\sqrt{\boxed{\text{キ}}}$ の円である。

  (2) $\ell$ 上の点 $\mathrm{P}$ を、実数 $t$ を用いて $\overrightarrow{\mathrm{OP}}=\overrightarrow{\mathrm{OA}}+t\overrightarrow{\mathrm{AB}}$ と表す。
  $$|\overrightarrow{\mathrm{CP}}|^2=\boxed{\text{ク}}t^2-\boxed{\text{ケコ}}t+\boxed{\text{サシ}}$$
  であり、$|\overrightarrow{\mathrm{CP}}|$ は $t=\boxed{\text{ス}}$ のとき最小値 $\sqrt{\boxed{\text{セ}}}$ をとる。

  (3) $\ell$ と $S$ の2つの交点を結ぶ線分の長さは $\boxed{\text{ソ}}$ である。

  (4) 点 $\mathrm{Q}$ が $S$ 上を動くとき、$\mathrm{Q}$ と直線 $\ell$ の距離の最大値は $\boxed{\text{タ}}+\sqrt{\boxed{\text{チ}}}$ である。
