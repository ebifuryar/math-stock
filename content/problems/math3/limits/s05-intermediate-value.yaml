author:
  intent: |
    中間値の定理を、仮定（閉区間での連続性）・確認（端点の値が異符号）・結論（少なくとも1つ）の3要素をそろえて答案に書けるかをみる。計算は易しく、差がつくのは「連続」の明記と結論の言い方である。指数関数と1次関数の交点は代数的には求められないので、存在だけを示す論法の必要性も実感できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (1) ア(オ) 関数の値の極限（関数の連続性と中間値の定理）"]
  variations:
    - 方程式 $\cos x=x$ が $0<x<\dfrac{\pi}{2}$ に実数解をもつことを示させる（三角関数の連続性を使う）。
    - 「区間 $[0,\ 1]$ で $f(0)>0,\ f(1)<0$ だが $f(x)=0$ が解をもたない関数の例」を挙げさせ、連続性の仮定の必要性を確認する。
