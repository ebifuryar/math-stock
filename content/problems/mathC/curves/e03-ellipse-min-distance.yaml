  - { label: ク, answer: "2" }
  - { label: ケ, answer: "4" }
  - { label: コ, answer: "3" }
solution: |
  (1) $\mathrm{PA}^2=(2\cos\theta-t)^2+\sin^2\theta=4\cos^2\theta-4t\cos\theta+t^2+1-\cos^2\theta=3\cos^2\theta-4t\cos\theta+t^2+1$。

  $u=\cos\theta$（$-1\leqq u\leqq 1$）とおくと
  $$f(u)=3u^2-4tu+t^2+1=3\left(u-\frac{2t}{3}\right)^2+1-\frac{t^2}{3}$$
  軸 $u=\dfrac{2t}{3}$ は $t>0$ より正。

  (2) $\dfrac{2t}{3}\leqq 1$、すなわち $0<t\leqq\dfrac{3}{2}$ のとき、軸が変域内にあるので最小値は $f\left(\dfrac{2t}{3}\right)=1-\dfrac{t^2}{3}$。$\mathrm{PA}$ の最小値は $\sqrt{1-\dfrac{t^2}{3}}$。

  (3) $t>\dfrac{3}{2}$ のとき、軸が変域の右外にあるので $u=1$ で最小。$f(1)=t^2-4t+4=(t-2)^2$ より、最小値は $|t-2|$（$\mathrm{P}$ は頂点 $(2,\ 0)$）。

  （軸の位置を確かめずに $\sqrt{1-\dfrac{t^2}{3}}$ とすると、$t>\sqrt{3}$ では根号の中が負になって不合理。$t=\dfrac{3}{2}$ では両方の式が $\dfrac{1}{2}$ で一致する。）

  (4) $t=1\leqq\dfrac{3}{2}$ なので $\cos\theta=\dfrac{2}{3}$ で最小。$x=2\cos\theta=\dfrac{4}{3}$（このとき $y=\pm\dfrac{\sqrt{5}}{3}$、最小値 $\sqrt{\dfrac{2}{3}}=\dfrac{\sqrt{6}}{3}$）。
