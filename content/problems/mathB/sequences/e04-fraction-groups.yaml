id: mb-sq-e04
level: exam
format: mark
title: 分数の群数列と和が初めて超える項
stem: |
  次のように、分母が $2,\ 3,\ 4,\ \cdots$ の分数を、分母の小さい順に、同じ分母の中では分子の小さい順に並べた数列を考える。分母が $m$ の分数としては、分子が $1,\ 2,\ \cdots,\ m-1$ の $m-1$ 個を並べる（約分はしない）。
  $$\frac{1}{2},\ \frac{1}{3},\ \frac{2}{3},\ \frac{1}{4},\ \frac{2}{4},\ \frac{3}{4},\ \frac{1}{5},\ \cdots$$

  (1) この数列に値が $\dfrac{7}{20}$ である項が初めて現れるのは、第 $\boxed{\text{アイウ}}$ 項である。

  (2) この数列の第 $1000$ 項の値を既約分数で表すと $\dfrac{\boxed{\text{エ}}}{\boxed{\text{オカ}}}$ である。

  (3) この数列の初項から第 $N$ 項までの和が初めて $100$ を超えるような $N$ は、$N=\boxed{\text{キクケ}}$ である。
blanks:
  - { label: アイウ, answer: "178" }
  - { label: エ, answer: "5" }
  - { label: オカ, answer: "23" }
  - { label: キクケ, answer: "205" }
solution: |
  分母が $m$ の分数の集まりを第 $m-1$ 群とみると、第 $j$ 群は分母 $j+1$ で $j$ 個の項からなる。第 $j$ 群の末項までの項数は $1+2+\cdots+j=\dfrac{j(j+1)}{2}$。

  (1) 値 $\dfrac{7}{20}$ は既約なので、分母は $20$ の倍数でなければならず、初めて現れるのは分母 $20$（第 $19$ 群）の $7$ 番目。第 $18$ 群の末項までに $\dfrac{18\cdot 19}{2}=171$ 項あるので、$171+7=178$ 項目。

  (2) $\dfrac{44\cdot 45}{2}=990<1000\leqq\dfrac{45\cdot 46}{2}=1035$ なので、第 $1000$ 項は第 $45$ 群（分母 $46$）の $1000-990=10$ 番目で $\dfrac{10}{46}=\dfrac{5}{23}$。

  (3) 第 $j$ 群の和は $\dfrac{1+2+\cdots+j}{j+1}=\dfrac{j}{2}$ なので、第 $j$ 群の末項までの和は $\dfrac{1}{2}\cdot\dfrac{j(j+1)}{2}=\dfrac{j(j+1)}{4}$。
  $j=19$ で $95$、$j=20$ で $105$ なので、和が $100$ を超えるのは第 $20$ 群（分母 $21$）の途中。第 $20$ 群の $i$ 番目までの和は
  $$95+\frac{1+2+\cdots+i}{21}=95+\frac{i(i+1)}{42}$$
  これが $100$ を超える条件は $i(i+1)>210$。$i=14$ のとき $14\cdot 15=210$ でちょうど $100$（超えない）、$i=15$ のとき $240>210$。

  第 $19$ 群の末項までの項数は $\dfrac{19\cdot 20}{2}=190$ なので、$N=190+15=205$。
concepts: [sq-sum-techniques, sq-sigma, sq-arithmetic]
misconceptions: [mc-sq-term-count, mc-sq-sigma-index-shift]
