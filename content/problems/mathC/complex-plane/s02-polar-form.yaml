id: mc-cp-s02
level: school
format: mark
title: 極形式への書き直し
stem: |
  以下では、極形式 $r(\cos\theta+i\sin\theta)$ における偏角 $\theta$ を $0\leqq\theta<2\pi$ の範囲で答えるものとし、$r>0$ とする。

  (1) $-\sqrt{3}+i$ を極形式で表すと
  $$-\sqrt{3}+i=\boxed{\text{ア}}\left(\cos\frac{\boxed{\text{イ}}}{\boxed{\text{ウ}}}\pi+i\sin\frac{\boxed{\text{イ}}}{\boxed{\text{ウ}}}\pi\right)$$
  である。

  (2) $-2\left(\cos\dfrac{\pi}{6}+i\sin\dfrac{\pi}{6}\right)$ を極形式で表すと
  $$\boxed{\text{エ}}\left(\cos\frac{\boxed{\text{オ}}}{\boxed{\text{カ}}}\pi+i\sin\frac{\boxed{\text{オ}}}{\boxed{\text{カ}}}\pi\right)$$
  である。

  (3) $\sin\dfrac{\pi}{5}+i\cos\dfrac{\pi}{5}$ を極形式で表すと
  $$\cos\frac{\boxed{\text{キ}}}{\boxed{\text{クケ}}}\pi+i\sin\frac{\boxed{\text{キ}}}{\boxed{\text{クケ}}}\pi$$
  である。
blanks:
  - { label: ア, answer: "2" }
  - { label: イ, answer: "5" }
  - { label: ウ, answer: "6" }
  - { label: エ, answer: "2" }
  - { label: オ, answer: "7" }
  - { label: カ, answer: "6" }
  - { label: キ, answer: "3" }
  - { label: クケ, answer: "10" }
solution: |
  (1) $r=\sqrt{(-\sqrt{3})^2+1^2}=2$。$\cos\theta=-\dfrac{\sqrt{3}}{2},\ \sin\theta=\dfrac{1}{2}$ を同時に満たす $\theta$ は $\dfrac{5}{6}\pi$。
  $$-\sqrt{3}+i=2\left(\cos\frac{5}{6}\pi+i\sin\frac{5}{6}\pi\right)$$

  (2) 係数 $-2$ は負なので、このままでは極形式ではない。$-1=\cos\pi+i\sin\pi$ を掛けたとみると、偏角は $\pi$ 増える。
  $$-2\left(\cos\frac{\pi}{6}+i\sin\frac{\pi}{6}\right)=2\left\{\cos\left(\frac{\pi}{6}+\pi\right)+i\sin\left(\frac{\pi}{6}+\pi\right)\right\}=2\left(\cos\frac{7}{6}\pi+i\sin\frac{7}{6}\pi\right)$$
  （直接 $-\sqrt{3}-i$ と計算してから極形式にしてもよい。）

  (3) $\cos$ と $\sin$ が入れ替わっている。$\sin\theta=\cos\left(\dfrac{\pi}{2}-\theta\right)$、$\cos\theta=\sin\left(\dfrac{\pi}{2}-\theta\right)$ より
  $$\sin\frac{\pi}{5}+i\cos\frac{\pi}{5}=\cos\frac{3}{10}\pi+i\sin\frac{3}{10}\pi$$
