id: el-exponent-laws
kind: property
title: 指数法則
body: |
  $a>0,\ b>0$、$r,\ s$ を実数とするとき
  $$a^r a^s=a^{r+s},\qquad a^r\div a^s=a^{r-s},\qquad (a^r)^s=a^{rs},\qquad (ab)^r=a^r b^r$$

  - $(a^r)^s$ は指数の **積**、$a^r a^s$ は指数の **和**。$(2^3)^2=2^6$ だが $2^{3^2}=2^9$ であり、累乗の累乗 $a^{r^s}$ は $(a^r)^s$ とは別物。
  - 割り算は負の指数の掛け算に直すと符号ミスが減る: $a^r\div a^{-s}=a^{r+s}$。
  - 計算では、まず底を素数（$2,\ 3$ など）にそろえ、指数部分だけの足し算・掛け算にする。
prerequisites: [el-rational-exponent]
