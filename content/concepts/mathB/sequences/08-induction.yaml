id: sq-induction
kind: method
title: 数学的帰納法
body: |
  自然数 $n$ についての命題 $P(n)$ がすべての自然数 $n$ で成り立つことを示すには、次の2つを示せばよい。

  1. $n=1$ のとき $P(1)$ が成り立つ。
  2. $n=k$ のとき $P(k)$ が成り立つと **仮定** すると、$n=k+1$ のときも $P(k+1)$ が成り立つ。

  (1) と (2) の両方が必要である。(2) だけでは何も示したことにならない（成り立たない等式でも (2) は通ることがある）。(2) では仮定 $P(k)$ を必ずどこかで用いる。$P(k+1)$ を直接示してしまうなら、それは帰納法になっていない。

  「$n\geqq m$ のすべての自然数」で示すときは、出発点を $n=m$ にし、(2) では $k\geqq m$ を用いてよい。

  **よく使う形**
  - 等式: $P(k+1)$ の左辺を「$P(k)$ の左辺 $+$ 第 $k+1$ 項」とみて仮定を代入する。
  - 不等式: (右辺) $-$ (左辺) $>0$ を示す。仮定から得た評価と、示したい式の間の差を別に示す。
  - 整除性: 「$f(k)$ が $m$ の倍数」を「$f(k)=mN$（$N$ は整数）」と式で表し、$f(k+1)$ を $f(k)$ を用いて表す。
prerequisites: [sq-recurrence-basic]
