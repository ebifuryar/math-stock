id: mc-cv-a01
level: applied
format: choice
title: 媒介変数の消去と x の変域
stem: |
  媒介変数 $\theta$ を用いて
  $$x=\sin\theta+\cos\theta,\qquad y=\sin\theta\cos\theta\qquad(0\leqq\theta\leqq\pi)$$
  と表される点 $\mathrm{P}(x,\ y)$ の描く図形について考える。

  $x^2=\sin^2\theta+2\sin\theta\cos\theta+\cos^2\theta=1+2y$ であるから、点 $\mathrm{P}$ は放物線 $y=\dfrac{x^2-1}{2}$ 上にある。また、$x$ は三角関数の合成により $x=\sqrt{2}\sin\left(\theta+\dfrac{\pi}{4}\right)$ と表される。

  点 $\mathrm{P}$ の描く図形として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: 放物線 $y=\dfrac{x^2-1}{2}$ 全体
    misconception: mc-cv-param-range
    rationale: |
      媒介変数を消去した式の表す図形全体を答えている。$|x|=\left|\sqrt{2}\sin\left(\theta+\dfrac{\pi}{4}\right)\right|\leqq\sqrt{2}$ なので、たとえば $x=2$ となる点は描かれない。
  - id: "2"
    text: 放物線 $y=\dfrac{x^2-1}{2}$ の $-\sqrt{2}\leqq x\leqq\sqrt{2}$ の部分
    misconception: mc-cv-param-range
    rationale: |
      $\theta$ がすべての実数を動くとしたときの変域を答えている。$0\leqq\theta\leqq\pi$ では $\dfrac{\pi}{4}\leqq\theta+\dfrac{\pi}{4}\leqq\dfrac{5}{4}\pi$ なので、$x=-\sqrt{2}$（$\theta+\dfrac{\pi}{4}=\dfrac{3}{2}\pi$）は実現しない。
  - id: "3"
    text: 放物線 $y=\dfrac{x^2-1}{2}$ の $-1\leqq x\leqq\sqrt{2}$ の部分
    rationale: |
      正解。$\theta+\dfrac{\pi}{4}$ の範囲 $\left[\dfrac{\pi}{4},\ \dfrac{5}{4}\pi\right]$ で $\sin$ は $-\dfrac{1}{\sqrt{2}}$ 以上 $1$ 以下のすべての値をとるので、$-1\leqq x\leqq\sqrt{2}$。
  - id: "4"
    text: 放物線 $y=\dfrac{x^2-1}{2}$ の $-1\leqq x\leqq 1$ の部分
    misconception: mc-cv-param-range
    rationale: |
      $\theta$ の範囲の両端 $\theta=0$（$x=1$）と $\theta=\pi$（$x=-1$）での値だけで変域を決めている。途中の $\theta=\dfrac{\pi}{4}$ で $x=\sqrt{2}$ となり、$x$ は端点での値を超える。
answer: "3"
solution: |
  $x^2=1+2\sin\theta\cos\theta=1+2y$ より、点 $\mathrm{P}$ は放物線 $y=\dfrac{x^2-1}{2}$ 上にある。

  変域を調べる。$x=\sqrt{2}\sin\left(\theta+\dfrac{\pi}{4}\right)$ で、$0\leqq\theta\leqq\pi$ より $\dfrac{\pi}{4}\leqq\theta+\dfrac{\pi}{4}\leqq\dfrac{5}{4}\pi$。この範囲で
  $$-\frac{1}{\sqrt{2}}\leqq\sin\left(\theta+\frac{\pi}{4}\right)\leqq 1\quad\Longrightarrow\quad -1\leqq x\leqq\sqrt{2}$$
  逆に、この範囲の各 $x$ に対して $x=\sqrt{2}\sin\left(\theta+\dfrac{\pi}{4}\right)$ を満たす $\theta\in[0,\ \pi]$ が存在し、そのとき $y=\dfrac{x^2-1}{2}$ となる。

  よって、放物線 $y=\dfrac{x^2-1}{2}$ の $-1\leqq x\leqq\sqrt{2}$ の部分。
concepts: [cv-parametric, tf-synthesis]
misconceptions: [mc-cv-param-range]
targetSeconds: 240
irt: { expectedCorrectRate: 0.5, discrimination: 1.3 }
author:
  intent: |
    媒介変数の消去は誘導で与え、消去後の変域を正しく求められるかに焦点を絞った。①は変域を落とす、②は $\theta$ の範囲の制限を無視する、④は端点の値だけで変域を決める、という変域処理の3段階の誤りに対応し、どこまで正しく処理できたかを識別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(イ) 曲線の媒介変数表示]
  variations:
    - $x=\sin\theta-\cos\theta,\ y=\sin\theta\cos\theta$（$0\leqq\theta\leqq\dfrac{\pi}{2}$）で同様に問う。
    - $x=\dfrac{1-t^2}{1+t^2},\ y=\dfrac{2t}{1+t^2}$（$t$ は実数）が円から1点を除いたものになることを確かめさせる。
