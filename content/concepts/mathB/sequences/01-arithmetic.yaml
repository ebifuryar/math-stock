id: sq-arithmetic
kind: formula
title: 等差数列の一般項と和
body: |
  初項 $a$、公差 $d$ の **等差数列** $\{a_n\}$ の一般項は
  $$a_n=a+(n-1)d$$
  である。第 $n$ 項までに公差を足す回数は $n-1$ 回であることに注意する。

  初項から第 $n$ 項までの和 $S_n$ は
  $$S_n=\frac{1}{2}n(a+l)=\frac{1}{2}n\{2a+(n-1)d\}\qquad(l\ \text{は末項})$$

  **項数**: 第 $p$ 項から第 $q$ 項まで（$p\leqq q$）の項数は $q-p+1$ である。$q-p$ は「間の数」であって項数ではない。

  **等差中項**: 3つの数 $a,\ b,\ c$ がこの順に等差数列をなす $\iff$ $2b=a+c$。
