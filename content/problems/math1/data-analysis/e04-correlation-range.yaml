id: m1-da-e04
level: exam
format: choice
title: 和の分散と相関係数の決定
stem: |
  2つの変量 $x,\ y$ について、$x$ の分散は $9$、$y$ の分散は $16$ であり、$x+y$ の分散は $37$ であるとする。

  このとき正しい記述を、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $x-y$ の分散は $25$ である。
    rationale: |
      $s_{x-y}^2=s_x^2+s_y^2-2s_{xy}$ の共分散の項を落としている。$s_{xy}=6$ なので $9+16-12=13$。
  - id: "2"
    text: $u=-2x+5,\ v=3y-1$ とおくと、$u$ と $v$ の相関係数は $-3$ である。
    misconception: mc-da-linear-transform
    rationale: |
      共分散の変化（$ac=-6$ 倍）を相関係数にそのまま適用している。標準偏差も $|{-2}|$ 倍、$|3|$ 倍されるので相関係数は符号だけ変わり $-0.5$。相関係数は必ず $-1\leqq r\leqq 1$ を満たすので、$-3$ という値自体ありえない。
  - id: "3"
    text: $x$ と $y$ の相関係数は $0.5$ であり、$x-y$ の分散は $13$ である。
    rationale: |
      正解。$s_{x+y}^2=s_x^2+s_y^2+2s_{xy}$ より $37=9+16+2s_{xy}$、$s_{xy}=6$。よって $r=\dfrac{6}{3\times 4}=0.5$、$s_{x-y}^2=9+16-12=13$。
  - id: "4"
    text: $x$ の分散と $y$ の分散だけからは $x+y$ の分散は定まらないので、与えられた条件は矛盾しており、相関係数も定まらない。
    rationale: |
      前半は正しい（$s_{x+y}^2$ は $s_{xy}$ によって決まり、$-1\leqq r\leqq 1$ から $1\leqq s_{x+y}^2\leqq 49$ の範囲をとりうる）。しかし $37$ はこの範囲内なので矛盾はなく、逆に $s_{x+y}^2=37$ が与えられれば共分散、したがって相関係数が一意に定まる。
answer: "3"
solution: |
  偏差を考えると $(x_k-\bar{x})+(y_k-\bar{y})$ の2乗の平均が $x+y$ の分散なので

  $$s_{x+y}^2=s_x^2+s_y^2+2s_{xy},\qquad s_{x-y}^2=s_x^2+s_y^2-2s_{xy}$$

  $37=9+16+2s_{xy}$ より $s_{xy}=6$、$r=\dfrac{6}{\sqrt{9}\sqrt{16}}=\dfrac{6}{12}=0.5$、$s_{x-y}^2=25-12=13$。

  なお $-1\leqq r\leqq 1$ すなわち $|s_{xy}|\leqq 12$ だから、$s_{x+y}^2=25+2s_{xy}$ がとりうる値の範囲は $1\leqq s_{x+y}^2\leqq 49$ である。$37$ はその範囲にあるので条件に矛盾はない。
concepts: [da-correlation, da-linear-transform, da-variance-formula]
misconceptions: [mc-da-linear-transform]
targetSeconds: 360
irt: { expectedCorrectRate: 0.28, discrimination: 1.4 }
author:
  intent: |
    和の分散の展開式を通して共分散を逆算し、相関係数を決定できるかをみる。さらに、相関係数が $-1\leqq r\leqq 1$ を満たすことから和の分散自体に範囲（$1$ 以上 $49$ 以下）があるという議論を、誤答④に埋め込んで考えさせる。②は変量変換で共分散の規則を相関係数に誤用する典型で、値が $-3$ と範囲外になることから自力で排除できるようにも作ってある。①は共分散の項を落とす（$x,\ y$ が無相関であるかのように扱う）誤り。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学I (4) ア(ア) 散布図・相関係数, 数学I (4) ア(ア) 分散・標準偏差（変量の変換）]
  variations:
    - $x+y$ の分散の値を $50$ にして、条件を満たすデータが存在しないことを説明させる。
    - $x+2y$ の分散を求めさせ、係数が付いた場合の展開を扱う。
