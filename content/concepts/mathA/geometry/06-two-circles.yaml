id: gm-two-circles
kind: property
title: 2つの円の位置関係と共通接線
body: |
  半径 $r,\ r'\ (r>r')$ の2円の中心間の距離を $d$ とすると

  | 位置関係 | 条件 | 共通接線の本数 |
  | --- | --- | --- |
  | 離れている | $d>r+r'$ | 4 |
  | 外接する | $d=r+r'$ | 3 |
  | 2点で交わる | $r-r'<d<r+r'$ | 2 |
  | 内接する | $d=r-r'$ | 1 |
  | 一方が他方の内部 | $d<r-r'$ | 0 |

  **共通接線の長さ**（接点間の距離）: 2つの半径は接線に垂直で互いに平行になる。一方の中心から、もう一方の半径（またはその延長）へ垂線を下ろして直角三角形をつくる。
  - 共通外接線（2円が接線の同じ側）: $\sqrt{d^2-(r-r')^2}$
  - 共通内接線（2円が接線の反対側）: $\sqrt{d^2-(r+r')^2}$

  中心間の距離 $d$ は直角三角形の**斜辺**になる。
prerequisites: [gm-power-of-point]
