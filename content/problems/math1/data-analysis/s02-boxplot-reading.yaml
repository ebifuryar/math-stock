id: m1-da-s02
level: school
format: choice
title: 箱ひげ図から読み取れること
stem: |
  A組とB組（それぞれ40人）で同じ数学のテスト（100点満点）を行った。それぞれの組の得点の箱ひげ図は、次の5数要約で表される。

  | | 最小値 | 第1四分位数 | 中央値 | 第3四分位数 | 最大値 |
  | --- | --- | --- | --- | --- | --- |
  | A組 | 32 | 55 | 64 | 75 | 92 |
  | B組 | 40 | 50 | 58 | 68 | 88 |

  この箱ひげ図から **必ず正しいといえる** ものを、次の①〜④のうちから一つ選べ。ただし、外れ値は「第1四分位数 $-1.5\times$ 四分位範囲」未満または「第3四分位数 $+1.5\times$ 四分位範囲」より大きい値とする。
choices:
  - id: "1"
    text: A組の平均点は、B組の平均点より高い。
    misconception: mc-da-boxplot-reading
    rationale: |
      箱ひげ図からは平均値は読み取れない。例えばA組の平均点は $58$ 点、B組の平均点は $64.8$ 点となるような、表と矛盾しないデータを作ることができる。
  - id: "2"
    text: A組では、55点以上の生徒が30人以上いる。
    rationale: |
      正解。40人のデータでは $Q_1$ は小さいほうから10番目と11番目の値の平均で、これが $55$ だから11番目の値は $55$ 以上。よって11番目〜40番目の30人は55点以上である。
  - id: "3"
    text: A組では、中央値から第3四分位数までの区間のほうが、第1四分位数から中央値までの区間より長いので、この区間に入る生徒の人数のほうが多い。
    misconception: mc-da-boxplot-reading
    rationale: |
      箱ひげ図の区間の長さは人数を表さない。どちらの区間にもおよそ全体の4分の1（約10人）ずつ入る。区間が長いことは、その範囲で得点がまばらであることを意味する。
  - id: "4"
    text: A組の最小値32点は外れ値である。
    misconception: mc-da-outlier-criterion
    rationale: |
      四分位範囲は $75-55=20$ で、下側の基準は $55-1.5\times 20=25$。$32>25$ なので外れ値ではない。$1.5$ 倍を落として $55-20=35$ を基準にすると外れ値と誤判定する。
answer: "2"
solution: |
  箱ひげ図は5数要約しか表していないので、平均値や区間ごとの正確な人数はわからない。わかるのは「何番目の値がどの範囲にあるか」である。

  40人のとき $Q_1=\dfrac{(\text{10番目})+(\text{11番目})}{2}=55$ なので、11番目以降の30人は55点以上（②が正しい）。

  外れ値の基準は $Q_1-1.5(Q_3-Q_1)=55-30=25$ なので、32点は外れ値ではない。
concepts: [da-quartiles-boxplot, da-outliers]
misconceptions: [mc-da-boxplot-reading, mc-da-outlier-criterion]
targetSeconds: 180
irt: { expectedCorrectRate: 0.6, discrimination: 1.1 }
author:
  intent: |
    共通テストで頻出の「箱ひげ図から読み取れる正しい記述」の基本形。四分位数の定義から人数の下限を論理的に導けるか（②）と、箱ひげ図に含まれない情報（平均値・区間内の人数の大小）を読み取ったつもりになっていないか（①③）、外れ値の基準を正確に適用できるか（④）を同時にみる。①は、表と矛盾しない極端なデータでB組の平均が上回る例が作れることを確認済み。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (4) イ(イ) 四分位範囲・箱ひげ図によるデータの傾向の把握, 数学I (4) イ(イ) 外れ値の扱い]
  variations:
    - 人数を39人（奇数）にして、$Q_1$ が何番目の値かの判断を変える。
    - 2組の箱ひげ図とヒストグラムの対応を選ばせる。
