id: ma-gm-e02
level: exam
format: choice
title: 2円の共通接線と共通弦
stem: |
  2つの円 $C_1,\ C_2$ が2点で交わっている。$C_1,\ C_2$ の共通接線の1つ $\ell$ が、$C_1$ と点 $\mathrm{S}$ で、$C_2$ と点 $\mathrm{T}$ で接している。$C_1$ と $C_2$ の2つの交点のうち、$\ell$ に近い方を $\mathrm{A}$、遠い方を $\mathrm{B}$ とし、直線 $\mathrm{AB}$ と直線 $\ell$ の交点を $\mathrm{M}$ とする。

  $\mathrm{ST}=8,\ \mathrm{AB}=6$ のとき、線分 $\mathrm{MA}$ の長さとして正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $\dfrac{8}{3}$
    misconception: mc-gm-power-segment
    rationale: |
      $\mathrm{MS}^2=\mathrm{MA}\cdot\mathrm{AB}$ として、方べきの定理で弦の長さ $\mathrm{AB}$ を掛けている。掛けるのは $\mathrm{M}$ から2交点までの長さ $\mathrm{MA}$ と $\mathrm{MB}=\mathrm{MA}+6$。
  - id: "2"
    text: 円の半径が与えられていないので、一つに定まらない。
    rationale: |
      2円の大きさが決まらないので長さも決まらない、と考えている。$\mathrm{M}$ は直線 $\mathrm{AB}$ 上にあるので、$C_1,\ C_2$ のどちらに対しても方べきが $\mathrm{MA}\cdot\mathrm{MB}$ で共通になり、半径によらず $\mathrm{MS}=\mathrm{MT}$ が言える。
  - id: "3"
    text: $2$
    rationale: |
      正解。方べきの定理より $\mathrm{MS}^2=\mathrm{MA}\cdot\mathrm{MB}=\mathrm{MT}^2$ なので $\mathrm{M}$ は $\mathrm{ST}$ の中点で $\mathrm{MS}=4$。$\mathrm{MA}=x$ とおくと $x(x+6)=16$、$x>0$ より $x=2$。
  - id: "4"
    text: $-3+\sqrt{73}$
    rationale: |
      $\mathrm{MS}=\mathrm{ST}=8$ として $x(x+6)=64$ を解いている。$\mathrm{M}$ は $\mathrm{S}$ と $\mathrm{T}$ の中点であり、$\mathrm{MS}=\dfrac{1}{2}\mathrm{ST}=4$。
answer: "3"
solution: |
  $\mathrm{M}$ は円 $C_1$ の外部の点で、$\mathrm{M}$ を通る直線が $C_1$ と $\mathrm{A},\ \mathrm{B}$ で交わり、$\mathrm{MS}$ は $C_1$ の接線だから $\mathrm{MS}^2=\mathrm{MA}\cdot\mathrm{MB}$。同様に $C_2$ について $\mathrm{MT}^2=\mathrm{MA}\cdot\mathrm{MB}$。

  よって $\mathrm{MS}=\mathrm{MT}$ で、$\mathrm{M}$ は線分 $\mathrm{ST}$ の中点、$\mathrm{MS}=4$。$\mathrm{MA}=x$ とすると、$\mathrm{A}$ は線分 $\mathrm{MB}$ 上にあるので $\mathrm{MB}=x+6$。
  $$x(x+6)=16\quad\Longrightarrow\quad(x+8)(x-2)=0$$
  $x>0$ より $\mathrm{MA}=2$。
concepts: [gm-power-of-point, gm-two-circles]
misconceptions: [mc-gm-power-segment]
targetSeconds: 300
irt: { expectedCorrectRate: 0.4, discrimination: 1.3 }
author:
  intent: |
    2円の共通弦（の延長）上の点では2円に対する方べきが等しい、という見方ができるかをみる。図の条件だけでは2円が決まらないのに答えが決まる、という構造にして、「半径がないから決まらない」と判断する受験生（②）と、$\mathrm{M}$ が $\mathrm{ST}$ の中点になることを見抜く受験生を識別する。①④は方べきの式の線分の取り方の誤りと、中点に気づかない誤りに対応する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学A (1) ア(イ) 円に関する基本的な性質（方べきの定理、2つの円の位置関係）]
  variations:
    - 「直線 $\mathrm{AB}$ は線分 $\mathrm{ST}$ を二等分する」ことを記述式で証明させる。
    - 共通接線を2本とし、直線 $\mathrm{AB}$ が2本の接線の接点を結ぶ線分の中点をそれぞれ通ることを用いて長さを求めさせる。
