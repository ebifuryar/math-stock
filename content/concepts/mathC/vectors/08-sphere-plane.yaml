id: vc-sphere-plane
kind: formula
title: 球面・平面の方程式と距離（発展）
body: |
  **球面** 中心 $(a,\ b,\ c)$、半径 $r$ の球面は $(x-a)^2+(y-b)^2+(z-c)^2=r^2$。$x^2+y^2+z^2+\cdots=0$ の形は平方完成して中心と半径を読む。座標平面（例: $z=0$）との交わりは、$z=0$ を代入した円になる。

  **平面の方程式（発展）** 点 $(x_0,\ y_0,\ z_0)$ を通り、法線ベクトル $\vec n=(a,\ b,\ c)$ に垂直な平面は
  $$a(x-x_0)+b(y-y_0)+c(z-z_0)=0$$
  法線ベクトルは、平面上の平行でない2つのベクトルの両方と内積が $0$ になるベクトルとして求める。

  **点と平面の距離（発展）** 点 $(x_1,y_1,z_1)$ と平面 $ax+by+cz+d=0$ の距離は $\dfrac{|ax_1+by_1+cz_1+d|}{\sqrt{a^2+b^2+c^2}}$。

  **点と直線の距離** 直線 $\vec p=\vec a+t\vec d$ と点 $\mathrm{C}$ の距離は $|\vec p-\vec c|^2$（$t$ の2次式）の最小値の平方根。直線と球面が交わるとき、切り取られる線分の長さは $2\sqrt{r^2-d^2}$（$d$ は中心と直線の距離）。
prerequisites: [vc-space-vector, vc-vector-equation]
