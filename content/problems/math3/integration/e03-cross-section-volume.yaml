id: m3-ig-e03
level: exam
format: mark
title: 断面積から求める立体の体積
stem: |
  座標空間において、不等式
  $$x^2+y^2\leqq 1,\qquad 0\leqq z\leqq x^2$$
  の表す立体を $K$ とする。$K$ は、$xy$ 平面上の円板 $x^2+y^2\leqq 1$ を底面とし、その上の点 $(x,\ y,\ 0)$ の真上に高さ $x^2$ まで積み上げた立体である。

  (1) $-1\leqq t\leqq 1$ とする。平面 $x=t$ による $K$ の断面は、$y$ 方向の長さが $2\sqrt{1-t^2}$、$z$ 方向の長さが $t^2$ の長方形であり、その面積は
  $$S(t)=\boxed{\text{ア}}\,t^2\sqrt{1-t^2}$$
  である。

  (2) $S(t)$ は偶関数であるから $V=\displaystyle\int_{-1}^{1}S(t)\,dt=2\int_0^1S(t)\,dt$ であり、$t=\sin\theta\ \left(0\leqq\theta\leqq\dfrac{\pi}{2}\right)$ と置換すると
  $$V=\boxed{\text{イ}}\int_0^{\frac{\pi}{2}}\sin^2\theta\cos^2\theta\,d\theta$$
  となる。これより $K$ の体積は $V=\dfrac{\pi}{\boxed{\text{ウ}}}$ である。

  (3) 検算のため、平面 $y=s\ (-1\leqq s\leqq 1)$ で $K$ を切る。断面は $xz$ 平面に平行な平面上の、$-\sqrt{1-s^2}\leqq x\leqq\sqrt{1-s^2},\ 0\leqq z\leqq x^2$ の部分であり、その面積は
  $$T(s)=\frac{\boxed{\text{エ}}}{\boxed{\text{オ}}}\left(1-s^2\right)^{\frac{3}{2}}$$
  である。$\displaystyle\int_{-1}^{1}T(s)\,ds$ を計算すると、(2) と同じ値になる。

  ただし、分数は既約分数で答えよ。
blanks:
  - { label: ア, answer: "2" }
  - { label: イ, answer: "4" }
  - { label: ウ, answer: "4" }
  - { label: エ, answer: "2" }
  - { label: オ, answer: "3" }
solution: |
  (1) 平面 $x=t$ 上では $y^2\leqq 1-t^2$、$0\leqq z\leqq t^2$ なので、断面は $2\sqrt{1-t^2}\times t^2$ の長方形で $S(t)=2t^2\sqrt{1-t^2}$。

  (2) $t=\sin\theta$ とおくと $dt=\cos\theta\,d\theta$、$t:0\to 1$ に $\theta:0\to\dfrac{\pi}{2}$ が対応し、$0\leqq\theta\leqq\dfrac{\pi}{2}$ で $\sqrt{1-\sin^2\theta}=\cos\theta$ なので
  $$V=2\int_0^1 2t^2\sqrt{1-t^2}\,dt=4\int_0^{\frac{\pi}{2}}\sin^2\theta\cos\theta\cdot\cos\theta\,d\theta=4\int_0^{\frac{\pi}{2}}\sin^2\theta\cos^2\theta\,d\theta$$
  $\sin^2\theta\cos^2\theta=\dfrac{\sin^22\theta}{4}=\dfrac{1-\cos 4\theta}{8}$ より
  $$V=4\left[\frac{\theta}{8}-\frac{\sin 4\theta}{32}\right]_0^{\frac{\pi}{2}}=4\cdot\frac{\pi}{16}=\frac{\pi}{4}$$

  (3) $a=\sqrt{1-s^2}$ とおくと $T(s)=\displaystyle\int_{-a}^{a}x^2\,dx=\frac{2}{3}a^3=\frac{2}{3}(1-s^2)^{\frac{3}{2}}$。$s=\sin\varphi$ と置換すると
  $$\int_{-1}^{1}T(s)\,ds=\frac{2}{3}\int_{-\frac{\pi}{2}}^{\frac{\pi}{2}}\cos^4\varphi\,d\varphi=\frac{2}{3}\cdot\frac{3}{8}\pi=\frac{\pi}{4}$$
  となり (2) と一致する。
