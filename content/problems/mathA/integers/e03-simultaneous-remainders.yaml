author:
  intent: |
    「余りの条件」を1次不定方程式に翻訳し、条件を1つずつ加えて周期が $15\to 105\to 1155$ と最小公倍数で伸びていく構造を理解しているかをみる。(3) では周期が $105\cdot 11$ になること（$105$ と $11$ が互いに素）を使えるかが鍵。周期を誤ると エオカ は合っても キ が合わず、理解の深さを分離できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学A (3) ア(ア) 整数の性質（1次不定方程式・余りによる整数の分類）]
