id: ma-it-a05
level: applied
format: written
title: 平方数の余りと背理法
stem: |
  (1) 整数 $n$ について、$n^2$ を $3$ で割った余りは $0$ または $1$ であることを示せ。

  (2) 整数 $a,\ b,\ c$ が $a^2+b^2=c^2$ を満たすとき、$a,\ b$ の少なくとも一方は $3$ の倍数であることを証明せよ。
modelAnswer: |
  **(1)** $k$ を整数とすると、$n$ は $3k,\ 3k+1,\ 3k+2$ のいずれかの形に表される。
  - $n=3k$ のとき $n^2=9k^2=3\cdot 3k^2$ で、余りは $0$
  - $n=3k+1$ のとき $n^2=9k^2+6k+1=3(3k^2+2k)+1$ で、余りは $1$
  - $n=3k+2$ のとき $n^2=9k^2+12k+4=3(3k^2+4k+1)+1$ で、余りは $1$

  よって $n^2$ を $3$ で割った余りは $0$ または $1$ である。

  **(2)** 結論を否定して、$a,\ b$ がともに $3$ の倍数でないと仮定する。

  (1) の場合分けから、$3$ の倍数でない整数の平方を $3$ で割った余りは $1$ である。よって $a^2,\ b^2$ を $3$ で割った余りはともに $1$ であり、整数 $s,\ t$ を用いて $a^2=3s+1,\ b^2=3t+1$ と表せるから
  $$c^2=a^2+b^2=3(s+t)+2$$
  となり、$c^2$ を $3$ で割った余りは $2$ である。

  これは (1)（平方数を $3$ で割った余りは $0$ か $1$）に矛盾する。

  したがって、$a,\ b$ の少なくとも一方は $3$ の倍数である。$\blacksquare$
rubric:
  - id: r1
    criterion: (1) $n=3k,\ 3k+1,\ 3k+2$ の3通りに分け、それぞれの $n^2$ を $3(\cdots)+r$ の形に変形して余りを求めている
    points: 3
    keywords: ["3k+1", "3k+2"]
  - id: r2
    criterion: (2) 結論を否定し「$a,\ b$ がともに $3$ の倍数でない」と仮定している（否定の形が正しい）
    points: 2
    keywords: ["ともに", "仮定"]
  - id: r3
    criterion: $3$ の倍数でない数の平方の余りが $1$ であることを (1) から導き、$a^2+b^2$ を $3$ で割った余りが $2$ になることを示している
    points: 3
    keywords: ["余りは1", "余りは2"]
  - id: r4
    criterion: $c^2$ の余りについて (1) と矛盾することを指摘し、結論を述べている
    points: 2
    keywords: ["矛盾"]
solution: |
  「少なくとも一方は $3$ の倍数」の否定は「両方とも $3$ の倍数でない」。そのとき $a^2+b^2$ を $3$ で割った余りは $1+1=2$ になるが、平方数 $c^2$ の余りは $0$ か $1$ しかないので矛盾する。
