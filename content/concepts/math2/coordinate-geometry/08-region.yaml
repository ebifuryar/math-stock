id: cg-region
kind: method
title: 不等式の表す領域と最大・最小
body: |
  **領域**
  - $y>f(x)$ は曲線 $y=f(x)$ の **上側**、$y<f(x)$ は **下側**。
  - $(x-a)^2+(y-b)^2<r^2$ は円の **内部**、$>r^2$ は **外部**。
  - $<,\ >$ なら境界を含まず、$\leqq,\ \geqq$ なら境界を含む。迷ったら領域に入りそうな1点（原点など）を代入して確かめる。
  - $ax+by+c>0$ のように $y$ について解いていない形は、$y$ について解いてから（$b<0$ なら不等号の向きが変わる）上下を判断する。

  **領域における最大・最小**: $(x,y)$ が領域 $D$ を動くときの式 $F(x,y)$ の最大・最小は、$F(x,y)=k$ とおいた図形が $D$ と **共有点をもつような $k$ の範囲** を求める。
  - $F=ax+by$（1次式）: 直線 $ax+by=k$ を平行移動する。$D$ が多角形なら頂点で最大・最小となる（線形計画法）。どの頂点かは、直線の傾きと境界の傾きの大小で決まる。
  - 境界に円弧があるとき: 直線が円弧に **接する** 点が候補になる。その接点が実際に $D$ に含まれるかを確認し、含まれなければ円弧の端点が候補になる。
  - $F=x^2+y^2$: 原点を中心とする円の半径の2乗。原点から境界の直線に下ろした垂線の足が候補になる（頂点とは限らない）。
  - $F=\dfrac{y-q}{x-p}$: 点 $(p,q)$ と $(x,y)$ を結ぶ直線の傾き。
prerequisites: [cg-line-equation, cg-circle-line]
