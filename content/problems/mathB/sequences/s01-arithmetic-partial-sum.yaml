id: mb-sq-s01
level: school
format: choice
title: 等差数列の途中の項から途中の項までの和
stem: |
  等差数列 $\{a_n\}$ において、第 $5$ 項が $17$、第 $12$ 項が $45$ である。この数列の第 $10$ 項から第 $20$ 項までの和として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $570$
    misconception: mc-sq-term-count
    rationale: |
      項数を $20-10=10$ としている。第 $10$ 項から第 $20$ 項までは $20-10+1=11$ 項あるので、$\dfrac{10\times(37+77)}{2}=570$ は1項分足りない。
  - id: "2"
    text: $583$
    misconception: mc-sq-term-count
    rationale: |
      初項を $a_1=17-5\times 4=-3$ と求めている。$a_5=a_1+4d$ であり、公差を足す回数は $5$ 回ではなく $4$ 回である。この誤った一般項 $4n-7$ で和をとると $\dfrac{11\times(33+73)}{2}=583$ になる。
  - id: "3"
    text: $590$
    misconception: mc-sq-sigma-index-shift
    rationale: |
      $S_{20}-S_{10}=780-190=590$ としている。$S_{10}$ は第 $10$ 項を含むので、これを引くと第 $11$ 項から第 $20$ 項までの和になる。正しくは $S_{20}-S_9$ である。
  - id: "4"
    text: $627$
    rationale: |
      正解。$a_n=4n-3$ より $a_{10}=37,\ a_{20}=77$。項数は $11$ なので $\dfrac{11\times(37+77)}{2}=627$。
answer: "4"
solution: |
  初項を $a$、公差を $d$ とすると $a+4d=17,\ a+11d=45$。辺々引いて $7d=28$ より $d=4$、$a=1$。よって $a_n=4n-3$。

  $a_{10}=37,\ a_{20}=77$ で、第 $10$ 項から第 $20$ 項までの項数は $20-10+1=11$ なので
  $$\sum_{n=10}^{20}a_n=\frac{11\times(37+77)}{2}=627$$
  （$S_n=n(2n-1)$ を用いて $S_{20}-S_9=780-153=627$ としてもよい。）
concepts: [sq-arithmetic, sq-sigma]
misconceptions: [mc-sq-term-count, mc-sq-sigma-index-shift]
targetSeconds: 180
irt: { expectedCorrectRate: 0.7, discrimination: 1.0 }
author:
  intent: |
    等差数列の基本計算のなかで「$1$ のずれ」を3種類に分けて検出する。①は項数を $q-p$ と数える誤り、②は一般項で公差を足す回数を $n$ 回とする誤り、③は $S_q-S_p$ として第 $p$ 項まで引いてしまう誤りである。いずれも計算力ではなく数え方の理解の問題で、選んだ選択肢から指導すべき点が特定できる。
  assessedAbilities: [知識・技能]
  curriculumRefs: ["数学B (1) ア(ア) 等差数列と等比数列"]
  variations:
    - 「初めて $200$ を超えるのは第何項か」を問い、不等式の解から項の番号への変換で同種のずれを確かめる。
    - 第 $10$ 項から第 $20$ 項までの **偶数番目の項** の和として、項数の数え方をさらに一段複雑にする。
