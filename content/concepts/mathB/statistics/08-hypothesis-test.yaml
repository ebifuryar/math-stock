id: st-hypothesis-test
kind: method
title: 仮説検定（正規分布を用いた検定）
body: |
  1. 主張に反する仮説 **帰無仮説** $H_0$（例：$m=100$、$p=\dfrac{1}{2}$）と、主張したい **対立仮説** $H_1$ を立てる。
  2. $H_0$ が正しいとして、標本から計算した量（標本平均・回数・比率）を標準化した $Z$ を求める。
  3. **有意水準**（通常 $5\%$）に対応する **棄却域** に $Z$ が入れば $H_0$ を棄却し、$H_1$ が正しいと判断する。入らなければ $H_0$ は棄却されず、「$H_1$ が正しいとは判断できない」と結論する。

  | 対立仮説 | 検定 | 有意水準5%の棄却域 |
  | --- | --- | --- |
  | $m\neq m_0$（異なる） | 両側検定 | $Z\leqq -1.96$ または $Z\geqq 1.96$ |
  | $m>m_0$（大きい） | 片側検定 | $Z\geqq 1.64$ 程度（$P(Z\geqq z_0)=0.05$ となる $z_0\fallingdotseq 1.645$） |
  | $m<m_0$（小さい） | 片側検定 | $Z\leqq -1.64$ 程度 |

  棄却域の代わりに、$H_0$ のもとで「観測値以上に極端な値」が出る確率を求めて有意水準と比べてもよい。片側検定ならその側だけ、両側検定なら両側を合わせた確率を用いる。

  - 両側か片側かは **データを見る前に**、主張の内容（「異なる」か「大きい／小さい」か）で決める。
  - 棄却されないことは $H_0$ が正しいと証明されたことを意味しない。
  - 有意水準5%の両側検定で $H_0:\ m=m_0$ が棄却されないことと、$m_0$ が信頼度95%の信頼区間に含まれることは同値である。
prerequisites: [st-normal, st-sample-mean, da-hypothesis-testing]
