id: mc-vc-a03
level: applied
format: mark
title: 正四面体と平面の交点・体積（誘導付き）
stem: |
  1辺の長さが $1$ の正四面体 $\mathrm{OABC}$ がある。$\overrightarrow{\mathrm{OA}}=\vec a,\ \overrightarrow{\mathrm{OB}}=\vec b,\ \overrightarrow{\mathrm{OC}}=\vec c$ とする。辺 $\mathrm{OA}$ の中点を $\mathrm{M}$、辺 $\mathrm{BC}$ を $1:2$ に内分する点を $\mathrm{N}$、$\triangle\mathrm{ABC}$ の重心を $\mathrm{G}$ とする。

  (1) 正四面体の各面は正三角形であるから
  $$\vec a\cdot\vec b=\vec b\cdot\vec c=\vec c\cdot\vec a=\frac{\boxed{\text{ア}}}{\boxed{\text{イ}}}$$
  である。

  (2) $\overrightarrow{\mathrm{MN}}=-\dfrac{\boxed{\text{ウ}}}{\boxed{\text{エ}}}\vec a+\dfrac{\boxed{\text{オ}}}{\boxed{\text{カ}}}\vec b+\dfrac{\boxed{\text{キ}}}{\boxed{\text{ク}}}\vec c$ であり、$|\overrightarrow{\mathrm{MN}}|=\dfrac{\sqrt{\boxed{\text{ケコ}}}}{\boxed{\text{サ}}}$ である。

  (3) 直線 $\mathrm{OG}$ と平面 $\mathrm{MBC}$ の交点を $\mathrm{K}$ とする。$\mathrm{K}$ は直線 $\mathrm{OG}$ 上にあるから、実数 $k$ を用いて $\overrightarrow{\mathrm{OK}}=k\overrightarrow{\mathrm{OG}}$ と表せる。これを $\overrightarrow{\mathrm{OM}},\ \overrightarrow{\mathrm{OB}},\ \overrightarrow{\mathrm{OC}}$ を用いて表すと
  $$\overrightarrow{\mathrm{OK}}=\frac{\boxed{\text{シ}}k}{\boxed{\text{ス}}}\overrightarrow{\mathrm{OM}}+\frac{k}{3}\overrightarrow{\mathrm{OB}}+\frac{k}{3}\overrightarrow{\mathrm{OC}}$$
  となる。$\mathrm{K}$ が平面 $\mathrm{MBC}$ 上にあることから、$k=\dfrac{\boxed{\text{セ}}}{\boxed{\text{ソ}}}$ である。

  (4) $\overrightarrow{\mathrm{OG}}\cdot\overrightarrow{\mathrm{AB}}=\boxed{\text{タ}}$ であり、同様に $\overrightarrow{\mathrm{OG}}\cdot\overrightarrow{\mathrm{AC}}$ も同じ値になるので、$\mathrm{OG}$ は平面 $\mathrm{ABC}$ に垂直である。$|\overrightarrow{\mathrm{OG}}|=\dfrac{\sqrt{\boxed{\text{チ}}}}{\boxed{\text{ツ}}}$ であるから、正四面体 $\mathrm{OABC}$ の体積は $\dfrac{\sqrt{\boxed{\text{テ}}}}{\boxed{\text{トナ}}}$ であり、四面体 $\mathrm{KABC}$ の体積は $\dfrac{\sqrt{\boxed{\text{ニ}}}}{\boxed{\text{ヌネ}}}$ である。
