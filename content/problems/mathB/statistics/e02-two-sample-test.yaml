id: mb-st-e02
level: exam
format: choice
title: 2つの工場の母平均の差の検定
stem: |
  2つの工場 A, B で同じ規格の製品を作っている。A で作られる製品の重さ（g）の母標準偏差は $6$、B で作られる製品の重さの母標準偏差は $8$ であることがわかっている。

  A の製品から無作為に $100$ 個、B の製品から無作為に $100$ 個を取り出して重さを量ったところ、標本平均はそれぞれ $\overline{X}=251.8$、$\overline{Y}=250.0$ であった。A と B の製品の重さの母平均をそれぞれ $m_A,\ m_B$ とし、「$m_A$ と $m_B$ は異なる」といえるかを有意水準 $5\%$ で検定する。

  ただし、2つの標本は互いに独立に取り出したものであり、帰無仮説 $m_A=m_B$ のもとで $\overline{X}-\overline{Y}$ は近似的に平均 $0$ の正規分布に従うものとする。また、$Z$ を標準正規分布に従う確率変数として、$p(z_0)=P(0\leqq Z\leqq z_0)$ の値は次の表のとおりである。

  | $z_0$ | $0.18$ | $1.80$ | $1.96$ | $3.40$ |
  | --- | --- | --- | --- | --- |
  | $p(z_0)$ | $0.0714$ | $0.4641$ | $0.4750$ | $0.4997$ |

  検定の過程と結論として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: '$\overline{X}-\overline{Y}$ の標準偏差は $\sqrt{0.64-0.36}\fallingdotseq 0.53$ で、標準化した値は約 $3.40$ となり $1.96$ より大きいので、$m_A$ と $m_B$ は異なると判断できる。'
    misconception: mc-st-sum-variance
    rationale: |
      差の分散を分散の差 $V(\overline{Y})-V(\overline{X})$ としている。独立な確率変数の差の分散は $V(\overline{X}-\overline{Y})=V(\overline{X})+(-1)^2V(\overline{Y})$ で、足し合わせる。
  - id: "2"
    text: '$\overline{X}-\overline{Y}$ の標準偏差は $1$ で、標準化した値は $1.8$ となり $1.96$ より小さいので、$m_A$ と $m_B$ が異なるとは判断できない。'
    rationale: |
      正解。$V(\overline{X})=\dfrac{6^2}{100}=0.36$、$V(\overline{Y})=\dfrac{8^2}{100}=0.64$、独立なので $V(\overline{X}-\overline{Y})=0.36+0.64=1$。標準化した値は $\dfrac{1.8-0}{1}=1.8$。両側検定の棄却域 $|Z|\geqq 1.96$ に入らない（両側の確率 $2\times 0.0359=0.0718>0.05$）ので、帰無仮説は棄却されない。
  - id: "3"
    text: '$\overline{X}-\overline{Y}$ の標準偏差は $1$ で、標準化した値は $1.8$ である。$Z\geqq 1.8$ となる確率は $0.5-0.4641=0.0359$ で $0.05$ より小さいので、$m_A$ と $m_B$ は異なると判断できる。'
    misconception: mc-st-one-two-sided
    rationale: |
      対立仮説が「異なる」（$m_A\neq m_B$）なので両側検定を行うべきところ、片側の確率だけを $0.05$ と比べている。両側では $P(|Z|\geqq 1.8)=0.0718>0.05$ となる。
  - id: "4"
    text: '$\overline{X}-\overline{Y}$ の標準偏差は $\sqrt{36+64}=10$ で、標準化した値は $0.18$ となり $1.96$ より十分小さいので、$m_A$ と $m_B$ は等しいと判断できる。'
    misconception: mc-st-sample-sd
    rationale: |
      個々の製品の分散 $36,\ 64$ をそのまま使い、標本平均の分散 $\dfrac{\sigma^2}{n}$ にしていない。さらに、帰無仮説が棄却されないことを「等しいと判断できる」と結論している点も誤り（棄却されないときの結論は「異なるとは判断できない」）。
answer: "2"
solution: |
  $V(\overline{X})=\dfrac{6^2}{100}=0.36$、$V(\overline{Y})=\dfrac{8^2}{100}=0.64$。2つの標本は独立なので
  $$V(\overline{X}-\overline{Y})=V(\overline{X})+(-1)^2V(\overline{Y})=1,\qquad \sigma(\overline{X}-\overline{Y})=1$$
  帰無仮説 $m_A=m_B$ のもとで $W=\dfrac{\overline{X}-\overline{Y}}{1}$ は近似的に $N(0,\ 1)$ に従い、観測値は $W=1.8$。

  対立仮説は $m_A\neq m_B$ なので両側検定。棄却域 $|W|\geqq 1.96$ に $1.8$ は入らない（両側の確率 $0.0718>0.05$）ので、帰無仮説は棄却されず、「$m_A$ と $m_B$ が異なるとは判断できない」。
concepts: [st-hypothesis-test, st-linear-sum, st-sample-mean]
misconceptions: [mc-st-sum-variance, mc-st-one-two-sided, mc-st-sample-sd, mc-da-hypothesis-accept-null]
targetSeconds: 480
irt: { expectedCorrectRate: 0.3, discrimination: 1.4 }
author:
  intent: |
    教科書の1標本の検定を、独立な確率変数の差の分散 $V(\overline{X}-\overline{Y})=\dfrac{\sigma_A^2}{n_A}+\dfrac{\sigma_B^2}{n_B}$ と組み合わせて2標本に拡張できるかをみる。$0.36+0.64=1$ となるよう母標準偏差と標本の大きさを選び、正しい計算では標準化した値が $1.8$ と $1.645$ と $1.96$ の間に入るようにした。これにより、分散の差をとる誤り（①）は判断が逆転し、片側で判断する誤り（③）も結論が逆転する。④は $\sqrt{n}$ で割らない誤りと「棄却されない＝等しい」という誤解を重ねた選択肢。表には各選択肢に現れる値をすべて載せ、表の有無で選択肢が絞れないようにした。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: ["数学B (2) ア(エ) 正規分布を用いた仮説検定", "数学B (2) ア(イ) 独立な確率変数の和の分散", "数学B (2) イ(ア) 標本分布の考察（標本平均の分布）"]
  variations:
    - 対立仮説を「$m_A>m_B$」と設定した場合の結論（片側で棄却される）を問う。
    - 標本の大きさを両工場とも $n$ として、同じ標本平均の差で棄却されるための $n$ の最小値（$n\geqq 119$）を求めさせる。
  notes: 表の値は erf で確認済み（p(0.18)=0.0714、p(1.80)=0.4641、p(1.96)=0.4750、p(3.40)=0.4997）。標準偏差の和 0.6+0.8=1.4 で割る誤りでは 1.29 となり、結論は正解と同じになるため選択肢から外した。
