id: mc-vc-s03
level: school
format: mark
title: 平行・垂直条件と大きさの最小
stem: |
  $\vec a=(-1,\ 3),\ \vec b=(1,\ 1),\ \vec c=(1,\ 3)$ とし、$t$ を実数とする。

  (1) $\vec a+t\vec b$ と $\vec c$ が平行になるのは $t=\boxed{\text{ア}}$ のときである。

  (2) $\vec a+t\vec b$ と $\vec b$ が垂直になるのは $t=\boxed{\text{イウ}}$ のときである。

  (3) $|\vec a+t\vec b|$ は $t=\boxed{\text{エオ}}$ のとき最小値 $\boxed{\text{カ}}\sqrt{\boxed{\text{キ}}}$ をとる。
blanks:
  - { label: ア, answer: "3" }
  - { label: イウ, answer: "-1" }
  - { label: エオ, answer: "-1" }
  - { label: カ, answer: "2" }
  - { label: キ, answer: "2" }
solution: |
  $\vec a+t\vec b=(t-1,\ t+3)$。

  (1) $\vec c=(1,\ 3)$ と平行になる条件は $(t-1)\cdot 3-(t+3)\cdot 1=0$、すなわち $2t-6=0$ より $t=3$。このとき $\vec a+3\vec b=(2,\ 6)=2\vec c$。

  (2) $(\vec a+t\vec b)\cdot\vec b=(t-1)+(t+3)=2t+2=0$ より $t=-1$。

  (3) $|\vec a+t\vec b|^2=(t-1)^2+(t+3)^2=2t^2+4t+10=2(t+1)^2+8$。$t=-1$ のとき最小値 $\sqrt{8}=2\sqrt{2}$。

  (2) と (3) で同じ $t=-1$ が現れるのは偶然ではない。$\vec a+t\vec b$ の終点は、$\vec a$ の終点を通り $\vec b$ に平行な直線上を動き、その長さが最小になるのは $\vec a+t\vec b\perp\vec b$（原点から直線に下ろした垂線）のときである。
concepts: [vc-operations, vc-inner-product]
misconceptions: []
targetSeconds: 240
irt: { expectedCorrectRate: 0.7, discrimination: 1.0 }
author:
  intent: |
    成分による平行条件・垂直条件と、$|\vec a+t\vec b|$ の最小という教科書の基本3題を1つの設定で確認する。(2) と (3) の答えを一致させてあり、「最小 ⇔ 垂直」という図形的な意味に気づいているかを解説で補強する。平行条件を内積 $=0$ と混同すると (1) で $t=-2$ となり、空欄の桁数とも合わない。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学C (1) ア(ア) ベクトルの成分表示, 数学C (1) ア(イ) ベクトルの内積とその基本的な性質]
  variations:
    - $|\vec a+t\vec b|\leqq\sqrt{10}$ となる $t$ の範囲を求めさせる。
    - $\vec a+t\vec b$ と $\vec b$ のなす角が $45^\circ$ になる $t$ を求めさせる。
