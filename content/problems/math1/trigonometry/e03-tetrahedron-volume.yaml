author:
  intent: |
    「$\mathrm{OA}=\mathrm{OB}=\mathrm{OC}$ なら垂線の足は底面の外心」という空間図形の構造を見抜き、正弦定理（外接円の半径）と結びつけて高さを求められるかをみる。(1)(2) は誘導、(3) で構造の理解が問われる。$2R$ と $R$ を取り違えると $R=\dfrac{16\sqrt{7}}{7}>4$ となり $\mathrm{OH}$ が求まらないので、検算の習慣も識別できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (2) ア(ウ) 正弦定理・余弦定理, 数学I (2) イ(イ) 図形の計量（空間図形への応用）]
  variations:
    - 四面体に内接する球の半径を、体積を4つの四面体に分けて求めさせる（各側面の面積の計算が必要）。
    - 底面を $\angle\mathrm{BAC}$ が鈍角の三角形にして、外心 $\mathrm{H}$ が $\triangle\mathrm{ABC}$ の外部にある場合を扱わせる。
