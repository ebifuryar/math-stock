id: m1-sp-e05
level: exam
format: written
title: 背理法による証明（a²+b²=c² と 3 の倍数）
stem: |
  整数 $a,\ b,\ c$ が $a^2+b^2=c^2$ を満たすとき、$a,\ b$ の少なくとも一方は $3$ の倍数であることを証明せよ。
modelAnswer: |
  **補題** 整数 $n$ について、$n^2$ を $3$ で割った余りは、$n$ が $3$ の倍数ならば $0$、$3$ の倍数でないならば $1$ である。

  （証明）$k$ を整数とする。$n=3k$ のとき $n^2=3\cdot 3k^2$ で余りは $0$。$n=3k+1$ のとき $n^2=3(3k^2+2k)+1$、$n=3k+2$ のとき $n^2=3(3k^2+4k+1)+1$ で、いずれも余りは $1$。

  **本題** 背理法で示す。$a,\ b$ がともに $3$ の倍数でないと仮定する。

  補題より、$a^2,\ b^2$ はともに $3$ で割ると $1$ 余るから、$a^2=3s+1,\ b^2=3t+1$（$s,\ t$ は整数）と書ける。よって
  $$c^2=a^2+b^2=3(s+t)+2$$
  となり、$c^2$ を $3$ で割った余りは $2$ である。

  一方、補題より平方数を $3$ で割った余りは $0$ または $1$ であり、$2$ になることはない。これは矛盾である。

  したがって、$a,\ b$ の少なくとも一方は $3$ の倍数である。（証明終）
rubric:
  - id: r1
    criterion: 背理法として、結論の否定「$a,\ b$ がともに $3$ の倍数でない」を正しく仮定している（「一方が $3$ の倍数でない」などは不可）
    points: 2
    keywords: ["背理法", "ともに3の倍数でない"]
  - id: r2
    criterion: 整数を $3k,\ 3k+1,\ 3k+2$（または $3k\pm 1$）に分類し、平方数を $3$ で割った余りが $0$ または $1$ であることを計算で示している
    points: 3
    keywords: ["3k+1", "3k+2", "余り"]
  - id: r3
    criterion: 仮定から $a^2+b^2$ を $3$ で割った余りが $2$ であることを導いている
    points: 2
    keywords: ["余りは2", "3(s+t)+2"]
  - id: r4
    criterion: $c^2$ の余りは $0$ か $1$ であることと比較し、何と何が矛盾するかを明示している
    points: 2
    keywords: ["矛盾"]
  - id: r5
    criterion: 「$a,\ b$ の少なくとも一方は $3$ の倍数である」と結論を明記している
    points: 1
    keywords: ["少なくとも一方"]
solution: |
  「少なくとも一方」の否定は「ともに〜でない」。この仮定のもとで $3$ で割った余りに注目すると、平方数の余りは $0,\ 1$ のどちらかしかないので、$1+1=2$ の余りをもつ $c^2$ が存在しえないことから矛盾が出る。
concepts: [sp-proof-contradiction, sp-negation, sp-proof-contrapositive]
misconceptions: [mc-sp-contradiction-structure, mc-sp-de-morgan-misuse]
targetSeconds: 600
irt: { expectedCorrectRate: 0.3, discrimination: 1.4 }
author:
  intent: |
    「少なくとも一方」を結論にもつ命題を、背理法で論理的に書き切れるかをみる。結論の否定を「一方が $3$ の倍数でない」と誤る答案（ド・モルガンの誤り）、余りの分類で $3k+2$ を落とす答案、$c$ の余りを場合分けせず矛盾の根拠を示さない答案を、ルーブリックの各項目で区別できるようにした。補題を独立させて書けるかも、答案の構成力として評価している。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学I (1) ア(エ) 集合と命題（背理法）]
  variations:
    - 同じ条件で「$a,\ b$ の少なくとも一方は偶数」を示させる（$4$ で割った余りに注目する）。
    - 「$a,\ b,\ c$ の少なくとも1つは $5$ の倍数」を示させ、余りの分類を $5$ 通りに増やす。
