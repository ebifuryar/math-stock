id: m2-cg-a03
level: applied
format: mark
title: 連立不等式の領域と1次式の最大値
stem: |
  $x,\ y$ が4つの不等式
  $$x\geqq 0,\quad y\geqq 0,\quad x+2y\leqq 8,\quad 3x+y\leqq 9$$
  を同時に満たすとする。この連立不等式の表す領域を $D$ とする。

  (1) 2直線 $x+2y=8$ と $3x+y=9$ の交点の座標は $(\boxed{\text{ア}},\ \boxed{\text{イ}})$ である。$D$ はこの点と $(0,\ 0),\ (3,\ 0),\ (0,\ 4)$ を頂点とする四角形の周および内部である。

  (2) $2x+3y$ の最大値は $\boxed{\text{ウエ}}$ である。

  (3) $4x+y$ の最大値は $\boxed{\text{オカ}}$ であり、そのときの $x,\ y$ の値は $x=\boxed{\text{キ}},\ y=\boxed{\text{ク}}$ である。
blanks:
  - { label: ア, answer: "2" }
  - { label: イ, answer: "3" }
  - { label: ウエ, answer: "13" }
  - { label: オカ, answer: "12" }
  - { label: キ, answer: "3" }
  - { label: ク, answer: "0" }
solution: |
  (1) $3x+y=9$ より $y=9-3x$。$x+2(9-3x)=8$ から $x=2,\ y=3$。

  (2) $2x+3y=k$ とおくと、直線 $y=-\dfrac{2}{3}x+\dfrac{k}{3}$（傾き $-\dfrac{2}{3}$）が $D$ と共有点をもつ範囲で $y$ 切片 $\dfrac{k}{3}$ を最大にする。境界の傾きは $x+2y=8$ が $-\dfrac{1}{2}$、$3x+y=9$ が $-3$ で、$-3<-\dfrac{2}{3}<-\dfrac{1}{2}$ なので、直線は頂点 $(2,\ 3)$ を通るときに $k$ が最大。最大値は $2\cdot 2+3\cdot 3=13$。

  （頂点での値: $(0,0)$ で $0$、$(3,0)$ で $6$、$(2,3)$ で $13$、$(0,4)$ で $12$。）

  (3) $4x+y=k$ の傾きは $-4$ で、$3x+y=9$ の傾き $-3$ より急。直線は頂点 $(3,\ 0)$ を通るときに $k$ が最大となり、最大値は $12$（$x=3,\ y=0$）。（頂点での値: $(0,0)$ で $0$、$(3,0)$ で $12$、$(2,3)$ で $11$、$(0,4)$ で $4$。）
concepts: [cg-region, cg-line-equation]
misconceptions: [mc-cg-region-boundary]
targetSeconds: 360
irt: { expectedCorrectRate: 0.55, discrimination: 1.1 }
author:
  intent: |
    線形計画法の基本として、目的関数の直線の傾きと境界の傾きを比べて最大となる頂点を判断できるかをみる。(2) と (3) で最大となる頂点が変わるように係数を設定し、「いつも2直線の交点で最大」と決めつける受験者を (3) で識別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (2) ア(エ) 不等式の表す領域, 数学II (2) イ(イ) 領域を用いた最大・最小]
  variations:
    - 目的関数を $ax+y$ とし、点 $(2,\ 3)$ で最大となる $a$ の範囲を求めさせる。
    - $x,\ y$ を整数に限定し、格子点での最大値を求めさせる（頂点が格子点でない設定にする）。
