solution: |
  (1) $P(X\geqq 115)=P\left(Z\geqq\dfrac{115-100}{10}\right)=P(Z\geqq 1.5)=0.5-0.4332=0.0668$

  (2) $\sigma(\overline{X})=\dfrac{10}{\sqrt{64}}=1.25$。$1.96\times 1.25=2.45$ なので、信頼区間は $97.75-2.45\leqq m\leqq 97.75+2.45$、すなわち $95.30\leqq m\leqq 100.20$。

  (3) $W=\dfrac{97.75-100}{1.25}=-1.8$。対立仮説が「小さい」なので片側検定で、
  $$P(W\leqq -1.8)=0.5-p(1.8)=0.5-0.4641=0.0359<0.05$$
  帰無仮説は棄却され、今年の母平均は $100$ g より小さいと判断できる（ネ $=0$）。

  (4) 両側検定では $P(|W|\geqq 1.8)=2\times 0.0359=0.0718>0.05$ なので棄却されない（ヘ $=1$）。$|W|=1.8<1.96$ と棄却域で判断しても同じ。

  (5) 両側検定の棄却域 $|W|\geqq 1.96$ に入らないことは $|\overline{X}-100|<1.96\times 1.25$、すなわち $100$ が信頼区間 $\overline{X}\pm 1.96\times 1.25$ に入ることと同じなので、$2$ が正しい（ホ $=2$）。

  - $0$：区間に含まれる（両側検定で棄却されない）ことは、$m=100$ が証明されたことではない。実際、片側検定では「小さい」と判断できた。
  - $1$：(3)(4) が反例。片側検定で棄却されても両側検定では棄却されないことがある。
  - $3$：有意水準を下げると棄却域は狭くなる（片側 $1\%$ なら $W\leqq -2.33$ 程度）ので、棄却されにくくなる。

  なお、両側か片側かはデータを見る前に、主張の内容で決める。ここでは「軽くなっていないか」を調べるのが目的なので片側検定が適切である。
