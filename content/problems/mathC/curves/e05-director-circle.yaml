id: mc-cv-e05
level: exam
format: written
title: 直交する2接線の交点の軌跡
stem: |
  楕円 $\dfrac{x^2}{4}+y^2=1$ に引いた2本の接線が直交するとき、その2本の接線の交点 $\mathrm{P}$ の軌跡を求めよ。
modelAnswer: |
  **接線の条件** 直線 $y=mx+n$ を楕円の式に代入して4倍すると $x^2+4(mx+n)^2=4$、
  $$(1+4m^2)x^2+8mnx+4(n^2-1)=0$$
  接する条件は判別式が $0$:
  $$\frac{D}{4}=16m^2n^2-4(1+4m^2)(n^2-1)=4(4m^2+1-n^2)=0\iff n^2=4m^2+1$$

  **(i) $p\neq\pm 2$ のとき。** $\mathrm{P}(p,\ q)$ を通る直線のうち $y$ 軸に平行な $x=p$ は、$p\neq\pm 2$ なので楕円に接しない。よって $\mathrm{P}$ を通る接線は傾き $m$ をもち、$y=m(x-p)+q$ と表せる。$n=q-mp$ を接する条件に代入して
  $$(q-mp)^2=4m^2+1\iff(p^2-4)m^2-2pqm+q^2-1=0\qquad\cdots(*)$$
  $\mathrm{P}$ から引いた2本の接線の傾きは $(*)$ の2解 $m_1,\ m_2$ であり、2本が直交する条件は $(*)$ が2つの実数解をもち $m_1m_2=-1$ となることである。解と係数の関係より
  $$m_1m_2=\frac{q^2-1}{p^2-4}=-1\iff p^2+q^2=5$$
  逆に $p^2+q^2=5$（$p\neq\pm 2$）のとき、$(*)$ の2解の積は $-1<0$ なので $(*)$ は異なる2つの実数解をもち、直交する2本の接線が引ける。

  **(ii) $p=\pm 2$ のとき。** $x=p$ は楕円に接する（接点 $(\pm 2,\ 0)$）。これと直交する接線は $x$ 軸に平行な $y=\pm 1$ なので、$\mathrm{P}$ は $(\pm 2,\ \pm 1)$（複号任意）の4点。これらは $p^2+q^2=5$ を満たす。また $p=\pm 2,\ q\neq\pm 1$ のとき、$\mathrm{P}$ を通るもう1本の接線は $(*)$ の $m^2$ の係数が $0$ となった1次方程式 $-2pqm+q^2-1=0$ から定まる傾きをもち、$x=p$ と直交しない（$q=0$ のときは他の接線がない）。

  (i)、(ii) より、求める軌跡は **円 $x^2+y^2=5$**。
rubric:
  - id: r1
    criterion: 直線 $y=mx+n$ が楕円に接する条件 $n^2=4m^2+1$（またはそれと同値な条件）を判別式から正しく導いている
    points: 2
    keywords: ["n^2=4m^2+1", "4m^2+1"]
  - id: r2
    criterion: $\mathrm{P}(p,\ q)$ を通る接線の傾きが満たす2次方程式 $(p^2-4)m^2-2pqm+q^2-1=0$ を導いている
    points: 2
    keywords: ["(p^2-4)m^2", "p^2-4"]
  - id: r3
    criterion: 解と係数の関係から $m_1m_2=\dfrac{q^2-1}{p^2-4}=-1$ とし、$p^2+q^2=5$ を得ている。2つの実数解をもつこと（積が負）にも触れている
    points: 3
    keywords: ["m1m2=-1", "p^2+q^2=5", "解と係数"]
  - id: r4
    criterion: $y$ 軸に平行な接線をもつ場合（$p=\pm 2$）を別に調べ、点 $(\pm 2,\ \pm 1)$ が軌跡に含まれることを示している
    points: 2
    keywords: ["p=±2", "(±2,±1)", "x=±2"]
  - id: r5
    criterion: 軌跡を「円 $x^2+y^2=5$」と結論している
    points: 1
    keywords: ["x^2+y^2=5"]
solution: |
  楕円 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ の直交する2接線の交点の軌跡は円 $x^2+y^2=a^2+b^2$（準円）になる。傾きを $m$ とおく解法は $y$ 軸に平行な接線を表せないので、$p=\pm 2$ の場合を別に調べる必要がある。図形的には、楕円に外接する長方形の頂点 $(\pm 2,\ \pm 1)$ がこの円上にあることで検算できる。
concepts: [cv-curve-line, cv-ellipse, cg-locus, qf-discriminant]
misconceptions: [mc-cv-tangent-external]
targetSeconds: 900
irt: { expectedCorrectRate: 0.2, discrimination: 1.5 }
author:
  intent: |
    曲線外の点から引く接線を「傾きの2次方程式」として捉え、直交条件を解と係数の関係に結びつけられるかをみる。接線の公式に $\mathrm{P}$ を代入する誤りでは手がかりが得られず、接点か傾きを文字でおく発想が必要になる。結論の円は予想しやすいが、$y$ 軸に平行な接線の場合分けと、実数解の存在（逆の確認）まで書けるかで上位層を識別する採点基準にした。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(ア) 2次曲線と直線の位置関係, 数学II (2) ア(エ) 軌跡]
  variations:
    - 放物線 $y^2=4x$ で同様に問い、直交する2接線の交点が準線 $x=-1$ 上にあることを示させる。
    - 双曲線 $\dfrac{x^2}{4}-y^2=1$ で同様に問い、軌跡が円 $x^2+y^2=3$ から漸近線上の4点を除いたものになることを考察させる。
