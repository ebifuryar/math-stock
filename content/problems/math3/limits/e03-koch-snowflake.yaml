solution: |
  (1) 1回の操作で、1本の辺は長さ $\dfrac{1}{3}$ 倍の辺 $4$ 本（両端の2本と、付け加えた正三角形の2辺）に置き換わる。よって辺の数は $3\cdot 4^n$、1辺の長さは $\left(\dfrac{1}{3}\right)^n$。
  $$L_n=3\cdot 4^n\cdot\left(\frac{1}{3}\right)^n=3\left(\frac{4}{3}\right)^n\to\infty\quad\left(\frac{4}{3}>1\right)$$

  (2) $P_n$ から $P_{n+1}$ を作るとき、$P_n$ の辺 $3\cdot 4^n$ 本それぞれに、1辺の長さ $\left(\dfrac{1}{3}\right)^{n+1}$ の正三角形が1個ずつ加わる。1辺 $s$ の正三角形の面積は $\dfrac{\sqrt{3}}{4}s^2$ なので
  $$S_{n+1}-S_n=3\cdot 4^n\cdot\frac{\sqrt{3}}{4}\cdot\frac{1}{9^{n+1}}=\frac{3\sqrt{3}}{4\cdot 9}\cdot\left(\frac{4}{9}\right)^n=\frac{\sqrt{3}}{12}\left(\frac{4}{9}\right)^n$$

  (3) $S_0=\dfrac{\sqrt{3}}{4}$ で、$n\geqq 1$ のとき
  $$S_n=S_0+\sum_{k=0}^{n-1}\frac{\sqrt{3}}{12}\left(\frac{4}{9}\right)^k$$
  公比 $\dfrac{4}{9}$ は $\left|\dfrac{4}{9}\right|<1$ なので収束し
  $$\lim_{n\to\infty}S_n=\frac{\sqrt{3}}{4}+\frac{\frac{\sqrt{3}}{12}}{1-\frac{4}{9}}=\frac{\sqrt{3}}{4}+\frac{3\sqrt{3}}{20}=\frac{8\sqrt{3}}{20}=\frac{2\sqrt{3}}{5}$$

  周の長さは発散するのに、面積はもとの正三角形の $\dfrac{8}{5}$ 倍に収束する。
