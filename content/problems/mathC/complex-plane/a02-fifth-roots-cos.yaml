id: mc-cp-a02
level: applied
format: mark
title: 1の5乗根と cos(2π/5) の値
stem: |
  $\alpha=\cos\dfrac{2\pi}{5}+i\sin\dfrac{2\pi}{5}$ とする。$\alpha$ を用いて $\cos\dfrac{2\pi}{5}$ の値を求めよう。

  (1) ド・モアブルの定理より $\alpha^5=\boxed{\text{ア}}$ である。$\alpha^5-1=(\alpha-1)(\alpha^4+\alpha^3+\alpha^2+\alpha+1)$ と $\alpha\neq 1$ から
  $$\alpha^4+\alpha^3+\alpha^2+\alpha+\boxed{\text{イ}}=0\qquad\cdots\cdots\text{①}$$
  が成り立つ。

  (2) $\alpha\neq 0$ なので、① の両辺を $\alpha^2$ で割り、$t=\alpha+\dfrac{1}{\alpha}$ とおく。$\alpha^2+\dfrac{1}{\alpha^2}=t^2-\boxed{\text{ウ}}$ であるから、$t$ は
  $$t^2+t-\boxed{\text{エ}}=0$$
  を満たす。

  (3) $|\alpha|=1$ より $\dfrac{1}{\alpha}=\overline{\alpha}$ であるから、$t=\boxed{\text{オ}}\cos\dfrac{2\pi}{5}$ である。$\cos\dfrac{2\pi}{5}>0$ に注意して (2) の2次方程式を解くと
  $$t=\frac{-1+\sqrt{\boxed{\text{カ}}}}{\boxed{\text{キ}}}$$
  となる。したがって
  $$\cos\frac{2\pi}{5}=\frac{\boxed{\text{クケ}}+\sqrt{\boxed{\text{コ}}}}{\boxed{\text{サ}}}$$
  である。
blanks:
  - { label: ア, answer: "1" }
  - { label: イ, answer: "1" }
  - { label: ウ, answer: "2" }
  - { label: エ, answer: "1" }
  - { label: オ, answer: "2" }
  - { label: カ, answer: "5" }
  - { label: キ, answer: "2" }
  - { label: クケ, answer: "-1" }
  - { label: コ, answer: "5" }
  - { label: サ, answer: "4" }
solution: |
  (1) $\alpha^5=\cos 2\pi+i\sin 2\pi=1$。$\alpha^5-1=(\alpha-1)(\alpha^4+\alpha^3+\alpha^2+\alpha+1)=0$ で $\alpha\neq 1$ なので ① が成り立つ。

  (2) ① を $\alpha^2$ で割ると
  $$\alpha^2+\alpha+1+\frac{1}{\alpha}+\frac{1}{\alpha^2}=0$$
  $\alpha^2+\dfrac{1}{\alpha^2}=\left(\alpha+\dfrac{1}{\alpha}\right)^2-2=t^2-2$ なので、$t^2-2+t+1=0$、すなわち $t^2+t-1=0$。

  (3) $\dfrac{1}{\alpha}=\overline{\alpha}=\cos\dfrac{2\pi}{5}-i\sin\dfrac{2\pi}{5}$ より $t=\alpha+\overline{\alpha}=2\cos\dfrac{2\pi}{5}$。$0<\dfrac{2\pi}{5}<\dfrac{\pi}{2}$ より $t>0$ なので、$t^2+t-1=0$ の正の解をとって
  $$t=\frac{-1+\sqrt{5}}{2},\qquad \cos\frac{2\pi}{5}=\frac{t}{2}=\frac{-1+\sqrt{5}}{4}$$
  （もう一方の解 $t=\dfrac{-1-\sqrt{5}}{2}$ は $2\cos\dfrac{4\pi}{5}$ に当たる。）
