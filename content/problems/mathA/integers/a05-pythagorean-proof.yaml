author:
  intent: |
    (1) で余りによる分類の基本を確認し、(2) で「(1) を道具として使う」誘導の流れに乗れるかをみる。背理法の仮定で「少なくとも一方」の否定を正しく「ともに〜でない」と書けるかが識別ポイント。平方数の余りの制約から解の存在を否定する発想は、入試の整数問題の基本手段である。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学A (3) ア(ア) 整数の性質（余りによる整数の分類）, 数学I (1) イ 命題と証明（背理法）]
  variations:
    - 同じ条件で「$a,\ b$ の少なくとも一方は偶数」「$a,\ b,\ c$ の少なくとも1つは $5$ の倍数」を示させる。
    - "$x^2+y^2=3z^2$ を満たす整数が $x=y=z=0$ に限ることを示させる（無限降下法への入口）。"
