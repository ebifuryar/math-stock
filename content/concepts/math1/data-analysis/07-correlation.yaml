id: da-correlation
kind: definition
title: 散布図・共分散・相関係数
body: |
  2つの変量 $x,\ y$ の組を座標平面上の点として表したものを **散布図** という。

  **共分散** $\displaystyle s_{xy}=\frac{1}{n}\sum_{k=1}^{n}(x_k-\bar{x})(y_k-\bar{y})$

  **相関係数** $\displaystyle r=\frac{s_{xy}}{s_x s_y}$

  - $-1\leqq r\leqq 1$。$r$ が $1$ に近いほど強い正の相関、$-1$ に近いほど強い負の相関があり、散布図の点は直線に近く並ぶ。
  - 相関係数は単位や尺度の取り方に依存しない（変量を正の数倍しても定数を足しても変わらない）。共分散は単位に依存する。
  - $r$ の値は散布図での直線の **傾き** ではなく、直線への **まとまり具合** を表す。
  - 相関関係があっても **因果関係があるとは限らない**。第3の要因（共通の原因）や偶然による見かけの相関もある。

  2変量の和 $z=x+y$ の分散は、偏差 $(x_k-\bar{x})+(y_k-\bar{y})$ の2乗を展開して $s_z^2=s_x^2+s_y^2+2s_{xy}$ となる。
prerequisites: [da-variance]
