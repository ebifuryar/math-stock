id: cv-curve-line
kind: method
title: 2次曲線と直線（共有点・接線）
body: |
  **共有点** 直線の式を2次曲線の式に代入して1文字を消去し、得られた方程式の実数解の個数を調べる。
  - 2次方程式になるとき: 判別式 $D>0$ なら2点、$D=0$ なら接する（1点）、$D<0$ なら共有点なし
  - 双曲線で直線が **漸近線に平行** なとき、または放物線で直線が **軸に平行** なときは $x^2$ の係数が $0$ になり1次方程式になる。このとき共有点は1個だが、接してはいない。

  **曲線上の点 $(x_1,\ y_1)$ における接線**
  - 放物線 $y^2=4px$: $y_1y=2p(x+x_1)$
  - 楕円 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$: $\dfrac{x_1x}{a^2}+\dfrac{y_1y}{b^2}=1$
  - 双曲線 $\dfrac{x^2}{a^2}-\dfrac{y^2}{b^2}=1$: $\dfrac{x_1x}{a^2}-\dfrac{y_1y}{b^2}=1$

  これらは $(x_1,\ y_1)$ が **曲線上にあるときだけ** 使える。曲線外の点 $(p,\ q)$ から引いた接線は、接点を $(s,\ t)$ とおいて接線 $\dfrac{sx}{a^2}+\dfrac{ty}{b^2}=1$ が $(p,\ q)$ を通る条件と、$(s,\ t)$ が曲線上にある条件を連立して求める。曲線外の点をそのまま公式に代入した直線は接線ではなく、2つの接点を結ぶ直線になる。

  **傾きを与えた接線** 直線 $y=mx+n$ が楕円 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ に接する条件は $n^2=a^2m^2+b^2$（代入した2次方程式の判別式 $=0$ から得られる）。$y$ 軸に平行な接線 $x=\pm a$ はこの形で表せないので別に調べる。
prerequisites: [cv-ellipse, cv-hyperbola, cv-parabola, qf-discriminant, cg-circle-line]
