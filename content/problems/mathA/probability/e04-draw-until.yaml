id: ma-pr-e04
level: exam
format: mark
title: 白玉を取り尽くすまでの回数の分布と期待値
stem: |
  袋の中に赤玉 $4$ 個と白玉 $2$ 個が入っている。袋から玉を $1$ 個ずつ取り出し、取り出した玉はもとに戻さない。白玉を $2$ 個とも取り出した時点で操作を終了し、それまでに取り出した玉の個数を $X$ とする。

  (1) 終了後も残りの玉を続けて取り出すと考え、$6$ 個の玉の色の並び方を考える。同じ色の玉は区別しないとき、色の並び方は全部で $\boxed{\text{アイ}}$ 通りあり、これらは同様に確からしい。

  (2) $X=k$ となるのは、$k$ 番目が白玉で、$1$ 番目から $k-1$ 番目までに白玉がちょうど $1$ 個ある場合である。よって $k=2,\ 3,\ \cdots,\ 6$ に対して
  $$P(X=k)=\frac{k-\boxed{\text{ウ}}}{\boxed{\text{エオ}}}$$
  である。

  (3) $X$ の期待値は $\dfrac{\boxed{\text{カキ}}}{\boxed{\text{ク}}}$ である。

  (4) $X\leqq 4$ であったとき、1回目に白玉を取り出していた条件付き確率は $\dfrac{\boxed{\text{ケ}}}{\boxed{\text{コ}}}$ である。

  ただし、(3)・(4) は既約分数で答えよ。
blanks:
  - { label: アイ, answer: "15" }
  - { label: ウ, answer: "1" }
  - { label: エオ, answer: "15" }
  - { label: カキ, answer: "14" }
  - { label: ク, answer: "3" }
  - { label: ケ, answer: "1" }
  - { label: コ, answer: "2" }
solution: |
  (1) 白玉の位置 $2$ か所を $6$ か所から選ぶので $\dfrac{6!}{4!\,2!}={}_6\mathrm{C}_2=15$（通り）。玉をすべて区別した $6!$ 通りの取り出し方は同様に確からしく、各色の並びには $4!\,2!$ 通りずつ対応するので、色の並びも同様に確からしい。

  (2) 2個目の白玉が $k$ 番目、1個目の白玉が $1\sim k-1$ 番目のどこか（$k-1$ 通り）。$P(X=k)=\dfrac{k-1}{15}$。$k=2,\cdots,6$ で和は $\dfrac{1+2+3+4+5}{15}=1$。

  (3) $$E=\sum_{k=2}^{6}k\cdot\frac{k-1}{15}=\frac{2+6+12+20+30}{15}=\frac{70}{15}=\frac{14}{3}$$

  (4) $X\leqq 4$ は白玉の位置の組が $(1,2),(1,3),(2,3),(1,4),(2,4),(3,4)$ の $6$ 通り。このうち1回目が白玉なのは $(1,2),(1,3),(1,4)$ の $3$ 通り。いずれも同様に確からしいので $\dfrac{3}{6}=\dfrac{1}{2}$。
