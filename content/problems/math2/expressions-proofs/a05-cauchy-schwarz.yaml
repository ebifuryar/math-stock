id: m2-ep-a05
level: applied
format: written
title: 平方の和による不等式の証明とその応用
stem: |
  (1) 実数 $a,\ b,\ x,\ y$ に対して、不等式
  $$(a^2+b^2)(x^2+y^2)\geqq(ax+by)^2$$
  が成り立つことを証明せよ。また、等号が成り立つための条件を求めよ。

  (2) 実数 $x,\ y$ が $x^2+y^2=1$ を満たすとき、$3x+4y$ の最大値と、そのときの $x,\ y$ の値を求めよ。
modelAnswer: |
  (1) 左辺から右辺を引くと
  $$\begin{aligned}
  (a^2+b^2)(x^2+y^2)-(ax+by)^2&=a^2x^2+a^2y^2+b^2x^2+b^2y^2-(a^2x^2+2abxy+b^2y^2)\\
  &=a^2y^2-2abxy+b^2x^2\\
  &=(ay-bx)^2\geqq 0
  \end{aligned}$$
  よって $(a^2+b^2)(x^2+y^2)\geqq(ax+by)^2$ が成り立つ。

  等号が成り立つのは $(ay-bx)^2=0$、すなわち $ay=bx$ のときである。

  (2) (1) で $a=3,\ b=4$ とすると
  $$(3^2+4^2)(x^2+y^2)\geqq(3x+4y)^2$$
  $x^2+y^2=1$ より $(3x+4y)^2\leqq 25$ なので
  $$-5\leqq 3x+4y\leqq 5$$
  $3x+4y=5$ となるのは、(1) の等号条件 $3y=4x$ が成り立ち、かつ $3x+4y=5$ のときである。$y=\dfrac{4}{3}x$ を $3x+4y=5$ に代入すると $\dfrac{25}{3}x=5$ より $x=\dfrac{3}{5}$、$y=\dfrac{4}{5}$。このとき $x^2+y^2=\dfrac{9}{25}+\dfrac{16}{25}=1$ を満たす。

  したがって **最大値 $5$（$x=\dfrac{3}{5},\ y=\dfrac{4}{5}$ のとき）**。
rubric:
  - id: r1
    criterion: （左辺）$-$（右辺）を計算し、$a^2y^2-2abxy+b^2x^2$ まで正しく整理している
    points: 2
    keywords: ["a^2y^2-2abxy+b^2x^2", "左辺-右辺"]
  - id: r2
    criterion: 差を $(ay-bx)^2$ と平方の形にし、実数の2乗が $0$ 以上であることから不等式を結論している（結論の不等式から出発する逆向きの論証は不可）
    points: 2
    keywords: ["(ay-bx)^2", "≥0", ">=0"]
  - id: r3
    criterion: 等号成立条件を $ay=bx$ と答えている
    points: 1
    keywords: ["ay=bx"]
  - id: r4
    criterion: (1) を $a=3,\ b=4$ で用いて $(3x+4y)^2\leqq 25$、すなわち $3x+4y\leqq 5$ を導いている
    points: 2
    keywords: ["25", "3x+4y≤5", "3x+4y<=5"]
  - id: r5
    criterion: 等号条件 $3y=4x$ と $x^2+y^2=1$（または $3x+4y=5$）から $x=\frac{3}{5},\ y=\frac{4}{5}$ を求め、値 $5$ が実際にとられることを確認して最大値 $5$ と結論している
    points: 3
    keywords: ["3/5", "4/5", "最大値5"]
solution: |
  (1) 差をとって平方の形にする典型。$(ay-bx)^2$ が現れることは、$a^2y^2$ と $b^2x^2$ が「たすき」に残ることから見通せる。

  (2) 不等式から $3x+4y\leqq 5$ が分かっても、それだけでは最大値は $5$ と言えない。等号条件 $3y=4x$ と制約 $x^2+y^2=1$ を同時に満たす $(x,\ y)$ が存在することを確かめて初めて最大値と結論できる。等号条件と $x^2+y^2=1$ だけからは $(x,\ y)=\left(\pm\dfrac{3}{5},\ \pm\dfrac{4}{5}\right)$（複号同順）の2組が出るが、負の組では $3x+4y=-5$（最小値）になる点にも注意。
concepts: [ep-proof-methods, ep-am-gm]
misconceptions: [mc-ep-amgm-equality]
targetSeconds: 480
irt: { expectedCorrectRate: 0.45, discrimination: 1.3 }
author:
  intent: |
    不等式の証明の基本手順（差をとる・平方の形にする・等号条件を述べる）を答案として書けるかと、得られた不等式で最大値を求める際に等号成立の確認ができるかをみる。(2) では「$\leqq 5$」で止まる答案、$\pm$ の符号を決めずに $x=\pm\dfrac{3}{5}$ とする答案を r5 で区別する。相加・相乗平均の問題と同じく「不等式の評価」と「最大値」の違いを、別の不等式で確認する構成にした。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (1) イ(イ) 等式や不等式が成り立つことの証明]
  variations:
    - 3文字版 $(a^2+b^2+c^2)(x^2+y^2+z^2)\geqq(ax+by+cz)^2$ を、差の平方の和として証明させる。
    - $x+2y=5$ のもとで $x^2+y^2$ の最小値を、同じ不等式で求めさせる（最小値 $5$、$x=1,\ y=2$）。
