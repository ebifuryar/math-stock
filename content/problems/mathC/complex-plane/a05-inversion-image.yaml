author:
  intent: |
    変換 $w=\dfrac{1}{z}$ による像を「$z$ を $w$ で表して条件に代入する」手順で求め、除外点（$w=0$）と、図形の一部だけが像になる場合（弧）を正しく判断できるかをみる。(1) は教科書の典型だが、除外点を根拠とともに書けるかを r3 で独立に評価する。(2) は偏角の対応と円周角の定理を結び付ける応用で、像を円全体や直線と答える誤り、端点を誤る誤りを r4・r5 で区別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(エ) 複素数平面における図形の移動（w=1/z による像）]
  variations:
    - $z$ が円 $|z-1|=1$ 上の原点以外の点を動くとき、$w=\dfrac{1}{z}$ の描く図形（直線 $w+\overline{w}=1$）を求めさせる。
    - $w=\dfrac{z+1}{z-1}$ により、虚軸が単位円（点 $1$ を除く）に移ることを示させる。
