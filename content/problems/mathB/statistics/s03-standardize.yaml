id: mb-st-s03
level: school
format: choice
title: 正規分布の標準化と確率
stem: |
  ある工場で作られる製品の重さ $X$（g）は、正規分布 $N(100,\ 4)$ に従うとする。

  重さが $104$ g 以上である確率 $P(X\geqq 104)$ として正しいものを、次の①〜④のうちから一つ選べ。ただし、$Z$ を標準正規分布に従う確率変数として、$p(z_0)=P(0\leqq Z\leqq z_0)$ の値は次の表のとおりである。

  | $z_0$ | $0.50$ | $1.00$ | $1.50$ | $2.00$ |
  | --- | --- | --- | --- | --- |
  | $p(z_0)$ | $0.1915$ | $0.3413$ | $0.4332$ | $0.4772$ |
choices:
  - id: "1"
    text: $0.4772$
    rationale: |
      標準化は $z=2$ と正しいが、表の値 $p(2)=P(0\leqq Z\leqq 2)$ をそのまま答えている。求めるのは $Z\geqq 2$ の部分なので $0.5$ から引く。
  - id: "2"
    text: $0.1587$
    misconception: mc-st-standardize
    rationale: |
      $N(100,\ 4)$ の $4$ を標準偏差とみて $z=\dfrac{104-100}{4}=1$ とし、$0.5-0.3413$ を答えている。第2成分は分散なので、標準偏差は $\sqrt{4}=2$。
  - id: "3"
    text: $0.9772$
    rationale: |
      $0.5+p(2)$ として、$X\leqq 104$ 側の確率を求めている。$104$ は平均 $100$ より大きいので、$104$ 以上の確率は $0.5$ より小さいはずである。
  - id: "4"
    text: $0.0228$
    rationale: |
      正解。標準偏差は $2$ なので $Z=\dfrac{X-100}{2}$ とおくと、$P(X\geqq 104)=P(Z\geqq 2)=0.5-0.4772=0.0228$。
answer: "4"
solution: |
  $N(100,\ 4)$ は平均 $100$、**分散** $4$ の正規分布なので、標準偏差は $2$。$Z=\dfrac{X-100}{2}$ とおくと $Z$ は $N(0,\ 1)$ に従う。

  $$P(X\geqq 104)=P\left(Z\geqq \frac{104-100}{2}\right)=P(Z\geqq 2)=0.5-p(2)=0.5-0.4772=0.0228$$
concepts: [st-normal]
misconceptions: [mc-st-standardize]
targetSeconds: 120
irt: { expectedCorrectRate: 0.7, discrimination: 1.1 }
author:
  intent: |
    $N(m,\ \sigma^2)$ の記法（第2成分は分散）と、表の値 $p(z_0)$ から裾の確率を出す操作を確認する。分散 $4$ を標準偏差と読むと $z=1$ となり表の値で計算できてしまうので、②がもっともらしい誤答として働く。①は表の値の読み違い、③は範囲の向きの取り違え。
  assessedAbilities: [知識・技能]
  curriculumRefs: ["数学B (2) ア(ウ) 正規分布"]
  variations:
    - $P(97\leqq X\leqq 104)$ のように平均の両側にまたがる区間（$0.4332+0.4772$）を問う。
    - 重い方から $2.28\%$ に入る製品の重さの境目を逆に求めさせる。
  notes: P(Z≥2)=0.02275（erf による値）。表の4桁値から 0.0228。
