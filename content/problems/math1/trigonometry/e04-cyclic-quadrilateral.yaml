id: m1-tg-e04
level: exam
format: mark
title: 円に内接する四角形と対角線
stem: |
  円に内接する四角形 $\mathrm{ABCD}$ において、$\mathrm{AB}=4,\ \mathrm{BC}=5,\ \mathrm{CD}=5,\ \mathrm{DA}=6$ とする。対角線 $\mathrm{AC}$ と $\mathrm{BD}$ の交点を $\mathrm{E}$ とする。

  (1) $\cos\angle\mathrm{ABC}=\dfrac{\boxed{\text{アイ}}}{\boxed{\text{ウ}}}$ であり、$\mathrm{AC}=\boxed{\text{エ}}$ である。

  (2) 四角形 $\mathrm{ABCD}$ の面積は $\boxed{\text{オカ}}\sqrt{\boxed{\text{キ}}}$ である。

  (3) $\mathrm{AE}:\mathrm{EC}=\boxed{\text{クケ}}:\boxed{\text{コサ}}$ であり、$\mathrm{AE}=\dfrac{\boxed{\text{シス}}}{\boxed{\text{セ}}}$ である。

  (4) $\mathrm{BD}=\dfrac{\boxed{\text{ソタ}}}{\boxed{\text{チ}}}$ である。
blanks:
  - { label: アイ, answer: "-1" }
  - { label: ウ, answer: "5" }
  - { label: エ, answer: "7" }
  - { label: オカ, answer: "10" }
  - { label: キ, answer: "6" }
  - { label: クケ, answer: "24" }
  - { label: コサ, answer: "25" }
  - { label: シス, answer: "24" }
  - { label: セ, answer: "7" }
  - { label: ソタ, answer: "50" }
  - { label: チ, answer: "7" }
solution: |
  (1) $\angle\mathrm{ABC}=\theta$ とすると、対角の和が $180^\circ$ なので $\angle\mathrm{ADC}=180^\circ-\theta$、$\cos\angle\mathrm{ADC}=-\cos\theta$。$\mathrm{AC}^2$ を2通りに表して
  $$16+25-40\cos\theta=25+36+60\cos\theta\quad\Longrightarrow\quad\cos\theta=-\frac{1}{5}$$
  $\mathrm{AC}^2=41+8=49$ より $\mathrm{AC}=7$。

  (2) $\sin\theta=\dfrac{2\sqrt{6}}{5}$、$\sin\angle\mathrm{ADC}=\sin\theta$ より
  $$S=\frac{1}{2}(4\cdot 5+5\cdot 6)\cdot\frac{2\sqrt{6}}{5}=10\sqrt{6}$$

  (3) $\triangle\mathrm{ABD}$ と $\triangle\mathrm{CBD}$ は底辺 $\mathrm{BD}$ を共有するので、面積比は $\mathrm{A},\ \mathrm{C}$ から $\mathrm{BD}$ までの距離の比、すなわち $\mathrm{AE}:\mathrm{EC}$ に等しい。$\angle\mathrm{BAD}+\angle\mathrm{BCD}=180^\circ$ より $\sin\angle\mathrm{BAD}=\sin\angle\mathrm{BCD}$ だから
  $$\mathrm{AE}:\mathrm{EC}=\frac{1}{2}\cdot 4\cdot 6\sin\angle\mathrm{BAD}:\frac{1}{2}\cdot 5\cdot 5\sin\angle\mathrm{BCD}=24:25$$
  $\mathrm{AE}=7\cdot\dfrac{24}{49}=\dfrac{24}{7}$。

  (4) $\angle\mathrm{BAD}=\varphi$ とすると $\cos\angle\mathrm{BCD}=-\cos\varphi$。$\mathrm{BD}^2$ を2通りに表して
  $$16+36-48\cos\varphi=25+25+50\cos\varphi\quad\Longrightarrow\quad\cos\varphi=\frac{1}{49}$$
  $\mathrm{BD}^2=52-\dfrac{48}{49}=\dfrac{2500}{49}$ より $\mathrm{BD}=\dfrac{50}{7}$。
concepts: [tg-figure-application, tg-law-of-cosines, tg-area, tg-identities]
misconceptions: [mc-tg-cyclic-supplement, mc-tg-cosine-sign]
targetSeconds: 720
irt: { expectedCorrectRate: 0.3, discrimination: 1.3 }
author:
  intent: |
    円に内接する四角形で、対角の関係を $\cos$（符号が反転）と $\sin$（等しい）に正しく使い分けられるかをみる。$\cos D=\cos B$ と誤ると (1) で $\cos\theta=1$ という不合理な値が出るので、検算できるかも分かる。(3) は「底辺を共有する三角形の面積比 = 高さの比」と「$\sin$ が等しい」ことを組み合わせる発想を問い、難関大の誘導なし問題につながる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (2) ア(ウ) 余弦定理, 数学I (2) イ(イ) 図形の計量（円に内接する四角形）]
  variations:
    - 外接円の半径（$\dfrac{35\sqrt{6}}{24}$）も求めさせ、$\triangle\mathrm{ABC}$ と $\triangle\mathrm{ABD}$ のどちらで正弦定理を使っても同じ値になることを確認させる。
    - 4辺を文字で与え、$\mathrm{AC}\cdot\mathrm{BD}=\mathrm{AB}\cdot\mathrm{CD}+\mathrm{AD}\cdot\mathrm{BC}$（トレミーの定理）が成り立つことを数値で確かめさせる。
