author:
  intent: |
    図形の操作を無限に繰り返す問題で、「個数」と「1個あたりの大きさ」の両方が等比的に変化することを読み取り、増加分の公比を $4\times\dfrac{1}{9}=\dfrac{4}{9}$ と正しく組み立てられるかをみる。1個あたりの面積比 $\dfrac{1}{9}$ だけを公比とする誤り、増加分の和を $\left(\dfrac{4}{9}\right)^1$ の項から始めて初項を取り違える誤り（正しくは $S_1-S_0=\dfrac{\sqrt{3}}{12}$ が初項）、$S_0$ を足し忘れる誤りで差がつく。周の長さ（公比 $\dfrac{4}{3}>1$ で発散）と面積（公比 $\dfrac{4}{9}<1$ で収束）の対比から、公比と収束条件の結びつきも確認できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (1) ア(イ) 無限級数の和", "数学III (1) イ(ウ) 極限に着目した事象の考察"]
  variations:
    - 付け加える正三角形を内側に向ける（反コッホ曲線）として、面積の極限 $\dfrac{\sqrt{3}}{4}\cdot\dfrac{2}{5}$ を求めさせる。
    - 正方形の各辺の中央 $\dfrac{1}{3}$ に正方形を付け加える操作にし、重なりが生じないかの吟味を含めて面積の極限を問う。
