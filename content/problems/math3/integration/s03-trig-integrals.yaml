id: m3-ig-s03
level: school
format: mark
title: 三角関数の積分（次数下げ・積和・f'/f 型）
stem: |
  (1) $\displaystyle\int_0^{\frac{\pi}{2}}\sin^2x\,dx=\frac{\pi}{\boxed{\text{ア}}}$ である。

  (2) $\displaystyle\int_0^{\frac{\pi}{4}}\sin 3x\cos x\,dx=\frac{\boxed{\text{イ}}}{\boxed{\text{ウ}}}$ である。

  (3) $\displaystyle\int_0^{\frac{\pi}{3}}\tan x\,dx=\log\boxed{\text{エ}}$ である。

  ただし、分数は既約分数で答えよ。
blanks:
  - { label: ア, answer: "4" }
  - { label: イ, answer: "1" }
  - { label: ウ, answer: "2" }
  - { label: エ, answer: "2" }
solution: |
  (1) 半角の公式 $\sin^2x=\dfrac{1-\cos 2x}{2}$ で次数を下げる。
  $$\int_0^{\frac{\pi}{2}}\frac{1-\cos 2x}{2}\,dx=\left[\frac{x}{2}-\frac{\sin 2x}{4}\right]_0^{\frac{\pi}{2}}=\frac{\pi}{4}$$

  (2) 積和の公式 $\sin 3x\cos x=\dfrac{1}{2}(\sin 4x+\sin 2x)$ より
  $$\frac{1}{2}\left[-\frac{\cos 4x}{4}-\frac{\cos 2x}{2}\right]_0^{\frac{\pi}{4}}=\frac{1}{2}\left\{\left(\frac{1}{4}-0\right)-\left(-\frac{1}{4}-\frac{1}{2}\right)\right\}=\frac{1}{2}$$

  (3) $\tan x=\dfrac{\sin x}{\cos x}=-\dfrac{(\cos x)'}{\cos x}$ なので
  $$\int_0^{\frac{\pi}{3}}\tan x\,dx=\Big[-\log|\cos x|\Big]_0^{\frac{\pi}{3}}=-\log\frac{1}{2}+\log 1=\log 2$$
concepts: [ig-trig-rational, ig-basic]
misconceptions: [mc-ig-inner-function]
targetSeconds: 360
