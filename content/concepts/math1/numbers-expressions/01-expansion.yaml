id: ne-expansion
kind: formula
title: 2次の乗法公式と展開
body: |
  展開は分配法則の繰り返しである。よく使う形を公式としてまとめておく。

  $$(a+b)^2=a^2+2ab+b^2,\qquad (a+b)(a-b)=a^2-b^2$$
  $$(x+a)(x+b)=x^2+(a+b)x+ab,\qquad (ax+b)(cx+d)=acx^2+(ad+bc)x+bd$$
  $$(a+b+c)^2=a^2+b^2+c^2+2ab+2bc+2ca$$

  - 「2乗の和」は各項の2乗だけでは終わらない。異なる2項の積（中間項）が必ず2倍で現れる。
  - 符号を含む項は $(x+2y-3)^2=\{x+2y+(-3)\}^2$ のように、符号ごと1つの項とみる。
  - 共通部分があれば $A=x+2y$ のように置き換えると、項の見落としが減る。

  （3次の乗法公式 $(a+b)^3$、$a^3+b^3$ の因数分解は数学IIで扱う。）
