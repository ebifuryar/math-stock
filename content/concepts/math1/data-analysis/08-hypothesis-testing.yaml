id: da-hypothesis-testing
kind: method
title: 仮説検定の考え方
body: |
  ある主張が正しいかを、データにもとづいて判断する方法。

  1. 主張に **反する** 仮説（例：「コインは公正で、表が出る確率は $\frac{1}{2}$」）を立てる。
  2. その仮説のもとで、観測された結果 **以上に極端な結果** が起こる確率を求める（コイン投げのシミュレーション結果の相対度数や、二項確率の計算を用いる）。
  3. その確率が **基準となる確率**（例えば $5\%$）以下なら、「仮説のもとでは非常に起こりにくいことが起こった」と考えて仮説を否定し、主張は正しいと判断する。基準より大きいときは、仮説は否定できず、**主張が正しいとは判断できない**。

  注意点

  - 確率は「観測値 **ちょうど** が出る確率」ではなく「観測値 **以上**（より極端な側すべて）が出る確率」で評価する。
  - 仮説が否定できなかったことは、仮説が正しいと **証明された** ことを意味しない。
