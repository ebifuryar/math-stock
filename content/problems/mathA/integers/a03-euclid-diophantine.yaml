id: ma-it-a03
level: applied
format: mark
title: 互除法と不定方程式の正の整数解
stem: |
  (1) $67$ と $29$ にユークリッドの互除法を用いると
  $$67=29\cdot 2+9,\qquad 29=9\cdot 3+2,\qquad 9=2\cdot 4+1$$
  となる。これを逆にたどると
  $$67\cdot\boxed{\text{アイ}}-29\cdot\boxed{\text{ウエ}}=1$$
  が得られる。ただし、アイ は $29$ 未満の自然数とする。

  (2) 方程式 $67x+29y=5000$ を満たす正の整数 $x,\ y$ の組は $\boxed{\text{オ}}$ 個あり、そのうち $x$ が最小であるものは
  $$x=\boxed{\text{カキ}},\qquad y=\boxed{\text{クケコ}}$$
  である。
blanks:
  - { label: アイ, answer: "13" }
  - { label: ウエ, answer: "30" }
  - { label: オ, answer: "3" }
  - { label: カキ, answer: "11" }
  - { label: クケコ, answer: "147" }
solution: |
  (1) 余りを順に表して代入する。
  $$1=9-2\cdot 4=9-(29-9\cdot 3)\cdot 4=9\cdot 13-29\cdot 4$$
  $$=(67-29\cdot 2)\cdot 13-29\cdot 4=67\cdot 13-29\cdot 30$$
  （$67\cdot(13+29t)-29\cdot(30+67t)=1$ も成り立つが、アイ $<29$ の条件から $t=0$ の組に定まる。）

  (2) (1) の両辺を $5000$ 倍すると $67\cdot 65000+29\cdot(-150000)=5000$。元の式と辺々引いて
  $$67(x-65000)=-29(y+150000)$$
  $67$ と $29$ は互いに素なので、$k$ を整数として $x=29k+65000,\ y=-67k-150000$。$x$ を小さくする向きに調整し、$k=m-2241$ とおき直すと $x=29m+11,\ y=147-67m$（$m$ は整数）。

  $x>0$ より $m\geqq 0$、$y>0$ より $67m<147$ すなわち $m\leqq 2$。よって $m=0,\ 1,\ 2$ の **3個**。$x$ が最小なのは $m=0$ のときで $(x,\ y)=(11,\ 147)$。
