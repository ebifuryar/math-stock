id: m2-el-a02
level: applied
format: choice
title: 桁数と最高位の数字
stem: |
  $\log_{10}2=0.3010,\ \log_{10}3=0.4771$ とする。$12^{20}$ の桁数と最高位の数字の組として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $21$ 桁で、最高位の数字は $3$
    misconception: mc-el-digit-count
    rationale: |
      $\log_{10}12^{20}=21.582$ の整数部分 $21$ をそのまま桁数にしている。$10^{21}\leqq 12^{20}<10^{22}$ であり、$10^{21}$ は $22$ 桁の数なので $22$ 桁。
  - id: "2"
    text: $27$ 桁で、最高位の数字は $1$
    misconception: mc-el-log-sum
    rationale: |
      $\log_{10}12=\log_{10}(10+2)=\log_{10}10+\log_{10}2=1.3010$ と、真数の和を対数の和に分けている。正しくは $\log_{10}12=\log_{10}(2^2\cdot 3)=2\log_{10}2+\log_{10}3=1.0791$。
  - id: "3"
    text: $22$ 桁で、最高位の数字は $3$
    rationale: |
      正解。$\log_{10}12^{20}=21.582$ より $22$ 桁。$\log_{10}3\leqq 0.582<\log_{10}4$ より最高位は $3$。
  - id: "4"
    text: $22$ 桁で、最高位の数字は $5$
    misconception: mc-el-digit-count
    rationale: |
      小数部分 $0.582$ の数字「$5$」をそのまま最高位の数字としている。最高位は $10^{0.582}$ の整数部分であり、$\log_{10}3=0.4771\leqq 0.582<0.6020=\log_{10}4$ から $3$。
answer: "3"
solution: |
  $\log_{10}12=\log_{10}(2^2\cdot 3)=2\times 0.3010+0.4771=1.0791$ なので
  $$\log_{10}12^{20}=20\times 1.0791=21.582$$
  よって $10^{21}<12^{20}<10^{22}$ となり、$12^{20}$ は **$22$ 桁**。

  また $12^{20}=10^{0.582}\times 10^{21}$ であり、
  $$\log_{10}3=0.4771<0.582<0.6020=\log_{10}4$$
  より $3<10^{0.582}<4$。よって最高位の数字は **$3$**。
concepts: [el-common-log, el-log-definition]
misconceptions: [mc-el-digit-count, mc-el-log-sum]
targetSeconds: 180
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    与えられた $\log_{10}2,\ \log_{10}3$ から $\log_{10}12$ を組み立てる力と、常用対数の整数部分・小数部分をそれぞれ桁数・最高位の数字に正しく翻訳できるかをみる。誤答①④は読み取りの誤り（桁数の $n$ と $n-1$、小数部分の数字の直読み）、②は対数の性質の誤用に対応する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (3) ア(ウ) 対数の意味とその基本的な性質, 数学II (3) イ(ア) 指数と対数を相互に関連付けて考察すること]
  variations:
    - $12^{20}$ の一の位の数字もあわせて問い、対数で分かることと分からないことを区別させる。
    - '$\left(\frac{2}{3}\right)^{30}$ のように $1$ より小さい数で、小数首位と首位の数字を問う。'