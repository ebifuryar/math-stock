id: sq-sum-techniques
kind: method
title: いろいろな数列の和と群数列
body: |
  **分数の和（部分分数分解）**: 一般項を差の形に分解すると、途中の項が打ち消し合う。
  $$\frac{1}{k(k+1)}=\frac{1}{k}-\frac{1}{k+1},\qquad \frac{1}{k(k+2)}=\frac{1}{2}\left(\frac{1}{k}-\frac{1}{k+2}\right)$$
  分母の2因数の差が $d$ なら係数 $\dfrac{1}{d}$ がつく。番号が2つずれる分解では、前から2項・後ろから2項が消え残る。何が残るかは、和を書き並べて確かめる。

  **（等差）×（等比）型の和**: $S=\displaystyle\sum_{k=1}^{n}(\text{等差})\times r^{k-1}$ は、$rS$ を1項ずらして並べ、$S-rS$ を計算する。中央部分は公比 $r$ の等比数列の和になる。その項数（多くは $n-1$）と、最後に余る項 $-(\text{末項})\times r^n$ を落とさないこと。

  **群数列**: 数列を規則に従って区切ったものは、
  1. 第 $m$ 群の項数と、第 $m$ 群の末項までの項数の合計 $\displaystyle\sum_{j=1}^{m}(\text{第 } j \text{ 群の項数})$ を求める
  2. 目標の項が「第 $(m-1)$ 群の末項までの項数 $<N\leqq$ 第 $m$ 群の末項までの項数」となる $m$ を探す

  という順で、「第何群の何番目か」と「もとの数列の第何項か」を行き来する。項の **値** と **番号** を混同しないこと。
prerequisites: [sq-sigma, sq-geometric]
