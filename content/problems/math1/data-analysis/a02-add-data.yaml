id: m1-da-a02
level: applied
format: choice
title: データ追加後の平均値と分散
stem: |
  9人の生徒が小テスト（20点満点）を受けたところ、得点の平均値は $6$ 点、分散は $4$ であった。後日、欠席していた1人が同じテストを受け、得点は $16$ 点であった。

  この1人を加えた10人の得点の平均値と分散の組として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: 平均値 $7$、分散 $12.6$
    rationale: |
      正解。合計は $9\times 6+16=70$、2乗の合計は $9\times(4+6^2)+16^2=360+256=616$。平均値 $7$、分散 $\dfrac{616}{10}-7^2=12.6$。
  - id: "2"
    text: 平均値 $7$、分散 $13.6$
    misconception: mc-da-variance-as-mean
    rationale: |
      もとの9人の偏差の2乗の和 $36$ に、もとの平均 $6$ からの偏差 $(16-6)^2=100$ を加えて $10$ で割っている。平均が $7$ に変わると全員の偏差が変わるので、古い平均からの偏差は使えない。
  - id: "3"
    text: 平均値 $7$、分散 $3.6$
    misconception: mc-da-variance-as-mean
    rationale: |
      1人だけのデータの分散を $0$ とみて、分散を人数で重み付け平均 $\dfrac{9\times 4+1\times 0}{10}$ している。グループ間の平均の差（$6$ と $16$）による散らばりが抜け落ちている。
  - id: "4"
    text: 平均値 $7$、分散 $14$
    rationale: |
      偏差の2乗の和 $126$ を、人数を更新せずに $9$ で割っている。10人のデータなので $10$ で割る。
answer: "1"
solution: |
  平均と分散から合計と2乗の合計を復元するのが定石。

  - 合計：$9\times 6+16=70$ より平均値は $7$
  - 2乗の合計：$\overline{x^2}=s^2+\bar{x}^2$ より、9人分は $9\times(4+36)=360$。加えて $360+16^2=616$
  - 分散：$\dfrac{616}{10}-7^2=61.6-49=12.6$

  （別解）9人の、新しい平均 $7$ からの偏差の2乗の和は $36+9\times(6-7)^2=45$。これに $(16-7)^2=81$ を加えて $126\div 10=12.6$。
concepts: [da-variance-formula, da-variance]
misconceptions: [mc-da-variance-as-mean]
targetSeconds: 240
irt: { expectedCorrectRate: 0.45, discrimination: 1.3 }
author:
  intent: |
    データを追加したときに、平均が変われば全員の偏差が変わることを理解し、「2乗の平均 − 平均の2乗」を使って再計算できるかをみる。平均値はどの選択肢でも $7$ にそろえ、分散の処理だけで差がつくようにした。②（古い平均からの偏差）・③（分散の重み付き平均）は同じ誤答パターンの2つの現れ方で、④は単純な割り算のミス。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (4) ア(ア) 分散・標準偏差]
  variations:
    - 追加する得点を平均値と同じ $6$ 点にして、分散が小さくなる（$3.6$）ことを確認させる。
    - 追加後の分散がもとの分散と等しくなるような追加得点を求めさせる。
