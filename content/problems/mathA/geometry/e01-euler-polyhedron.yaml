id: ma-gm-e01
level: exam
format: choice
title: 五角形と六角形からなる多面体
stem: |
  凸多面体 $K$ のすべての面は五角形または六角形であり、$K$ のどの頂点にもちょうど3つの面が集まっている。$K$ の六角形の面の数を $h$ とするとき、$K$ の頂点の数 $v$ を $h$ で表したものとして正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $v=3h+30$
    misconception: mc-gm-polyhedron-count
    rationale: |
      これは辺の数 $e$。各面の頂点数の合計 $5p+6h$（$p$ は五角形の数）を、辺と同じく $2$ で割っている。1つの頂点には3つの面が集まるので、頂点は $3$ 回ずつ重複して数えられており、$3$ で割る必要がある。
  - id: "2"
    text: $v=2h+20$
    rationale: |
      正解。五角形の数を $p$ とすると $e=\dfrac{5p+6h}{2},\ v=\dfrac{5p+6h}{3},\ f=p+h$。オイラーの多面体定理 $v-e+f=2$ に代入すると $p=12$ が $h$ によらず決まり、$v=\dfrac{60+6h}{3}=2h+20$。
  - id: "3"
    text: $v=6h+60$
    misconception: mc-gm-polyhedron-count
    rationale: |
      $p=12$ は求められているが、各面の頂点数の合計 $5\cdot 12+6h$ を重複で割らずに頂点の数としている。1つの頂点は3つの面で数えられている。
  - id: "4"
    text: 五角形の面の数が分からないので、$v$ は $h$ だけでは表せない。
    rationale: |
      未知数が $p,\ h$ の2つで条件が1つだから決まらない、と判断している。オイラーの多面体定理に代入すると $h$ が消えて $p=12$ が定まる。「どの頂点にも3面」という条件が、$v$ と $e$ を面の数で表すことに使われている。
answer: "2"
solution: |
  五角形の面の数を $p$ とする。各面の辺数の合計 $5p+6h$ は、1本の辺を2回ずつ数えるので $e=\dfrac{5p+6h}{2}$。各面の頂点数の合計も $5p+6h$ で、1つの頂点を3回ずつ数えるので $v=\dfrac{5p+6h}{3}$。$f=p+h$。

  $v-e+f=2$ に代入し、両辺に $6$ を掛けると
  $$2(5p+6h)-3(5p+6h)+6(p+h)=12\quad\Longrightarrow\quad p=12$$
  よって $v=\dfrac{60+6h}{3}=2h+20$。

  確認: $h=0$ は正十二面体（$v=20$）、$h=20$ はサッカーボール型の切頂二十面体（$v=60$）。
concepts: [gm-solid-figures]
misconceptions: [mc-gm-polyhedron-count]
targetSeconds: 420
irt: { expectedCorrectRate: 0.35, discrimination: 1.3 }
author:
  intent: |
    オイラーの多面体定理を、具体的な多面体の確認ではなく「未知の多面体の構造を決める道具」として使えるかをみる（難関大で頻出のテーマ）。辺・頂点を面から数えるときの重複の回数（辺は2、頂点は3）を正しく扱えるか、未知数が2つでも定理から一方が決まることに気づけるかを識別する。①③は重複の扱いの誤り、④は方程式の数だけで「決まらない」と判断する誤りに対応する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学A (1) ア(エ) 空間図形（多面体、オイラーの多面体定理）]
  variations:
    - 各面が三角形で各頂点に5面が集まる凸多面体の面の数を求めさせる（正二十面体、$f=20$）。
    - 各面が三角形または四角形で、どの頂点にも4面が集まる凸多面体について、三角形の面の数が $8$ に決まることを示させる。
