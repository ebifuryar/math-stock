author:
  intent: |
    「見込む角」を2つの角の差ととらえ、$\tan$ の加法定理で $x$ の関数にできるかをみる。最大化では「$\tan\theta$ の最大 ⇔ $\theta$ の最大」（$\tan$ の単調性）を使うことと、分母・分子を $x$ で割って相加・相乗平均にもちこむ処理が要る。2直線のなす角の公式の応用として、入試で頻出の型を共通テスト形式の誘導で出題した。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学II (4) イ(ア) 加法定理（2直線のなす角）]
  variations:
    - $\mathrm{A}(0,\ a),\ \mathrm{B}(0,\ b)$ で一般化し、最大となる $x=\sqrt{ab}$ を導かせる。
    - 絵画を見る位置の最適化（壁の絵の上端・下端と目の高さ）という文脈で出題する。
