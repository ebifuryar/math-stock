id: pr-grouping
kind: method
title: 組分けの数え方
body: |
  異なる $n$ 人（個）をいくつかの組に分けるとき、**組に区別があるか** をまず確認する。

  1. 組に名前（部屋 $A,\ B,\ C$ など）があるとして数える。各組に入るメンバーを順に ${}_n\mathrm{C}_r$ で選び、積の法則で掛ける。
  2. 組に区別がない場合は、**人数が同じ組どうし** だけが入れかえ可能なので、人数が等しい組が $k$ 組あれば $k!$ で割る。人数の異なる組は人数で区別できるので割らない。

  例: $9$ 人を $3$ 人ずつ $3$ 組に分ける方法は $\dfrac{{}_9\mathrm{C}_3\times{}_6\mathrm{C}_3}{3!}=280$ 通り。$8$ 人を $4$ 人・$2$ 人・$2$ 人に分ける方法は $\dfrac{{}_8\mathrm{C}_4\times{}_4\mathrm{C}_2}{2!}=210$ 通り。

  「空の組を作らない」条件は、空の組を許した数から余事象（包除原理）で引くか、各組の人数の内訳で場合分けする。
prerequisites: [pr-combination]
