id: mc-vc-s05
level: school
format: written
title: 2直線の交点の位置ベクトル
stem: |
  $\triangle\mathrm{OAB}$ において、辺 $\mathrm{OA}$ を $2:1$ に内分する点を $\mathrm{C}$、辺 $\mathrm{OB}$ の中点を $\mathrm{D}$ とし、線分 $\mathrm{AD}$ と線分 $\mathrm{BC}$ の交点を $\mathrm{P}$ とする。$\overrightarrow{\mathrm{OA}}=\vec a,\ \overrightarrow{\mathrm{OB}}=\vec b$ とする。

  (1) $\overrightarrow{\mathrm{OP}}$ を $\vec a,\ \vec b$ を用いて表せ。

  (2) 直線 $\mathrm{OP}$ と辺 $\mathrm{AB}$ の交点を $\mathrm{Q}$ とする。$\mathrm{AQ}:\mathrm{QB}$ を求めよ。
modelAnswer: |
  $\overrightarrow{\mathrm{OC}}=\dfrac{2}{3}\vec a,\ \overrightarrow{\mathrm{OD}}=\dfrac{1}{2}\vec b$ である。

  (1) $\mathrm{P}$ は線分 $\mathrm{AD}$ 上にあるから、$\mathrm{AP}:\mathrm{PD}=s:(1-s)$ とおくと
  $$\overrightarrow{\mathrm{OP}}=(1-s)\vec a+s\cdot\frac{1}{2}\vec b=(1-s)\vec a+\frac{s}{2}\vec b\qquad\cdots\text{①}$$
  $\mathrm{P}$ は線分 $\mathrm{BC}$ 上にあるから、$\mathrm{CP}:\mathrm{PB}=t:(1-t)$ とおくと
  $$\overrightarrow{\mathrm{OP}}=(1-t)\cdot\frac{2}{3}\vec a+t\vec b\qquad\cdots\text{②}$$
  $\vec a\neq\vec 0,\ \vec b\neq\vec 0$ で、$\vec a$ と $\vec b$ は平行でない（一次独立）から、①②の係数を比較して
  $$1-s=\frac{2}{3}(1-t),\qquad \frac{s}{2}=t$$
  第2式を第1式に代入して $1-s=\dfrac{2}{3}-\dfrac{s}{3}$、$\dfrac{2}{3}s=\dfrac{1}{3}$ より $s=\dfrac{1}{2}$、$t=\dfrac{1}{4}$。

  よって $\overrightarrow{\mathrm{OP}}=\dfrac{1}{2}\vec a+\dfrac{1}{4}\vec b$。

  (2) $\mathrm{Q}$ は直線 $\mathrm{OP}$ 上にあるから $\overrightarrow{\mathrm{OQ}}=k\overrightarrow{\mathrm{OP}}=\dfrac{k}{2}\vec a+\dfrac{k}{4}\vec b$ と表せる。$\mathrm{Q}$ は直線 $\mathrm{AB}$ 上にあるから係数の和が $1$ で
  $$\frac{k}{2}+\frac{k}{4}=1\qquad k=\frac{4}{3}$$
  よって $\overrightarrow{\mathrm{OQ}}=\dfrac{2}{3}\vec a+\dfrac{1}{3}\vec b=\dfrac{2\vec a+1\cdot\vec b}{1+2}$ となり、$\mathrm{Q}$ は辺 $\mathrm{AB}$ を $1:2$ に内分する。

  **答え: (1) $\overrightarrow{\mathrm{OP}}=\dfrac{1}{2}\vec a+\dfrac{1}{4}\vec b$ (2) $\mathrm{AQ}:\mathrm{QB}=1:2$**
rubric:
  - id: r1
    criterion: $\mathrm{P}$ が $\mathrm{AD}$ 上・$\mathrm{BC}$ 上にあることから、別々の文字を用いて $\overrightarrow{\mathrm{OP}}$ を2通りに正しく表している（$\overrightarrow{\mathrm{OC}}=\dfrac{2}{3}\vec a$ の係数を含む）
    points: 3
    keywords: ["(1-s)", "(1-t)", "2/3"]
  - id: r2
    criterion: $\vec a,\ \vec b$ が一次独立（$\vec 0$ でなく平行でない）であることを述べてから係数を比較している
    points: 2
    keywords: ["一次独立", "平行でない"]
  - id: r3
    criterion: 連立方程式を解いて $\overrightarrow{\mathrm{OP}}=\dfrac{1}{2}\vec a+\dfrac{1}{4}\vec b$ を得ている
    points: 2
    keywords: ["1/2", "1/4"]
  - id: r4
    criterion: $\overrightarrow{\mathrm{OQ}}=k\overrightarrow{\mathrm{OP}}$ とおき、係数の和が $1$ となる条件から $k=\dfrac{4}{3}$ を求め、$\mathrm{AQ}:\mathrm{QB}=1:2$ を比の向きを正しく答えている
    points: 3
    keywords: ["4/3", "1:2"]
solution: |
  交点の位置ベクトルは「2通りに表して係数比較」が基本。係数比較の根拠として $\vec a,\ \vec b$ の一次独立を必ず述べる。(2) は「直線 $\mathrm{AB}$ 上 ⇔ 係数の和が $1$」を使う。$\overrightarrow{\mathrm{OQ}}=\dfrac{2}{3}\vec a+\dfrac{1}{3}\vec b$ は $\mathrm{A}$ 寄りの点（$\vec a$ の係数が大きい）なので $\mathrm{AQ}<\mathrm{QB}$。

  検算（チェバの定理）: $\dfrac{\mathrm{OC}}{\mathrm{CA}}\cdot\dfrac{\mathrm{AQ}}{\mathrm{QB}}\cdot\dfrac{\mathrm{BD}}{\mathrm{DO}}=2\cdot\dfrac{1}{2}\cdot 1=1$。また (1) より $\mathrm{AP}:\mathrm{PD}=1:1$、$\mathrm{CP}:\mathrm{PB}=1:3$ もわかる。
concepts: [vc-intersection, vc-position-vector]
misconceptions: [mc-vc-independence-unchecked, mc-vc-division-reversed]
targetSeconds: 480
irt: { expectedCorrectRate: 0.65, discrimination: 1.1 }
author:
  intent: |
    交点の位置ベクトルを求める標準手順（2通りの表示・一次独立の明記・係数比較）を答案として書けるかをみる。一次独立への言及を独立した採点項目にして、答えは合っているが根拠が欠けている答案を区別する。(2) では $\overrightarrow{\mathrm{OQ}}=\dfrac{2}{3}\vec a+\dfrac{1}{3}\vec b$ から比を読む段階で、内分の係数を逆に読んで $2:1$ と答える誤りを識別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (1) ア(ア) 位置ベクトル, 数学C (1) イ(イ) ベクトルを用いた平面図形の考察]
  variations:
    - $\mathrm{C}$ を辺 $\mathrm{OA}$ の $3:2$ の内分点、$\mathrm{D}$ を辺 $\mathrm{OB}$ の $1:2$ の内分点に変えて同じことを問う。
    - $\triangle\mathrm{OAB}$ の面積を $S$ として $\triangle\mathrm{PAB}$ の面積を求めさせる。
