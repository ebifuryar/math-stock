author:
  intent: |
    共通テスト第3問型の総合問題。正規分布の確率（1）、標本平均の標準偏差と信頼区間（2）、片側検定（3）、両側検定（4）、区間推定と検定の関係（5）を一つの状況でつなぐ。標本平均を $97.75$（$W=-1.8$）にしたのは、$1.645<|W|<1.96$ となって片側では棄却・両側では棄却されないという境目に置くため。これにより、検定の種類を取り違える受験者は ネ・ヘ のどちらかで必ず誤る。$\sigma(\overline{X})$ を $10$ のまま使うと $W=-0.225$ となって表で計算できず、途中で誤りに気づけるかどうかも見ている。(5) は「区間に含まれる＝証明された」という誤解（$0$）を、会話の花子さんの発言と対応させて退けさせる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (2) ア(ウ) 正規分布", "数学B (2) イ(ア) 標本分布の考察（標本平均の分布）", "数学B (2) ア(エ) 正規分布を用いた区間推定（母平均）", "数学B (2) ア(エ) 正規分布を用いた仮説検定"]
  variations:
    - 標本の大きさを $100$ にして（$\sigma(\overline{X})=1$）、同じ標本平均で両側検定でも棄却されることを確認させる。
    - 母標準偏差が未知で、標本の標準偏差 $10.4$ g を用いる設定に変える。
  notes: 表の値は erf で確認済み（p(1.80)=0.46407）。片側の確率 0.5-0.4641=0.0359、両側 0.0718（erf による値は 0.03593、0.07186）。
