author:
  intent: |
    和・積の期待値と和の分散の公式について、それぞれの成立条件（独立性）を意識して使えるかをみる。(3) の $V(2X-Y)$ は、分散を引く誤り（$4\cdot\frac{1}{2}-\frac{3}{2}=\frac{1}{2}$）や $a$ を2乗しない誤り（$2\cdot\frac{1}{2}+\frac{3}{2}=\frac{5}{2}$）がいずれも既約分数の形の誤答になるよう数値を選んだ。(4) では復元抽出と非復元抽出を並べ、独立でないときは分散の和の公式が成り立たない（$1$ ではなく $\frac{2}{3}$）ことを、総当たりで確かめさせる。標本調査で復元抽出を仮定する理由につながる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (2) ア(イ) 確率変数の和と積（独立な確率変数）", "数学B (2) ア(ウ) 二項分布", "数学B (2) ア(ア) 標本調査の考え方（母集団と標本、復元抽出）"]
  variations:
    - 非復元で2枚取り出すときの $V(T)$ を、$V(T)=V(X_1)+V(X_2)+2\{E(X_1X_2)-E(X_1)E(X_2)\}$ から求めさせる（入試レベル）。
    - $V(X+X)$ と $V(X_1+X_2)$ の違いを問う。
