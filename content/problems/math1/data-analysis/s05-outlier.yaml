id: m1-da-s05
level: school
format: written
title: 外れ値の判定
stem: |
  次のデータは、ある部の部員12人の1週間の自主練習時間（時間）である。

  $$12,\ 16,\ 3,\ 14,\ 19,\ 11,\ 31,\ 15,\ 10,\ 17,\ 13,\ 8$$

  第1四分位数・中央値・第3四分位数と四分位範囲を求め、このデータに外れ値があるかどうかを判定せよ。ただし、外れ値とは「第1四分位数 $-1.5\times$ 四分位範囲」未満の値、または「第3四分位数 $+1.5\times$ 四分位範囲」より大きい値とする。
modelAnswer: |
  小さい順に並べると

  $$3,\ 8,\ 10,\ 11,\ 12,\ 13,\ 14,\ 15,\ 16,\ 17,\ 19,\ 31$$

  データは12個なので、中央値は6番目と7番目の平均で $Q_2=\dfrac{13+14}{2}=13.5$。

  下位6個 $3,8,10,11,12,13$ の中央値は $Q_1=\dfrac{10+11}{2}=10.5$、上位6個 $14,15,16,17,19,31$ の中央値は $Q_3=\dfrac{16+17}{2}=16.5$。

  四分位範囲は $Q_3-Q_1=16.5-10.5=6$。

  外れ値の基準は

  $$Q_1-1.5\times 6=10.5-9=1.5,\qquad Q_3+1.5\times 6=16.5+9=25.5$$

  $1.5$ 未満の値はないので、$3$ は外れ値ではない。$25.5$ より大きい値は $31$ だけである。

  よって **外れ値は $31$（時間）の1つだけ** である。
rubric:
  - id: r1
    criterion: データを小さい順に並べ、中央値 $13.5$ を正しく求めている
    points: 2
    keywords: ["13.5"]
  - id: r2
    criterion: 下位・上位6個ずつに分けて $Q_1=10.5,\ Q_3=16.5$ を求め、四分位範囲 $6$ を得ている
    points: 3
    keywords: ["10.5", "16.5"]
  - id: r3
    criterion: 外れ値の基準値 $1.5$ と $25.5$ を正しく計算している
    points: 3
    keywords: ["1.5", "25.5"]
  - id: r4
    criterion: 基準と比較して、$31$ は外れ値、$3$ は外れ値でないと結論している
    points: 2
    keywords: ["31", "外れ値"]
solution: |
  まず並べ替えて四分位数を求め、基準の値 $Q_1-1.5(Q_3-Q_1)$ と $Q_3+1.5(Q_3-Q_1)$ を計算してからデータと比べる。見た目では $3$ も小さく離れているが、下側の基準 $1.5$ より大きいので外れ値ではない。
concepts: [da-outliers, da-quartiles-boxplot]
misconceptions: [mc-da-outlier-criterion]
targetSeconds: 300
irt: { expectedCorrectRate: 0.62, discrimination: 1.1 }
author:
  intent: |
    外れ値の定義を、四分位数の計算から基準値の比較まで一貫して答案に書けるかをみる。見た目で離れている $3$ と $31$ の2つを置き、基準を計算しないと $3$ も外れ値と判断してしまうよう設計した（$1.5$ 倍を落として $Q_1-6=4.5$ を基準にしても $3$ が外れ値になる）。偶数個のデータで四分位数がすべて小数になるので、中央値の求め方の確認にもなる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (4) イ(イ) 外れ値の扱い, 数学I (4) イ(イ) 四分位範囲・箱ひげ図によるデータの傾向の把握]
  variations:
    - 外れ値を除いたときの平均値・中央値の変化を比べさせ、どちらが外れ値の影響を受けやすいかを記述させる。
    - データに1つ値を追加して、外れ値でなくなるための条件（追加する値の範囲）を求めさせる。
