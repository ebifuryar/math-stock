id: cg-line-equation
kind: formula
title: 直線の方程式と2直線の平行・垂直
body: |
  - 点 $(x_1,y_1)$ を通り傾き $m$ の直線: $y-y_1=m(x-x_1)$
  - 2点 $(x_1,y_1),\ (x_2,y_2)$ を通る直線: $x_1\neq x_2$ なら $y-y_1=\dfrac{y_2-y_1}{x_2-x_1}(x-x_1)$、$x_1=x_2$ なら $x=x_1$
  - 一般形 $ax+by+c=0$（$a,\ b$ の少なくとも一方は $0$ でない）は、$y$ 軸に平行な直線（$b=0$）も含めてすべての直線を表す。傾き $m$ を使う形では $y$ 軸に平行な直線が表せないことに注意。

  **2直線の平行・垂直**（傾き $m_1,\ m_2$ の2直線）

  | 関係 | 傾きでの条件 | 一般形 $a_1x+b_1y+c_1=0,\ a_2x+b_2y+c_2=0$ での条件 |
  | --- | --- | --- |
  | 平行 | $m_1=m_2$ | $a_1b_2-a_2b_1=0$ |
  | 垂直 | $m_1m_2=-1$ | $a_1a_2+b_1b_2=0$ |

  垂直な直線の傾きは「逆数にして符号を変える」。例: 傾き $\dfrac{2}{3}$ に垂直なら $-\dfrac{3}{2}$。直線 $ax+by+c=0$ に対して、ベクトル $(a,\ b)$ はこの直線に垂直（法線ベクトル）である。
