id: ma-pr-a02
level: applied
format: choice
title: 先に3勝した方が優勝する確率
stem: |
  $A,\ B$ の2人が試合を繰り返し、先に $3$ 勝した方を優勝とする。1試合で $A$ が $B$ に勝つ確率は $\dfrac{2}{3}$ で、引き分けはなく、各試合の結果は互いに独立であるとする。

  $A$ が優勝する確率として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $\dfrac{104}{243}$
    misconception: mc-pr-repeated-coefficient
    rationale: |
      $\left(\dfrac{2}{3}\right)^3\left\{1+\dfrac{1}{3}+\left(\dfrac{1}{3}\right)^2\right\}$ と、負ける試合の位置の選び方（${}_3\mathrm{C}_1,\ {}_4\mathrm{C}_2$）を掛け忘れている。例えば3勝1敗は「敗,勝,勝,勝」「勝,敗,勝,勝」「勝,勝,敗,勝」の3通りの順番がある。
  - id: "2"
    text: $\dfrac{64}{81}$
    rationale: |
      正解。3勝0敗 $\dfrac{8}{27}$、3勝1敗 ${}_3\mathrm{C}_1\left(\dfrac{2}{3}\right)^2\dfrac{1}{3}\cdot\dfrac{2}{3}=\dfrac{8}{27}$、3勝2敗 ${}_4\mathrm{C}_2\left(\dfrac{2}{3}\right)^2\left(\dfrac{1}{3}\right)^2\cdot\dfrac{2}{3}=\dfrac{16}{81}$ の和。
  - id: "3"
    text: $\dfrac{80}{243}$
    rationale: |
      「5試合行って $A$ がちょうど $3$ 勝する確率」${}_5\mathrm{C}_3\left(\dfrac{2}{3}\right)^3\left(\dfrac{1}{3}\right)^2$ を求めている。5試合すべて行うと仮定するなら、$A$ が優勝することは「$3$ 勝 **以上**」に対応するので、4勝・5勝の場合も含める必要がある。
  - id: "4"
    text: $\dfrac{16}{27}$
    rationale: |
      3勝0敗と3勝1敗だけを足し、3勝2敗の場合を落としている。優勝が決まるまでの試合数は $3,\ 4,\ 5$ の3通りある。
answer: "2"
solution: |
  $A$ が優勝するのは、最後の試合に $A$ が勝ち、それまでに $A$ が $2$ 勝している場合。最後の試合の直前までの負け数で場合分けする（互いに排反）。

  - 3勝0敗: $\left(\dfrac{2}{3}\right)^3=\dfrac{8}{27}$
  - 3勝1敗: ${}_3\mathrm{C}_1\left(\dfrac{2}{3}\right)^2\left(\dfrac{1}{3}\right)\times\dfrac{2}{3}=\dfrac{8}{27}$
  - 3勝2敗: ${}_4\mathrm{C}_2\left(\dfrac{2}{3}\right)^2\left(\dfrac{1}{3}\right)^2\times\dfrac{2}{3}=\dfrac{16}{81}$

  合計 $\dfrac{24+24+16}{81}=\dfrac{64}{81}$。
concepts: [pr-independent-repeated]
misconceptions: [mc-pr-repeated-coefficient]
targetSeconds: 240
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    終了条件のある反復試行で、「最後の試合は $A$ の勝ちに固定し、それ以前の試合だけで ${}_n\mathrm{C}_r$ を使う」ことができるかをみる。①は係数の掛け忘れ、③は優勝を「5試合中ちょうど3勝」と誤ってモデル化したもの、④は場合の取りこぼし。なお「5試合すべて行うとみなして3勝以上」とする別解でも $\dfrac{64}{81}$ になることを、解説で扱うと理解が深まる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学A (2) イ(イ) 独立な試行と確率（反復試行）"]
  variations:
    - 引き分け（確率 $\dfrac{1}{6}$ など）を加え、「4試合目で $A$ の優勝が決まる確率」を問う。
    - 「$A$ が優勝したとき、5試合目までもつれていた条件付き確率」を問い、条件付き確率と組み合わせる。
  notes: 5試合すべて行うとみなす別解：${}_5\mathrm{C}_3(2/3)^3(1/3)^2+{}_5\mathrm{C}_4(2/3)^4(1/3)+(2/3)^5=(80+80+32)/243=64/81。
