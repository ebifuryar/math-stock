id: m1-sp-e03
level: exam
format: mark
title: 平方数の倍数条件と必要十分条件
stem: |
  $n$ を自然数とする。

  (1) 「$n^2$ が $12$ の倍数である」ことは、「$n$ が $6$ の倍数である」ための $\boxed{\text{ア}}$ 。

  (2) 「$n^2$ が $12$ の倍数である」ことは、「$n$ が $12$ の倍数である」ための $\boxed{\text{イ}}$ 。

  $\boxed{\text{ア}}$、$\boxed{\text{イ}}$ の解答群（同じものを繰り返し選んでもよい）
  - ⓪ 必要条件であるが、十分条件ではない
  - ① 十分条件であるが、必要条件ではない
  - ② 必要十分条件である
  - ③ 必要条件でも十分条件でもない

  (3) $2$ 以上 $30$ 以下の自然数 $k$ のうち、命題「すべての自然数 $n$ について、$n^2$ が $k$ の倍数ならば $n$ は $k$ の倍数である」が真となるものは $\boxed{\text{ウエ}}$ 個ある。
blanks:
  - { label: ア, answer: "2" }
  - { label: イ, answer: "0" }
  - { label: ウエ, answer: "18" }
solution: |
  (1) $n^2$ が $12=2^2\cdot 3$ の倍数なら、$n^2$ は $2$ の倍数かつ $3$ の倍数。素数 $p$ について「$n^2$ が $p$ の倍数 $\Rightarrow$ $n$ は $p$ の倍数」なので、$n$ は $2$ の倍数かつ $3$ の倍数、すなわち $6$ の倍数。逆に $n=6m$ なら $n^2=36m^2=12\cdot 3m^2$。よって必要十分条件（②）。

  (2) $n$ が $12$ の倍数なら $n^2$ も $12$ の倍数。逆は偽（反例 $n=6$）。必要条件であるが十分条件ではない（⓪）。

  (3) $k$ が $1$ より大きい平方数 $m^2$（$m\geqq 2$）で割り切れる、すなわち $k=m^2l$ と書けるとき、$n=ml$ とすると $n^2=k\cdot l$ は $k$ の倍数だが、$0<n<k$ なので $n$ は $k$ の倍数でない。よって命題は偽。

  逆に $k$ が異なる素数の積 $k=p_1p_2\cdots p_r$ のとき、$n^2$ が $k$ の倍数なら各 $p_i$ について $n$ は $p_i$ の倍数となり、$n$ は $k$ の倍数。よって命題は真。

  $2\leqq k\leqq 30$ で平方数（$4,\ 9,\ 25$）で割り切れるものは $4,\ 8,\ 9,\ 12,\ 16,\ 18,\ 20,\ 24,\ 25,\ 27,\ 28$ の $11$ 個。求める個数は $29-11=18$。
concepts: [sp-necessary-sufficient, sp-proof-contrapositive, sp-proposition-truth]
misconceptions: [mc-sp-converse-assumed, mc-sp-nec-suff-reversed, mc-sp-counterexample]
targetSeconds: 480
irt: { expectedCorrectRate: 0.25, discrimination: 1.4 }
author:
  intent: |
    (1)・(2) で「$n^2$ が $k$ の倍数 $\Rightarrow$ $n$ が $k$ の倍数」が $k$ によって成り立ったり成り立たなかったりすることを体験させ、(3) でその境目（平方因子をもつかどうか）を自分で見抜けるかをみる。(1) を「$12$ の倍数だから $n$ も $12$ の倍数」と誤って⓪とする受験者、(3) で反例の作り方（$n=ml$）を一般化できずに数え間違える受験者を識別する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学I (1) ア(ウ) 集合と命題（必要条件・十分条件、反例）]
  variations:
    - (3) を「$n^3$ が $k$ の倍数ならば $n$ は $k$ の倍数」に変え、立方因子で判定させる（答えは $2\leqq k\leqq 30$ で $k=8,\ 16,\ 24,\ 27$ 以外の $25$ 個）。
    - (1) の $12$ を $18$ に変え、$n$ が $6$ の倍数と同値になることを示させる記述問題にする。
  notes: |
    (3) は素因数分解（数学A「整数の性質」相当）の考え方を背景にもつが、「$n^2$ が素数 $p$ の倍数ならば $n$ は $p$ の倍数」と反例の構成だけで処理でき、集合と命題の問題として成立する。
