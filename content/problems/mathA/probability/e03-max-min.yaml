author:
  intent: |
    「最大値が $5$ かつ最小値が $2$」を、集合 $A$ から $B\cup C$ を除いたものとして包除原理で処理できるかをみる。$B\cap C$ を足し戻さない（$4^n-2\cdot 3^n$）誤りは $n=2$ で負になることで検算できる。後半は $p_n$ の増減を差で調べる力をみる。$p_4-p_3=\dfrac{1}{648}$ と非常に僅差になるよう設計しており、概算で $n=3$ と答える受験者を識別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学A (2) イ(ア) 確率とその基本的な法則", "数学A (2) ア(ア) 集合の要素の個数"]
  variations:
    - 最大値が $6$ かつ最小値が $1$ である確率 $\dfrac{6^n-2\cdot 5^n+4^n}{6^n}$ を求め、$n$ 回で $1$ と $6$ がともに出る確率として解釈させる。
    - 記述式にして、$p_n$ を最大にする $n$ の決定過程を答案として書かせる。
  notes: 誘導を外せば国公立二次の標準的な記述問題になる。後半の比較は、比 $p_{n+1}/p_n$ より差の方が扱いやすい。
