- id: mc-it-one-is-prime
  title: 1を素数とみなす
  description: |
    $1$ を素数に含めてしまう。素数の個数を数えるときに $1$ を加える、素因数分解に $1$ を書き込む、などの形で現れる。
  cause: |
    素数を「$1$ とそれ自身でしか割り切れない数」と覚えており、「正の約数がちょうど2個」という定義の核心を押さえていない。$1$ を素数に入れると素因数分解の一意性（$6=2\cdot 3=1\cdot 2\cdot 3$）が崩れる、という理由まで説明させる設問が有効。
  remedyConcepts: [it-divisor-prime, it-prime-factorization]
- id: mc-it-divisor-count-exponent
  title: 約数の個数で指数に1を足し忘れる
  description: |
    $N=p^{a}q^{b}$ の正の約数の個数を $ab$ と計算する（正しくは $(a+1)(b+1)$）。あるいは $(a+1)+(b+1)$ と和にする。
  cause: |
    約数を $p^{i}q^{j}$ と表したときの指数 $i$ の選び方が「$0,\ 1,\ \ldots,\ a$ の $a+1$ 通り」であること（$p^0=1$ を選ぶ場合）を意識せず、公式を形だけで覚えている。積の法則で数えている、という構造が見えていないと和にもしてしまう。誤答の数値が具体的に出るので、選択肢・マークの両方で検出しやすい。
  remedyConcepts: [it-prime-factorization]
- id: mc-it-coprime-ignored
  title: 「互いに素」の条件を使わずに整除・積の関係を結論する
  description: |
    「$a\mid bc$ ならば $a\mid b$ または $a\mid c$」「$a\mid c,\ b\mid c$ ならば $ab\mid c$」「最小公倍数は $ab$」のように、互いに素（または素数）であるときにだけ成り立つ性質を無条件に使う。$a=Ga',\ b=Gb'$ とおいた後に $a',\ b'$ が互いに素であることを使わない（または確認しない）のも同じ根。
  cause: |
    素数 $p$ についての性質「$p\mid bc \Rightarrow p\mid b$ または $p\mid c$」や、互いに素な2数についての性質を、一般の整数に拡張してしまう。反例（$4\mid 2\cdot 6$、$\mathrm{lcm}(4,6)=12\neq 24$）に触れた経験が少ないことが原因。作問では、互いに素でない数を混ぜると誤答が具体的な数値として現れる。
  remedyConcepts: [it-gcd-lcm]
- id: mc-it-remainder-incomplete
  title: 余りによる分類が網羅的でない
  description: |
    「すべての整数 $n$ について〜」を示すのに、$n=3k+1,\ 3k+2$ だけを調べて $n=3k$ を落とす、偶数・奇数だけで分ければ十分と思い込む（$8$ の倍数を示すのに $4$ で割った余りまで見る必要があるのに見ない）など、場合の一部しか調べない。
  cause: |
    割り算の原理（余りは $0$ から $m-1$ までのちょうど $m$ 通り）と「分類が全体を覆っている」ことの対応を意識していない。数値をいくつか代入して成り立ったことで満足してしまう習慣も根にある。証明問題の採点基準に「分類の網羅」を独立した項目として入れると識別できる。
  remedyConcepts: [it-remainder-classification]
- id: mc-it-general-solution-gcd
  title: 一般解で係数を gcd で割らない
  description: |
    $12x+18y=42$ の一般解を $x=x_0+18k,\ y=y_0-12k$ のように元の係数のまま書く。これは解であるが、すべての解を表していない（正しくは両辺を $6$ で割った $2x+3y=7$ の係数を使い $x=x_0+3k$）。
  cause: |
    一般解を「$a(x-x_0)=-b(y-y_0)$ から $b\mid (x-x_0)$」と導く際に、$a$ と $b$ が互いに素であることが必要だという論理を理解せず、公式 $x=x_0+bk$ だけを暗記している。解の個数を数える問題では個数が少なく出るので誤答として表面化する。
  remedyConcepts: [it-linear-diophantine, it-gcd-lcm]
- id: mc-it-particular-sign
  title: 特殊解・一般解の符号ミス
  description: |
    $ax-by=c$ の形の方程式で、$ax+by=c$ の特殊解をそのまま使う、あるいは一般解を $x=x_0+bk,\ y=y_0-ak$ と書いて $x,\ y$ を逆向きに動かす。互除法を逆にたどるときに符号を取り違えるのも同類。
  cause: |
    特殊解や一般解を元の方程式に代入して検算する習慣がない。また「$ax+by$ 型では $x,\ y$ が逆向き、$ax-by$ 型では同じ向きに動く」という構造を、$a(x-x_0)=b(y-y_0)$ の式から確認していない。
  remedyConcepts: [it-linear-diophantine, it-euclidean-algorithm]
- id: mc-it-base-weight-reversed
  title: n 進法で桁の重みを逆にする
  description: |
    $n$ で割り続けた余りを上から読んで $n$ 進数を書く（$6=110_{(2)}$ を $011_{(2)}$ とする）、$abc_{(n)}$ を $a+bn+cn^2$ と計算する、など位の重みを逆順に対応させる。小数部分で $n$ を掛けて出た整数部分を下から読むのも同じ誤り。
  cause: |
    割り算の筆算で最初に出る余りが $n^0$ の位（一の位）であることを、$N=n(\cdots)+r$ という式の意味から理解していない。手順を「下から読む」という合言葉だけで覚えているため、小数部分（上から読む）と混同する。
  remedyConcepts: [it-base-n]
- id: mc-it-finite-decimal-condition
  title: n 進法の有限小数の条件の誤用
  description: |
    $n$ 進法でも「分母の素因数が $2$ と $5$ だけなら有限小数」という10進法の条件を使う、約分する前の分母で判定する、分母が $n$ の素因数を **含んでいれば** 有限小数になると考える、などの誤り。
  cause: |
    有限小数 $0.d_1d_2\cdots d_k{}_{(n)}=\dfrac{m}{n^k}$ という表示から「既約分数の分母が $n^k$ の約数 $\iff$ 分母の素因数がすべて $n$ の素因数」と導く過程を経ずに、10進法の結果だけを覚えている。約分前の分母で判定する誤りは、分子と分母に共通な素因数を持つ選択肢で識別できる。
  remedyConcepts: [it-base-n, it-prime-factorization]
