author:
  intent: |
    二項分布 → 1次式 $3X-100$ の期待値・分散 → 正規近似 → 検定という流れを一続きで処理できるかをみる。(1) の $\sigma(S)$ で、$V(3X-100)$ を $3V(X)=75$ や $3V(X)-100$ とする誤り、$V(X)$ を $np=50$ とする誤り（$\sigma(S)=\sqrt{450}$）を表面化させる。(2) は平均の両側にまたがる区間で、表の値の加減を確認する。(3) の最後の問いは、棄却域を $S$ の値の範囲に戻し、さらに「$S$ は $3X-100$ の形の値しかとらない」という離散性に気づけるかを問う入試的な仕上げで、$S$ を連続的な整数と考えると $21$ から $79$ までの $59$ 個と誤る。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (2) ア(ウ) 二項分布と正規分布", "数学B (2) ア(イ) aX+b の期待値と分散", "数学B (2) ア(エ) 正規分布を用いた仮説検定"]
  variations:
    - 対立仮説を「表が出る確率は $\frac{1}{2}$ より小さい」とした片側検定で、棄却される $S$ の最大値を求めさせる。
    - '表で $+3$、裏で $-2$ と移動量を変え、$E(S)$ と $\sigma(S)$ が $n$ にどう依存するかを考えさせる。'
  notes: 二項分布による正確な値は P(S≥80)=P(X≥60)=0.0284、P(35≤S≤80)=P(45≤X≤60)=0.8468。半整数補正を行わない高校の扱いでの近似値を答えとする。棄却されない X の範囲は z=(X-50)/5 で |z|<1.96、X=41〜59（X=40, 60 では |z|=2）。
