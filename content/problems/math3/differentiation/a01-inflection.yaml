id: m3-df-a01
level: applied
format: choice
title: 変曲点の判定
stem: |
  曲線 $y=x^4e^{-x}$ について考える。この関数の第2次導関数は
  $$y''=x^2(x^2+px+q)e^{-x}$$
  （$p,\ q$ は定数）の形に表される。この曲線の変曲点の $x$ 座標をすべて挙げたものとして正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $x=0,\ 4$
    rationale: |
      $y'=x^3(4-x)e^{-x}=0$ の解、すなわち極値をとる点（$x=0$ で極小、$x=4$ で極大）を答えている。変曲点は $y''$ の符号が変わる点である。
  - id: "2"
    text: $x=0,\ 2,\ 6$
    misconception: mc-df-inflection-second-only
    rationale: |
      $y''=0$ の解をすべて変曲点としている。$y''=x^2(x-2)(x-6)e^{-x}$ の因数 $x^2$ は $x=0$ の前後で符号を変えないので、$x=0$ の前後では $y''>0$ のまま（下に凸のまま）であり、変曲点ではない。
  - id: "3"
    text: $x=2,\ 6$
    rationale: |
      正解。$y''=x^2(x-2)(x-6)e^{-x}$ の符号は $x<2\ (x\neq 0)$ で正、$2<x<6$ で負、$x>6$ で正となり、凹凸が入れ替わるのは $x=2,\ 6$ である。
  - id: "4"
    text: $x=-6,\ -2$
    misconception: mc-df-chain-inner
    rationale: |
      $(e^{-x})'=e^{-x}$ と、内側の $-x$ の導関数 $-1$ を掛け忘れている。すると $y'=(x^4+4x^3)e^{-x}$、$y''=(x^4+8x^3+12x^2)e^{-x}=x^2(x+2)(x+6)e^{-x}$ となり、符号が変わる点が $x=-6,\ -2$ になる。
answer: "3"
solution: |
  $(e^{-x})'=-e^{-x}$ に注意して
  $$y'=4x^3e^{-x}-x^4e^{-x}=(4x^3-x^4)e^{-x}$$
  $$y''=(12x^2-4x^3)e^{-x}-(4x^3-x^4)e^{-x}=(x^4-8x^3+12x^2)e^{-x}=x^2(x-2)(x-6)e^{-x}$$
  よって $p=-8,\ q=12$。$e^{-x}>0,\ x^2\geqq 0$ なので $y''$ の符号は $(x-2)(x-6)$ の符号で決まる（$x=0$ では $y''=0$ だが前後で正のまま）。

  | $x$ | $\cdots$ | $0$ | $\cdots$ | $2$ | $\cdots$ | $6$ | $\cdots$ |
  | --- | --- | --- | --- | --- | --- | --- | --- |
  | $y''$ | $+$ | $0$ | $+$ | $0$ | $-$ | $0$ | $+$ |
  | 凹凸 | 下に凸 | | 下に凸 | 変曲点 | 上に凸 | 変曲点 | 下に凸 |

  変曲点は $x=2,\ 6$ の2点で、座標は $\left(2,\ \dfrac{16}{e^2}\right),\ \left(6,\ \dfrac{1296}{e^6}\right)$。
concepts: [df-graph, df-elementary]
misconceptions: [mc-df-inflection-second-only, mc-df-chain-inner]
targetSeconds: 240
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    変曲点を「$f''(x)=0$ の解」ではなく「$f''(x)$ の符号が変わる点」として判定できるかをみる。$f''(x)$ が重解の因数 $x^2$ を含むように設計し、$f''=0$ だけで判断する受験者を②に集める。①は極値と変曲点の混同、④は $(e^{-x})'$ の符号の誤りがそのまま変曲点の位置に現れたもので、計算と概念のどちらでつまずいたかを分けられる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (2) イ(ア) 導関数を用いた関数の考察（グラフの凹凸と変曲点）"]
  variations:
    - 曲線 $y=x^5-5x^4$ で同様に問う（$y''=20x^2(x-3)$、変曲点は $x=3$ のみ）。
    - 増減・凹凸・$x\to\pm\infty$ の極限を調べてグラフの概形を記述させる。
