id: mc-cv-a03
level: applied
format: mark
title: 楕円外の点から引いた接線
stem: |
  楕円 $C:\ \dfrac{x^2}{4}+\dfrac{y^2}{3}=1$ と点 $\mathrm{A}(4,\ 0)$ について、太郎さんと花子さんが話している。

  > 太郎: 楕円上の点 $(x_1,\ y_1)$ における接線は $\dfrac{x_1x}{4}+\dfrac{y_1y}{3}=1$ だから、$\mathrm{A}$ の座標を代入して $x=1$ が接線だね。
  >
  > 花子: でも $\mathrm{A}$ は $C$ 上の点ではないし、$x=1$ は $\mathrm{A}$ を通らないよ。接点を文字でおいて考えよう。

  (1) 接点を $(s,\ t)$ とすると、接線の方程式は $\dfrac{sx}{4}+\dfrac{ty}{3}=1$ である。これが $\mathrm{A}$ を通ることから $s=\boxed{\text{ア}}$ であり、$(s,\ t)$ は $C$ 上にあるから $t=\pm\dfrac{\boxed{\text{イ}}}{\boxed{\text{ウ}}}$ である。よって、$\mathrm{A}$ から $C$ に引いた2本の接線の方程式は
  $$x\pm\boxed{\text{エ}}\,y=\boxed{\text{オ}}$$
  である。

  (2) 2つの接点を結ぶ直線の方程式は $x=\boxed{\text{カ}}$ であり、太郎さんが求めた直線と一致する。$\mathrm{A}$ と2つの接点を頂点とする三角形の面積は $\dfrac{\boxed{\text{キ}}}{\boxed{\text{ク}}}$ である。

  (3) $C$ の焦点のうち $x$ 座標が正であるものは $(\boxed{\text{ケ}},\ 0)$ であり、(2) の直線はこの焦点を通る。
blanks:
  - { label: ア, answer: "1" }
  - { label: イ, answer: "3" }
  - { label: ウ, answer: "2" }
  - { label: エ, answer: "2" }
  - { label: オ, answer: "4" }
  - { label: カ, answer: "1" }
  - { label: キ, answer: "9" }
  - { label: ク, answer: "2" }
  - { label: ケ, answer: "1" }
solution: |
  (1) 接線 $\dfrac{sx}{4}+\dfrac{ty}{3}=1$ が $\mathrm{A}(4,\ 0)$ を通るので $s=1$。$\dfrac{1}{4}+\dfrac{t^2}{3}=1$ より $t^2=\dfrac{9}{4}$、$t=\pm\dfrac{3}{2}$。

  接線は $\dfrac{x}{4}\pm\dfrac{3}{2}\cdot\dfrac{y}{3}=1$、すなわち $\dfrac{x}{4}\pm\dfrac{y}{2}=1$ を $4$ 倍して $x\pm 2y=4$。

  （検算: $x=4-2y$ を $C$ に代入すると $3(4-2y)^2+4y^2=12\iff 16y^2-48y+36=0\iff 4(2y-3)^2=0$ で重解。）

  (2) 接点は $\left(1,\ \dfrac{3}{2}\right),\ \left(1,\ -\dfrac{3}{2}\right)$ なので、結ぶ直線は $x=1$。三角形は底辺 $3$、高さ $4-1=3$ で面積 $\dfrac{9}{2}$。

  太郎さんの直線 $\dfrac{4x}{4}=1$ は接線ではなく、2接点を結ぶ直線である。一般に、曲線外の点 $(p,\ q)$ を接線の公式に代入した直線 $\dfrac{px}{4}+\dfrac{qy}{3}=1$ は、どちらの接点 $(s,\ t)$ に対しても $\dfrac{ps}{4}+\dfrac{qt}{3}=1$（接線が $(p,\ q)$ を通る条件）を満たすので、2接点を通る。

  (3) $c=\sqrt{4-3}=1$ より焦点は $(\pm 1,\ 0)$。直線 $x=1$ は焦点 $(1,\ 0)$ を通る。（$\mathrm{A}$ は準線 $x=\dfrac{a^2}{c}=4$ 上の点である。）
