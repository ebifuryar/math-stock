id: m2-cg-a02
level: applied
format: choice
title: 円外の点から引いた接線
stem: |
  点 $\mathrm{P}(2,\ 4)$ から円 $x^2+y^2=4$ に引いた接線をすべて求めたものとして正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $3x-4y+10=0$ の1本のみ
    misconception: mc-cg-tangent-vertical
    rationale: |
      傾きを $m$ とおいて $y-4=m(x-2)$ とし、$m=\dfrac{3}{4}$ だけを得て終えている。この置き方では $y$ 軸に平行な直線 $x=2$ を表せない。$x=2$ は中心 $(0,\ 0)$ からの距離が $2$ で、これも接線である。
  - id: "2"
    text: $x+2y-2=0$ の1本のみ
    rationale: |
      円周上の点での接線の公式 $x_1x+y_1y=r^2$ に、円の外の点 $\mathrm{P}$ の座標を代入している。$\mathrm{P}$ は円周上にないのでこの公式は使えない（$x+2y-2=0$ は2つの接点を結ぶ直線で、$\mathrm{P}$ を通らない）。
  - id: "3"
    text: $y=4$ と $4x+3y-20=0$ の2本
    rationale: |
      中心と直線の距離を半径 $2$ ではなく $r^2=4$ に等しいとおいて、$\dfrac{|4-2m|}{\sqrt{m^2+1}}=4$ から $m=0,\ -\dfrac{4}{3}$ を得ている。たとえば $y=4$ は中心からの距離が $4$ で、円と共有点をもたない。
  - id: "4"
    text: $x=2$ と $3x-4y+10=0$ の2本
    rationale: |
      正解。円外の点からの接線は必ず2本ある。傾きを使う方法で1本しか出ないときは、$y$ 軸に平行な直線 $x=2$ を調べる。
answer: "4"
solution: |
  **傾きをおく方法**: 接線を $y-4=m(x-2)$、すなわち $mx-y-2m+4=0$ とおく。中心 $(0,\ 0)$ との距離が半径 $2$ に等しいから
  $$\frac{|-2m+4|}{\sqrt{m^2+1}}=2\iff (4-2m)^2=4(m^2+1)\iff 16-16m=4\iff m=\frac{3}{4}$$
  よって $y=\dfrac{3}{4}x+\dfrac{5}{2}$、すなわち $3x-4y+10=0$。

  $m$ が1つしか得られないのは、もう1本が $y$ 軸に平行だからである。$\mathrm{P}$ を通る直線 $x=2$ は中心からの距離が $2$ なので接線。

  **接点をおく方法**: 接点を $(x_1,\ y_1)$ とすると接線は $x_1x+y_1y=4$。これが $\mathrm{P}$ を通るので $2x_1+4y_1=4$。$x_1^2+y_1^2=4$ と連立して $(x_1,\ y_1)=(2,\ 0),\ \left(-\dfrac{6}{5},\ \dfrac{8}{5}\right)$。接線は $x=2$ と $-\dfrac{6}{5}x+\dfrac{8}{5}y=4$（$3x-4y+10=0$）。
concepts: [cg-circle-line, cg-circle-equation, cg-point-line-distance]
misconceptions: [mc-cg-tangent-vertical]
targetSeconds: 240
irt: { expectedCorrectRate: 0.5, discrimination: 1.3 }
author:
  intent: |
    円外の点から引く接線が2本あり、そのうち1本が $y$ 軸に平行な場合を見落とさないかをみる。点の $x$ 座標を半径と等しくして、傾きをおく解法では必ず1本しか出ないように設計した。②は接線公式を円外の点に誤用する典型、③は半径と半径の2乗の混同で、それぞれ別の理解不足を識別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (2) ア(ウ) 円と直線の位置関係（接線）]
  variations:
    - 2つの接点を結ぶ直線（極線）の方程式を求めさせ、②の直線の意味を確認させる。
    - 中心が原点でない円 $(x-1)^2+(y-1)^2=1$ と点 $(2,\ 3)$ で同様に問う。
