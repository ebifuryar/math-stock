id: ma-pr-s03
level: school
format: mark
title: 隣り合う・隣り合わない並び方と重複順列
stem: |
  男子 $4$ 人と女子 $3$ 人の計 $7$ 人がいる。

  (1) $7$ 人が1列に並ぶとき、女子 $3$ 人が続いて並ぶ並び方は $\boxed{\text{アイウ}}$ 通りある。

  (2) $7$ 人が円形のテーブルのまわりに等間隔に座るとき、女子どうしが隣り合わない座り方は $\boxed{\text{エオカ}}$ 通りある。ただし、回転して一致する座り方は同じものとみなす。

  (3) $7$ 人を2つの部屋 $A,\ B$ に入れる。どの部屋にも少なくとも1人は入るような入れ方は $\boxed{\text{キクケ}}$ 通りある。
blanks:
  - { label: アイウ, answer: "720" }
  - { label: エオカ, answer: "144" }
  - { label: キクケ, answer: "126" }
solution: |
  (1) 女子 $3$ 人をひとまとめにして、男子 $4$ 人と合わせた $5$ つを並べると $5!$ 通り。まとめた中の女子の並び方が $3!$ 通り。$120\times 6=720$（通り）。

  (2) 男子 $4$ 人を先に円形に並べる：$(4-1)!=6$ 通り。男子の間の $4$ か所から $3$ か所を選んで女子を並べる：${}_4\mathrm{P}_3=24$ 通り。$6\times 24=144$（通り）。

  (3) 各人が $A,\ B$ のどちらに入るかで $2^7=128$ 通り。全員が $A$、全員が $B$ の $2$ 通りを除いて $126$（通り）。
concepts: [pr-permutation]
misconceptions: [mc-pr-order-confusion]
targetSeconds: 240
irt: { expectedCorrectRate: 0.65, discrimination: 1.0 }
author:
  intent: |
    順列の基本操作（まとめる・間に入れる・円順列・重複順列）を一通り正確に使えるかをみる。(2) は1列の場合（両端あり、間が $5$ か所）の発想をそのまま持ち込むと誤り、円形では間が $4$ か所になることを理解しているかを識別する。(3) は空室を除き忘れて $128$ とする誤りを想定している。
  assessedAbilities: [知識・技能]
  curriculumRefs: ["数学A (2) ア(イ) 順列・組合せ"]
  variations:
    - (2) を1列に並べる場合（$4!\times{}_5\mathrm{P}_3=1440$ 通り）にして、円形との違いを比較させる。
    - (3) を部屋 $A,\ B,\ C$ の3つにし、包除原理 $3^7-3\cdot 2^7+3$ を使わせる。
