solution: |
  (1) $f'(x)=-e^{-x}\sin x+e^{-x}\cos x=-e^{-x}(\sin x-\cos x)=-\sqrt{2}\,e^{-x}\sin\left(x-\dfrac{\pi}{4}\right)$。

  (2) $e^{-x}>0$ なので、$f'(x)$ の符号は $-\sin\left(x-\dfrac{\pi}{4}\right)$ の符号と一致する。$f'(x)$ が正から負に変わるのは、$\sin\left(x-\dfrac{\pi}{4}\right)$ が負から正に変わる点、すなわち $x-\dfrac{\pi}{4}=2(n-1)\pi$（$n=1,\ 2,\ \ldots$）のときである。$x\geqq 0$ の範囲で小さい順に
  $$x_n=\frac{\pi}{4}+2(n-1)\pi=\frac{(8n-7)\pi}{4}$$
  $\sin x_n=\sin\dfrac{\pi}{4}=\dfrac{\sqrt{2}}{2}$ なので $a_n=\dfrac{\sqrt{2}}{2}e^{-x_n}$、よって
  $$\frac{a_{n+1}}{a_n}=e^{-(x_{n+1}-x_n)}=e^{-2\pi}$$

  (3) $\{a_n\}$ は初項 $a_1=\dfrac{\sqrt{2}}{2}e^{-\frac{\pi}{4}}$、公比 $e^{-2\pi}$（$0<e^{-2\pi}<1$）の無限等比数列なので、和は収束し
  $$\sum_{n=1}^{\infty}a_n=\frac{\frac{\sqrt{2}}{2}e^{-\frac{\pi}{4}}}{1-e^{-2\pi}}=\frac{\sqrt{2}\,e^{-\frac{\pi}{4}}\cdot e^{2\pi}}{2(e^{2\pi}-1)}=\frac{\sqrt{2}\,e^{\frac{7}{4}\pi}}{2(e^{2\pi}-1)}$$
