author:
  intent: |
    一般形の2次式を平方完成して標準形に直し、平行移動の考え方で焦点や媒介変数表示を求められるかをみる。(2) で焦点を平行移動し忘れて $(\pm\sqrt{5},\ 0)$ とする誤りや、$c^2=9+4$ とする誤りを空欄ク・ケコで識別できる。(3) は楕円の媒介変数表示と平行移動を結びつける導入。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学C (2) ア(ア) 放物線・楕円・双曲線が2次式で表されること, 数学C (2) ア(イ) 曲線の媒介変数表示]
  variations:
    - $9x^2-4y^2+18x+16y-43=0$ を変形させ、双曲線の中心・焦点・漸近線を求めさせる。
    - $y^2-4y-8x+12=0$ の放物線の焦点と準線を求めさせる。
