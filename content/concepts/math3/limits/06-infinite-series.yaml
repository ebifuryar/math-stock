id: lm-infinite-series
kind: theorem
title: 無限級数と無限等比級数
body: |
  無限級数 $\displaystyle\sum_{n=1}^{\infty}a_n$ の和とは、**部分和** $S_n=\displaystyle\sum_{k=1}^{n}a_k$ の極限 $\displaystyle\lim_{n\to\infty}S_n$ のこと。まず $S_n$ を $n$ の式で表し、それから極限をとる。部分分数分解で $S_n$ を求める例:
  $$\sum_{k=1}^{n}\frac{2}{k(k+2)}=\sum_{k=1}^{n}\left(\frac{1}{k}-\frac{1}{k+2}\right)=\frac{3}{2}-\frac{1}{n+1}-\frac{1}{n+2}\to\frac{3}{2}$$

  **収束と項の極限**: $\displaystyle\sum a_n$ が収束 $\Rightarrow\displaystyle\lim_{n\to\infty}a_n=0$。対偶から、$a_n\not\to 0$ なら発散する。**逆は成り立たない**: $\displaystyle\sum_{n=1}^{\infty}\frac{1}{\sqrt{n}+\sqrt{n+1}}$ は項が $0$ に収束するが、$S_n=\sqrt{n+1}-1\to\infty$ で発散する。

  **無限等比級数** $\displaystyle\sum_{n=1}^{\infty}ar^{n-1}=a+ar+ar^2+\cdots$ は
  - $a=0$ のとき、すべての項が $0$ で収束し、和は $0$（$r$ は何でもよい）。
  - $a\neq 0$ のとき、**収束 $\iff|r|<1$** で、和は $\dfrac{a}{1-r}$。$r=-1$ では部分和が振動し、$r=1$ では発散する。

  初項や公比に文字を含むときは「$a=0$ または $|r|<1$」を条件とし、両方を書き出す。

  **循環小数**: $0.1\dot{2}\dot{3}=0.1+0.023+0.00023+\cdots=\dfrac{1}{10}+\dfrac{0.023}{1-0.01}=\dfrac{61}{495}$。

  **図形への応用**: 相似な図形を繰り返し作るとき、長さの比 $k$ なら面積の比は $k^2$。1回目に加わる量（初項）と比（公比）を正確に読み取り、個数が増える場合は「1個あたり × 個数」の公比になることに注意する。
prerequisites: [sq-geometric, sq-sum-techniques, lm-geometric-limit]
