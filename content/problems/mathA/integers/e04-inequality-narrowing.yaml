author:
  intent: |
    対称な不定方程式で大小関係を仮定し、不等式で候補を有限個に絞る定石を使いこなせるかをみる。誘導で評価の式（ア）と積の形への変形（イ・ウ）を与え、そのあとの場合の調べ上げ（$x=2,\ y=3$ が不適になること、負の約数の組の除外）を受験者に委ねることで、手順の完遂力を識別する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学A (3) ア(ア) 整数の性質（不等式による整数解の絞り込み）]
  variations:
    - '$xyz=x+y+z$（解は $(1,2,3)$ のみ）や $\dfrac{1}{x}+\dfrac{1}{y}+\dfrac{1}{z}=1$ に変える。'
    - 大小の仮定を外して「自然数の組 $(x,y,z)$ の総数」（並べ替えを含めて $6+6+3=15$ 組）を問う。
