id: ep-division-fraction
kind: method
title: 整式の除法と分数式
body: |
  **整式の除法** 整式 $A$ を整式 $B$（$B\neq 0$）で割った商を $Q$、余りを $R$ とすると
  $$A=BQ+R,\qquad (R\text{ の次数})<(B\text{ の次数})\ \text{または}\ R=0$$
  この等式は $x$ についての恒等式である。筆算では、抜けている次数の項を $0$ として場所を空けておくと、引き算での桁ずれを防げる。

  - 1次式で割った余りは定数、2次式で割った余りは **1次以下**（$px+q$ の形）。

  **分数式** 分母・分子を因数分解してから
  - 約分は **共通因数** どうしで行う（項どうしを消してはいけない）。
  - 加減は通分してから。$\dfrac{1}{x-1}-\dfrac{1}{x+1}=\dfrac{2}{x^2-1}$ のように、2つずつ組にして計算すると楽なことが多い。
  - 分母が $0$ になる値は考える範囲から除かれている。
prerequisites: [ne-factorization]
