id: sq-sigma
kind: formula
title: Σ記号と和の公式
body: |
  $\displaystyle\sum_{k=1}^{n}a_k=a_1+a_2+\cdots+a_n$ と表す。$\displaystyle\sum_{k=p}^{q}a_k$ の項数は $q-p+1$ である。

  | 和 | 結果 |
  | --- | --- |
  | $\displaystyle\sum_{k=1}^{n}c$ | $nc$ |
  | $\displaystyle\sum_{k=1}^{n}k$ | $\dfrac{1}{2}n(n+1)$ |
  | $\displaystyle\sum_{k=1}^{n}k^2$ | $\dfrac{1}{6}n(n+1)(2n+1)$ |
  | $\displaystyle\sum_{k=1}^{n}k^3$ | $\left\{\dfrac{1}{2}n(n+1)\right\}^2$ |
  | $\displaystyle\sum_{k=1}^{n}r^{k-1}\ (r\neq 1)$ | $\dfrac{r^n-1}{r-1}$ |

  **線形性**: $\displaystyle\sum_{k=1}^{n}(pa_k+qb_k)=p\sum_{k=1}^{n}a_k+q\sum_{k=1}^{n}b_k$（$p,\ q$ は $k$ に無関係な定数）。積 $\displaystyle\sum a_kb_k$ は $\displaystyle\sum a_k\cdot\sum b_k$ に分けられない。

  上端が $n-1$ の和 $\displaystyle\sum_{k=1}^{n-1}$ は、公式の $n$ に $n-1$ を代入して求める。等比数列の和では「初項・公比・項数」を確かめてから公式に当てはめる。
prerequisites: [sq-arithmetic, sq-geometric]
