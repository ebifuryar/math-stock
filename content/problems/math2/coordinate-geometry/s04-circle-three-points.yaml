author:
  intent: |
    3点を通る円を一般形と連立方程式で決定し、平方完成で中心・半径を読み取り、さらに中心が原点でない円の接線の公式を使えるかをみる。(3) で $x^2+y^2=r^2$ 用の公式 $5x+5y=25$ をそのまま使うと誤りになり、公式の適用条件を理解しているかを識別できる。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学II (2) ア(ウ) 円の方程式]
  variations:
    - 3点のうち2点を通り、中心が直線 $y=x-1$ 上にある円を求めさせる。
    - 3点が直角三角形をなす場合に、直径を使えば連立方程式が不要になることに気づかせる。
