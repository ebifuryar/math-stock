id: cg-circle-equation
kind: formula
title: 円の方程式
body: |
  - 中心 $(a,b)$、半径 $r$ の円: $(x-a)^2+(y-b)^2=r^2$（基本形）
  - 展開した形 $x^2+y^2+lx+my+n=0$（一般形）は、平方完成して
  $$\left(x+\frac{l}{2}\right)^2+\left(y+\frac{m}{2}\right)^2=\frac{l^2+m^2-4n}{4}$$
  となり、右辺が正のときに限り円を表す。

  **3点を通る円** は一般形に3点の座標を代入し、$l,\ m,\ n$ の連立1次方程式を解く。中心がわかりやすいとき（直角三角形の3頂点なら斜辺が直径など）は基本形を使う。

  **円周上の点 $(x_1,y_1)$ における接線**
  - 円 $x^2+y^2=r^2$: $x_1x+y_1y=r^2$
  - 円 $(x-a)^2+(y-b)^2=r^2$: $(x_1-a)(x-a)+(y_1-b)(y-b)=r^2$

  この公式は接点が円周上にあるときだけ使える。円の外の点 $(p,q)$ を代入してできる直線 $px+qy=r^2$ は接線ではない（2接点を結ぶ直線になる）。
prerequisites: [cg-distance-division]
