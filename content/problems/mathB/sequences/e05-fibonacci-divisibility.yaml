author:
  intent: |
    整除性の数学的帰納法で、「$5$ の倍数」を「$5M$（$M$ は整数）」と式で表して仮定を実際に使えるかをみる。(1) で $5$ 項先までの関係式を自分で作らせることで、(2) の (II) で「何を仮定し、どの式に代入するか」が明確になるよう誘導した。$a_{5k+5}$ を $a_{5k+4}+a_{5k+3}$ のまま扱って仮定を使えない答案、$n=1$ の確認を省く答案、$a_{5k+1}$ が整数であることに触れない答案を、それぞれ別の基準で区別できる。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: ["数学B (1) ア(ウ) 漸化式と数学的帰納法（数学的帰納法）"]
  variations:
    - 同様に $a_{n+4}=3a_{n+2}-a_n$ を導き、$a_{4n}$ が $3$ の倍数であることを示させる。
    - 「$a_n$ が $5$ の倍数 $\iff n$ が $5$ の倍数」の逆向きも示させる（$5$ で割った余りの周期性を用いる）。
