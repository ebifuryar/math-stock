  - { label: ク, answer: "7" }
  - { label: ケ, answer: "7" }
  - { label: コ, answer: "4" }
  - { label: サシ, answer: "21" }
  - { label: ス, answer: "7" }
  - { label: セ, answer: "5" }
  - { label: ソ, answer: "3" }
solution: |
  (1) 余弦定理より $\cos\angle\mathrm{BAC}=\dfrac{4^2+5^2-6^2}{2\cdot 4\cdot 5}=\dfrac{5}{40}=\dfrac{1}{8}$。$\sin\angle\mathrm{BAC}=\sqrt{1-\dfrac{1}{64}}=\dfrac{3\sqrt{7}}{8}$ より
  $$\triangle\mathrm{ABC}=\frac{1}{2}\cdot 4\cdot 5\cdot\frac{3\sqrt{7}}{8}=\frac{15\sqrt{7}}{4}$$

  (2) 正弦定理より $2R=\dfrac{6}{3\sqrt{7}/8}=\dfrac{16}{\sqrt{7}}$、$R=\dfrac{8}{\sqrt{7}}=\dfrac{8\sqrt{7}}{7}$。

  (3) $\triangle\mathrm{OAH},\ \triangle\mathrm{OBH},\ \triangle\mathrm{OCH}$ はいずれも $\angle\mathrm{OHA}=\angle\mathrm{OHB}=\angle\mathrm{OHC}=90^\circ$ の直角三角形で、斜辺 $\mathrm{OA}=\mathrm{OB}=\mathrm{OC}$、$\mathrm{OH}$ は共通。よって $\mathrm{HA}=\mathrm{HB}=\mathrm{HC}$ となり、$\mathrm{H}$ は $\triangle\mathrm{ABC}$ の外心で $\mathrm{HA}=R$。
  $$\mathrm{OH}=\sqrt{\mathrm{OA}^2-R^2}=\sqrt{16-\frac{64}{7}}=\sqrt{\frac{48}{7}}=\frac{4\sqrt{21}}{7}$$
  $$V=\frac{1}{3}\cdot\frac{15\sqrt{7}}{4}\cdot\frac{4\sqrt{21}}{7}=\frac{15\cdot 7\sqrt{3}}{21}=5\sqrt{3}$$
