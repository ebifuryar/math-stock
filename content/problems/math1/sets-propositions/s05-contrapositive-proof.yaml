author:
  intent: |
    対偶による証明の答案の型（対偶の明示 → 余りによる場合分け → 結論）を書けるかをみる。$3k+2$ の場合を書き落とす答案、裏「$n^2$ が $3$ の倍数でない $\Rightarrow$ $n$ は $3$ の倍数でない」を証明してしまう答案、最後に「もとの命題も真」と結ばない答案を、ルーブリックの各項目で区別できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
