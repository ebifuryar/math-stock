id: cv-ellipse
kind: definition
title: 楕円（焦点からの距離の和）
body: |
  平面上の異なる2定点 $\mathrm{F},\ \mathrm{F'}$ からの距離の和が一定（$\mathrm{FF'}$ より大きい値）である点の軌跡を **楕円** といい、$\mathrm{F},\ \mathrm{F'}$ を **焦点** という。

  **標準形** $a>b>0$ のとき
  $$\frac{x^2}{a^2}+\frac{y^2}{b^2}=1$$
  - 焦点 $(\pm c,\ 0)$、$c=\sqrt{a^2-b^2}$（$a^2=b^2+c^2$）
  - 長軸の長さ $2a$（$x$ 軸上）、短軸の長さ $2b$、中心は原点
  - 楕円上の点から2焦点までの距離の和は $2a$（長軸の長さ）

  **長軸が $y$ 軸上の楕円** $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ で $b>a>0$ のときは、焦点は $(0,\ \pm\sqrt{b^2-a^2})$、長軸の長さ・距離の和は $2b$。分母の **大きい方の文字の軸** に焦点がある、と覚える。
  $$\text{例: }\frac{x^2}{9}+\frac{y^2}{25}=1\ \Longrightarrow\ \text{焦点 }(0,\ \pm 4),\ \text{距離の和 }10$$

  **双曲線との違い** 楕円は $c^2=(\text{大きい分母})-(\text{小さい分母})$、双曲線は $c^2=a^2+b^2$。楕円の焦点は必ず楕円の内部にあり、中心からの距離 $c$ は長半径より小さい。

  **円との関係** 円 $x^2+y^2=a^2$ を $y$ 軸方向に $\dfrac{b}{a}$ 倍に縮小すると楕円 $\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}=1$ になる。
prerequisites: [cg-locus, cg-circle-equation]
