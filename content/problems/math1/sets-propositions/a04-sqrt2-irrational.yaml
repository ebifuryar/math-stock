id: m1-sp-a04
level: applied
format: mark
title: √2 が無理数であることの証明（穴埋め）
stem: |
  $\sqrt{2}$ が無理数であることを、背理法を用いて次のように証明した。$\boxed{\text{ア}}$ 〜 $\boxed{\text{オ}}$ に当てはまるものを答えよ。ただし、$\boxed{\text{ア}}$、$\boxed{\text{ウ}}$、$\boxed{\text{オ}}$ はそれぞれの解答群のうちから一つずつ選べ。また、「整数 $m$ について、$m^2$ が偶数ならば $m$ は偶数である」ことは用いてよい。

  **証明** $\sqrt{2}$ が無理数でない、すなわち $\boxed{\text{ア}}$ と仮定する。このとき、互いに素な自然数 $m,\ n$ を用いて $\sqrt{2}=\dfrac{m}{n}$ と表せる。両辺を2乗して分母を払うと
  $$m^2=\boxed{\text{イ}}\,n^2$$
  となるので、$m^2$ は偶数であり、$m$ は $\boxed{\text{ウ}}$ である。そこで $m=2k$（$k$ は自然数）とおくと $n^2=\boxed{\text{エ}}\,k^2$ となり、$n$ も偶数である。これは $\boxed{\text{オ}}$ に矛盾する。したがって、$\sqrt{2}$ は無理数である。

  $\boxed{\text{ア}}$ の解答群
  - ⓪ $\sqrt{2}$ は整数である
  - ① $\sqrt{2}$ は有理数である
  - ② $\sqrt{2}$ は実数である
  - ③ $\sqrt{2}$ は無理数である

  $\boxed{\text{ウ}}$ の解答群
  - ⓪ 偶数
  - ① 奇数

  $\boxed{\text{オ}}$ の解答群
  - ⓪ $\sqrt{2}>1$ であること
  - ① $m,\ n$ が自然数であること
  - ② $m,\ n$ が互いに素であること
  - ③ $m^2$ が偶数であること
blanks:
  - { label: ア, answer: "1" }
  - { label: イ, answer: "2" }
  - { label: ウ, answer: "0" }
  - { label: エ, answer: "2" }
  - { label: オ, answer: "2" }
solution: |
  背理法では結論「無理数である」の否定「有理数である」を仮定する（ア＝①）。⓪ は「無理数でない」場合の一部（整数の場合）しか仮定しておらず、否定として不十分。

  $\sqrt{2}=\dfrac{m}{n}$ より $m^2=2n^2$（イ＝$2$）。$m^2$ が偶数なので $m$ は偶数（ウ＝⓪）。$m=2k$ を代入すると $4k^2=2n^2$、すなわち $n^2=2k^2$（エ＝$2$）で $n$ も偶数。

  $m,\ n$ がともに $2$ を約数にもつことは、最初に置いた「互いに素」に矛盾する（オ＝②）。
concepts: [sp-proof-contradiction, sp-negation]
misconceptions: [mc-sp-contradiction-structure, mc-sp-negation-quantifier]
targetSeconds: 180
irt: { expectedCorrectRate: 0.58, discrimination: 1.1 }
author:
  intent: |
    背理法の論理構造（何を仮定し、何と何が矛盾するのか）を理解しているかを、穴埋めで分解して確かめる。計算部分（イ・エ）は易しく、アとオで差がつくように設計した。アの⓪は否定の範囲の誤り、オの⓪・①・③は「矛盾の相手」が最初の仮定（互いに素）であることを理解していない答案に対応する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (1) ア(エ) 集合と命題（背理法）]
  variations:
    - 同じ構成で $\sqrt{3}$ が無理数であることを示させる（「$m^2$ が $3$ の倍数ならば $m$ は $3$ の倍数」を用いる）。
    - $\sqrt{4}$ に同じ論法を当てはめるとどこで破綻するかを問い、証明の各段階の役割を確認させる。
