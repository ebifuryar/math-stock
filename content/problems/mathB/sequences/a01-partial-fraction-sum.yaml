id: mb-sq-a01
level: applied
format: choice
title: 部分分数分解による分数の数列の和
stem: |
  自然数 $n$ に対して
  $$T_n=\sum_{k=1}^{n}\frac{1}{k(k+2)}=\frac{1}{1\cdot 3}+\frac{1}{2\cdot 4}+\frac{1}{3\cdot 5}+\cdots+\frac{1}{n(n+2)}$$
  とする。$T_n$ を $n$ の式で表したものとして正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $\dfrac{n(3n+5)}{4(n+1)(n+2)}$
    rationale: |
      正解。$\dfrac{1}{k(k+2)}=\dfrac{1}{2}\left(\dfrac{1}{k}-\dfrac{1}{k+2}\right)$ と分解すると、前の2項 $1,\ \dfrac{1}{2}$ と後ろの2項 $-\dfrac{1}{n+1},\ -\dfrac{1}{n+2}$ が消え残る。
  - id: "2"
    text: $\dfrac{n(3n+5)}{2(n+1)(n+2)}$
    misconception: mc-sq-partial-fraction
    rationale: |
      $\dfrac{1}{k(k+2)}=\dfrac{1}{k}-\dfrac{1}{k+2}$ として係数 $\dfrac{1}{2}$ を付け忘れている。右辺を通分すると $\dfrac{2}{k(k+2)}$ になり、正しい値の $2$ 倍になる。
  - id: "3"
    text: $\dfrac{n+1}{2(n+2)}$
    misconception: mc-sq-partial-fraction
    rationale: |
      $\dfrac{1}{2}\left(1-\dfrac{1}{n+2}\right)$ と、前後1項ずつだけが残るとしている。番号が2つずれる分解では、$\dfrac{1}{2}$ と $-\dfrac{1}{n+1}$ も打ち消されずに残る。（$n=1$ では偶然正しい値 $\dfrac{1}{3}$ になるが、$n=2$ では $\dfrac{3}{8}$ となり $T_2=\dfrac{11}{24}$ と一致しない。）
  - id: "4"
    text: $\dfrac{(n-1)(3n+2)}{4n(n+1)}$
    misconception: mc-sq-sigma-index-shift
    rationale: |
      消え残る末尾の項を $-\dfrac{1}{n},\ -\dfrac{1}{n+1}$ と1つずらしている。最後の項 $\dfrac{1}{n(n+2)}$ から出る $-\dfrac{1}{n+2}$ が残ることを、和の末尾を書き並べて確かめていない。$n=1$ で $0$ になることからも誤りとわかる。
answer: "1"
solution: |
  $$\frac{1}{k(k+2)}=\frac{1}{2}\left(\frac{1}{k}-\frac{1}{k+2}\right)$$
  より
  $$T_n=\frac{1}{2}\left\{\left(1-\frac{1}{3}\right)+\left(\frac{1}{2}-\frac{1}{4}\right)+\left(\frac{1}{3}-\frac{1}{5}\right)+\cdots+\left(\frac{1}{n-1}-\frac{1}{n+1}\right)+\left(\frac{1}{n}-\frac{1}{n+2}\right)\right\}$$
  打ち消し合わずに残るのは $1,\ \dfrac{1}{2},\ -\dfrac{1}{n+1},\ -\dfrac{1}{n+2}$ なので
  $$T_n=\frac{1}{2}\left(\frac{3}{2}-\frac{1}{n+1}-\frac{1}{n+2}\right)=\frac{1}{2}\cdot\frac{3(n+1)(n+2)-2(n+2)-2(n+1)}{2(n+1)(n+2)}=\frac{n(3n+5)}{4(n+1)(n+2)}$$
  検算: $n=1$ で $\dfrac{8}{24}=\dfrac{1}{3}$、$n=2$ で $\dfrac{22}{48}=\dfrac{11}{24}=\dfrac{1}{3}+\dfrac{1}{8}$。
concepts: [sq-sum-techniques, sq-sigma]
misconceptions: [mc-sq-partial-fraction, mc-sq-sigma-index-shift]
targetSeconds: 300
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    $\dfrac{1}{k(k+1)}$ 型の和を経験した受験者が、番号が2つずれる分解に正しく対応できるかをみる。係数 $\dfrac{1}{2}$ の付け忘れ（②）、消え残る項の数の誤り（③）、消え残る末尾の項の番号のずれ（④）を分離して検出する。③は $n=1$ で正しい値と一致するので、$n=2$ まで検算する習慣があるかも問われる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (1) ア(イ) いろいろな数列（和の求め方）"]
  variations:
    - $\displaystyle\sum_{k=1}^{n}\frac{1}{(3k-1)(3k+2)}$ のように、分母が等差数列の隣り合う2項の積になる形にする（係数 $\dfrac{1}{3}$）。
    - $\displaystyle\sum_{k=1}^{n}\frac{1}{\sqrt{k}+\sqrt{k+1}}$ のように、有理化によって差の形に直す和を扱う。
