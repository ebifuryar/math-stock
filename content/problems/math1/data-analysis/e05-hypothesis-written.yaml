id: m1-da-e05
level: exam
format: written
title: 仮説検定による判断の記述
stem: |
  ある品種の種子は、これまでの記録では発芽する確率が $\dfrac{1}{2}$ であった。新しい処理を施した種子10粒をまいたところ、9粒が発芽した。「新しい処理によって発芽しやすくなった」と判断してよいか。

  発芽する確率が $\dfrac{1}{2}$ であるとして計算した、10粒のうちちょうど $k$ 粒が発芽する確率は次の表のとおりである（$\dfrac{1}{1024}$ を単位とする）。

  | $k$ | 7 | 8 | 9 | 10 |
  | --- | --- | --- | --- | --- |
  | 確率 | $\dfrac{120}{1024}$ | $\dfrac{45}{1024}$ | $\dfrac{10}{1024}$ | $\dfrac{1}{1024}$ |

  基準となる確率を $0.05$ として、仮説検定の考え方を用いて判断の過程を書け。また、発芽したのが8粒であった場合はどう判断されるかも述べよ。
modelAnswer: |
  「新しい処理によって発芽しやすくなった」という主張に対し、それに反する仮説

  $$\text{（仮説）新しい処理をしても発芽する確率は }\frac{1}{2}\text{ のままである}$$

  を立てる。この仮説のもとで、10粒のうち9粒以上が発芽する確率は

  $$\frac{10}{1024}+\frac{1}{1024}=\frac{11}{1024}=0.0107\cdots$$

  である。これは基準となる確率 $0.05$ より小さいので、仮説のもとではめったに起こらないことが起きたと考えられる。よって仮説は否定され、**新しい処理によって発芽しやすくなったと判断してよい**。

  次に、発芽したのが8粒であった場合、8粒以上が発芽する確率は

  $$\frac{45+10+1}{1024}=\frac{56}{1024}=0.0546\cdots$$

  で、$0.05$ より大きい。したがって仮説は否定できず、**発芽しやすくなったとは判断できない**。ただしこれは、発芽する確率が $\dfrac{1}{2}$ であることが証明されたという意味ではない。
rubric:
  - id: r1
    criterion: 主張に反する仮説（発芽する確率は $\dfrac{1}{2}$ のままである）を明示している
    points: 2
    keywords: ["仮説", "1/2"]
  - id: r2
    criterion: 「ちょうど9粒」ではなく「9粒以上」の確率として $\dfrac{11}{1024}\fallingdotseq 0.011$ を求めている
    points: 3
    keywords: ["9粒以上", "11/1024"]
  - id: r3
    criterion: $0.05$ と比較して仮説を否定し、発芽しやすくなったと判断してよいと結論している
    points: 2
    keywords: ["0.05", "判断してよい"]
  - id: r4
    criterion: 8粒の場合に $\dfrac{56}{1024}\fallingdotseq 0.055>0.05$ を求め、判断できないと結論している
    points: 2
    keywords: ["56/1024", "判断できない"]
  - id: r5
    criterion: 否定できないことは仮説が正しいと証明されたことではない、と述べている
    points: 1
    keywords: ["証明", "正しい"]
solution: |
  仮説検定は、主張に反する仮説を立て、その仮説のもとで「観測された結果以上に極端な結果」が起こる確率を基準と比べる。ここでは9粒以上（$\frac{11}{1024}=0.011<0.05$）なので仮説を否定でき、8粒以上（$\frac{56}{1024}=0.055>0.05$）なら否定できない。否定できない場合の結論は「判断できない」であり、仮説を肯定したことにはならない。
concepts: [da-hypothesis-testing]
misconceptions: [mc-da-hypothesis-accept-null, mc-da-hypothesis-point-prob]
targetSeconds: 480
irt: { expectedCorrectRate: 0.3, discrimination: 1.4 }
author:
  intent: |
    仮説検定の答案の型（仮説の設定 → 以上の確率の計算 → 基準との比較 → 結論の述べ方）を、自分の言葉で書けるかをみる。境目をまたぐよう数値を設計しており、9粒では $0.011<0.05$ で否定でき、8粒では $0.055>0.05$ で否定できない。さらに「ちょうど8粒」の確率は $\dfrac{45}{1024}=0.044<0.05$ なので、累積を取らない受験者は8粒の場合に逆の結論に達する。最後の採点基準で、「否定できない」ことの意味まで書けた答案を区別する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学I (4) イ(ウ) 仮説検定の考え方, 数学I (4) ア(イ) データの収集と標本調査]
  variations:
    - 基準となる確率を $0.01$ として、9粒でも判断が変わる（$0.011>0.01$）ことを論じさせる。
    - 「発芽しにくくなった」という主張について、1粒以下しか発芽しなかった場合を扱わせる。
