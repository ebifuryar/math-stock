id: m1-da-a01
level: applied
format: choice
title: 相関係数についての正しい記述
stem: |
  ある高校の生徒50人について、数学の得点を変量 $x$、英語の得点を変量 $y$ とする。$x,\ y$ のデータについて次のことがわかっている。

  | | 平均値 | 標準偏差 |
  | --- | --- | --- |
  | $x$（数学） | 60 | 10 |
  | $y$（英語） | 55 | 15 |

  また、$x$ と $y$ の共分散は $105$ である。

  次の①〜④の記述のうち、正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $x$ と $y$ には正の相関があるので、数学の得点を上げる学習をすれば、英語の得点も上がる。
    misconception: mc-da-correlation-causation
    rationale: |
      相関関係は因果関係を意味しない。例えば「学習時間全体が長い」という共通の要因で両方が高くなっている可能性がある。
  - id: "2"
    text: 数学の得点が平均値以上である生徒は、全員英語の得点も平均値以上である。
    misconception: mc-da-correlation-causation
    rationale: |
      正の相関は全体の傾向であり、個々の生徒について何も保証しない。相関係数 $0.7$ では、数学が平均以上で英語が平均未満の生徒がいても矛盾しない（$r=1$ でも保証されるのは直線上に並ぶことだけで、この記述が成り立つのはその特別な場合）。
  - id: "3"
    text: 全員の英語の得点を2倍した変量を $y'=2y$ とすると、$x$ と $y'$ の共分散は $105$ のまま変わらない。
    misconception: mc-da-linear-transform
    rationale: |
      偏差が2倍になるので共分散も2倍の $210$ になる。単位（尺度）に依存しないのは相関係数であって、共分散ではない。
  - id: "4"
    text: $x$ と $y$ の相関係数は $0.7$ であり、全員の数学の得点に5点を加え、英語の得点を $1.2$ 倍しても、相関係数は $0.7$ のまま変わらない。
    rationale: |
      正解。$r=\dfrac{105}{10\times 15}=0.7$。$u=x+5,\ v=1.2y$ とすると共分散は $1\times 1.2\times 105=126$、標準偏差は $10$ と $18$ なので $r=\dfrac{126}{10\times 18}=0.7$。
answer: "4"
solution: |
  相関係数は $r=\dfrac{s_{xy}}{s_xs_y}=\dfrac{105}{10\times 15}=0.7$（やや強い正の相関）。

  $u=ax+b,\ v=cy+d$ と変換すると共分散は $ac$ 倍、標準偏差の積は $|a||c|$ 倍になるので、$ac>0$ なら相関係数は変わらない。共分散は尺度に依存するので、$y$ を2倍すれば共分散も2倍になる。

  相関関係から因果関係や個々のデータについての確定的な結論は導けない。
concepts: [da-correlation, da-linear-transform]
misconceptions: [mc-da-correlation-causation, mc-da-linear-transform]
targetSeconds: 240
irt: { expectedCorrectRate: 0.52, discrimination: 1.2 }
author:
  intent: |
    共通テスト形式の「正しい記述を選べ」。相関係数の計算（数値の確認）と、その性質の理解（尺度不変性・因果との区別・個別のデータへの非適用）を同時にみる。正解の④は計算と変換の両方が正しくないと選べず、③は「何が尺度に依存し何が依存しないか」の区別を問う。①②は日常的な読み違いを2通り用意した。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (4) ア(ア) 散布図・相関係数, 数学I (4) イ(イ) データの傾向の把握と表現]
  variations:
    - "英語の得点を $-1$ 倍（$100-y$ のような失点に変換）したときの相関係数の符号を問う。"
    - 散布図の特徴を言葉で与え、相関係数の値の候補（$-0.8,\ 0.1,\ 0.7$ など）と対応させる。
