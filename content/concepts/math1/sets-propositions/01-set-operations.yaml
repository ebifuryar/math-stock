id: sp-set-operations
kind: definition
title: 集合の演算（部分集合・共通部分・和集合・補集合）
body: |
  範囲がはっきりしたものの集まりを **集合**、集合をつくる1つ1つを **要素** という。$a$ が集合 $A$ の要素であることを $a\in A$ と書く。

  - **部分集合**: $A$ のどの要素も $B$ の要素であるとき $A\subset B$。要素を1つももたない集合を **空集合** $\varnothing$ という。
  - **共通部分** $A\cap B$: $A$ と $B$ の **両方** に属する要素全体。
  - **和集合** $A\cup B$: $A$ と $B$ の **少なくとも一方** に属する要素全体。
  - **補集合** $\overline{A}$: 全体集合 $U$ の要素のうち、$A$ に属さないもの全体。

  不等式で表された集合は数直線上に図示し、端点が含まれるか（$\leqq$ か $<$ か）を●・○で区別する。補集合をとると端点の含まれ方が入れかわる。例えば $U$ を実数全体とすると、$A=\{x\mid x<3\}$ のとき $\overline{A}=\{x\mid x\geqq 3\}$。

  （参考）有限集合の要素の個数 $n(A)$ については $n(A\cup B)=n(A)+n(B)-n(A\cap B)$ が成り立つ（詳しくは数学Aで扱う）。
