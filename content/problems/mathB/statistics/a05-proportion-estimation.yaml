id: mb-st-a05
level: applied
format: written
title: 母比率の推定と必要な標本の大きさ
stem: |
  ある市の有権者から無作為に $400$ 人を選んで、ある政策に賛成かどうかを調べたところ、$256$ 人が賛成と答えた。

  (1) この市の有権者全体における賛成者の割合（母比率）$p$ に対する信頼度 $95\%$ の信頼区間を求めよ。区間の両端は小数第4位を四捨五入して小数第3位まで答えよ。

  (2) 標本比率が (1) と同じ値になると仮定したとき、信頼度 $95\%$ の信頼区間の幅を $0.05$ 以下にするには、標本の大きさを少なくとも何人にすればよいか。

  ただし、$Z$ が標準正規分布に従うとき $P(-1.96\leqq Z\leqq 1.96)=0.95$ である。
modelAnswer: |
  (1) 標本比率は $R=\dfrac{256}{400}=0.64$ である。標本の大きさ $n=400$ は十分大きいので、$R$ は近似的に正規分布 $N\!\left(p,\ \dfrac{p(1-p)}{n}\right)$ に従う。$p(1-p)$ を $R(1-R)$ で代用すると、$R$ の標準偏差は
  $$\sqrt{\frac{R(1-R)}{n}}=\sqrt{\frac{0.64\times 0.36}{400}}=\frac{0.8\times 0.6}{20}=0.024$$
  よって、母比率 $p$ に対する信頼度 $95\%$ の信頼区間は
  $$0.64-1.96\times 0.024\leqq p\leqq 0.64+1.96\times 0.024$$
  $1.96\times 0.024=0.04704$ より $0.59296\leqq p\leqq 0.68704$。小数第3位まで答えると
  $$0.593\leqq p\leqq 0.687$$

  (2) 標本の大きさを $n$ とすると、信頼区間の幅は
  $$2\times 1.96\sqrt{\frac{0.64\times 0.36}{n}}=\frac{2\times 1.96\times 0.48}{\sqrt{n}}=\frac{1.8816}{\sqrt{n}}$$
  これが $0.05$ 以下となる条件は
  $$\sqrt{n}\geqq\frac{1.8816}{0.05}=37.632\qquad\therefore\ n\geqq 37.632^2=1416.16\cdots$$
  $n$ は自然数なので、標本の大きさを少なくとも $1417$ 人にすればよい。
rubric:
  - id: r1
    criterion: 標本比率 $R=0.64$ と、その標準偏差 $\sqrt{\dfrac{R(1-R)}{n}}=0.024$ を正しく求めている
    points: 3
    keywords: ["0.64", "0.024"]
  - id: r2
    criterion: '$R\pm 1.96\sqrt{\dfrac{R(1-R)}{n}}$ の形で信頼区間を立てている'
    points: 2
    keywords: ["1.96"]
  - id: r3
    criterion: 信頼区間を $0.593\leqq p\leqq 0.687$ と正しく答えている
    points: 2
    keywords: ["0.593", "0.687"]
  - id: r4
    criterion: 区間の **幅**（半幅ではない）$\dfrac{2\times 1.96\times 0.48}{\sqrt{n}}\leqq 0.05$ という不等式を立てている
    points: 2
    keywords: ["0.05", "√n"]
  - id: r5
    criterion: '$n\geqq 1416.16\cdots$ から、自然数として最小の $1417$ 人を答えている'
    points: 1
    keywords: ["1417"]
solution: |
  $R=0.64$、$\sqrt{\dfrac{0.64\times 0.36}{400}}=0.024$、$1.96\times 0.024=0.04704$ より、信頼区間は $0.593\leqq p\leqq 0.687$。

  幅は $\dfrac{2\times 1.96\times 0.48}{\sqrt{n}}$。これを $0.05$ 以下にするには $\sqrt{n}\geqq 37.632$、$n\geqq 1416.16\cdots$ で、最小の $n$ は $1417$。幅を約 $\dfrac{1}{2}$ にするのに、標本の大きさは約 $4$ 倍が必要になる。
concepts: [st-estimation, st-sample-mean, st-binomial]
misconceptions: [mc-st-sample-sd, mc-st-binomial-variance]
targetSeconds: 600
irt: { expectedCorrectRate: 0.45, discrimination: 1.3 }
author:
  intent: |
    母比率の推定の手順と、必要な標本の大きさを不等式で逆算する力をみる。(1) は $0.64\times 0.36$ が $0.48^2$ になるよう人数を選び、根号が外れて手計算で処理できるようにした。標準偏差を $\sqrt{\frac{0.64}{400}}=0.04$（$1-R$ の掛け忘れ）とすると区間が $0.562\leqq p\leqq 0.718$ となり、r1・r3 で識別できる。(2) は「幅」と「半幅」の取り違え（半幅で立てると $355$ 人）、$\sqrt{n}$ を $n$ とする誤りを r4 で区別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (2) ア(エ) 正規分布を用いた区間推定（母比率）", "数学B (2) イ(ア) 標本分布の考察（標本比率の分布）"]
  variations:
    - 標本比率が未知の段階で、$R(1-R)\leqq\frac{1}{4}$ を用いて最悪の場合の標本の大きさ（$1537$ 人）を求めさせる。
    - 「賛成者は過半数である」といえるかを、母比率 $\frac{1}{2}$ の片側検定で判断させる。
