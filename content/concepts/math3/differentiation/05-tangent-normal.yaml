id: df-tangent-normal
kind: method
title: 接線・法線と共通接線
body: |
  曲線 $y=f(x)$ 上の点 $(t,\ f(t))$ における

  - **接線**: $y-f(t)=f'(t)(x-t)$
  - **法線**（接点で接線に垂直な直線）: $f'(t)\neq 0$ のとき $y-f(t)=-\dfrac{1}{f'(t)}(x-t)$、$f'(t)=0$ のとき $x=t$

  曲線外の点を通る接線は、接点を $(t,\ f(t))$ とおいて接線の式を立て、通る点の座標を代入して $t$ の方程式を解く。異なる $t$ が異なる接線を与えるかどうか（1本の直線が2点で接することがないか）も確かめる。

  **共通接線**: 2曲線 $y=f(x),\ y=g(x)$ の両方に接する直線は、それぞれの接点を $s,\ t$ とおき、2本の接線の **傾きと切片がともに一致する** 条件
  $$f'(s)=g'(t),\qquad f(s)-sf'(s)=g(t)-tg'(t)$$
  を連立して求める。2曲線が点 $(p,\ q)$ を共有し、その点で共通の接線をもつ（接する）条件は $f(p)=g(p),\ f'(p)=g'(p)$ である。
prerequisites: [cl-tangent, df-rules]
