author:
  intent: |
    積の形の極限を、対数をとって和に直し区分求積法に持ち込む典型手順を、誘導付きで実行できるかをみる。(1) で手順を示し、(2) で誘導なしに同じ変形（$n^n$ をくくり出して $\log\left(2+\frac{k}{n}\right)$ の和にする）ができるかで上位層を識別する。(2) で $\dfrac{k}{n}$ ではなく $\dfrac{2n+k}{n}$ を $x$ とおいた受験者は積分区間 $[2,\ 3]$ の $\displaystyle\int_2^3\log x\,dx$ となり、これも正しい（同じ値になる）。区間を $[0,\ 3]$ や $[2,\ 3]$ と $\log(2+x)$ の組合せにする誤りは値がずれる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (3) イ(イ) 極限や定積分の考えを基にした考察（区分求積法）", "数学III (3) ア(イ) 置換積分法・部分積分法"]
  variations:
    - $\displaystyle\lim_{n\to\infty}\frac{\sqrt[n]{n!}}{n}=\frac{1}{e}$ を、$\displaystyle\int_0^1\log x\,dx$（広義積分）を避けて定積分と不等式ではさむ形で証明させる。
    - $\displaystyle\lim_{n\to\infty}\sqrt[n]{\left(1+\frac{1^2}{n^2}\right)\left(1+\frac{2^2}{n^2}\right)\cdots\left(1+\frac{n^2}{n^2}\right)}$（$=2e^{\frac{\pi}{2}-2}$）を問う。
