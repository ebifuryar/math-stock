id: m2-ep-a04
level: applied
format: mark
title: 2次式で割った余りと整式の決定
stem: |
  整式 $P(x)$ を $x-1$ で割ると余りは $5$、$x+2$ で割ると余りは $-4$ である。

  (1) $P(x)$ を $(x-1)(x+2)$ で割った余りを求めよう。割る式は2次式なので、余りは1次以下の整式であり、$px+q$（$p,\ q$ は定数）とおける。商を $Q(x)$ とすると
  $$P(x)=(x-1)(x+2)Q(x)+px+q$$
  これに $x=1,\ -2$ を代入することにより、求める余りは
  $$\boxed{\text{ア}}\,x+\boxed{\text{イ}}$$
  である。

  (2) さらに、$P(x)$ は $x^3$ の係数が $1$ の3次式で、$P(0)=8$ であるとする。このとき (1) の商 $Q(x)$ は $x+c$（$c$ は定数）の形であり、$P(0)=8$ から $c$ が定まって
  $$P(x)=x^3-\boxed{\text{ウ}}\,x^2-\boxed{\text{エ}}\,x+\boxed{\text{オ}}$$
  である。
blanks:
  - { label: ア, answer: "3" }
  - { label: イ, answer: "2" }
  - { label: ウ, answer: "2" }
  - { label: エ, answer: "2" }
  - { label: オ, answer: "8" }
solution: |
  (1) 剰余の定理より $P(1)=5,\ P(-2)=-4$。等式に代入して
  $$p+q=5,\qquad -2p+q=-4$$
  これを解いて $p=3,\ q=2$。余りは $3x+2$。

  (2) $P(x)=(x-1)(x+2)(x+c)+3x+2$ で、$P(0)=(-1)\cdot 2\cdot c+2=-2c+2=8$ より $c=-3$。
  $$P(x)=(x^2+x-2)(x-3)+3x+2=x^3-2x^2-5x+6+3x+2=x^3-2x^2-2x+8$$
  検算: $P(1)=1-2-2+8=5$、$P(-2)=-8-8+4+8=-4$、$P(0)=8$。
concepts: [ep-factor-theorem, ep-identity, ep-division-fraction]
misconceptions: [mc-ep-remainder-degree]
targetSeconds: 300
irt: { expectedCorrectRate: 0.55, discrimination: 1.2 }
author:
  intent: |
    「2次式で割った余りは1次以下」という次数の判断と、$A=BQ+R$ を恒等式として扱い、割る式が $0$ になる値を代入して条件を得る手順をみる。(1) は誘導付きで確実に得点させ、(2) では商の次数（3次式を2次式で割った商は1次）を自分で判断させて整式全体を決定させる。余りを定数とおくと2つの条件が矛盾して先に進めないので、次数の誤りがそのまま表面化する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (1) ア(オ) 因数定理, 数学II (1) ア(イ) 多項式の除法]
  variations:
    - 割る式を $(x-1)^2$ に変え、$x=1$ の代入だけでは余りが決まらないことに気づかせる。
    - $P(x)$ を $x^2-1$ で割った余りと $x^2-4$ で割った余りが与えられたとき、$x^2+x-2$ で割った余りを求めさせる。
