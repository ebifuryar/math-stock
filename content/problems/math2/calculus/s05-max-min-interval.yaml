id: m2-cl-s05
level: school
format: written
title: 区間における3次関数の最大・最小
stem: |
  関数 $f(x)=x^3-6x^2+9x+1\ (-1\leqq x\leqq 4)$ の最大値と最小値を求めよ。また、そのときの $x$ の値も答えよ。
modelAnswer: |
  $f'(x)=3x^2-12x+9=3(x-1)(x-3)$

  $-1\leqq x\leqq 4$ における増減表は次のようになる。

  | $x$ | $-1$ | $\cdots$ | $1$ | $\cdots$ | $3$ | $\cdots$ | $4$ |
  | --- | --- | --- | --- | --- | --- | --- | --- |
  | $f'(x)$ | | $+$ | $0$ | $-$ | $0$ | $+$ | |
  | $f(x)$ | $-15$ | $\nearrow$ | $5$ | $\searrow$ | $1$ | $\nearrow$ | $5$ |

  ここで $f(-1)=-1-6-9+1=-15$、$f(1)=1-6+9+1=5$、$f(3)=27-54+27+1=1$、$f(4)=64-96+36+1=5$。

  極大値 $5$ と右端の値 $f(4)=5$ が等しく、極小値 $1$ より左端の値 $f(-1)=-15$ が小さい。

  よって **最大値 $5$（$x=1,\ 4$ のとき）、最小値 $-15$（$x=-1$ のとき）**。
rubric:
  - id: r1
    criterion: $f'(x)=3(x-1)(x-3)$ を求め、増減表（または増減の説明）を正しく書いている
    points: 3
    keywords: ["3(x-1)(x-3)", "増減表"]
  - id: r2
    criterion: 極値 $f(1)=5$、$f(3)=1$ を正しく計算している
    points: 2
    keywords: ["f(1)=5", "f(3)=1"]
  - id: r3
    criterion: 端点の値 $f(-1)=-15$、$f(4)=5$ を計算し、極値と比較している
    points: 3
    keywords: ["f(-1)=-15", "f(4)=5"]
  - id: r4
    criterion: 最大値 $5$（$x=1,\ 4$）、最小値 $-15$（$x=-1$）を、最大となる $x$ を2つとも挙げて結論している
    points: 2
    keywords: ["最大値", "最小値", "-15"]
solution: |
  増減表を作り、区間内の極値と両端の値をすべて比べる。極小値 $1$ は最小値ではなく（左端 $-15$ のほうが小さい）、最大値 $5$ は極大点 $x=1$ と右端 $x=4$ の2か所でとる。
concepts: [cl-max-min, cl-extremum]
misconceptions: [mc-cl-endpoint-missing]
targetSeconds: 360
irt: { expectedCorrectRate: 0.62, discrimination: 1.1 }
author:
  intent: |
    「最大値 = 極大値、最小値 = 極小値」と思い込んでいないかをみる。最小値は端点でとり、最大値は極大点と端点の2か所でとるように係数と区間を設計しており、端点を比較しない答案は最小値を $1$ と誤り、最大値をとる $x$ も1つしか挙げない。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学II (5) ア(イ) 関数の増減と極大・極小（最大・最小）"]
  variations:
    - 区間を $0\leqq x\leqq a$ として、最大値を $a$ で場合分けさせる（境界 $f(a)=5$ を解く）。
