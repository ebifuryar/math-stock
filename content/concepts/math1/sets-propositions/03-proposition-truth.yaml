id: sp-proposition-truth
kind: definition
title: 命題と条件・真理集合・反例
body: |
  正しいか正しくないかが明確に決まる文や式を **命題** という。変数を含み、その値によって真偽が決まる文や式を **条件** という。

  条件 $p$ を満たすもの全体の集合を $p$ の **真理集合** といい、$P$ で表す。命題「$p\Longrightarrow q$」について
  $$p\Longrightarrow q\ \text{が真}\iff P\subset Q$$

  命題「$p\Longrightarrow q$」が偽であることを示すには、**$p$ を満たすが $q$ を満たさない例**（**反例**）を1つ挙げればよい。
  - $p$ を満たさない例は反例にならない（仮定を満たしていないから）。
  - 例をいくつ挙げて成り立っても「真」の証明にはならない。真であることは一般的に示す。

  反例を探すときは、$0$、負の数、端点（等号の場合）、無理数などの「特別な値」をまず試すとよい。
prerequisites: [sp-set-operations]
