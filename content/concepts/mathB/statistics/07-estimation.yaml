id: st-estimation
kind: method
title: 母平均・母比率の推定（信頼区間）
body: |
  **母平均の推定**：母標準偏差 $\sigma$ の母集団から大きさ $n$ の標本をとり、標本平均が $\overline{X}$ のとき、母平均 $m$ に対する **信頼度95%の信頼区間** は

  $$\overline{X}-1.96\cdot\frac{\sigma}{\sqrt{n}}\leqq m\leqq \overline{X}+1.96\cdot\frac{\sigma}{\sqrt{n}}$$

  （$P(|Z|\leqq 1.96)=0.95$ から。信頼度99%なら $1.96$ を $2.58$ にかえる。）$\sigma$ が未知で $n$ が大きいときは、標本の標準偏差で代用してよい。

  **母比率の推定**：標本比率を $R$ とすると、母比率 $p$ に対する信頼度95%の信頼区間は
  $$R-1.96\sqrt{\frac{R(1-R)}{n}}\leqq p\leqq R+1.96\sqrt{\frac{R(1-R)}{n}}$$

  **意味**：母平均 $m$ は定数で、変動するのは標本ごとに作られる区間のほうである。「同じ方法で標本をとって区間を作ることを繰り返すと、そのうち約95%の区間が $m$ を含む」という意味であり、「$m$ が95%の確率でこの区間に入る」「母集団の95%のデータがこの区間に入る」という意味ではない。

  区間の幅 $2\times 1.96\cdot\dfrac{\sigma}{\sqrt{n}}$ は $\sqrt{n}$ に反比例する。幅を $\dfrac{1}{2}$ にするには標本の大きさを $4$ 倍にする必要がある。
prerequisites: [st-sample-mean]
