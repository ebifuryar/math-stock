id: m1-da-e02
level: exam
format: choice
title: 仮説検定の判断についての正しい記述
stem: |
  1枚のコインについて「表が出る確率は $\dfrac{1}{2}$ より大きいのではないか」と考え、20回投げたところ表が14回出た。表が出る確率が $\dfrac{1}{2}$ であるとして計算した確率は、次の表のとおりである（小数第4位まで）。

  | 表の回数 | 14 | 15 | 16 | 17 | 18 | 19 | 20 |
  | --- | --- | --- | --- | --- | --- | --- | --- |
  | 確率 | 0.0370 | 0.0148 | 0.0046 | 0.0011 | 0.0002 | 0.0000 | 0.0000 |

  基準となる確率を $0.05$ とするとき、この実験結果にもとづく判断として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: 表がちょうど14回出る確率は $0.0370$ で $0.05$ より小さいから、表が出る確率は $\dfrac{1}{2}$ より大きいと判断できる。
    misconception: mc-da-hypothesis-point-prob
    rationale: |
      「ちょうど14回」の確率で判断している。20回投げたとき、どの回数もちょうどその値になる確率は小さく（最大の10回でも約 $0.176$）、これで判断するとほとんどの結果が「珍しい」ことになってしまう。評価すべきは14回 **以上** の確率。
  - id: "2"
    text: 表が14回以上出る確率は約 $0.0577$ であり、15回以上出る確率は約 $0.0207$ であるから、どちらの基準でみても表が出る確率は $\dfrac{1}{2}$ より大きいと判断できる。
    misconception: mc-da-hypothesis-point-prob
    rationale: |
      確率の計算は正しいが、実際に観測されたのは14回なので、用いるのは14回以上の確率 $0.0577$ である。これは $0.05$ より大きいので仮説は否定できない。15回以上の確率は、この実験では使わない。
  - id: "3"
    text: 表が14回以上出る確率は約 $0.0577$ で $0.05$ より大きいから、このコインは表が出る確率が $\dfrac{1}{2}$ の公正なコインであることが確かめられた。
    misconception: mc-da-hypothesis-accept-null
    rationale: |
      確率が基準より大きいときは「仮説を否定する根拠がない」だけで、仮説が正しいと証明されたわけではない。実際、表が出る確率が $0.6$ のコインでも14回という結果は十分起こりうる。
  - id: "4"
    text: 表が14回以上出る確率は約 $0.0577$ で $0.05$ より大きいから、表が出る確率が $\dfrac{1}{2}$ より大きいとは判断できない。もし表が15回出ていれば、同じ基準で $\dfrac{1}{2}$ より大きいと判断できた。
    rationale: |
      正解。$0.0370+0.0148+0.0046+0.0011+0.0002=0.0577>0.05$ なので仮説は否定できない。一方15回以上なら $0.0148+0.0046+0.0011+0.0002=0.0207<0.05$ となり、仮説を否定できる。
answer: "4"
solution: |
  仮説検定では、観測された結果 **以上に極端な** 結果が起こる確率を、仮説（表が出る確率は $\dfrac{1}{2}$）のもとで計算する。

  - 14回以上：$0.0370+0.0148+0.0046+0.0011+0.0002=0.0577>0.05$ → 仮説は否定できない
  - 15回以上：$0.0207<0.05$ → 仮説を否定できる

  14回では「表が出やすいとは判断できない」が結論であり、「公正であることが確かめられた」とは言えない。基準 $0.05$ のもとでの境目が14回と15回の間にあることも押さえる。
concepts: [da-hypothesis-testing]
misconceptions: [mc-da-hypothesis-point-prob, mc-da-hypothesis-accept-null]
targetSeconds: 300
irt: { expectedCorrectRate: 0.38, discrimination: 1.5 }
author:
  intent: |
    仮説検定の考え方で最も誤解が多い3点（ちょうどの確率で判断する／否定できないことを肯定の証明と読む／観測値と無関係な裾を使う）を、同じ数値表のもとで一度に識別する。表の値は二項分布 $B(20,\ \frac{1}{2})$ の正確な値（$\frac{38760}{2^{20}}$ など）を丸めたもので、14回以上が $0.0577$、15回以上が $0.0207$ と基準 $0.05$ をまたぐよう回数を選んである。正解の④は結論の非対称性（判断できない／もし15回なら判断できる）まで言い切っており、言い回しの丁寧さだけでは選べないようにした。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学I (4) イ(ウ) 仮説検定の考え方]
  variations:
    - 基準となる確率を $0.01$ に変えて、15回でも否定できなくなることを確認させる。
    - "「表が出る確率は $\\dfrac{1}{2}$ と異なる」という主張に変え、両側で確率を評価させる。"
