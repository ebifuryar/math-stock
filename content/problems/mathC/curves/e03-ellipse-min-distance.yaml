author:
  intent: |
    楕円上の点を媒介変数で表し、距離の2乗を $\cos\theta$ の2次関数として、変域 $-1\leqq\cos\theta\leqq 1$ のもとで最小値を場合分けして求められるかをみる。(3) は変域の制限を無視して頂点の値を答えると誤る設計で、「点 $\mathrm{A}$ が楕円の外側に近づくと最短点が頂点に移る」という図形的な理解とも対応する。境界 $t=\dfrac{3}{2}$ は、点 $(2,\ 0)$ での楕円の曲率円の中心 $\left(\dfrac{3}{2},\ 0\right)$ にあたる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(イ) 曲線の媒介変数表示, 数学I (3) ア(イ) 2次関数の最大・最小]
  variations:
    - 点 $\mathrm{A}$ を $(0,\ t)$ にとり、$\mathrm{PA}$ の最大値を場合分けして求めさせる。
    - 楕円上の点 $\mathrm{P}$ と直線 $x+2y=6$ の距離の最小値を、合成または平行な接線を用いて求めさせる。
