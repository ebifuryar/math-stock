author:
  intent: |
    標本平均の分布の公式を「覚えている」だけでなく、どの性質をどの条件で使って導くかを答案に書けるかをみる。特に、期待値には独立性が不要で分散には必要、という区別を書き分けた答案だけが r2 の満点を得る。(2) は導いた公式をそのまま検定に使わせ、$\sigma$ を $\sqrt{n}$ で割らないと $Z=0.2$ となって結論が逆転する。$Z=2$ は $1.96$ をわずかに超える値で、有意水準 $1\%$（$2.58$）なら棄却されない境目に置いた。(3) は $\sqrt{n}$ を含む不等式を解いて自然数の最小値を答える処理まで求める。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (2) イ(ア) 標本分布の考察（標本平均の期待値と標準偏差）", "数学B (2) ア(イ) 独立な確率変数と和の分散", "数学B (2) ア(エ) 正規分布を用いた仮説検定"]
  variations:
    - 有限母集団から非復元抽出する場合に $V(\overline{X})$ が $\frac{\sigma^2}{n}$ より小さくなることを、$N=4$ の小さな母集団で確かめさせる。
    - (2) を有意水準 $1\%$ で行い、結論が変わることを述べさせる。
