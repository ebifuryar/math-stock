id: ma-it-e03
level: exam
format: mark
title: 複数の余りの条件を満たす整数
stem: |
  自然数 $N$ に関する次の条件を考える。

  (A) $3$ で割ると $2$ 余り、$5$ で割ると $3$ 余る。

  (B) $7$ で割ると $4$ 余る。

  (C) $11$ で割り切れる。

  (1) 条件 (A) を満たす $N$ は、$m$ を $0$ 以上の整数として $N=15m+\boxed{\text{ア}}$ と表される。

  (2) 条件 (A), (B) をともに満たす $N$ は、$k$ を $0$ 以上の整数として $N=105k+\boxed{\text{イウ}}$ と表される。

  (3) 条件 (A), (B), (C) をすべて満たす $N$ のうち最小のものは $\boxed{\text{エオカ}}$ であり、$10000$ 以下のものは全部で $\boxed{\text{キ}}$ 個ある。
blanks:
  - { label: ア, answer: "8" }
  - { label: イウ, answer: "53" }
  - { label: エオカ, answer: "473" }
  - { label: キ, answer: "9" }
solution: |
  (1) $N=3a+2=5b+3$ より $3a-5b=1$。特殊解 $(a,b)=(2,1)$ から $3(a-2)=5(b-1)$、$a=5m+2$。よって $N=3(5m+2)+2=15m+8$。

  (2) $15m+8=7n+4$ より $15m-7n=-4$。$15m=14m+m$ と見ると $m+4$ が $7$ の倍数になればよいので $m=7k+3$。よって $N=15(7k+3)+8=105k+53$。

  (3) $105k+53=11\cdot 9k+6k+11\cdot 4+9$ より、$6k+9$ が $11$ の倍数になればよい。$k=0,1,2,\ldots$ と調べると $k=4$ で $33$。$6$ と $11$ は互いに素なので $k=11j+4$ に限られ、$N=105(11j+4)+53=1155j+473$。

  最小は $473$。$1155j+473\leqq 10000$ より $j\leqq 8.2\cdots$、$j=0,1,\ldots,8$ の **$9$ 個**。
concepts: [it-linear-diophantine, it-remainder-classification, it-gcd-lcm]
misconceptions: [mc-it-general-solution-gcd, mc-it-particular-sign]
targetSeconds: 480
