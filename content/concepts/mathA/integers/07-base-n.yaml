id: it-base-n
kind: definition
title: n 進法（記数法）
body: |
  $n$ を $2$ 以上の整数とする。$0$ 以上 $n-1$ 以下の数字を並べ、右から順に $n^0,\ n^1,\ n^2,\ \ldots$ の位として数を表す方法を **$n$ 進法** という。
  $$abc_{(n)}=a\cdot n^2+b\cdot n+c,\qquad 0.de_{(n)}=\frac{d}{n}+\frac{e}{n^2}$$

  - **10進数 → $n$ 進数**: 整数部分は $n$ で割り続けて余りを **下から** 読む。小数部分は $n$ を掛け続けて整数部分を **上から** 読む。
  - **桁数**: $N$ が $n$ 進法で $k$ 桁 $\iff n^{k-1}\leqq N<n^{k}$
  - **有限小数**: 既約分数 $\dfrac{q}{p}$ が $n$ 進法で有限小数になる $\iff$ $p$ の素因数がすべて $n$ の素因数である（10進法なら $2$ と $5$ だけ、6進法なら $2$ と $3$ だけ）。判定は必ず **約分してから** 行う。
prerequisites: [it-prime-factorization]
