id: ma-gm-e04
level: exam
format: mark
title: 三垂線の定理と点と平面の距離
stem: |
  四面体 $\mathrm{OABC}$ において、$\mathrm{AB}=10,\ \mathrm{BC}=21,\ \mathrm{CA}=17$ であり、辺 $\mathrm{OA}$ は平面 $\mathrm{ABC}$ に垂直で $\mathrm{OA}=6$ である。点 $\mathrm{A}$ から直線 $\mathrm{BC}$ に下ろした垂線を $\mathrm{AH}$（$\mathrm{H}$ は直線 $\mathrm{BC}$ 上）とする。

  (1) $\triangle\mathrm{ABC}$ の面積は $\boxed{\text{アイ}}$ であり、$\mathrm{AH}=\boxed{\text{ウ}}$ である。

  (2) 三垂線の定理より $\mathrm{OH}\perp\mathrm{BC}$ であり、$\mathrm{OH}=\boxed{\text{エオ}}$、$\triangle\mathrm{OBC}$ の面積は $\boxed{\text{カキク}}$ である。

  (3) 点 $\mathrm{A}$ と平面 $\mathrm{OBC}$ の距離は $\dfrac{\boxed{\text{ケコ}}}{\boxed{\text{サ}}}$ である。

  (4) 平面 $\mathrm{OBC}$ と平面 $\mathrm{ABC}$ のなす角を $\theta$ とすると、$\cos\theta=\dfrac{\boxed{\text{シ}}}{\boxed{\text{ス}}}$ である。
blanks:
  - { label: アイ, answer: "84" }
  - { label: ウ, answer: "8" }
  - { label: エオ, answer: "10" }
  - { label: カキク, answer: "105" }
  - { label: ケコ, answer: "24" }
  - { label: サ, answer: "5" }
  - { label: シ, answer: "4" }
  - { label: ス, answer: "5" }
solution: |
  (1) $\mathrm{BH}=x$ とすると $10^2-x^2=17^2-(21-x)^2$ より $x=6$、$\mathrm{AH}=8$（$\mathrm{H}$ は辺 $\mathrm{BC}$ 上）。面積は $\dfrac{1}{2}\cdot 21\cdot 8=84$。

  (2) $\mathrm{OA}\perp$ 平面 $\mathrm{ABC}$、$\mathrm{AH}\perp\mathrm{BC}$ だから三垂線の定理より $\mathrm{OH}\perp\mathrm{BC}$。$\triangle\mathrm{OAH}$ は $\angle\mathrm{OAH}=90^\circ$ の直角三角形なので $\mathrm{OH}=\sqrt{6^2+8^2}=10$。$\triangle\mathrm{OBC}=\dfrac{1}{2}\cdot 21\cdot 10=105$。

  (3) 四面体の体積は $V=\dfrac{1}{3}\cdot 84\cdot 6=168$。求める距離を $d$ とすると $\dfrac{1}{3}\cdot 105\cdot d=168$ より $d=\dfrac{24}{5}$。（$\mathrm{BC}\perp$ 平面 $\mathrm{OAH}$ なので、$\triangle\mathrm{OAH}$ で $\mathrm{A}$ から $\mathrm{OH}$ に下ろした垂線の長さ $\dfrac{6\cdot 8}{10}$ としてもよい。）

  (4) 交線 $\mathrm{BC}$ に対して $\mathrm{OH}\perp\mathrm{BC},\ \mathrm{AH}\perp\mathrm{BC}$ なので $\theta=\angle\mathrm{OHA}$。$\cos\theta=\dfrac{\mathrm{AH}}{\mathrm{OH}}=\dfrac{4}{5}$。
