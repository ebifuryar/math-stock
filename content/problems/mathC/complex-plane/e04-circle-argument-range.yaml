id: mc-cp-e04
level: exam
format: mark
title: 円上を動く点の偏角の範囲と累乗
stem: |
  複素数 $z$ が $|z-2i|=1$ を満たしながら動くとする。偏角は $0$ 以上 $2\pi$ 未満で考える。

  (1) $|z|$ の最大値は $\boxed{\text{ア}}$、最小値は $\boxed{\text{イ}}$ である。

  (2) $\arg z$ の最大値は $\dfrac{\boxed{\text{ウ}}}{\boxed{\text{エ}}}\pi$、最小値は $\dfrac{\pi}{\boxed{\text{オ}}}$ である。

  (3) $z^3$ が実数となるような $z$ は全部で $\boxed{\text{カ}}$ 個ある。そのうち $z^3$ が負の実数となるものは
  $$z=\frac{\sqrt{\boxed{\text{キ}}}}{\boxed{\text{ク}}}+\frac{\boxed{\text{ケ}}}{\boxed{\text{コ}}}i$$
  であり、このとき $z^3=-\boxed{\text{サ}}\sqrt{\boxed{\text{シ}}}$ である。
blanks:
