id: cg-locus
kind: method
title: 軌跡の求め方と除外点
body: |
  条件を満たす点 $\mathrm{P}$ 全体が描く図形を **軌跡** という。手順は
  1. 求める点を $\mathrm{P}(x,y)$ とおく
  2. 条件を $x,\ y$ の式で表す（媒介変数があれば消去する）
  3. 得られた図形上の **すべての点が実際に条件を満たすか**（逆の確認）を調べ、満たさない点や範囲を除く

  **アポロニウスの円**: 2定点 $\mathrm{A},\ \mathrm{B}$ からの距離の比が $m:n$（$m\neq n$）である点の軌跡は円で、線分 $\mathrm{AB}$ を $m:n$ に内分する点と外分する点を直径の両端とする（$m=n$ なら $\mathrm{AB}$ の垂直二等分線）。

  **媒介変数の消去で注意すること**
  - $t=\dfrac{y}{x}$ のように割り算で消去したら、$x=0$ の場合を別に調べる。
  - 媒介変数に条件（判別式 $D>0$ など）があれば、それを $x$ の変域に移す。例: $x=\dfrac{m+2}{2}$ なら $m$ の範囲がそのまま $x$ の範囲を決める。
  - 動く直線が表せない直線（$y=tx$ は $y$ 軸を表せない など）に対応する点が除外点になることが多い。
prerequisites: [cg-circle-equation, cg-distance-division]
