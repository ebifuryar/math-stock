id: df-differentiability
kind: definition
title: 微分可能性と連続性
body: |
  関数 $f(x)$ について、極限値
  $$f'(a)=\lim_{h\to 0}\frac{f(a+h)-f(a)}{h}$$
  が **存在する** とき、$f(x)$ は $x=a$ で **微分可能** であるという。$h\to +0$ と $h\to -0$ の両方の極限（右側微分係数・左側微分係数）が存在して一致することが必要である。

  **微分可能ならば連続**: $f(a+h)-f(a)=\dfrac{f(a+h)-f(a)}{h}\cdot h\to f'(a)\cdot 0=0$ より、$x=a$ で微分可能なら連続である。**逆は成り立たない**（例: $f(x)=|x|$ は $x=0$ で連続だが、右側微分係数 $1$ と左側微分係数 $-1$ が一致しないので微分可能でない）。

  **区分的に定義された関数** のつなぎ目 $x=a$ で微分可能かどうかは、
  1. まず連続であるか（左右の極限と $f(a)$ が一致するか）を調べ、
  2. 次に定義に従って左右の微分係数を求めて比べる。

  $\displaystyle\lim_{x\to a}f'(x)$ が存在しなくても $f'(a)$ は存在することがある（例: $x\neq 0$ で $x^2\sin\dfrac{1}{x}$、$x=0$ で $0$ とした関数）。微分可能性は導関数の極限ではなく **定義の式** で判定する。
prerequisites: [cl-derivative]
