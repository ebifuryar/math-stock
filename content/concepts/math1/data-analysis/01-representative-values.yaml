id: da-representative-values
kind: definition
title: 代表値（平均値・中央値・最頻値）
body: |
  データ全体の特徴を1つの数値で表したものを **代表値** という。

  - **平均値** $\bar{x}=\dfrac{x_1+x_2+\cdots+x_n}{n}$
  - **中央値**（メジアン）：値を小さい順に並べたとき中央にくる値。データの大きさ $n$ が偶数のときは、中央の2つの値の平均。
  - **最頻値**（モード）：最も個数の多い値。度数分布表では度数が最大の階級の階級値。

  平均値は極端な値（外れ値）の影響を受けやすく、中央値は受けにくい。どの代表値が適切かはデータの分布と目的によって決まる。
