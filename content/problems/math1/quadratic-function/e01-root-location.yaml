id: m1-qf-e01
level: exam
format: choice
title: 2つの正の解をもつ条件
stem: |
  $x$ の2次方程式 $x^2-2ax+a+6=0$ が異なる2つの正の解をもつような定数 $a$ の値の範囲として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $a<-2,\ 3<a$
    misconception: mc-root-location-insufficient
    rationale: |
      判別式の条件だけ。$a<-2$ では軸 $x=a$ が負になり、2解とも負になる。
  - id: "2"
    text: $-6<a<-2,\ 3<a$
    misconception: mc-root-location-insufficient
    rationale: |
      判別式と $f(0)>0$ だけで、軸の条件が抜けている。$-6<a<-2$ では2解とも負。
  - id: "3"
    text: $3\leqq a$
    misconception: mc-discriminant-equality
    rationale: |
      $a=3$ では $D=0$ で重解 $x=3$ となり、「異なる2つ」の解にならない。
  - id: "4"
    text: $3<a$
    rationale: |
      正解。判別式・軸・端点の3条件の共通部分。
answer: "4"
solution: |
  $f(x)=x^2-2ax+a+6$ とおく。$y=f(x)$ のグラフが $x$ 軸の正の部分と異なる2点で交わる条件は
  1. $\dfrac{D}{4}=a^2-a-6=(a+2)(a-3)>0$ より $a<-2,\ 3<a$
  2. 軸 $x=a>0$
  3. $f(0)=a+6>0$ より $a>-6$

  共通部分をとって $3<a$。
concepts: [qf-root-location, qf-discriminant]
misconceptions: [mc-root-location-insufficient, mc-discriminant-equality]
targetSeconds: 240
irt: { expectedCorrectRate: 0.4, discrimination: 1.4 }
author:
  intent: |
    解の配置の3条件を過不足なく立てられるかをみる。誤答①②は「どの条件を落としたか」に対応させており、選ばれた誤答から欠けた観点を診断できる。$a=3$ の扱い（③）で等号の理解も同時に測る。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学I (3) ア(イ) 2次方程式の解とグラフ]
  variations:
    - 「正の解と負の解を1つずつ」に変え、$f(0)<0$ だけで足りることに気づかせる。
    - 解と係数の関係（数学II）を使う解法との比較を問う。
