id: m3-lm-e02
level: exam
format: choice
title: 無理方程式の実数解の個数
stem: |
  $a$ を実数の定数とする。$x$ についての方程式
  $$\sqrt{2x+4}=x+a$$
  が異なる2つの実数解をもつような $a$ の値の範囲として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $a<\dfrac{5}{2}$
    misconception: mc-lm-irrational-equation
    rationale: |
      両辺を2乗した $x^2+(2a-2)x+a^2-4=0$ の判別式 $D>0$ だけで判断している。2乗によって $\sqrt{2x+4}=-(x+a)$ の解（無縁解）も含まれるため、$x+a\geqq 0$ を満たすかを確かめなければならない。たとえば $a=0$ では $x=1\pm\sqrt{5}$ のうち $x=1-\sqrt{5}$ は $x+a<0$ で不適となり、解は1個。
  - id: "2"
    text: $2<a<\dfrac{5}{2}$
    misconception: mc-lm-irrational-equation
    rationale: |
      直線が半放物線の端点 $(-2,\ 0)$ を通る $a=2$ を除いている。$a=2$ のとき、2乗した方程式は $x^2+2x=0$ で $x=0,\ -2$ となり、どちらも $x+2\geqq 0$ を満たすので、異なる2つの実数解をもつ。
  - id: "3"
    text: $2\leqq a\leqq\dfrac{5}{2}$
    rationale: |
      接する場合 $a=\dfrac{5}{2}$ を含めている。このとき2乗した方程式は $\left(x+\dfrac{3}{2}\right)^2=0$ で、実数解は $x=-\dfrac{3}{2}$ の1個（重解）だけである。
  - id: "4"
    text: $2\leqq a<\dfrac{5}{2}$
    rationale: |
      正解。半放物線 $y=\sqrt{2x+4}$ と直線 $y=x+a$ が異なる2点で交わるのは、直線が端点 $(-2,\ 0)$ を通るとき（$a=2$）から、接するとき（$a=\dfrac{5}{2}$）の手前まで。
answer: "4"
solution: |
  実数解は、半放物線 $y=\sqrt{2x+4}$（端点 $(-2,\ 0)$、上に凸で右へのびる）と、傾き $1$ の直線 $y=x+a$ の共有点の $x$ 座標である。

  **端点を通るとき**: $0=-2+a$ より $a=2$。

  **接するとき**: $2x+4=(x+a)^2$、すなわち $x^2+(2a-2)x+a^2-4=0$ の判別式について
  $$\frac{D}{4}=(a-1)^2-(a^2-4)=-2a+5=0\quad\text{より}\quad a=\frac{5}{2}$$
  このとき重解 $x=-(a-1)=-\dfrac{3}{2}$ で、$x+a=1>0$ なので実際に接する（接点 $\left(-\dfrac{3}{2},\ 1\right)$）。

  直線を下から上へ平行移動して共有点の個数を調べると

  | $a$ の範囲 | $a<2$ | $2\leqq a<\dfrac{5}{2}$ | $a=\dfrac{5}{2}$ | $a>\dfrac{5}{2}$ |
  | --- | --- | --- | --- | --- |
  | 実数解の個数 | 1 | 2 | 1 | 0 |

  よって **$2\leqq a<\dfrac{5}{2}$**。

  式だけで処理する場合は、$\sqrt{2x+4}=x+a\iff 2x+4=(x+a)^2\ \text{かつ}\ x+a\geqq 0$ として、2次方程式が $x\geqq -a$ に異なる2解をもつ条件（解の配置）を調べても同じ結果になる。
concepts: [lm-rational-irrational]
misconceptions: [mc-lm-irrational-equation]
targetSeconds: 420
irt: { expectedCorrectRate: 0.35, discrimination: 1.4 }
author:
  intent: |
    無理方程式を「2乗した2次方程式」に置き換える際の同値性の崩れ（無縁解）を意識し、グラフ（半放物線と直線）で解の個数を正確に数えられるかをみる。判別式だけで答える受験者は①、境界の扱いで迷う受験者は②（端点）や③（接点）を選ぶので、どの段階の理解不足かを分離できる。二次試験では解の配置による論証も求められるので、記述版への発展も想定している。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (1) ア(ウ) 分数関数と無理関数", "数学III (1) イ(イ) 分数関数と無理関数のグラフの考察"]
  variations:
    - 不等式 $\sqrt{2x+4}>x+a$ の解がちょうど長さ $3$ の区間になる $a$ を求めさせる。
    - 方程式 $\sqrt{2x+4}=ax$ の実数解の個数を、原点を通る直線の傾き $a$ で分類させる。
