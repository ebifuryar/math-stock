id: m3-lm-e04
level: exam
format: mark
title: 漸化式で定まる数列の極限（はさみうち）
stem: |
  数列 $\{a_n\}$ を
  $$a_1=2,\qquad a_{n+1}=\sqrt{4a_n-3}\quad(n=1,\ 2,\ 3,\ \cdots)$$
  で定める。

  (1) $\{a_n\}$ が $\alpha$ に収束すると仮定すると $\alpha=\sqrt{4\alpha-3}$ を満たすから、$\alpha$ の候補は $1$ と $3$ である。すべての自然数 $n$ について $a_n\geqq 2$ であること（数学的帰納法で示せる）を用いると、極限の候補は $\alpha=\boxed{\text{ア}}$ に限られる。

  (2) 
  $$a_{n+1}-3=\frac{\boxed{\text{イ}}\,(a_n-3)}{\sqrt{4a_n-3}+\boxed{\text{ウ}}}$$
  が成り立つ。

  (3) $a_n\geqq 2$ より $\sqrt{4a_n-3}\geqq\sqrt{5}>2$ であることを用いると
  $$|a_{n+1}-3|\leqq\frac{\boxed{\text{エ}}}{\boxed{\text{オ}}}\,|a_n-3|$$
  が成り立つ。

  (4) (3) を繰り返し用いると
  $$|a_n-3|\leqq\left(\frac{\boxed{\text{カ}}}{\boxed{\text{キ}}}\right)^{n-\boxed{\text{ク}}}|a_1-3|$$
  であり、はさみうちの原理により $\displaystyle\lim_{n\to\infty}a_n=\boxed{\text{ケ}}$ である。
blanks:
  - { label: ア, answer: "3" }
  - { label: イ, answer: "4" }
  - { label: ウ, answer: "3" }
  - { label: エ, answer: "4" }
  - { label: オ, answer: "5" }
  - { label: カ, answer: "4" }
  - { label: キ, answer: "5" }
  - { label: ク, answer: "1" }
  - { label: ケ, answer: "3" }
solution: |
  (1) $\alpha=\sqrt{4\alpha-3}$ を2乗すると $\alpha^2-4\alpha+3=0$ で $\alpha=1,\ 3$（どちらも $\alpha\geqq 0$ を満たす）。$a_n\geqq 2$ を帰納法で示す: $a_1=2$。$a_k\geqq 2$ なら $a_{k+1}=\sqrt{4a_k-3}\geqq\sqrt{5}>2$。極限は $2$ 以上なので $\alpha=3$。

  (2) 分子の有理化（$3=\sqrt{9}$ とみる）。
  $$a_{n+1}-3=\sqrt{4a_n-3}-3=\frac{(4a_n-3)-9}{\sqrt{4a_n-3}+3}=\frac{4(a_n-3)}{\sqrt{4a_n-3}+3}$$

  (3) 分母は $\sqrt{4a_n-3}+3>2+3=5$ なので
  $$|a_{n+1}-3|=\frac{4|a_n-3|}{\sqrt{4a_n-3}+3}\leqq\frac{4}{5}|a_n-3|$$
  分母を $\sqrt{4a_n-3}\geqq 0$ だけで評価すると係数は $\dfrac{4}{3}>1$ となり、極限の議論に使えない。$a_n\geqq 2$ が必要になるのはこのためである。

  (4) 
  $$0\leqq|a_n-3|\leqq\frac{4}{5}|a_{n-1}-3|\leqq\cdots\leqq\left(\frac{4}{5}\right)^{n-1}|a_1-3|=\left(\frac{4}{5}\right)^{n-1}$$
  $\left(\dfrac{4}{5}\right)^{n-1}\to 0$ なので、はさみうちの原理により $|a_n-3|\to 0$、すなわち $\displaystyle\lim_{n\to\infty}a_n=3$。
concepts: [lm-squeeze, lm-geometric-limit, sq-induction]
misconceptions: [mc-lm-indeterminate-form]
targetSeconds: 600
irt: { expectedCorrectRate: 0.35, discrimination: 1.4 }
author:
  intent: |
    一般項が求められない漸化式について、極限の候補を求め、$|a_{n+1}-\alpha|\leqq r|a_n-\alpha|$（$r<1$ の定数）を作ってはさみうちに持ち込む、二次試験の定番の流れを誘導付きで確認する。特性方程式の解が2つあり、どちらが極限かを数列の範囲で選ぶ必要がある点、分母を $0$ 以上としか評価しないと係数が $\dfrac{4}{3}$ となって失敗する点で、手順の意味まで理解しているかを識別する。(4) の指数 $n-1$ は、評価を何回繰り返すかの数え方をみる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (1) ア(ア) 数列の極限", "数学III (1) イ(ア) 極限を求める方法の考察", "数学B (1) ア(ウ) 漸化式と数学的帰納法"]
  variations:
    - $a_1=2$ を $a_1=4$ に変え、$a_n>3$ で減少しながら $3$ に近づく場合を扱う（このときは $\sqrt{4a_n-3}>3$ からより強い評価 $\dfrac{2}{3}$ が得られる）。
    - 誘導を外し、「$\{a_n\}$ の極限を求めよ」だけの記述式にして、$a_n\geqq 2$ の証明から書かせる。
