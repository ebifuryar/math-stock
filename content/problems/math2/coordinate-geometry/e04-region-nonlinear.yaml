author:
  intent: |
    同じ領域で、目的関数の種類（1次式・距離の2乗・傾き）に応じて最大・最小の候補が変わることを理解しているかをみる。(2) の最小は頂点でなく辺上の点 $(2,\ 1)$ でとるよう設計し、頂点だけ調べると最小値を $25$ と誤る。(3) は式を図形の量（傾き）として読み替える発想を問う。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学II (2) ア(エ) 不等式の表す領域, 数学II (2) イ(イ) 領域を用いた最大・最小]
  variations:
    - $(x-6)^2+(y+6)^2$ の最小値を問い、垂線の足が辺の外に出て頂点 $(4,\ -3)$ で最小（値 $13$）となる場合と比較させる。
    - $y-ax$ の最大値を与える点が $(0,\ 5)$ となる $a$ の範囲を求めさせる。
