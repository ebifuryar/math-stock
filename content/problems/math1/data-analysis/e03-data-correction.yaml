id: m1-da-e03
level: exam
format: mark
title: データの修正による分散の変化
stem: |
  20人の生徒のテストの得点について、平均値は $60$、分散は $27$ と計算されていた。その後、2人分の得点を記録し誤っていたことがわかった。正しくは、$52$ 点と記録されていた生徒が $62$ 点、$68$ 点と記録されていた生徒が $58$ 点であった。

  修正後の20人の平均値は $\boxed{\text{アイ}}$ で、分散は $\boxed{\text{ウエ}}$ である。

  さらに、欠席していた1人が同じテストを受け、$81$ 点であった。この1人を加えた21人の平均値は $\boxed{\text{オカ}}$、分散は $\boxed{\text{キク}}$ である。
blanks:
  - { label: アイ, answer: "60" }
  - { label: ウエ, answer: "21" }
  - { label: オカ, answer: "61" }
  - { label: キク, answer: "40" }
solution: |
  **修正**：$52+68=120$、$62+58=120$ で合計は変わらないので、平均値は $60$ のまま。

  偏差の2乗の和は $20\times 27=540$。誤っていた2人の分（平均 $60$ からの偏差）は $(-8)^2+8^2=128$、正しい値では $2^2+(-2)^2=8$ なので

  $$540-128+8=420,\qquad s^2=\frac{420}{20}=21$$

  **追加**：合計は $20\times 60+81=1281$ なので平均値は $\dfrac{1281}{21}=61$。

  2乗の合計は $20(21+60^2)+81^2=20\times 3621+6561=72420+6561=78981$ だから

  $$s^2=\frac{78981}{21}-61^2=3761-3721=40$$

  （別解）平均が $60$ から $61$ に $1$ ずれるので、もとの20人の偏差の2乗の和は $420+20\times 1^2=440$ になり、追加した生徒の分 $(81-61)^2=400$ を加えて $\dfrac{840}{21}=40$。
concepts: [da-variance-formula, da-variance]
misconceptions: [mc-da-variance-as-mean]
targetSeconds: 480
irt: { expectedCorrectRate: 0.25, discrimination: 1.4 }
author:
  intent: |
    「平均が変わらない修正でも分散は変わる」「平均が変わる追加では全員の偏差が変わる」という2つの山を1問で越えさせる。前半は合計が変わらないよう $52,68\to 62,58$ と設計したので、平均値だけ見て「何も変わらない」と判断した受験者は分散で止まる。後半は追加値 $81$ を選んで平均が整数 $61$、分散が整数 $40$ になるようにした。平均のずれを無視すると $\dfrac{420+(81-60)^2}{21}=41$ となり、$40$ との差 $1$ がちょうど平均のずれの効果 $20\times 1^2$ にあたる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (4) ア(ア) 分散・標準偏差, 数学I (4) イ(ア) データの分析における問題解決]
  variations:
    - 誤記録の修正で合計も変わる場合（例：$52\to 72$ のみ）にして、平均と分散の両方を変化させる。
    - 追加した生徒の得点を文字 $a$ として、21人の分散が最小になる $a$ を求めさせる。
