id: m1-tg-a05
level: applied
format: written
title: 120°の角の二等分線の長さ
stem: |
  $\triangle\mathrm{ABC}$ において、$\mathrm{AB}=3,\ \mathrm{AC}=6,\ \angle\mathrm{BAC}=120^\circ$ とする。$\angle\mathrm{BAC}$ の二等分線と辺 $\mathrm{BC}$ の交点を $\mathrm{D}$ とする。

  (1) 辺 $\mathrm{BC}$ の長さを求めよ。

  (2) 線分 $\mathrm{AD}$ の長さを求めよ。

  (3) 線分 $\mathrm{BD}$ の長さを求めよ。
modelAnswer: |
  (1) 余弦定理より
  $$\mathrm{BC}^2=3^2+6^2-2\cdot 3\cdot 6\cos 120^\circ=9+36+18=63$$
  $\mathrm{BC}>0$ より $\mathrm{BC}=3\sqrt{7}$。

  (2) $\mathrm{AD}$ は $\angle\mathrm{BAC}$ を二等分するので $\angle\mathrm{BAD}=\angle\mathrm{CAD}=60^\circ$。$\mathrm{AD}=x$ とおくと、$\triangle\mathrm{ABC}=\triangle\mathrm{ABD}+\triangle\mathrm{ACD}$ より
  $$\frac{1}{2}\cdot 3\cdot 6\sin 120^\circ=\frac{1}{2}\cdot 3\cdot x\sin 60^\circ+\frac{1}{2}\cdot 6\cdot x\sin 60^\circ$$
  $\sin 120^\circ=\sin 60^\circ=\dfrac{\sqrt{3}}{2}$ であるから、両辺を $\dfrac{\sqrt{3}}{4}$ で割って $18=9x$。よって $\mathrm{AD}=2$。

  (3) $\triangle\mathrm{ABD}$ において、$\mathrm{AB}=3,\ \mathrm{AD}=2,\ \angle\mathrm{BAD}=60^\circ$ であるから、余弦定理より
  $$\mathrm{BD}^2=3^2+2^2-2\cdot 3\cdot 2\cos 60^\circ=9+4-6=7$$
  $\mathrm{BD}>0$ より $\mathrm{BD}=\sqrt{7}$。

  （検算: $\mathrm{BD}:\mathrm{DC}=\mathrm{AB}:\mathrm{AC}=1:2$ より $\mathrm{BD}=\dfrac{1}{3}\cdot 3\sqrt{7}=\sqrt{7}$ と一致する。）

  **答え: (1) $3\sqrt{7}$ (2) $2$ (3) $\sqrt{7}$**
rubric:
  - id: r1
    criterion: 余弦定理で $\cos 120^\circ=-\dfrac{1}{2}$ を正しく用い、$\mathrm{BC}=3\sqrt{7}$ を求めている
    points: 2
    keywords: ["63", "3√7"]
  - id: r2
    criterion: $\triangle\mathrm{ABC}=\triangle\mathrm{ABD}+\triangle\mathrm{ACD}$ という面積の関係を、$60^\circ$ の角を用いた式として立てている
    points: 3
    keywords: ["面積", "sin60"]
  - id: r3
    criterion: 方程式を解いて $\mathrm{AD}=2$ を得ている
    points: 2
    keywords: ["AD=2"]
  - id: r4
    criterion: $\triangle\mathrm{ABD}$ での余弦定理、または $\mathrm{BD}:\mathrm{DC}=\mathrm{AB}:\mathrm{AC}$ と (1) の結果から、根拠を示して $\mathrm{BD}=\sqrt{7}$ を求めている
    points: 3
    keywords: ["BD=√7", "1:2"]
solution: |
  角の二等分線の長さは、三角形を二等分線で2つに分けて **面積の和** で方程式を立てるのが定石。$\angle A=120^\circ$ なので半分の角が $60^\circ$ になり、$\sin 120^\circ=\sin 60^\circ$ がそろって計算が簡単になる。$\mathrm{AD}$ が分かれば $\triangle\mathrm{ABD}$ は「2辺と間の角」が分かった三角形になる。
concepts: [tg-law-of-cosines, tg-area, tg-identities]
misconceptions: [mc-tg-cosine-sign, mc-tg-area-angle]
targetSeconds: 480
irt: { expectedCorrectRate: 0.45, discrimination: 1.2 }
author:
  intent: |
    角の二等分線の長さを「面積の分割」という図形的な見方で式にできるかをみる。余弦定理だけで攻めようとすると $\mathrm{BD}$ を先に求める必要があり（角の二等分線の性質＝数学Aの知識が要る）、面積で考えれば数学Iの範囲で直接 $\mathrm{AD}$ が出る。記述式にして、どの三角形に何の定理を適用したかを明示できるかを評価する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (2) ア(ウ) 余弦定理, 数学I (2) イ(イ) 図形の計量（三角形の面積）]
  variations:
    - $\mathrm{AB}=b,\ \mathrm{AC}=c$ として $\mathrm{AD}=\dfrac{bc}{b+c}$ を導かせる（$\angle A=120^\circ$ の一般化）。
    - $\angle\mathrm{BAC}=60^\circ$ に変え、$\sin 30^\circ$ を用いる形にする。
