id: m2-cl-e05
level: exam
format: written
title: 3次方程式が異なる3つの実数解をもつ条件
stem: |
  $a$ を実数の定数とする。$x$ の3次方程式
  $$x^3-3ax+2=0$$
  が異なる3つの実数解をもつような $a$ の値の範囲を求めよ。また、そのとき正の解はいくつあるか答えよ。
modelAnswer: |
  $f(x)=x^3-3ax+2$ とおく。方程式が異なる3つの実数解をもつ $\iff$ $y=f(x)$ のグラフが $x$ 軸と異なる3点で交わる $\iff$ $f(x)$ が極大値と極小値をもち、（極大値）$\times$（極小値）$<0$。

  $f'(x)=3x^2-3a$。

  $a\leqq 0$ のとき $f'(x)\geqq 0$ で $f(x)$ は増加するので、実数解は1個のみ。

  $a>0$ のとき $f'(x)=3(x+\sqrt{a})(x-\sqrt{a})$ で、$x=-\sqrt{a}$ で極大、$x=\sqrt{a}$ で極小となる。
  $$f(-\sqrt{a})=-a\sqrt{a}+3a\sqrt{a}+2=2+2a\sqrt{a},\qquad f(\sqrt{a})=2-2a\sqrt{a}$$
  極大値 $2+2a\sqrt{a}>0$ は常に成り立つので、条件は極小値 $2-2a\sqrt{a}<0$、すなわち $a\sqrt{a}=(\sqrt{a})^3>1$。よって $\sqrt{a}>1$、すなわち $a>1$。

  したがって求める範囲は **$a>1$**。

  このとき $f(0)=2>0$ であり、$f(-\sqrt{a})>0,\ f(\sqrt{a})<0$、また $x\to-\infty$ で $f(x)\to-\infty$、$x\to\infty$ で $f(x)\to\infty$ である。中間値の考え（グラフが連続であること）により、3つの解は
  $$x<-\sqrt{a},\qquad 0<x<\sqrt{a},\qquad \sqrt{a}<x$$
  の範囲に1つずつある（$-\sqrt{a}<x<0$ では $f(x)$ は減少しながら $f(0)=2>0$ より大きいので解はない）。

  よって **正の解は2個**（負の解は1個）。
rubric:
  - id: r1
    criterion: 異なる3つの実数解をもつ条件を「極値をもち、極大値と極小値が異符号」と正しく言い換えている
    points: 2
    keywords: ["極大値", "極小値", "<0"]
  - id: r2
    criterion: $a\leqq 0$ では極値をもたず条件を満たさないことを、$a=0$ の場合も含めて示している（$a\geqq 0$ や $D\geqq 0$ としていない）
    points: 2
    keywords: ["a>0", "増加"]
  - id: r3
    criterion: 極値 $f(\pm\sqrt{a})=2\pm 2a\sqrt{a}$ を正しく計算している
    points: 2
    keywords: ["2+2a√a", "2-2a√a"]
  - id: r4
    criterion: 極小値 $<0$ から $a>1$ を導いている
    points: 2
    keywords: ["a>1"]
  - id: r5
    criterion: $f(0)=2>0$ などを根拠に、3つの解の位置を示して正の解が2個であると結論している
    points: 2
    keywords: ["f(0)=2", "2個"]
solution: |
  文字 $a$ が $x$ の1次の項に付いているので、定数分離よりも「3次関数の極値の積 $<0$」で処理するほうが整式の範囲で完結する。$a\leqq 0$ では単調増加で解は1個。$a>0$ では極大値 $2+2a\sqrt{a}$ が常に正なので、極小値 $2-2a\sqrt{a}<0$ から $a>1$。正の解の個数は $f(0)=2>0$ を手がかりに、解が $(-\infty,-\sqrt{a}),\ (0,\sqrt{a}),\ (\sqrt{a},\infty)$ に1つずつあることから2個。
