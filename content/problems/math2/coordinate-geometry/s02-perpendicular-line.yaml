id: m2-cg-s02
level: school
format: choice
title: 垂直な直線の方程式
stem: |
  点 $(2,\ -1)$ を通り、直線 $2x-3y+1=0$ に垂直な直線の方程式として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $2x-3y-7=0$
    misconception: mc-cg-perpendicular-slope
    rationale: |
      傾きが $\dfrac{2}{3}$ で、与えられた直線と **平行** な直線になっている。垂直なら傾きの積が $-1$。
  - id: "2"
    text: $3x-2y-8=0$
    misconception: mc-cg-perpendicular-slope
    rationale: |
      傾きを逆数 $\dfrac{3}{2}$ にしただけで、符号を変えていない（$m_1m_2=1$ としている）。
  - id: "3"
    text: $3x+2y-4=0$
    rationale: |
      正解。傾き $-\dfrac{3}{2}$ で点 $(2,\ -1)$ を通る。
  - id: "4"
    text: $2x+3y-1=0$
    misconception: mc-cg-perpendicular-slope
    rationale: |
      傾きの符号だけを変えて $-\dfrac{2}{3}$ にしている。垂直な直線の傾きは「逆数にして符号を変える」。
answer: "3"
solution: |
  $2x-3y+1=0$ は $y=\dfrac{2}{3}x+\dfrac{1}{3}$ で、傾きは $\dfrac{2}{3}$。これに垂直な直線の傾き $m$ は $\dfrac{2}{3}m=-1$ より $m=-\dfrac{3}{2}$。
  $$y+1=-\frac{3}{2}(x-2)\quad\Longrightarrow\quad 3x+2y-4=0$$
  （別解）一般形で $a_1a_2+b_1b_2=0$ を使うと、$2x-3y+1=0$ に垂直な直線は $3x+2y+c=0$ と書ける。$(2,\ -1)$ を代入して $c=-4$。
concepts: [cg-line-equation]
misconceptions: [mc-cg-perpendicular-slope]
targetSeconds: 90
irt: { expectedCorrectRate: 0.75, discrimination: 1.0 }
author:
  intent: |
    垂直条件 $m_1m_2=-1$ を正しく適用できるかをみる。誤答3つはすべて与えられた点を通る直線にしてあり、「点を通るか」の検算では排除できず、傾きの条件そのものを理解していないと選んでしまうように設計している。平行と垂直の混同（①）、逆数だけ（②）、符号だけ（④）を分離して診断できる。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学II (2) ア(イ) 直線の方程式・2直線の平行と垂直]
  variations:
    - 2直線 $ax+2y=1$ と $x+(a+1)y=3$ が垂直・平行になる $a$ の値をそれぞれ求めさせる。
    - 線分の垂直二等分線の方程式を求めさせる。
