id: cl-derivative
kind: definition
title: 平均変化率・微分係数・導関数
body: |
  関数 $f(x)$ で、$x$ が $a$ から $a+h$ まで変化するときの **平均変化率** は
  $$\frac{f(a+h)-f(a)}{h}$$
  で、これは2点 $(a,\ f(a)),\ (a+h,\ f(a+h))$ を結ぶ直線の傾きである。$h$ を含む式であることに注意する。

  $h\to 0$ のときの極限値を $x=a$ における **微分係数** といい、$f'(a)$ で表す。
  $$f'(a)=\lim_{h\to 0}\frac{f(a+h)-f(a)}{h}$$
  これは曲線 $y=f(x)$ の点 $(a,\ f(a))$ における接線の傾きである。

  各 $x$ に $f'(x)$ を対応させた関数が **導関数** で、整式については次が成り立つ（$n$ は自然数、$k,\ l$ は定数）。

  | 関数 | 導関数 |
  | --- | --- |
  | $x^n$ | $nx^{n-1}$ |
  | 定数 $c$ | $0$ |
  | $kf(x)+lg(x)$ | $kf'(x)+lg'(x)$ |
prerequisites: []
