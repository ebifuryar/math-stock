id: m2-cl-a05
level: applied
format: written
title: 3次方程式の実数解の個数（定数分離）
stem: |
  $a$ を定数とする。$x$ の方程式
  $$x^3-3x^2-9x-a=0$$
  の異なる実数解の個数を、$a$ の値によって分類して答えよ。
modelAnswer: |
  方程式は $x^3-3x^2-9x=a$ と変形できる。$g(x)=x^3-3x^2-9x$ とおくと、異なる実数解の個数は、曲線 $y=g(x)$ と直線 $y=a$ の共有点の個数に等しい。

  $g'(x)=3x^2-6x-9=3(x+1)(x-3)$

  | $x$ | $\cdots$ | $-1$ | $\cdots$ | $3$ | $\cdots$ |
  | --- | --- | --- | --- | --- | --- |
  | $g'(x)$ | $+$ | $0$ | $-$ | $0$ | $+$ |
  | $g(x)$ | $\nearrow$ | $5$ | $\searrow$ | $-27$ | $\nearrow$ |

  $g(-1)=-1-3+9=5$（極大値）、$g(3)=27-27-27=-27$（極小値）。また $x\to\pm\infty$ で $g(x)\to\pm\infty$。

  よって $y=g(x)$ のグラフは、左下から上って点 $(-1,\ 5)$ で極大となり、下って点 $(3,\ -27)$ で極小となったあと、右上へ上がる。直線 $y=a$ を上下に動かして共有点を数えると

  - $a<-27,\ 5<a$ のとき **1個**
  - $a=-27,\ 5$ のとき **2個**
  - $-27<a<5$ のとき **3個**
rubric:
  - id: r1
    criterion: 定数 $a$ を分離し、曲線 $y=g(x)$ と直線 $y=a$ の共有点の個数に言い換えている
    points: 2
    keywords: ["y=a", "共有点"]
  - id: r2
    criterion: $g'(x)=3(x+1)(x-3)$ から増減表を正しく作っている
    points: 3
    keywords: ["3(x+1)(x-3)", "増減表"]
  - id: r3
    criterion: 極大値 $5$、極小値 $-27$ を正しく求めている
    points: 2
    keywords: ["5", "-27"]
  - id: r4
    criterion: $a<-27,\ 5<a$ で1個、$a=-27,\ 5$ で2個、$-27<a<5$ で3個と、境界を含めて漏れなく分類している
    points: 3
    keywords: ["1個", "2個", "3個"]
solution: |
  $a$ を右辺に分離すると、$y=x^3-3x^2-9x$ のグラフと水平な直線 $y=a$ の共有点の個数を数える問題になる。極大値 $5$・極小値 $-27$ の高さで個数が変わり、ちょうどその高さでは直線がグラフに接するので2個になる。
concepts: [cl-equation-inequality, cl-extremum]
misconceptions: []
targetSeconds: 480
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    定数分離によって、方程式の解の個数をグラフと直線の共有点の個数に言い換えられるかをみる。境界 $a=5,\ -27$ で個数が2個になる（接する）ことを明記できるかが、上位層と中位層を分ける。$a$ を含んだまま $f(x)=x^3-3x^2-9x-a$ の極値の符号で論じる答案も正当であり、同じ基準で採点できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学II (5) イ(ア) 導関数を用いた関数の考察（方程式の実数解の個数）"]
  variations:
    - 「異なる2つの正の解と1つの負の解をもつ」条件を問い、$y$ 軸との交点 $g(0)=0$ の位置も考えさせる。
    - 区間 $0\leqq x\leqq 4$ における実数解の個数に変え、端点の値 $g(0)=0,\ g(4)=-20$ も境界に加える。
