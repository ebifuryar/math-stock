id: sp-proof-contradiction
kind: method
title: 背理法
body: |
  命題が成り立たないと **仮定** して矛盾を導き、それによって命題が成り立つと結論する証明法を **背理法** という。

  例: $\sqrt{2}$ が無理数であることの証明
  1. $\sqrt{2}$ が有理数であると仮定し、$\sqrt{2}=\dfrac{m}{n}$（$m,\ n$ は互いに素な自然数）とおく。
  2. $m^2=2n^2$ より $m^2$ は偶数なので $m$ は偶数。$m=2k$ とおくと $n^2=2k^2$ より $n$ も偶数。
  3. $m,\ n$ がともに偶数となり、互いに素であることに矛盾する。よって $\sqrt{2}$ は無理数。

  **注意点**
  - 仮定するのは結論の **正確な否定**（「無理数である」の否定は「有理数である」、「少なくとも一方」の否定は「どちらも〜でない」）。
  - 矛盾は「仮定した事実」や「既に知られた事実」と衝突することで示す。何と何が矛盾するかを答案に明記する。
  - $\sqrt{2}$ が無理数であることを用いると、有理数 $a,\ b$ について $a+b\sqrt{2}=0\Longrightarrow a=b=0$ が示せる（$b\neq 0$ と仮定すると $\sqrt{2}=-\dfrac{a}{b}$ が有理数となり矛盾）。
prerequisites: [sp-negation, sp-proposition-truth]
