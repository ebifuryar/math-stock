id: m3-df-e03
level: exam
format: mark
title: 減衰振動の極大値の列とその和
stem: |
  $x\geqq 0$ で定義された関数 $f(x)=e^{-x}\sin x$ について考える。

  (1) 導関数は
  $$f'(x)=-\sqrt{\boxed{\text{ア}}}\,e^{-x}\sin\left(x-\frac{\pi}{\boxed{\text{イ}}}\right)$$
  と表される。

  (2) $f(x)$ が極大となる $x$ の値を小さい順に $x_1,\ x_2,\ x_3,\ \ldots$ とすると
  $$x_n=\frac{(\boxed{\text{ウ}}\,n-\boxed{\text{エ}})\pi}{\boxed{\text{オ}}}$$
  である。また、極大値 $a_n=f(x_n)$ について $\dfrac{a_{n+1}}{a_n}=e^{-\boxed{\text{カ}}\pi}$ が成り立つ。

  (3) 極大値の総和は
  $$\sum_{n=1}^{\infty}a_n=\frac{\sqrt{\boxed{\text{キ}}}\,e^{\frac{\boxed{\text{ク}}}{\boxed{\text{ケ}}}\pi}}{\boxed{\text{コ}}\left(e^{2\pi}-1\right)}$$
  である。
blanks:
