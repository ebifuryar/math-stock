id: mb-st-e04
level: exam
format: mark
title: 硬貨による数直線上の移動と正規近似・検定
stem: |
  数直線上の原点に点 $Q$ がある。1枚の硬貨を投げ、表が出たら $Q$ を正の向きに $2$ だけ、裏が出たら負の向きに $1$ だけ移動させる。これを $n$ 回繰り返したときの $Q$ の座標を $S$、表の出た回数を $X$ とする。硬貨の表が出る確率は $\dfrac{1}{2}$ で、各回の結果は独立であるとする。

  以下では、$Z$ を標準正規分布に従う確率変数とし、$p(z_0)=P(0\leqq Z\leqq z_0)$ の値は次の表のとおりとする。また、$n=100$ は十分大きいとみなして二項分布を正規分布で近似してよい。

  | $z_0$ | $1.00$ | $1.50$ | $1.80$ | $1.96$ | $2.00$ | $2.50$ |
  | --- | --- | --- | --- | --- | --- | --- |
  | $p(z_0)$ | $0.3413$ | $0.4332$ | $0.4641$ | $0.4750$ | $0.4772$ | $0.4938$ |

  (1) $n=100$ とする。$S$ を $X$ で表すと $S=3X-100$ であるから、$E(S)=\boxed{\text{アイ}}$、$\sigma(S)=\boxed{\text{ウエ}}$ である。

  (2) $n=100$ のとき、$P(S\geqq 80)$ の近似値は $0.\boxed{\text{オカキク}}$、$P(35\leqq S\leqq 80)$ の近似値は $0.\boxed{\text{ケコサシ}}$ である。

  (3) ある硬貨を用いて $n=100$ として実験したところ、$S=20$ となった。この硬貨について、「表が出る確率は $\dfrac{1}{2}$ である」を帰無仮説、「表が出る確率は $\dfrac{1}{2}$ ではない」を対立仮説として、有意水準 $5\%$ で両側検定を行う。

  帰無仮説のもとで $S$ を標準化した値は $\boxed{\text{スセ}}$ であり、$\boxed{\text{ソ}}$。

  $\boxed{\text{ソ}}$ に当てはまるものを、次の $0$ 〜 $3$ のうちから一つ選べ。

  $0$：帰無仮説は棄却され、表が出る確率は $\dfrac{1}{2}$ ではないと判断できる

  $1$：帰無仮説は棄却され、表が出る確率は $\dfrac{1}{2}$ より大きいと判断できる

  $2$：帰無仮説は棄却されず、表が出る確率は $\dfrac{1}{2}$ であると判断できる

  $3$：帰無仮説は棄却されず、表が出る確率が $\dfrac{1}{2}$ ではないとは判断できない

  さらに、$n=100$ の実験で得られる可能性のある $S$ の値のうち、この両側検定で帰無仮説が **棄却されない** ものは全部で $\boxed{\text{タチ}}$ 個ある。
blanks:
  - { label: アイ, answer: "50" }
  - { label: ウエ, answer: "15" }
  - { label: オカキク, answer: "0228" }
  - { label: ケコサシ, answer: "8185" }
  - { label: スセ, answer: "-2" }
  - { label: ソ, answer: "0" }
  - { label: タチ, answer: "19" }
solution: |
  (1) 表 $X$ 回・裏 $100-X$ 回なので $S=2X-(100-X)=3X-100$。$X$ は $B\left(100,\ \dfrac{1}{2}\right)$ に従い $E(X)=50$、$V(X)=25$。
  $$E(S)=3\cdot 50-100=50,\qquad V(S)=3^2\cdot 25=225,\qquad \sigma(S)=15$$

  (2) $S$ は近似的に $N(50,\ 15^2)$ に従い、$Z=\dfrac{S-50}{15}$ とおく。

  - $P(S\geqq 80)=P(Z\geqq 2)=0.5-0.4772=0.0228$
  - $P(35\leqq S\leqq 80)=P(-1\leqq Z\leqq 2)=0.3413+0.4772=0.8185$

  (3) $\dfrac{20-50}{15}=-2$。$|-2|\geqq 1.96$ で棄却域に入るので帰無仮説は棄却され、表が出る確率は $\dfrac{1}{2}$ ではないと判断できる（ソ $=0$）。両側検定なので結論は「$\dfrac{1}{2}$ ではない」であり、「大きい」（$1$）とは言えない（実際 $S=20<50$ は表が少ない側）。

  棄却されないのは $\left|\dfrac{S-50}{15}\right|<1.96$、すなわち $20.6<S<79.4$ のとき。$S=3X-100$ で $X$ は整数なので、$20.6<3X-100<79.4$ より $40.2<X<59.8$、$X=41,\ 42,\ \cdots,\ 59$ の $19$ 個。$S$ の値は $23,\ 26,\ \cdots,\ 77$ の $19$ 個である。
