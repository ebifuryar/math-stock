id: ma-it-e01
level: exam
format: choice
title: 積の形に変形して整数解を数える
stem: |
  等式
  $$\frac{1}{x}+\frac{1}{y}=\frac{1}{6}$$
  を満たす整数の組 $(x,\ y)$ の個数として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $7$ 個
    misconception: mc-it-divisor-count-exponent
    rationale: |
      負の約数まで考え、$x=0$ になる組を除く方針は正しいが、$36=2^2\cdot 3^2$ の正の約数の個数を指数の積 $2\cdot 2=4$ としている。正しくは $(2+1)(2+1)=9$ 個。
  - id: "2"
    text: $9$ 個
    rationale: |
      $(x-6)(y-6)=36$ の正の約数の組だけを数えている（正の整数解の個数）。問題は「整数の組」なので、$x-6,\ y-6$ がともに負の場合も調べる必要がある。例えば $(x,y)=(3,-6)$ も解。
  - id: "3"
    text: $18$ 個
    rationale: |
      負の約数の組まで数えたが、$x-6=-6,\ y-6=-6$ すなわち $(x,y)=(0,0)$ を除いていない。$x=0$ では $\dfrac{1}{x}$ が定義されない。
  - id: "4"
    text: $17$ 個
    rationale: |
      正解。$(x-6)(y-6)=36$ を満たす整数の組は、$36$ の正の約数 $9$ 個と負の約数 $9$ 個に対応して $18$ 組。このうち $(x,y)=(0,0)$ は不適なので $17$ 組。
answer: "4"
solution: |
  $x\neq 0,\ y\neq 0$ のもとで両辺に $6xy$ を掛けると $6y+6x=xy$、すなわち
  $$xy-6x-6y=0\iff (x-6)(y-6)=36$$
  $x-6$ は $36$ の約数（正負を含む）で、$36=2^2\cdot 3^2$ の正の約数は $(2+1)(2+1)=9$ 個なので、整数の約数は $18$ 個。$x-6=d$ に対して $y-6=\dfrac{36}{d}$ と1組ずつ定まる。

  ただし $d=-6$ のとき $(x,y)=(0,0)$ となり不適。それ以外では $x,\ y$ はともに $0$ にならない（$x=0$ となるのは $d=-6$ のみ、$y=0$ も同様）。

  よって $18-1=$ **$17$ 個**。
concepts: [it-integer-solutions, it-prime-factorization]
misconceptions: [mc-it-divisor-count-exponent]
targetSeconds: 300
irt: { expectedCorrectRate: 0.3, discrimination: 1.4 }
author:
  intent: |
    分数式の不定方程式を積の形 $(x-6)(y-6)=36$ に直す定石と、そのあとで (a) 負の約数を考えるか (b) 変形前の条件 $x\neq 0$ に戻って除外できるか、の2段階を識別する。「正の整数」と書かない設定にしたことで、②（正の解だけ）と③（除外忘れ）が典型的な取りこぼしとして分離される。①は約数の個数の公式の誤りを同時に検出する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学A (3) ア(ア) 整数の性質（整数解の絞り込み・約数の個数）]
  variations:
    - 「正の整数 $x,\ y$ で $x\leqq y$」に変え、$\dfrac{1}{x}+\dfrac{1}{y}=\dfrac{1}{12}$ の解の個数（$8$ 個）を問う。
    - '正の整数 $x,\ y$ で $\dfrac{1}{x}+\dfrac{2}{y}=\dfrac{1}{4}$（$(x-4)(y-8)=32$、解は6組）とし、負の約数の組が不適になる理由を不等式で説明させる。'
