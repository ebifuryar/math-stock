author:
  intent: |
    群数列で「群の番号」「群の中での位置」「もとの数列での番号」「項の値」の4つを正確に行き来できるかをみる。分母 $m$ が第 $m-1$ 群になるずれ（(1) で $\dfrac{20\cdot 21}{2}$ や $\dfrac{19\cdot 20}{2}$ を使うと $217$ や $197$ になる）、第 $1000$ 項の値を約分すること（(2)）、群ごとの和が $\dfrac{j}{2}$ になる構造の利用（(3)）を段階的に問う。(3) では $i=14$ でちょうど $100$ になるように設計してあり、「超える」と「以上」の区別まで確認できているかで最上位層を識別する（$204$ と答えた受験者は等号の扱いを誤っている）。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (1) ア(イ) いろいろな数列（群数列）", "数学B (1) イ(ア) 数列の考えを事象の考察に活用する"]
  variations:
    - 既約分数だけを並べる（オイラー関数が現れ、群の項数が規則的でなくなる）と難しくなることを観察させる。
    - 第 $n$ 群の和が $\dfrac{n}{2}$ であることを使い、初項から第 $\dfrac{n(n+1)}{2}$ 項までの和を $n$ で表させる。
