id: pr-expected-value
kind: definition
title: 期待値
body: |
  ある試行の結果によって値が定まる変量 $X$ が、値 $x_1,\ x_2,\ \cdots,\ x_n$ をそれぞれ確率 $p_1,\ p_2,\ \cdots,\ p_n$ でとるとき
  $$E=x_1p_1+x_2p_2+\cdots+x_np_n\qquad(p_1+p_2+\cdots+p_n=1)$$
  を $X$ の **期待値** という。

  手順は (1) $X$ のとりうる値を **もれなく** 書き出す、(2) それぞれの確率を求める、(3) 確率の和が $1$ になることを確かめる、(4) 積の和をとる。確率の和が $1$ にならなければ、値の取りこぼしか確率の計算ミスがある。

  $X$ の値が $0$ の場合は期待値の計算には寄与しないが、確率の和の確認には含める。
prerequisites: [pr-probability-basics]
