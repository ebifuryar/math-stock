id: el-substitution
kind: method
title: 置き換えによる方程式・不等式・最大最小
body: |
  $4^x=(2^x)^2$、$(\log_2 x)^2$ のように同じ形が繰り返し現れるときは、$t=2^x$ や $t=\log_2 x$ と置き換えて $t$ の2次式に直す。

  **置き換えた文字の範囲を必ず求める。**
  - $t=a^x$ なら $t>0$（$x$ に範囲があれば、増減を見て $t$ の範囲を決める）。
  - $t=a^x+a^{-x}$ なら相加平均・相乗平均の関係から $t\geqq 2$（等号は $x=0$）。
  - $t=\log_a x$ は $x$ の範囲に応じて決まる（$x>0$ 全体なら $t$ は実数全体）。

  $t$ の範囲で2次方程式・2次不等式・2次関数の最大最小を処理し、最後に $x$ に戻す。$t>0$ に1つの $x$ が対応するので、方程式の実数解の個数は「範囲内にある $t$ の個数」と一致する。
prerequisites: [el-exp-function, qf-vertex-form, qf-max-min]
