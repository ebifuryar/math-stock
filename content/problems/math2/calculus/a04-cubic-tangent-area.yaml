author:
  intent: |
    共通テスト「3次関数のグラフと接線・面積」型の誘導問題。(1) で接点を $t$ とおいた接線の一般形を作らせ、(2) で「点 $\mathrm{P}$ における接線」と「$\mathrm{P}$ を通る接線」の違いに気づけるかをみる。「$\mathrm{P}$ を通る接線は $\mathrm{P}$ における接線だけ」と考える受験者はキ以降に進めない。$t$ の3次方程式で $t=2$ が重解になる理由（接点の重複）を理解していれば因数分解が速い。(3) は3次関数と接線で囲まれた面積で、1/6 公式を誤用すると $\dfrac{9}{2}$ となり識別できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学II (5) ア(ア) 微分係数と導関数（接線の方程式）", "数学II (5) イ(イ) 定積分を用いた面積"]
  variations:
    - 点 $(2,\ b)$ を通る接線が3本引ける $b$ の範囲を問う（入試型、定数分離に帰着）。
    - $\mathrm{P}$ における接線 $y=9x-16$ と $C$ で囲まれた部分の面積（$\dfrac{1}{12}\cdot 6^4=108$）を問う。
