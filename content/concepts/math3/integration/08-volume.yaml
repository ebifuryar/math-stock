id: ig-volume
kind: formula
title: 立体の体積と回転体
body: |
  **断面積から求める体積**: $x$ 軸に垂直な平面 $x=t$ による断面積が $S(t)$ のとき
  $$V=\int_a^b S(t)\,dt$$
  どの軸に垂直に切るかは自由に選べる。切り方を変えても体積は変わらない（検算に使える）。

  **$x$ 軸のまわりの回転体**: 断面は半径 $|f(x)|$ の円なので
  $$V=\pi\int_a^b\{f(x)\}^2\,dx$$
  2曲線 $y=f(x),\ y=g(x)\ (f(x)\geqq g(x)\geqq 0)$ の間の部分を回転すると断面はドーナツ形（円環）なので
  $$V=\pi\int_a^b\left[\{f(x)\}^2-\{g(x)\}^2\right]dx\qquad\left(\pi\int_a^b\{f(x)-g(x)\}^2dx\ \text{ではない}\right)$$

  **$y$ 軸のまわりの回転体**: 断面は $y$ 軸に垂直なので **$y$ で積分する**。$V=\pi\displaystyle\int_c^d x^2\,dy$ を、必要なら $y=f(x)$ を用いて $dy=f'(x)\,dx$ と置換し、区間も対応させて $x$ の積分に直す。穴があれば（外側の半径）$^2-$（内側の半径）$^2$。
  （参考）$a\leqq x\leqq b\ (0\leqq a)$、$0\leqq y\leqq f(x)$ の部分を $y$ 軸のまわりに回転させた体積は $V=2\pi\displaystyle\int_a^b xf(x)\,dx$ とも計算できる（バウムクーヘン型の検算）。
prerequisites: [ig-area-length]
