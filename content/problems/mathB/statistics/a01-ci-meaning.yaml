id: mb-st-a01
level: applied
format: choice
title: 信頼区間の正しい解釈
stem: |
  ある工場で作られる部品の長さ（mm）の母平均 $m$ を推定するため、無作為に $100$ 個の部品を取り出して長さを測ったところ、標本平均は $50.0$ mm であった。母標準偏差は $4$ mm とする。

  花子さんは、$m$ に対する信頼度 $95\%$ の信頼区間を
  $$49.216\leqq m\leqq 50.784$$
  と求めた（$Z$ が標準正規分布に従うとき $P(-1.96\leqq Z\leqq 1.96)=0.95$ を用いた）。

  この結果についての記述として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: 母平均 $m$ が $49.216$ 以上 $50.784$ 以下である確率は $95\%$ である。
    misconception: mc-st-ci-interpretation
    rationale: |
      母平均 $m$ は定数であり、この区間に「入っている」か「入っていない」かのどちらかである。$95\%$ は、標本を取り直して区間を作ることを繰り返したときに $m$ を含む区間の割合であって、ひとたび得られた具体的な区間について $m$ が入る確率ではない。
  - id: "2"
    text: この工場で作られる部品のうち、約 $95\%$ の部品の長さが $49.216$ mm 以上 $50.784$ mm 以下である。
    misconception: mc-st-sample-sd
    rationale: |
      信頼区間は標本平均の散らばり $\dfrac{4}{\sqrt{100}}=0.4$ をもとに作った区間で、個々の部品の散らばり（標準偏差 $4$）とは別物である。個々の部品の長さの約 $95\%$ が入る範囲なら、幅はおよそ $\pm 1.96\times 4$ になる。
  - id: "3"
    text: 同じ方法で大きさ $100$ の標本を取り出して信頼区間を作ることを何度も繰り返すと、作られた区間のうち約 $95\%$ が $m$ を含む。
    rationale: |
      正解。信頼度 $95\%$ は区間を作る手続きの性質で、$P\left(\overline{X}-1.96\cdot\dfrac{\sigma}{\sqrt{n}}\leqq m\leqq\overline{X}+1.96\cdot\dfrac{\sigma}{\sqrt{n}}\right)=0.95$ の確率は、変動する $\overline{X}$（区間の側）についての確率である。
  - id: "4"
    text: 標本の大きさを $400$ にして同じように推定すると、信頼区間の幅は $0.392$ になる。
    misconception: mc-st-sample-sd
    rationale: |
      標本を $4$ 倍にすれば幅も $\dfrac{1}{4}$ になると考えている。幅は $2\times 1.96\cdot\dfrac{\sigma}{\sqrt{n}}$ で $\sqrt{n}$ に反比例するので、$n=400$ では $2\times 1.96\times\dfrac{4}{20}=0.784$（もとの $1.568$ の $\dfrac{1}{2}$）になる。
answer: "3"
solution: |
  区間は $50.0\pm 1.96\times\dfrac{4}{\sqrt{100}}=50.0\pm 0.784$ で、花子さんの計算は正しい。

  - 母平均 $m$ は定数で、確率的に変動するのは標本から作られる区間のほう。信頼度 $95\%$ は「区間を作ることを繰り返すと約 $95\%$ の区間が $m$ を含む」という意味（③）。
  - ①は1つの区間について $m$ の確率を述べており誤り。②は個々のデータの散らばりと標本平均の散らばりの混同。
  - 幅は $\sqrt{n}$ に反比例するので、$n$ を $4$ 倍にしても幅は $\dfrac{1}{2}$ 倍の $0.784$ であり、④は誤り。
concepts: [st-estimation, st-sample-mean]
misconceptions: [mc-st-ci-interpretation, mc-st-sample-sd]
targetSeconds: 180
irt: { expectedCorrectRate: 0.5, discrimination: 1.3 }
author:
  intent: |
    信頼区間の意味を正しく理解しているかを、典型的な3種類の誤解（母平均が確率的に入る／母集団のデータの範囲／幅が $n$ に反比例）と並べて識別する。計算は与えてあり、解釈そのものを問う。①は教科書でも明示的に否定される言い回しだが、日常的な感覚では最も自然に聞こえるため、上位層でも迷う誤答として機能する。④は数値を具体的に示し、$\sqrt{n}$ の効き方を計算で確かめた受験者だけが退けられるようにした。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: ["数学B (2) ア(エ) 正規分布を用いた区間推定（母平均、信頼区間の意味）", "数学B (2) イ(ア) 標本分布の考察（標本平均の分布）"]
  variations:
    - 信頼度を $99\%$ に上げると区間の幅はどうなるか、正誤の選択肢を作る。
    - 100回分の信頼区間をシミュレーションで描いた結果を文章で与え、$m$ を含まない区間の個数の目安を問う。
  notes: 区間の被覆率はシミュレーション（2万回）で約 0.950 を確認済み。
