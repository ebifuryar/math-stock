id: m1-da-s03
level: school
format: mark
title: 代表値と分散・標準偏差
stem: |
  次のデータは、生徒6人が1か月に読んだ本の冊数である。

  $$8,\ 4,\ 20,\ 2,\ 10,\ 4$$

  このデータの平均値は $\boxed{\text{ア}}$ 冊、中央値は $\boxed{\text{イ}}$ 冊、最頻値は $\boxed{\text{ウ}}$ 冊である。

  また、分散は $\boxed{\text{エオ}}$、標準偏差は $\boxed{\text{カ}}$ 冊である。
blanks:
  - { label: ア, answer: "8" }
  - { label: イ, answer: "6" }
  - { label: ウ, answer: "4" }
  - { label: エオ, answer: "36" }
  - { label: カ, answer: "6" }
solution: |
  合計は $48$ なので平均値は $48\div 6=8$。

  小さい順に $2,\ 4,\ 4,\ 8,\ 10,\ 20$。個数が偶数なので中央値は3番目と4番目の平均 $\dfrac{4+8}{2}=6$。最頻値は2回現れる $4$。

  偏差は $0,\ -4,\ 12,\ -6,\ 2,\ -4$ で、その2乗の和は $0+16+144+36+4+16=216$。分散は $216\div 6=36$、標準偏差は $\sqrt{36}=6$。
concepts: [da-representative-values, da-variance]
misconceptions: []
targetSeconds: 180
irt: { expectedCorrectRate: 0.75, discrimination: 0.9 }
author:
  intent: |
    代表値3種と分散・標準偏差の定義どおりの計算ができるかをみる基本問題。平均値・中央値・最頻値がすべて異なり、極端な値 $20$ で平均が中央値より大きくなるデータにして、「代表値はどれも同じようなもの」という思い込みを崩す。個数が偶数なので中央値は2つの値の平均になる。分散は整数、標準偏差も整数になるよう設計し、計算ミスと定義の誤り（$n-1$ で割る、平方根の取り忘れ）を区別しやすくしている。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学I (4) ア(イ) 基本的な統計量（代表値）の算出, 数学I (4) ア(ア) 分散・標準偏差]
  variations:
    - 同じデータで「2乗の平均 − 平均の2乗」を使って分散を求めさせ、計算量を比較させる。
    - 20冊の生徒を除いたときの平均値と中央値の変化を問い、外れ値への頑健さを考えさせる。
