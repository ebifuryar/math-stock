id: ma-pr-e05
level: exam
format: written
title: n個の目の積が4の倍数となる確率
stem: |
  $n$ を正の整数とする。$1$ 個のさいころを $n$ 回投げるとき、出た目の積が $4$ の倍数となる確率 $p_n$ を $n$ の式で表せ。
modelAnswer: |
  余事象「積が $4$ の倍数でない」の確率を求める。

  目を素因数 $2$ の個数で分類すると

  - 奇数の目 $1,\ 3,\ 5$：$2$ を含まない（確率 $\dfrac{1}{2}$）
  - $2,\ 6$：$2$ をちょうど $1$ 個含む（確率 $\dfrac{1}{3}$）
  - $4$：$2$ を $2$ 個含む（確率 $\dfrac{1}{6}$）

  積が $4$ の倍数でないのは、積に含まれる素因数 $2$ の個数が $0$ 個または $1$ 個のときであり、次の (i)、(ii) のいずれかである。これらは互いに排反である。

  (i) $n$ 回とも奇数の目が出る場合。確率は $\left(\dfrac{1}{2}\right)^n$。

  (ii) $n$ 回のうちちょうど $1$ 回だけ $2$ または $6$ の目が出て、残り $n-1$ 回は奇数の目が出る場合（$4$ の目は出ない）。各回は独立なので、反復試行の考え方により確率は
  $${}_n\mathrm{C}_1\cdot\frac{1}{3}\left(\frac{1}{2}\right)^{n-1}=\frac{n}{3}\cdot\frac{2}{2^n}=\frac{2n}{3\cdot 2^n}$$

  よって
  $$p_n=1-\left(\frac{1}{2}\right)^n-\frac{2n}{3\cdot 2^n}=1-\frac{2n+3}{3\cdot 2^n}$$

  （確認：$n=1$ のとき $p_1=1-\dfrac{5}{6}=\dfrac{1}{6}$ で、$4$ の目が出る確率に一致する。）
rubric:
  - id: r1
    criterion: 余事象「積が $4$ の倍数でない」を考える方針を明示している
    points: 2
    keywords: ["余事象", "4の倍数でない"]
  - id: r2
    criterion: 目を素因数 $2$ の個数（奇数／$2,6$／$4$）で正しく分類し、$4$ の目と $2,6$ の目を区別している
    points: 2
    keywords: ["2,6", "奇数"]
  - id: r3
    criterion: すべて奇数の場合の確率 $\left(\dfrac{1}{2}\right)^n$ を求めている
    points: 2
    keywords: ["(1/2)^n"]
  - id: r4
    criterion: ちょうど1回だけ $2$ または $6$ が出る場合を、係数 $n$（${}_n\mathrm{C}_1$）を含めて $\dfrac{n}{3}\left(\dfrac{1}{2}\right)^{n-1}$ と求めている
    points: 3
    keywords: ["nC1", "1/3"]
  - id: r5
    criterion: $p_n=1-\dfrac{2n+3}{3\cdot 2^n}$（または同値な式）と結論している
    points: 1
    keywords: ["2n+3"]
solution: |
  余事象は「素因数 $2$ が $0$ 個または $1$ 個」。すべて奇数 $\left(\dfrac{1}{2}\right)^n$ と、ちょうど1回 $2$ か $6$ で残り奇数 $n\cdot\dfrac{1}{3}\left(\dfrac{1}{2}\right)^{n-1}$ を除いて
  $$p_n=1-\frac{2n+3}{3\cdot 2^n}$$
