id: cv-parabola
kind: definition
title: 放物線（焦点と準線）
body: |
  平面上で、定点 $\mathrm{F}$ と、$\mathrm{F}$ を通らない定直線 $\ell$ からの距離が等しい点の軌跡を **放物線** という。$\mathrm{F}$ を **焦点**、$\ell$ を **準線** という。

  **標準形** $p\neq 0$ とする。
  - 焦点 $(p,\ 0)$、準線 $x=-p$ の放物線: $y^2=4px$（軸は $x$ 軸、頂点は原点）
  - 焦点 $(0,\ p)$、準線 $y=-p$ の放物線: $x^2=4py$（軸は $y$ 軸）

  （導出）点 $\mathrm{P}(x,\ y)$ について $\mathrm{PF}^2=(x-p)^2+y^2$、準線までの距離の2乗は $(x+p)^2$。等しいとおいて展開すると $y^2=4px$。

  **焦点の読み取り方** 係数 $4p$ を $4$ で割った値が焦点の座標になる。たとえば $y^2=12x$ は $4p=12$ より焦点 $(3,\ 0)$、準線 $x=-3$。

  数学Iの $y=ax^2$ は $x^2=\dfrac{1}{a}y$ と変形して $4p=\dfrac{1}{a}$、焦点は $\left(0,\ \dfrac{1}{4a}\right)$ である（$\left(0,\ \dfrac{a}{4}\right)$ ではない）。

  **焦点までの距離** 放物線 $y^2=4px$（$p>0$）上の点 $\mathrm{P}(x_1,\ y_1)$ について、定義から $\mathrm{PF}=x_1+p$（準線までの距離）。根号の計算をせずに求められる。
prerequisites: [cg-locus, qf-definition]
