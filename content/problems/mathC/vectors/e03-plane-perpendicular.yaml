author:
  intent: |
    空間座標での計量の一連の流れ（面積公式・法線ベクトル・垂線の足・体積・平面上の点の表示）を、数値の一貫性を保ちながら処理できるかをみる。$\overrightarrow{\mathrm{OH}}=k\vec n$ とおく発想が (3) の鍵で、ここで「$\overrightarrow{\mathrm{OH}}\cdot\overrightarrow{\mathrm{AB}}=\overrightarrow{\mathrm{OH}}\cdot\overrightarrow{\mathrm{AC}}=0$ と平面上の条件の3式」を連立する受験者との処理時間の差も識別点になる。行列式による体積 $\dfrac{1}{6}|\det(\vec a,\ \vec b,\ \vec c)|=1$ と一致することを確認済み。(4) で $s+t<1$ を確かめることで、垂線の足の位置の判定まで含めた。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (1) ア(ウ) 空間座標と空間におけるベクトル, 数学C (1) イ(イ) ベクトルを用いた空間図形の考察]
  variations:
    - 点 $\mathrm{O}$ を $\mathrm{O}'(3,\ 3,\ 3)$ に替え、$\mathrm{O}'$ から平面 $\mathrm{ABC}$ に下ろした垂線の足が $\triangle\mathrm{ABC}$ の外部に出るかどうかを判定させる。
    - 平面 $\mathrm{ABC}$ に関して $\mathrm{O}$ と対称な点の座標を求めさせる。
