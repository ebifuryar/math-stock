id: m2-cl-e03
level: exam
format: mark
title: 文字定数を含む3次関数の区間での最大・最小
stem: |
  $a$ を正の定数とし、$f(x)=x^3-3a^2x$ の $0\leqq x\leqq 1$ における最小値を $m(a)$、最大値を $M(a)$ とする。

  (1) 最小値は
  $$m(a)=\begin{cases}-\boxed{\text{ア}}\,a^{\boxed{\text{イ}}} & (0<a<\boxed{\text{ウ}}\ \text{のとき})\\[4pt] \boxed{\text{エ}}-\boxed{\text{オ}}\,a^2 & (\text{それ以外のとき})\end{cases}$$
  である。

  (2) $M(a)=0$ となるのは
  $$a\geqq\frac{\sqrt{\boxed{\text{カ}}}}{\boxed{\text{キ}}}$$
  のときであり、それ以外の $a$ では $M(a)=f(1)$ である。
blanks:
  - { label: ア, answer: "2" }
  - { label: イ, answer: "3" }
  - { label: ウ, answer: "1" }
  - { label: エ, answer: "1" }
  - { label: オ, answer: "3" }
  - { label: カ, answer: "3" }
  - { label: キ, answer: "3" }
solution: |
  $f'(x)=3x^2-3a^2=3(x+a)(x-a)$。$x\geqq 0$ では $0\leqq x\leqq a$ で減少、$x\geqq a$ で増加し、$x=a$ で極小値 $f(a)=-2a^3$ をとる。

  (1)

  - $0<a<1$ のとき: 極小点 $x=a$ が区間内にあるので $m(a)=f(a)=-2a^3$。
  - $a\geqq 1$ のとき: 区間 $0\leqq x\leqq 1$ で $f(x)$ は減少するので $m(a)=f(1)=1-3a^2$。

  (2) $f(x)$ は区間内で「減少してから増加」または「減少のみ」なので、最大値は両端の値 $f(0)=0$ と $f(1)=1-3a^2$ の大きいほう。$f(1)\leqq 0 \iff a^2\geqq\dfrac{1}{3}\iff a\geqq\dfrac{\sqrt{3}}{3}$（$a>0$）のとき $M(a)=f(0)=0$、$0<a<\dfrac{\sqrt{3}}{3}$ のとき $M(a)=f(1)=1-3a^2>0$。
concepts: [cl-max-min, cl-extremum]
misconceptions: [mc-cl-endpoint-missing]
targetSeconds: 480
irt: { expectedCorrectRate: 0.35, discrimination: 1.3 }
author:
  intent: |
    極小点 $x=a$ が区間に入るかどうか（最小値）と、両端の値の大小がどこで入れ替わるか（最大値）という、性質の異なる2つの場合分けを区別できるかをみる。最小値の境界は $a=1$、最大値の境界は $f(0)=f(1)$ から $a=\dfrac{\sqrt{3}}{3}$ と、境界の決め方が違う点が識別の鍵。端点を比べない受験者は最大値で詰まり、極小値をそのまま最小値とする受験者は $a\geqq 1$ の場合を誤る。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学II (5) イ(ア) 導関数を用いた関数の考察（最大・最小）"]
  variations:
    - 区間を $0\leqq x\leqq 2$ にして、最大値の比較対象に「極大値」を含める必要がない理由も書かせる。
    - $M(a)-m(a)$ を $a$ の関数として、その最小値を問う。
