id: m2-el-a05
level: applied
format: written
title: 常用対数と回数の見積もり
stem: |
  ある浄水装置に水を1回通すたびに、水に含まれる不純物の量は、通す前の量の $80\%$ になる。不純物の量を最初の量の $1\%$ 以下にするには、この装置に少なくとも何回通せばよいか。ただし、$\log_{10}2=0.3010$ とする。
modelAnswer: |
  最初の不純物の量を $A\ (A>0)$ とすると、$n$ 回通した後の量は $A\times 0.8^n$ である。求める条件は
  $$A\times 0.8^n\leqq A\times 0.01,\quad\text{すなわち}\quad 0.8^n\leqq 10^{-2}$$

  両辺は正であり、底 $10$ は $1$ より大きいので、両辺の常用対数をとっても不等号の向きは変わらない。
  $$n\log_{10}0.8\leqq -2$$

  ここで
  $$\log_{10}0.8=\log_{10}\frac{2^3}{10}=3\log_{10}2-1=3\times 0.3010-1=-0.0970$$
  なので $-0.0970\,n\leqq -2$。両辺を負の数 $-0.0970$ で割ると不等号の向きが変わり
  $$n\geqq\frac{2}{0.0970}=20.6\cdots$$

  $n$ は自然数なので、これを満たす最小の $n$ は $21$。よって **少なくとも $21$ 回** 通せばよい。
rubric:
  - id: r1
    criterion: $n$ 回後の量を $0.8^n$ 倍と表し、条件を $0.8^n\leqq 0.01$（または $\left(\frac{4}{5}\right)^n\leqq\frac{1}{100}$）と立式している
    points: 2
    keywords: ["0.8^n", "0.01"]
  - id: r2
    criterion: 両辺の常用対数をとり $n\log_{10}0.8\leqq -2$ としている
    points: 2
    keywords: ["log", "-2"]
  - id: r3
    criterion: $\log_{10}0.8=3\log_{10}2-1=-0.0970$ を正しく求めている
    points: 2
    keywords: ["3log", "-0.0970", "-0.097"]
  - id: r4
    criterion: 負の数で割るときに不等号の向きを変え、$n\geqq 20.6\cdots$ を得ている
    points: 2
    keywords: ["20.6", "n≧", "n>="]
  - id: r5
    criterion: 自然数であることから最小の $n$ を $21$ 回と結論している
    points: 2
    keywords: ["21"]
solution: |
  「$0.8$ を何回掛けると $0.01$ 以下になるか」を常用対数で調べる。$\log_{10}0.8=\log_{10}\dfrac{8}{10}=3\log_{10}2-1$ と、与えられた $\log_{10}2$ だけで表すのが要点。$\log_{10}0.8$ は負なので、割るときに不等号の向きが変わる（ここで向きを変えないと $n\leqq 20.6$ となり意味をなさない）。実際 $0.8^{20}\fallingdotseq 0.0115$、$0.8^{21}\fallingdotseq 0.0092$ である。
concepts: [el-common-log, el-log-definition, ne-linear-inequality]
misconceptions: [mc-ne-inequality-direction, mc-el-log-sum]
targetSeconds: 360
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    日常の事象を指数の不等式として立式し、常用対数で解く一連の流れを記述できるかをみる。$\log_{10}0.8$ が負になるため、割るときの不等号の向きと、最後に自然数として切り上げる判断の2か所で、立式から結論までを論理的に書けているかを区別できる。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学II (3) ア(ウ) 対数の意味とその基本的な性質, 数学II (3) イ(ウ) 二つの数量の関係に着目し、日常の事象や社会の事象などを数学的に捉え、問題を解決する]
  variations:
    - '「毎年 $1.5$ 倍に増える量が初めて $1$ 万倍を超えるのは何年後か」のように、増加の場面で出題する（$\log_{10}3$ を使う）。'
    - 除去率を文字 $p\%$ にし、ちょうど $10$ 回で $1\%$ 以下になる $p$ の範囲を問う。
