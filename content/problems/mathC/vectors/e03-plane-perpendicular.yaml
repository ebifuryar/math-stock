solution: |
  (1) $\overrightarrow{\mathrm{AB}}=(2,\ -2,\ -1),\ \overrightarrow{\mathrm{AC}}=(2,\ 0,\ -2)$。
  $$\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{AC}}=4+0+2=6,\quad |\overrightarrow{\mathrm{AB}}|=3,\quad |\overrightarrow{\mathrm{AC}}|=2\sqrt{2}$$
  $$\triangle\mathrm{ABC}=\frac{1}{2}\sqrt{9\cdot 8-6^2}=\frac{1}{2}\sqrt{36}=3$$

  (2) $\vec n\cdot\overrightarrow{\mathrm{AB}}=4-2p-q=0$、$\vec n\cdot\overrightarrow{\mathrm{AC}}=4-2q=0$ より $q=2,\ p=1$。$\vec n=(2,\ 1,\ 2)$、$|\vec n|=3$。

  (3) $\overrightarrow{\mathrm{OH}}$ は平面 $\mathrm{ABC}$ に垂直なので $\vec n$ に平行で、$\overrightarrow{\mathrm{OH}}=k\vec n$ とおける。$\mathrm{H}$ は平面上にあるから $\overrightarrow{\mathrm{AH}}\perp\vec n$:
  $$(k\vec n-\overrightarrow{\mathrm{OA}})\cdot\vec n=9k-(-2+1+4)=0\qquad k=\frac{1}{3}$$
  よって $\mathrm{H}\left(\dfrac{2}{3},\ \dfrac{1}{3},\ \dfrac{2}{3}\right)$、$\mathrm{OH}=\dfrac{1}{3}\cdot 3=1$。体積は $\dfrac{1}{3}\cdot 3\cdot 1=1$。

  （発展: 平面 $\mathrm{ABC}$ の方程式は $2x+y+2z=3$ で、点と平面の距離の公式から $\mathrm{OH}=\dfrac{|-3|}{\sqrt{4+1+4}}=1$ としてもよい。）

  (4) $\overrightarrow{\mathrm{AH}}=\left(\dfrac{5}{3},\ -\dfrac{2}{3},\ -\dfrac{4}{3}\right)=s(2,\ -2,\ -1)+t(2,\ 0,\ -2)$ とおくと、$y$ 成分から $-2s=-\dfrac{2}{3}$ で $s=\dfrac{1}{3}$、$x$ 成分から $2s+2t=\dfrac{5}{3}$ で $t=\dfrac{1}{2}$（$z$ 成分 $-\dfrac{1}{3}-1=-\dfrac{4}{3}$ も成り立つ）。$s>0,\ t>0,\ s+t=\dfrac{5}{6}<1$ なので $\mathrm{H}$ は $\triangle\mathrm{ABC}$ の内部にある。
