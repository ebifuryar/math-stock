# 科目 → 単元の階層。単元IDは「科目ID（小文字）-単元名」で一意にする。
subjects:
  - id: math1
    title: 数学I
    units:
      - id: math1-numbers-expressions
        title: 数と式
        curriculumCode: 数学I (1) 数と式
        summary: 多項式の展開と因数分解、実数と平方根、1次不等式と絶対値
      - id: math1-sets-propositions
        title: 集合と命題
        curriculumCode: 数学I (1) 数と式（集合と命題）
        summary: 集合の演算、必要条件と十分条件、逆・裏・対偶、背理法
      - id: math1-quadratic-function
        title: 2次関数
        curriculumCode: 数学I (3) 2次関数
        summary: 2次関数の値の変化とグラフ、最大・最小、2次方程式・2次不等式との関係
      - id: math1-trigonometry
        title: 図形と計量
        curriculumCode: 数学I (2) 図形と計量
        summary: 三角比と相互関係、正弦定理・余弦定理、三角形の面積と空間図形への応用
      - id: math1-data-analysis
        title: データの分析
        curriculumCode: 数学I (4) データの分析
        summary: 代表値と四分位数・箱ひげ図、分散と標準偏差、相関係数、仮説検定の考え方
  - id: mathA
    title: 数学A
    units:
      - id: matha-probability
        title: 場合の数と確率
        curriculumCode: 数学A (2) 場合の数と確率
        summary: 集合の要素の個数、順列・組合せ、確率とその基本性質、独立な試行と反復試行、条件付き確率、期待値
      - id: matha-geometry
        title: 図形の性質
        curriculumCode: 数学A (1) 図形の性質
        summary: 三角形の五心、チェバ・メネラウスの定理、円の性質（方べきの定理・接弦定理）、作図、空間図形
      - id: matha-integers
        title: 整数の性質
        curriculumCode: 数学A (3) 数学と人間の活動
        summary: 約数と倍数、素因数分解、ユークリッドの互除法、1次不定方程式、記数法（n進法）
  - id: math2
    title: 数学II
    units:
      - id: math2-expressions-proofs
        title: いろいろな式
        curriculumCode: 数学II (1) いろいろな式
        summary: 3次の展開・因数分解、二項定理、整式の除法と分数式、恒等式、等式・不等式の証明、複素数と2次方程式、剰余の定理・因数定理と高次方程式
      - id: math2-coordinate-geometry
        title: 図形と方程式
        curriculumCode: 数学II (2) 図形と方程式
        summary: 点と直線、円の方程式、円と直線の位置関係、軌跡、不等式の表す領域と最大・最小
      - id: math2-exp-log
        title: 指数関数・対数関数
        curriculumCode: 数学II (3) 指数関数・対数関数
        summary: 指数の拡張、指数関数のグラフと方程式・不等式、対数とその性質、対数関数、常用対数と桁数
      - id: math2-trig-functions
        title: 三角関数
        curriculumCode: 数学II (4) 三角関数
        summary: 一般角と弧度法、三角関数のグラフと周期、加法定理、2倍角・半角、三角関数の合成、方程式・不等式と最大・最小
      - id: math2-calculus
        title: 微分・積分の考え
        curriculumCode: 数学II (5) 微分・積分の考え
        summary: 微分係数と導関数、接線、関数の増減と極値、最大・最小、方程式の実数解の個数、不定積分と定積分、面積
  - id: mathB
    title: 数学B
    units:
      - id: mathb-sequences
        title: 数列
        curriculumCode: 数学B (1) 数列
        summary: 等差数列・等比数列、Σと和の計算、階差数列、群数列、漸化式、数学的帰納法
      - id: mathb-statistics
        title: 統計的な推測
        curriculumCode: 数学B (2) 統計的な推測
        summary: 確率変数と確率分布、期待値・分散、二項分布、正規分布、標本平均の分布、母平均・母比率の推定、仮説検定
  - id: math3
    title: 数学III
    units:
      - id: math3-limits
        title: 極限
        curriculumCode: 数学III (1) 極限
        summary: 数列の極限、無限等比数列と無限級数、関数の極限、関数の連続性と中間値の定理、分数関数・無理関数・逆関数と合成関数
      - id: math3-differentiation
        title: 微分法
        curriculumCode: 数学III (2) 微分法
        summary: 積・商・合成関数の微分、三角・指数・対数関数の導関数、接線と法線、グラフの凹凸と変曲点、最大・最小、方程式・不等式への応用、速度・加速度
      - id: math3-integration
        title: 積分法
        curriculumCode: 数学III (3) 積分法
        summary: 置換積分・部分積分、いろいろな関数の積分、定積分と区分求積法、定積分と不等式、面積・体積・曲線の長さ
  - id: mathC
    title: 数学C
    units:
      - id: mathc-vectors
        title: ベクトル
        curriculumCode: 数学C (1) ベクトル
        summary: 平面ベクトルの演算と内積、位置ベクトルと図形、ベクトル方程式、空間座標と空間ベクトル、平面・直線・球面
      - id: mathc-complex-plane
        title: 複素数平面
        curriculumCode: 数学C (2) 平面上の曲線と複素数平面（複素数平面）
        summary: 複素数平面と極形式、ド・モアブルの定理、n乗根、回転と図形への応用、複素数の表す図形
      - id: mathc-curves
        title: 平面上の曲線
        curriculumCode: 数学C (2) 平面上の曲線と複素数平面（平面上の曲線）
        summary: 放物線・楕円・双曲線、2次曲線と直線、媒介変数表示、極座標と極方程式
