id: sq-geometric
kind: formula
title: 等比数列の一般項と和
body: |
  初項 $a$、公比 $r$ の **等比数列** $\{a_n\}$ の一般項は
  $$a_n=ar^{n-1}$$

  初項から第 $n$ 項までの和 $S_n$ は、公比が $1$ かどうかで場合分けする。
  $$r\neq 1\ \text{のとき}\ \ S_n=\frac{a(1-r^n)}{1-r}=\frac{a(r^n-1)}{r-1},\qquad r=1\ \text{のとき}\ \ S_n=na$$
  公式は $S_n-rS_n=a-ar^n$ を $1-r$ で割って得られるので、$r=1$ では使えない。公比が文字を含むときは必ず $r=1$ の場合を別に調べる。

  **等比中項**: 3つの数 $a,\ b,\ c$ がこの順に等比数列をなす $\iff$ $b^2=ac$（ただし $a,\ b,\ c$ は $0$ でないとする）。$b^2=ac$ から $b$ は2つ得られることが多く、符号の条件で絞り込む。
