id: m3-lm-s04
level: school
format: mark
title: 関数の極限（三角関数・片側極限・e）
stem: |
  次の極限値を求めよ。ただし、角の単位は弧度法とし、$e$ は自然対数の底とする。

  (1) 
  $$\lim_{x\to 0}\frac{\sin 3x}{x}=\boxed{\text{ア}}$$

  (2) 
  $$\lim_{x\to 0}\frac{1-\cos x}{x^2}=\frac{\boxed{\text{イ}}}{\boxed{\text{ウ}}}$$

  (3) 
  $$\lim_{x\to 1+0}\frac{x^2-1}{|x-1|}=\boxed{\text{エ}},\qquad \lim_{x\to 1-0}\frac{x^2-1}{|x-1|}=\boxed{\text{オカ}}$$
  したがって、$\displaystyle\lim_{x\to 1}\frac{x^2-1}{|x-1|}$ は存在しない。

  (4) 
  $$\lim_{x\to 0}(1+2x)^{\frac{1}{x}}=e^{\boxed{\text{キ}}}$$
blanks:
  - { label: ア, answer: "3" }
  - { label: イ, answer: "1" }
  - { label: ウ, answer: "2" }
  - { label: エ, answer: "2" }
  - { label: オカ, answer: "-2" }
  - { label: キ, answer: "2" }
solution: |
  (1) $\sin$ の中身と分母をそろえる。
  $$\frac{\sin 3x}{x}=3\cdot\frac{\sin 3x}{3x}\to 3\cdot 1=3$$

  (2) 分子・分母に $1+\cos x$ を掛ける。
  $$\frac{1-\cos x}{x^2}=\frac{\sin^2 x}{x^2(1+\cos x)}=\left(\frac{\sin x}{x}\right)^2\cdot\frac{1}{1+\cos x}\to 1\cdot\frac{1}{2}=\frac{1}{2}$$

  (3) $x>1$ のとき $|x-1|=x-1$ なので $\dfrac{(x-1)(x+1)}{x-1}=x+1\to 2$。$x<1$ のとき $|x-1|=-(x-1)$ なので $-(x+1)\to -2$。右側極限と左側極限が一致しないので、$x\to 1$ の極限は存在しない。

  (4) $2x=h$ とおくと $x\to 0$ のとき $h\to 0$ で
  $$(1+2x)^{\frac{1}{x}}=\left\{(1+h)^{\frac{1}{h}}\right\}^2\to e^2$$
  $1^\infty$ の形だが、極限は $1$ ではない。
concepts: [lm-function-limit]
misconceptions: [mc-lm-indeterminate-form, mc-lm-one-sided-limit]
targetSeconds: 360
irt: { expectedCorrectRate: 0.65, discrimination: 1.0 }
author:
  intent: |
    関数の極限の基本公式 $\dfrac{\sin x}{x}\to 1$、$(1+h)^{\frac{1}{h}}\to e$ を、中身をそろえて使えるか、絶対値を含む式で左右の極限を分けて求められるかをみる。(1) で $1$、(4) で $e$ や $1$ と答えた場合は、公式の形をそろえずに当てはめる誤りを示す。(3) の左側極限 $-2$ を $2$ と答えた場合は片側極限の違いを無視していることを示す。
  assessedAbilities: [知識・技能]
  curriculumRefs: ["数学III (1) ア(オ) 関数の値の極限"]
  variations:
    - $\displaystyle\lim_{x\to 0}\frac{\tan 2x}{\sin 5x}$ や $\displaystyle\lim_{x\to\infty}x\sin\frac{1}{x}$ のように、置き換えを要する形にする。
    - $\displaystyle\lim_{x\to\infty}\left(1-\frac{3}{x}\right)^{x}=e^{-3}$ のように、負の数を含む形で指数の符号を確認させる。
