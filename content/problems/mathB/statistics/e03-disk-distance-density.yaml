  - { label: ケ, answer: "2" }
  - { label: コ, answer: "2" }
  - { label: サ, answer: "2" }
solution: |
  (1) $R\leqq r$ となるのは $P$ が半径 $r$ の円板に入るときで、確率は面積比 $\dfrac{\pi r^2}{\pi\cdot 1^2}=r^2$。確率密度関数は、これを $r$ で微分して $f(r)=2r$（実際、$\displaystyle\int_0^r 2t\,dt=r^2$）。

  (2) $E(R)=\displaystyle\int_0^1 r\cdot 2r\,dr=\frac{2}{3}$、$E(R^2)=\displaystyle\int_0^1 r^2\cdot 2r\,dr=\frac{1}{2}$ より
  $$V(R)=\frac{1}{2}-\left(\frac{2}{3}\right)^2=\frac{9-8}{18}=\frac{1}{18}$$

  (3) $P\left(R\leqq\dfrac{2}{3}\right)=\left(\dfrac{2}{3}\right)^2=\dfrac{4}{9}$。$c^2=\dfrac{1}{2}$ より $c=\dfrac{\sqrt{2}}{2}$。

  分布が $r$ の大きい側に偏っている（外側ほど面積が大きい）ため、期待値 $\dfrac{2}{3}$ 以下となる確率は $\dfrac{1}{2}$ より小さく、中央値 $\dfrac{\sqrt{2}}{2}\fallingdotseq 0.707$ は期待値より大きい。

  (4) $S=\pi R^2$ より $E(S)=\pi E(R^2)=\dfrac{\pi}{2}$。$\pi\{E(R)\}^2=\dfrac{4\pi}{9}$ ではない。
