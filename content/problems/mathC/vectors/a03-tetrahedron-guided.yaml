solution: |
  (1) $\vec a\cdot\vec b=1\cdot 1\cdot\cos 60^\circ=\dfrac{1}{2}$。

  (2) $\overrightarrow{\mathrm{OM}}=\dfrac{1}{2}\vec a$、$\overrightarrow{\mathrm{ON}}=\dfrac{2\vec b+\vec c}{3}$ より
  $$\overrightarrow{\mathrm{MN}}=-\frac{1}{2}\vec a+\frac{2}{3}\vec b+\frac{1}{3}\vec c$$
  $$|\overrightarrow{\mathrm{MN}}|^2=\frac{1}{4}+\frac{4}{9}+\frac{1}{9}+2\left(-\frac{1}{3}\vec a\cdot\vec b+\frac{2}{9}\vec b\cdot\vec c-\frac{1}{6}\vec c\cdot\vec a\right)=\frac{29}{36}+2\cdot\frac{1}{2}\left(-\frac{1}{3}+\frac{2}{9}-\frac{1}{6}\right)=\frac{29}{36}-\frac{10}{36}=\frac{19}{36}$$
  よって $|\overrightarrow{\mathrm{MN}}|=\dfrac{\sqrt{19}}{6}$。

  (3) $\overrightarrow{\mathrm{OG}}=\dfrac{\vec a+\vec b+\vec c}{3}$、$\vec a=2\overrightarrow{\mathrm{OM}}$ より
  $$\overrightarrow{\mathrm{OK}}=\frac{k}{3}\left(2\overrightarrow{\mathrm{OM}}+\overrightarrow{\mathrm{OB}}+\overrightarrow{\mathrm{OC}}\right)=\frac{2k}{3}\overrightarrow{\mathrm{OM}}+\frac{k}{3}\overrightarrow{\mathrm{OB}}+\frac{k}{3}\overrightarrow{\mathrm{OC}}$$
  $\mathrm{K}$ が平面 $\mathrm{MBC}$ 上にある条件は係数の和が $1$ であること: $\dfrac{4k}{3}=1$ より $k=\dfrac{3}{4}$。

  (4) $\overrightarrow{\mathrm{OG}}\cdot\overrightarrow{\mathrm{AB}}=\dfrac{1}{3}(\vec a+\vec b+\vec c)\cdot(\vec b-\vec a)=\dfrac{1}{3}\left(|\vec b|^2-|\vec a|^2+\vec b\cdot\vec c-\vec c\cdot\vec a\right)=0$。
  $$|\overrightarrow{\mathrm{OG}}|^2=\frac{1}{9}\left(3+2\cdot\frac{3}{2}\right)=\frac{6}{9}\qquad |\overrightarrow{\mathrm{OG}}|=\frac{\sqrt{6}}{3}$$
  $\triangle\mathrm{ABC}=\dfrac{\sqrt{3}}{4}$ より $V=\dfrac{1}{3}\cdot\dfrac{\sqrt{3}}{4}\cdot\dfrac{\sqrt{6}}{3}=\dfrac{\sqrt{2}}{12}$。

  $\mathrm{K}$ は線分 $\mathrm{OG}$ を $3:1$ に内分するので、$\mathrm{K}$ と平面 $\mathrm{ABC}$ の距離は $\mathrm{OG}$ の $\dfrac{1}{4}$。四面体 $\mathrm{KABC}$ の体積は $\dfrac{1}{4}V=\dfrac{\sqrt{2}}{48}$。
