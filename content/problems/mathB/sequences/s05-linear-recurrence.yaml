author:
  intent: |
    $a_{n+1}=pa_n+q$ 型の標準的な処理を、記述として筋道立てて書けるかをみる。置き換えた数列の初項を $a_1=2$ のままにする誤り（$a_n=2\cdot 3^{n-1}+1$）、指数を $n$ にする誤り（$3^n+1$）、和で $\displaystyle\sum_{k=1}^{n}1$ を落とす誤りが、それぞれ別の基準で減点されるように設計した。$a_1$ の値を代入して検算しているかも答案から読み取れる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (1) ア(ウ) 漸化式と数学的帰納法（漸化式）"]
  variations:
    - $a_{n+1}=\dfrac{1}{2}a_n+3$ とし、一般項が $6$ に近づいていく様子を観察させる。
    - $a_1$ を文字 $c$ にして、$\{a_n\}$ が定数列になる $c$ の値（$c=1$）を問う。
