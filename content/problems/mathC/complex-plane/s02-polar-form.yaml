targetSeconds: 240
irt: { expectedCorrectRate: 0.65, discrimination: 1.1 }
author:
  intent: |
    極形式の条件（$r>0$、$\cos$ と $\sin$ の角が同じ、間が $+i$）を理解しているかを、3つの形でみる。(1) は標準的な変換で象限の判断を、(2) は係数が負の場合を、(3) は $\cos$ と $\sin$ が入れ替わった場合を問う。(2) で $\boxed{\text{エ}}$ に $-2$ を入れようとしても1桁の欄に入らず、偏角を $\dfrac{1}{6}\pi$ とすると $\boxed{\text{オ}}$ に $1$ が入るので、どの誤りかを特定できる。(3) で $\dfrac{1}{5}$ と答えると分母が2桁欄に合わず、形式から再考を促す。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学C (2) ア(イ) 複素数平面と複素数の極形式]
  variations:
    - $\cos\dfrac{\pi}{7}-i\sin\dfrac{\pi}{7}$ や $-\cos\dfrac{\pi}{8}+i\sin\dfrac{\pi}{8}$ を極形式に直させる。
    - $1+\cos\theta+i\sin\theta\ (0<\theta<\pi)$ を半角の公式で極形式にさせる（$2\cos\dfrac{\theta}{2}\left(\cos\dfrac{\theta}{2}+i\sin\dfrac{\theta}{2}\right)$）。
