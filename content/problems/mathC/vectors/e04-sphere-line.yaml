author:
  intent: |
    球面の方程式の平方完成、直線のベクトル方程式、$|\vec a+t\vec b|$ の最小（点と直線の距離）を組み合わせ、空間での「中心と直線の距離」で位置関係を判断できるかをみる。(2) は平面の $|\vec a+t\vec b|$ の最小と同じ構造であることに気づけば機械的に進む。(4) は距離の最大を三角不等式で評価し、等号成立の点を具体的に示せるかで上位層を識別する。交点を実際に求めても (3) が確かめられる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (1) ア(ウ) 空間座標と空間におけるベクトル, 数学C (1) イ(イ) ベクトルを用いた空間図形の考察]
  variations:
    - $\ell$ と $S$ の2つの交点と中心 $\mathrm{C}$ を頂点とする三角形の面積を、ベクトルの面積公式で求めさせる（$2\sqrt{5}$）。
    - $S$ と平面 $z=k$ の交わりの円が $\ell$ と共有点をもつような $k$ の範囲を問う。
