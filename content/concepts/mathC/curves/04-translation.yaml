id: cv-translation
kind: method
title: 2次曲線の平行移動
body: |
  曲線 $F(x,\ y)=0$ を $x$ 軸方向に $p$、$y$ 軸方向に $q$ だけ平行移動した曲線は
  $$F(x-p,\ y-q)=0$$
  焦点・頂点・中心・準線・漸近線もすべて同じだけ平行移動する。

  **一般形から標準形へ** $Ax^2+By^2+Cx+Dy+E=0$ の形の式は、$x$ と $y$ についてそれぞれ平方完成する。
  $$4x^2+9y^2-16x+18y-11=0\iff 4(x-2)^2+9(y+1)^2=36\iff\frac{(x-2)^2}{9}+\frac{(y+1)^2}{4}=1$$
  これは楕円 $\dfrac{x^2}{9}+\dfrac{y^2}{4}=1$ を $(2,\ -1)$ だけ平行移動したもの。焦点はもとの $(\pm\sqrt{5},\ 0)$ を移した $(2\pm\sqrt{5},\ -1)$。

  **形の判定**（$xy$ の項がないとき）
  - $A,\ B$ が同符号 → 楕円（または円・1点・図形なし）
  - $A,\ B$ が異符号 → 双曲線（または交わる2直線）
  - $A,\ B$ の一方が $0$ → 放物線

  焦点などはまず標準形で求めてから平行移動する。平行移動後の式に直接 $c=\sqrt{a^2-b^2}$ を当てはめて原点基準の座標を答えるのは誤り。
prerequisites: [cv-parabola, cv-ellipse, cv-hyperbola, qf-graph-translation]
