author:
  intent: |
    指数関数と三角関数の積の導関数を三角関数の合成で整理し、無限に続く極値を一般項で表せるかをみる。$f'(x)=0$ となる点は $x=\dfrac{\pi}{4}+k\pi$ と周期 $\pi$ で現れるが、極大はそのうち1つおき（周期 $2\pi$）であることを、符号の変化から判断できるかが識別の鍵となる。$x_n=\dfrac{\pi}{4}+(n-1)\pi$ と答える受験者は極大と極小を区別していない。(3) は極限単元の無限等比級数との融合で、公比が $e^{-\pi}$ ではなく $e^{-2\pi}$ となることの確認にもなる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (2) イ(ア) 導関数を用いた関数の考察（極値）", "数学III (1) ア(ア) 無限等比級数"]
  variations:
    - 極小値も含めたすべての極値の絶対値の和を求めさせる（公比 $e^{-\pi}$ の級数になる）。
    - 曲線 $y=e^{-x}\sin x$ が曲線 $y=e^{-x}$ に接する点が、極大点ではなく $x=\dfrac{\pi}{2}+2(n-1)\pi$ であることを確かめさせる。
