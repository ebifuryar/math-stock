id: m2-cg-e03
level: exam
format: mark
title: 中心が動く2円の位置関係と共通弦
stem: |
  $a$ を正の定数とし、2つの円
  $$C_1:\ x^2+y^2=4,\qquad C_2:\ (x-a)^2+(y-2a)^2=9$$
  を考える。

  (1) $C_1$ と $C_2$ が外接するのは $a=\sqrt{\boxed{\text{ア}}}$ のときであり、内接するのは $a=\dfrac{\sqrt{\boxed{\text{イ}}}}{\boxed{\text{ウ}}}$ のときである。

  (2) $a=1$ のとき、$C_1$ と $C_2$ は異なる2点で交わる。2つの交点を通る直線の方程式は $x+\boxed{\text{エ}}y=0$ であり、2つの交点を結ぶ線分の長さは $\boxed{\text{オ}}$ である。

  (3) $a=1$ のとき、$C_1$ と $C_2$ の2つの交点と点 $(3,\ -1)$ を通る円の中心の座標は $(\boxed{\text{カ}},\ \boxed{\text{キ}})$、半径は $\boxed{\text{ク}}$ である。
blanks:
  - { label: ア, answer: "5" }
  - { label: イ, answer: "5" }
  - { label: ウ, answer: "5" }
  - { label: エ, answer: "2" }
  - { label: オ, answer: "4" }
  - { label: カ, answer: "3" }
  - { label: キ, answer: "6" }
  - { label: ク, answer: "7" }
solution: |
  (1) 中心 $(0,\ 0)$ と $(a,\ 2a)$ の距離は $d=\sqrt{a^2+4a^2}=\sqrt{5}\,a$（$a>0$）。半径は $2$ と $3$。
  - 外接: $d=2+3=5$ より $a=\dfrac{5}{\sqrt{5}}=\sqrt{5}$
  - 内接: $d=3-2=1$ より $a=\dfrac{1}{\sqrt{5}}=\dfrac{\sqrt{5}}{5}$

  (2) $a=1$ のとき $d=\sqrt{5}$ で $1<\sqrt{5}<5$ なので2点で交わる。$C_2$ は $x^2+y^2-2x-4y-4=0$。$f=x^2+y^2-4,\ g=x^2+y^2-2x-4y-4$ として
  $$f-g=2x+4y=0\quad\Longrightarrow\quad x+2y=0$$
  この直線は $C_1$ の中心 $(0,\ 0)$ を通るので、共通弦は $C_1$ の直径であり、長さは $2\cdot 2=4$。

  (3) 2交点を通る円は、$t$ を定数として $f+t(x+2y)=0$ と表せる。点 $(3,\ -1)$ を通るので
  $$9+1-4+t(3-2)=0\quad\Longrightarrow\quad t=-6$$
  よって $x^2+y^2-6x-12y-4=0$、すなわち $(x-3)^2+(y-6)^2=49$。中心 $(3,\ 6)$、半径 $7$。
