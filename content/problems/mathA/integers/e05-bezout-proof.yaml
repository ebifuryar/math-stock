author:
  intent: |
    1次不定方程式の解の存在定理を、余りの「鳩の巣」的な議論で証明させる国公立二次の定番。(1) で「互いに素」をどこで使うかを明示できるか（$b\mid (i-j)a\Rightarrow b\mid i-j$）が最大の識別点で、ここを根拠なしに書く答案は配点の大部分を失う。(2) は「$b$ 個が相異なり、候補も $b$ 通り」から全余りが現れると結論する論理の明確さをみる。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学A (3) ア(ア) 整数の性質（1次不定方程式・ユークリッドの互除法）, 数学I (1) イ 命題と証明（背理法）]
  variations:
    - '(2) の後に「$ax+by$（$x,\ y$ は $0$ 以上の整数）で表せない最大の整数は $ab-a-b$」を示させる発展問題につなげる。'
    - 互除法を用いた構成的な証明（$ax+by$ の形の数全体が $\gcd$ の倍数全体と一致する）と比較させる。
