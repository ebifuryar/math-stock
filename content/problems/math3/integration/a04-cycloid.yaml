author:
  intent: |
    媒介変数表示の曲線について、長さ・面積・回転体の体積の3つの公式を、$dx=\dfrac{dx}{dt}\,dt$ の置換と結び付けて使い分けられるかをみる。(1) は半角の公式で根号を外す誘導付きで、根号を付け忘れて $\displaystyle\int_0^{2\pi}2(1-\cos t)\,dt=4\pi$ とすると整数にならず、誤りに気づける設計。(2)(3) では $dx$ を $dt$ に直すときに $\dfrac{dx}{dt}$ を掛け忘れる誤り（(2) で $2\pi$ と答える）や、体積で $\pi$ や2乗を落とす誤りを識別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (3) イ(イ) 定積分を用いた面積・体積・曲線の長さ"]
  variations:
    - アステロイド $x=\cos^3t,\ y=\sin^3t$ の長さ（$6$）と囲む面積（$\dfrac{3}{8}\pi$）を問う。
    - (3) を $y$ 軸のまわりの回転（$6\pi^3$）に変え、$\displaystyle\pi\int x^2\,dy$ を $t$ の積分に直させる。
