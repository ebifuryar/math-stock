author:
  intent: |
    確率密度関数が与えられていない状況で、累積分布 $P(R\leqq r)$ を図形の面積から求め、それを微分して密度を作れるかをみる。「点を一様に選ぶ」から $R$ も $[0,\ 1]$ で一様と考えると $f(r)=1$、$E(R)=\dfrac{1}{2}$ となり、イ以降がすべて崩れる。(3) では期待値と中央値が一致しないことを、(4) では $E(R^2)\neq\{E(R)\}^2$（$E(\pi R^2)$ を $\pi\{E(R)\}^2=\frac{4\pi}{9}$ とする誤り）を確認させる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (2) ア(ウ) 連続型確率変数と確率密度関数", "数学II (5) 積分の考え（定積分）"]
  variations:
    - 半径 $1$ の球の内部から点を選ぶ場合に一般化させる（$f(r)=3r^2$、$E(R)=\frac{3}{4}$）。
    - 正方形 $0\leqq x\leqq 1,\ 0\leqq y\leqq 1$ から点を選び、$X=\max(x,\ y)$ の分布を求めさせる。
  notes: sympy の積分と、円板内一様点 30 万個のモンテカルロ（E≈0.6667、V≈0.0557、P(R≤2/3)≈0.4436、中央値≈0.708）で確認済み。
