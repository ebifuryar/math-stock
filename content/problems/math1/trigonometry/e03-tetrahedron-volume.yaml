id: m1-tg-e03
level: exam
format: mark
title: 3辺が等しい四面体の高さと体積
stem: |
  四面体 $\mathrm{OABC}$ において、$\mathrm{OA}=\mathrm{OB}=\mathrm{OC}=4$、$\mathrm{AB}=4,\ \mathrm{CA}=5,\ \mathrm{BC}=6$ とする。

  (1) $\cos\angle\mathrm{BAC}=\dfrac{\boxed{\text{ア}}}{\boxed{\text{イ}}}$ であり、$\triangle\mathrm{ABC}$ の面積は $\dfrac{\boxed{\text{ウエ}}\sqrt{\boxed{\text{オ}}}}{\boxed{\text{カ}}}$ である。

  (2) $\triangle\mathrm{ABC}$ の外接円の半径は $\dfrac{\boxed{\text{キ}}\sqrt{\boxed{\text{ク}}}}{\boxed{\text{ケ}}}$ である。

  (3) 頂点 $\mathrm{O}$ から平面 $\mathrm{ABC}$ に垂線 $\mathrm{OH}$ を下ろす。$\mathrm{OH}=\dfrac{\boxed{\text{コ}}\sqrt{\boxed{\text{サシ}}}}{\boxed{\text{ス}}}$ であり、四面体 $\mathrm{OABC}$ の体積は $\boxed{\text{セ}}\sqrt{\boxed{\text{ソ}}}$ である。
blanks:
  - { label: ア, answer: "1" }
  - { label: イ, answer: "8" }
  - { label: ウエ, answer: "15" }
