author:
  intent: |
    1の3乗根 $\omega$ を「$x^2+x+1$ で割った余りを調べる道具」として使えるかをみる証明問題。$\omega$ の性質の導出（r1）、余りの次数の設定（r2）、指数の3による場合分け（r3）、$p\omega+q=0$ から $p=q=0$ を導く論理の詰め（r4）を分けて採点できるように設計した。r4 の「$\omega$ が虚数なので」の一言を欠く答案は上位層にも多く、論証の完成度で差がつく。(2) は (1) の議論が「$n$ が3の倍数でない」ことをどこで使ったかを確認させる役割をもつ。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学II (1) ア(オ) 因数定理と簡単な高次方程式（1の3乗根）, 数学II (1) イ(イ) 等式や不等式が成り立つことの証明]
  variations:
    - $x^{2n}+x^n+1$ を $x^2-x+1$ で割り切れるための $n$ の条件を、$-\omega$ を用いて調べさせる。
    - $x^{100}$ を $x^2+x+1$ で割った余り（$x$）を求めさせる。
