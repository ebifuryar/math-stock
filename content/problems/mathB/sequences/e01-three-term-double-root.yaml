id: mb-sq-e01
level: exam
format: choice
title: 隣接3項間漸化式（特性方程式が重解をもつ場合）
stem: |
  数列 $\{a_n\}$ が
  $$a_1=1,\qquad a_2=4,\qquad a_{n+2}=4a_{n+1}-4a_n\quad(n=1,\ 2,\ 3,\ \cdots)$$
  で定められている。一般項 $a_n$ として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $a_n=4^{n-1}$
    rationale: |
      $a_1=1,\ a_2=4$ だけを見て公比 $4$ の等比数列と早合点している。実際は $a_3=4\cdot 4-4\cdot 1=12$ であり、$4^2=16$ と一致しない。
  - id: "2"
    text: $a_n=n\cdot 2^{n-1}$
    rationale: |
      正解。$a_{n+1}-2a_n=2^n$ の両辺を $2^{n+1}$ で割ると、$\dfrac{a_n}{2^n}$ は初項 $\dfrac{1}{2}$、公差 $\dfrac{1}{2}$ の等差数列になる。
  - id: "3"
    text: $a_n=(n+1)\cdot 2^{n-1}$
    misconception: mc-sq-characteristic-misuse
    rationale: |
      $c_n=\dfrac{a_n}{2^n}$ とおいたのに、初項を $c_1=a_1=1$ のままにしている。正しくは $c_1=\dfrac{a_1}{2}=\dfrac{1}{2}$。$n=1$ で $a_1=2$ となり、与えられた初項と合わない。
  - id: "4"
    text: $a_n=(2n-1)\cdot 2^{n-1}$
    rationale: |
      $a_{n+1}-2a_n=2^n$ を $2^n$ で割ったのに、$\dfrac{a_{n+1}}{2^n}$ を $c_{n+1}=\dfrac{a_{n+1}}{2^{n+1}}$ と同一視して $c_{n+1}-c_n=1$ としている。$n=1$ では $1$ で一致するが、$a_2=6$ となり誤り。
answer: "2"
solution: |
  特性方程式 $x^2=4x-4$、すなわち $(x-2)^2=0$ は重解 $x=2$ をもつ。漸化式は
  $$a_{n+2}-2a_{n+1}=2(a_{n+1}-2a_n)$$
  と変形できるので、$\{a_{n+1}-2a_n\}$ は初項 $a_2-2a_1=2$、公比 $2$ の等比数列で
  $$a_{n+1}-2a_n=2\cdot 2^{n-1}=2^n$$
  両辺を $2^{n+1}$ で割ると
  $$\frac{a_{n+1}}{2^{n+1}}-\frac{a_n}{2^n}=\frac{1}{2}$$
  $c_n=\dfrac{a_n}{2^n}$ は初項 $c_1=\dfrac{1}{2}$、公差 $\dfrac{1}{2}$ の等差数列なので $c_n=\dfrac{n}{2}$、よって $a_n=n\cdot 2^{n-1}$。

  検算: $a_3=3\cdot 4=12=4\cdot 4-4\cdot 1$、$a_4=4\cdot 8=32=4\cdot 12-4\cdot 4$。
concepts: [sq-recurrence-advanced, sq-recurrence-basic]
misconceptions: [mc-sq-characteristic-misuse]
targetSeconds: 420
irt: { expectedCorrectRate: 0.38, discrimination: 1.3 }
author:
  intent: |
    隣接3項間漸化式で特性方程式が重解をもつ場合を扱えるかをみる。異なる2解の場合のように「2本の式から $a_{n+1}$ を消去する」ことができないため、$a_{n+1}-2a_n=2^n$ を $2^{n+1}$ で割って等差型に帰着させる一段が必要になる。①は初めの2項だけで規則を決める早合点、③は置き換えた数列の初項の変換忘れ、④は割る数と添字の対応の誤りで、③は $n=1$、④は $n=2$ の検算で棄却できるように設計した。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (1) ア(ウ) 漸化式と数学的帰納法（漸化式）"]
  variations:
    - $a_{n+2}=5a_{n+1}-6a_n$（解 $2,\ 3$）として、2本の式から $a_{n+1}$ を消去する通常の場合と比較させる。
    - 一般項を推定させ、数学的帰納法で証明させる（2つ前までを仮定する形の帰納法）。
