author:
  intent: |
    2円の位置関係を中心間の距離と半径の和・差で判定できるか（外接と内接の区別）、そして2円の交点を通る図形の考え方を、直線（共通弦）と円の両方に使えるかをみる。(2) で共通弦が $C_1$ の中心を通るように設定し、交点を求めなくても長さが直径とわかる図形的な見方ができるかを識別する。(3) は $f+t\cdot(\text{直線})=0$ の形を使うと計算が最も軽くなる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (2) ア(ウ) 円の方程式・2つの円の位置関係]
  variations:
    - $C_1$ と $C_2$ が共有点をもたない $a$ の範囲（$0<a<\dfrac{\sqrt{5}}{5},\ \sqrt{5}<a$）を問う。
    - $a$ を動かしたときの共通弦の中点の軌跡を求めさせる。
