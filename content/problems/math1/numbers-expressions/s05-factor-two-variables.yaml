id: m1-ne-s05
level: school
format: written
title: 2文字を含む式のたすき掛け
stem: |
  次の式を因数分解せよ。途中の過程も記せ。
  $$2x^2+5xy+2y^2-5x-y-3$$
modelAnswer: |
  $x$ について降べきの順に整理すると
  $$2x^2+(5y-5)x+(2y^2-y-3)$$

  定数項（$x$ を含まない部分）を因数分解すると
  $$2y^2-y-3=(y+1)(2y-3)$$

  よって与式は $2x^2+(5y-5)x+(y+1)(2y-3)$ である。$2=2\times 1$、$(y+1)(2y-3)$ の組でたすき掛けをすると
  $$2\cdot(2y-3)+1\cdot(y+1)=5y-5$$
  となり、$x$ の係数と一致する。

  したがって
  $$2x^2+5xy+2y^2-5x-y-3=\{2x+(y+1)\}\{x+(2y-3)\}=\mathbf{(2x+y+1)(x+2y-3)}$$

  検算: $(2x+y+1)(x+2y-3)=2x^2+4xy-6x+xy+2y^2-3y+x+2y-3=2x^2+5xy+2y^2-5x-y-3$ となり、与式に一致する。

rubric:
  - id: r1
    criterion: $x$（または $y$）について降べきの順に整理し、$2x^2+(5y-5)x+(2y^2-y-3)$ の形にしている
    points: 2
    keywords: ["整理", "5y-5"]
  - id: r2
    criterion: $x$ を含まない部分 $2y^2-y-3$ を $(y+1)(2y-3)$ と正しく因数分解している
    points: 3
    keywords: ["(y+1)(2y-3)", "(2y-3)(y+1)"]
  - id: r3
    criterion: たすき掛けで、$x$ の係数 $5y-5$ になる組合せ（$2$ と $2y-3$、$1$ と $y+1$）を正しく選んでいる
    points: 3
    keywords: ["たすき", "2x+y+1"]
  - id: r4
    criterion: 最終結果 $(2x+y+1)(x+2y-3)$ を答えている（因数の順序は問わない）
    points: 2
    keywords: ["(2x+y+1)(x+2y-3)", "(x+2y-3)(2x+y+1)"]
solution: |
  2文字の2次式は、1つの文字（ここでは $x$）について整理し、定数項（$y$ の2次式）を先に因数分解してからたすき掛けをする。最後は展開して検算する。
concepts: [ne-factorization]
misconceptions: [mc-ne-factorization-error]
targetSeconds: 300
irt: { expectedCorrectRate: 0.62, discrimination: 1.1 }
author:
  intent: |
    2文字を含む2次式を「1文字について整理 → 定数項の因数分解 → たすき掛け」という手順で処理できるかをみる。$2x^2+5xy+2y^2=(2x+y)(x+2y)$ に気づいて当てずっぽうに定数を探す方法では、$(2x+y+3)(x+2y-1)$ などの誤った組合せで止まりやすい。記述式にすることで、整理の手順を踏んでいるか、検算しているかを評価できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (1) ア(ウ) 二次の乗法公式と因数分解]
  variations:
    - $x^2+3xy+2y^2+2x+5y-3$ のように $x^2$ の係数が $1$ の易しい版にする。
    - 次数の異なる2文字の式（例として $a^2b+a^2-b-1$）で「次数の低い文字について整理」を問う。
