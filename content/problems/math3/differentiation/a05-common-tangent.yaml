id: m3-df-a05
level: applied
format: written
title: 指数関数と対数関数のグラフの共通接線
stem: |
  2つの曲線
  $$C_1:\ y=e^x,\qquad C_2:\ y=\log x+2$$
  の両方に接する直線（共通接線）について考える。

  (1) $C_1$ 上の点 $(t,\ e^t)$ における接線 $\ell$ の方程式を求めよ。

  (2) $\ell$ が $C_2$ にも接するための、$t$ についての条件を求めよ。

  (3) $C_1$ と $C_2$ の共通接線をすべて求めよ。
modelAnswer: |
  (1) $y'=e^x$ より、$\ell$ の方程式は $y-e^t=e^t(x-t)$、すなわち
  $$\ell:\ y=e^tx+(1-t)e^t$$

  (2) $C_2$ 上の点 $(s,\ \log s+2)\ (s>0)$ における接線は、$y'=\dfrac{1}{x}$ より
  $$y=\frac{1}{s}(x-s)+\log s+2=\frac{1}{s}x+\log s+1$$
  $\ell$ が $C_2$ に接する $\iff$ ある $s>0$ についてこの直線と $\ell$ が一致する $\iff$ 傾きと切片がそれぞれ等しい:
  $$\frac{1}{s}=e^t,\qquad \log s+1=(1-t)e^t$$
  第1式より $s=e^{-t}$（$s>0$ を満たす）、$\log s=-t$。第2式に代入して
  $$1-t=(1-t)e^t\quad\iff\quad(1-t)(e^t-1)=0$$
  よって求める条件は **$t=0$ または $t=1$**。

  (3) $t=0$ のとき、(1) より $\ell:\ y=x+1$（$C_2$ との接点は $s=1$ で $(1,\ 2)$）。

  $t=1$ のとき、$\ell:\ y=ex$（$C_2$ との接点は $s=e^{-1}$ で $\left(\dfrac{1}{e},\ 1\right)$）。

  共通接線は $C_1$ 上のどこかで $C_1$ に接するので、(1) の $\ell$ の形で表され、(2) の条件を満たす。よって共通接線は
  $$y=x+1,\qquad y=ex$$
  の **2本** である。
rubric:
  - id: r1
    criterion: (1) で接線 $y=e^tx+(1-t)e^t$ を正しく求めている
    points: 2
    keywords: ["e^t", "(1-t)e^t"]
  - id: r2
    criterion: (2) で $C_2$ 上の点 $(s,\ \log s+2)$ における接線を求め、傾きと切片の一致を条件として立式している
    points: 3
    keywords: ["1/s", "logs+1"]
  - id: r3
    criterion: (2) で $s=e^{-t}$ を代入して $(1-t)(e^t-1)=0$ を導き、$t=0,\ 1$ を得ている（両辺を $1-t$ で割って $t=1$ を落としていない）
    points: 3
    keywords: ["(1-t)(e^t-1)=0", "t=1"]
  - id: r4
    criterion: (3) で共通接線 $y=x+1$ と $y=ex$ の2本を答えている
    points: 2
    keywords: ["y=x+1", "y=ex"]
solution: |
  共通接線は「一方の曲線の接線が他方の曲線にも接する」条件で求める。$C_1$ の接点を $t$、$C_2$ の接点を $s$ とおいて傾きと切片を比べると、$s=e^{-t}$ と $(1-t)(e^t-1)=0$ が得られる。$t=0$ から $y=x+1$、$t=1$ から $y=ex$ の2本。$y=x+1$ は見つけやすいが、$1-t$ で両辺を割ると $y=ex$ を見落とす。
concepts: [df-tangent-normal, df-elementary]
misconceptions: []
targetSeconds: 600
irt: { expectedCorrectRate: 0.45, discrimination: 1.2 }
author:
  intent: |
    共通接線を「2つの接点を文字でおき、傾きと切片を一致させる」という手順で求められるかをみる。$C_2$ は $C_1$ を $y=x$ に関して折り返して上に $2$ だけずらした曲線で、2曲線は共有点をもたないので、「共有点で接する」条件と混同すると立式できない。(2) で $1-t=(1-t)e^t$ の両辺を $1-t$ で割ってしまうと $t=1$ の解（$y=ex$）を失うので、因数分解して解を拾う丁寧さを r3 で評価する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (2) イ(イ) 導関数の応用（接線・共通接線）"]
  variations:
    - 曲線 $y=ax^2$ と $y=\log x$ が接する（共有点で共通の接線をもつ）ときの $a$ の値（$a=\dfrac{1}{2e}$）と接点を求めさせる。
    - $C_2$ を $y=\log x+k$ として、共通接線の本数を $k$ の値で分類させる。
