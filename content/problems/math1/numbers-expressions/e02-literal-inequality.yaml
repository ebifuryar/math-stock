id: m1-ne-e02
level: exam
format: choice
title: 文字係数の1次不等式
stem: |
  $a$ を定数とする。$x$ についての不等式
  $$a^2x+1\geqq a(x+1)$$
  を解いた結果として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $a>1$ のとき $x\geqq\dfrac{1}{a}$、$a<1$ かつ $a\neq 0$ のとき $x\leqq\dfrac{1}{a}$、$a=0,\ 1$ のときすべての実数
    misconception: mc-ne-inequality-direction
    rationale: |
      $x$ の係数 $a(a-1)$ の符号を、$a-1$ の符号だけで判断している。$a<0$ のときは $a(a-1)>0$ なので向きは変わらず $x\geqq\dfrac{1}{a}$ となる。$a=-1$ とすると不等式は $2x\geqq -2$ で $x\geqq -1$ である。
  - id: "2"
    text: $a<0,\ 1<a$ のとき $x\geqq\dfrac{1}{a}$、$0<a<1$ のとき $x\leqq\dfrac{1}{a}$、$a=1$ のときすべての実数、$a=0$ のとき解はない
    misconception: mc-ne-inequality-direction
    rationale: |
      $a=0$ の扱いだけが誤り。$a=0$ のとき不等式は $0\cdot x\geqq -1$ となり、左辺は常に $0$ で $-1$ 以上なので、すべての実数が解である。
  - id: "3"
    text: $a>0$ のとき $x\geqq\dfrac{1}{a}$、$a<0$ のとき $x\leqq\dfrac{1}{a}$、$a=1$ のときすべての実数、$a=0$ のとき解はない
    misconception: mc-ne-inequality-direction
    rationale: |
      $a(a-1)x\geqq a-1$ の両辺を、符号の分からない $a-1$ で割って $ax\geqq 1$ としている。$0<a<1$ では $a-1<0$ なので向きが変わる。$a=\dfrac{1}{2}$ とすると不等式は $-\dfrac{1}{4}x\geqq -\dfrac{1}{2}$ で $x\leqq 2$ である。
  - id: "4"
    text: $a<0,\ 1<a$ のとき $x\geqq\dfrac{1}{a}$、$0<a<1$ のとき $x\leqq\dfrac{1}{a}$、$a=0,\ 1$ のときすべての実数
    rationale: |
      正解。$x$ の係数 $a(a-1)$ の符号（正・負・$0$）で3通りに分け、$0$ の場合は $a=0$ と $a=1$ をそれぞれ確かめている。
answer: "4"
solution: |
  移項して整理すると
  $$a^2x-ax\geqq a-1,\qquad a(a-1)x\geqq a-1$$

  $x$ の係数 $a(a-1)$ の符号で分ける。
  - $a(a-1)>0$、すなわち $a<0$ または $a>1$ のとき
    $$x\geqq\frac{a-1}{a(a-1)}=\frac{1}{a}$$
  - $a(a-1)<0$、すなわち $0<a<1$ のとき、向きが変わって $x\leqq\dfrac{1}{a}$
  - $a=0$ のとき $0\cdot x\geqq -1$ となり、すべての実数が解
  - $a=1$ のとき $0\cdot x\geqq 0$ となり、すべての実数が解

  （$a-1$ で約分してはいけない。$a-1$ の符号は $a$ によって変わる。）
concepts: [ne-linear-inequality]
misconceptions: [mc-ne-inequality-direction]
targetSeconds: 300
irt: { expectedCorrectRate: 0.3, discrimination: 1.5 }
author:
  intent: |
    文字係数の1次不等式で、係数の符号による場合分けを過不足なく行えるかをみる。両辺に共通因数 $a-1$ が現れるように設計してあり、符号未定の式で約分する誤り（③）、符号判断を一方の因数だけで行う誤り（①）、係数 $0$ の不等式の真偽を誤る誤り（②）を独立に検出できる。正答には $a=0$ と $a=1$ の両方を確認する必要がある。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (1) ア(エ) 一次不等式]
  variations:
    - 不等号を $>$ にして、$a=0,\ 1$ のときに解がなくなる場合と比べさせる。
    - $ax>a^2$ のような簡単な形で、場合分けの型を練習させる。
