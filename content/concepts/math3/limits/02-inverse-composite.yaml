id: lm-inverse-composite
kind: definition
title: 逆関数と合成関数
body: |
  **逆関数**: 関数 $y=f(x)$ で、値域の各 $y$ に対して $x$ がただ1つ定まるとき、$x=g(y)$ と表し、文字を入れ替えた $y=g(x)$ を $f$ の逆関数 $f^{-1}(x)$ という。求め方は
  1. $y=f(x)$ を $x$ について解く（$x=g(y)$）。
  2. $x$ と $y$ を入れ替える。
  3. **定義域と値域を入れ替える**: $f^{-1}$ の定義域は $f$ の値域、$f^{-1}$ の値域は $f$ の定義域。

  例: $f(x)=\sqrt{x-2}+1\ (x\geqq 2)$ の値域は $y\geqq 1$ なので、$f^{-1}(x)=(x-1)^2+2\ (x\geqq 1)$。定義域を書かないと放物線全体になり、別の関数になる。

  $y=f(x)$ と $y=f^{-1}(x)$ のグラフは直線 $y=x$ に関して対称。$f^{-1}(x)=f(x)$ となるのは、グラフ自身が $y=x$ に関して対称なとき（例: $y=\dfrac{x+3}{x-1}$。漸近線の交点 $(1,\ 1)$ が $y=x$ 上にある）。

  **合成関数**: $(g\circ f)(x)=g(f(x))$。**先に $f$、あとで $g$** を施す。一般に $g\circ f\neq f\circ g$。$g\circ f$ が定義されるには、$f$ の値域が $g$ の定義域に含まれる必要がある。また $(f^{-1}\circ f)(x)=x$。
prerequisites: [lm-rational-irrational]
