id: el-change-of-base
kind: formula
title: 底の変換公式
body: |
  $a,\ b,\ c$ が正の数で、$a\neq 1,\ c\neq 1$ のとき
  $$\log_a b=\frac{\log_c b}{\log_c a}$$
  **分子が真数、分母が底**。$\log_a b=p$ とおくと $a^p=b$、両辺の $c$ を底とする対数をとれば $p\log_c a=\log_c b$ となることから導ける。

  よく使う形:
  - $\log_a b=\dfrac{1}{\log_b a}$、$\log_a b\cdot\log_b c=\log_a c$
  - $\log_{a^2} M=\dfrac{1}{2}\log_a M$（例: $\log_4 M=\dfrac{\log_2 M}{2}$）

  底の異なる対数を含む方程式・不等式や大小比較では、まず底をそろえる。
prerequisites: [el-log-definition]
