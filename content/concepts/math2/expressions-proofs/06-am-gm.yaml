id: ep-am-gm
kind: theorem
title: 相加平均と相乗平均の関係
body: |
  $a>0,\ b>0$ のとき
  $$\frac{a+b}{2}\geqq\sqrt{ab}\qquad\left(a+b\geqq 2\sqrt{ab}\right)$$
  等号は $a=b$ のときに限り成り立つ。（証明: $a+b-2\sqrt{ab}=(\sqrt{a}-\sqrt{b})^2\geqq 0$）

  **最小値を求めるときの手順**
  1. 和の2項が **正** であることを確認する。
  2. 積が **定数** になる組を作る（例: $x+\dfrac{4}{x}\geqq 2\sqrt{4}=4$）。積が定数でなければ下限は定まらない。
  3. **等号が成り立つ値が実際に存在する** ことを確かめる。これがないと「$\geqq 4$」は言えても「最小値 $4$」とは言えない。

  **2回使うときの落とし穴** 不等式を2つ掛けたり足したりするとき、それぞれの等号成立条件が **同時に** 満たされないと、得られた値は最小値にならない。その場合は式を展開する・条件式を掛けるなどして、1回の相加・相乗平均で済む形にする。

  例: $x,\ y>0,\ x+2y=1$ のとき
  $$\frac{1}{x}+\frac{1}{y}=\left(\frac{1}{x}+\frac{1}{y}\right)(x+2y)=3+\frac{2y}{x}+\frac{x}{y}\geqq 3+2\sqrt{2}$$
prerequisites: [ep-proof-methods]
