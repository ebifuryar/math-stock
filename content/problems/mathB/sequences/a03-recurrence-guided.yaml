author:
  intent: |
    共通テスト型の誘導問題。$a_{n+1}=pa_n+(n\text{ の1次式})$ 型を、$b_n=a_n-(pn+q)$ という置き換えに沿って解けるかをみる。(2) で「すべての $n$ について成り立つ」を係数比較（恒等式）として処理できるか、(3) で置き換えた数列の初項を $b_1=a_1-3$ と変換できるか（$a_1=4$ のままだと $a_n=4\cdot 2^{n-1}+2n+1$ となり (1) と矛盾する）を段階的に確認する。(1) の具体的な値は (3) の検算にも使えるよう配置した。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (1) ア(ウ) 漸化式と数学的帰納法（漸化式）", "数学B (1) イ(ア) 事象の再帰的な関係を漸化式で表す"]
  variations:
    - 誘導を「$c_n=a_{n+1}-a_n$ とおく」に変え、階差数列の漸化式経由で同じ一般項を導かせる。
    - $a_{n+1}=3a_n+2^n$ とし、両辺を $2^{n+1}$ で割る誘導にする。
