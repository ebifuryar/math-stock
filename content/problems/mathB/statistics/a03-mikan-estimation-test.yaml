id: mb-st-a03
level: applied
format: mark
title: みかんの重さの推定と検定（会話形式）
stem: |
  ある農園では、出荷するみかん1個の重さの平均が $100$ g になるように管理している。この農園で収穫されるみかん1個の重さ（g）を確率変数 $X$ とし、$X$ は正規分布 $N(m,\ 10^2)$ に従うとする。母標準偏差 $10$ g は過去の記録からわかっているものとする。

  以下では、$Z$ を標準正規分布に従う確率変数とし、$p(z_0)=P(0\leqq Z\leqq z_0)$ の値は次の正規分布表のとおりとする。

  | $z_0$ | $1.00$ | $1.50$ | $1.80$ | $1.96$ | $2.00$ | $2.50$ |
  | --- | --- | --- | --- | --- | --- | --- |
  | $p(z_0)$ | $0.3413$ | $0.4332$ | $0.4641$ | $0.4750$ | $0.4772$ | $0.4938$ |

  (1) $m=100$ のとき、収穫したみかん1個の重さが $115$ g 以上である確率は $0.\boxed{\text{アイウエ}}$ である。

  (2) 太郎さんと花子さんは、今年のみかんが例年より軽くなっていないかを調べることにした。

  > 太郎：今年収穫したみかんから無作為に $64$ 個を選んで重さを量ったら、標本平均は $97.75$ g だったよ。
  >
  > 花子：$64$ 個あれば、標本平均 $\overline{X}$ は近似的に正規分布に従うと考えてよいね。$\overline{X}$ の標準偏差は $\boxed{\text{オ}}.\boxed{\text{カキ}}$ g だよ。
  >
  > 太郎：それを使うと、今年の母平均 $m$ に対する信頼度 $95\%$ の信頼区間は $\boxed{\text{クケ}}.\boxed{\text{コサ}}\leqq m\leqq\boxed{\text{シスセ}}.\boxed{\text{ソタ}}$ になるね。

  (3)

  > 花子：$100$ はこの区間に含まれているね。今年も平均は $100$ g だと確かめられたのかな。
  >
  > 太郎：そう言い切ってよいかはわからないよ。「今年の母平均は $100$ g より小さい」を対立仮説、「$m=100$」を帰無仮説として、有意水準 $5\%$ で仮説検定をしてみよう。

  帰無仮説が正しいとき、(2) で求めた $\overline{X}$ の標準偏差を用いて $W=\dfrac{\overline{X}-100}{\sigma(\overline{X})}$ とおくと、$W$ は近似的に標準正規分布に従う。$\overline{X}=97.75$ のときの $W$ の値は $\boxed{\text{チツ}}.\boxed{\text{テ}}$ であり、帰無仮説のもとで $W$ がこの値以下となる確率は $0.\boxed{\text{トナニヌ}}$ である。この結果から、$\boxed{\text{ネ}}$。

  $\boxed{\text{ネ}}$ に当てはまるものを、次の $0$ 〜 $3$ のうちから一つ選べ。

  $0$：今年の母平均は $100$ g より小さいと判断できる

  $1$：今年の母平均は $100$ g より小さいとは判断できない

  $2$：今年の母平均は $100$ g であると判断できる

  $3$：今年の母平均は $100$ g より大きいと判断できる

  (4)

  > 花子：もし対立仮説を「今年の母平均は $100$ g ではない」として両側検定をしたら、どうなるの？

  この場合、帰無仮説のもとで $|W|$ が観測された値の絶対値以上となる確率は $0.\boxed{\text{ノハヒフ}}$ であり、有意水準 $5\%$ で帰無仮説は $\boxed{\text{ヘ}}$。

  $\boxed{\text{ヘ}}$ に当てはまるものを、次の $0$、$1$ のうちから一つ選べ。

  $0$：棄却される　$1$：棄却されない

  (5) 二人の会話や (1)〜(4) の結果について述べた次の $0$ 〜 $3$ のうち、正しいものは $\boxed{\text{ホ}}$ である。

  $0$：$100$ が信頼度 $95\%$ の信頼区間に含まれるので、今年の母平均は $100$ g であると判断できる。

  $1$：片側検定で帰無仮説が棄却されたので、同じデータで両側検定を行っても必ず棄却される。

  $2$：有意水準 $5\%$ の両側検定で帰無仮説 $m=100$ が棄却されないことと、$100$ が信頼度 $95\%$ の信頼区間に含まれることは、同じことを表している。

  $3$：有意水準を $1\%$ に変えると、片側検定でも帰無仮説は棄却されやすくなる。
