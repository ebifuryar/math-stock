id: ma-pr-e03
level: exam
format: mark
title: 最大値と最小値が指定された確率とその最大化
stem: |
  $n$ を $2$ 以上の整数とする。$1$ 個のさいころを $n$ 回投げるとき、出た目の最大値が $5$ かつ最小値が $2$ である確率を $p_n$ とする。

  出た目がすべて $2$ 以上 $5$ 以下である事象を $A$、すべて $2$ 以上 $4$ 以下である事象を $B$、すべて $3$ 以上 $5$ 以下である事象を $C$ とする。

  $P(A)=\left(\dfrac{\boxed{\text{ア}}}{\boxed{\text{イ}}}\right)^n$ であり、包除原理により
  $$P(B\cup C)=2\left(\frac{\boxed{\text{ウ}}}{\boxed{\text{エ}}}\right)^n-\left(\frac{\boxed{\text{オ}}}{\boxed{\text{カ}}}\right)^n$$
  である。最大値が $5$ かつ最小値が $2$ である事象は、$A$ から $B\cup C$ を除いたものであるから
  $$p_n=\frac{\boxed{\text{キ}}^{\,n}-\boxed{\text{ク}}\cdot\boxed{\text{ケ}}^{\,n}+\boxed{\text{コ}}^{\,n}}{6^n}$$
  となる。

  さらに、$p_n$ を最大にする $n$ は $n=\boxed{\text{サ}}$ であり、そのときの確率は $\dfrac{\boxed{\text{シス}}}{\boxed{\text{セソタ}}}$ である。

  ただし、分数は既約分数で答えよ。
blanks:
  - { label: ア, answer: "2" }
  - { label: イ, answer: "3" }
  - { label: ウ, answer: "1" }
  - { label: エ, answer: "2" }
  - { label: オ, answer: "1" }
  - { label: カ, answer: "3" }
  - { label: キ, answer: "4" }
  - { label: ク, answer: "2" }
  - { label: ケ, answer: "3" }
  - { label: コ, answer: "2" }
  - { label: サ, answer: "4" }
  - { label: シス, answer: "55" }
  - { label: セソタ, answer: "648" }
solution: |
  $P(A)=\left(\dfrac{4}{6}\right)^n=\left(\dfrac{2}{3}\right)^n$、$P(B)=P(C)=\left(\dfrac{3}{6}\right)^n=\left(\dfrac{1}{2}\right)^n$、$B\cap C$ はすべて $3$ 以上 $4$ 以下で $P(B\cap C)=\left(\dfrac{1}{3}\right)^n$。
  $$P(B\cup C)=2\left(\frac{1}{2}\right)^n-\left(\frac{1}{3}\right)^n$$
  $B\cup C\subset A$ なので
  $$p_n=\left(\frac{2}{3}\right)^n-2\left(\frac{1}{2}\right)^n+\left(\frac{1}{3}\right)^n=\frac{4^n-2\cdot 3^n+2^n}{6^n}$$

  最大化：
  $$p_{n+1}-p_n=\left(\frac{1}{2}\right)^n-\frac{1}{3}\left(\frac{2}{3}\right)^n-\frac{2}{3}\left(\frac{1}{3}\right)^n$$
  $\left(\dfrac{1}{2}\right)^n\div\dfrac{1}{3}\left(\dfrac{2}{3}\right)^n=3\left(\dfrac{3}{4}\right)^n$ は $n\geqq 4$ で $3\cdot\dfrac{81}{256}<1$ となるので、$n\geqq 4$ では $p_{n+1}<p_n$。一方 $p_2=\dfrac{1}{18},\ p_3=\dfrac{1}{12},\ p_4=\dfrac{110}{1296}=\dfrac{55}{648}$ で $p_2<p_3<p_4$（$p_4-p_3=\dfrac{1}{648}$）。よって $n=4$ で最大、$p_4=\dfrac{55}{648}$。
