id: mc-cv-e04
level: exam
format: mark
title: 双曲線と直線の共有点の個数
stem: |
  $m$ を実数の定数とする。双曲線 $H:\ x^2-y^2=1$ と直線 $\ell:\ y=mx+1$ の共有点について考える。

  (1) $y$ を消去すると
  $$(\boxed{\text{ア}}-m^2)x^2-\boxed{\text{イ}}\,mx-\boxed{\text{ウ}}=0\qquad\cdots(*)$$
  を得る。

  (2) $m^2=\boxed{\text{エ}}$ のとき、$(*)$ は1次方程式となり、$H$ と $\ell$ の共有点はちょうど1個である。このとき $\ell$ は $H$ の漸近線に平行である。

  (3) $H$ と $\ell$ が接するのは $m=\pm\sqrt{\boxed{\text{オ}}}$ のときであり、$m=\sqrt{\boxed{\text{オ}}}$ のときの接点の座標は $\left(-\sqrt{\boxed{\text{カ}}},\ \boxed{\text{キク}}\right)$ である。

  (4) $H$ と $\ell$ の共有点がちょうど1個となる $m$ の値は全部で $\boxed{\text{ケ}}$ 個ある。

  (5) $H$ と $\ell$ が異なる2点で交わり、その2点が $H$ の異なる枝（$x>0$ の部分と $x<0$ の部分）にあるような $m$ の値の範囲は $\boxed{\text{コサ}}<m<\boxed{\text{シ}}$ である。
blanks:
  - { label: ア, answer: "1" }
  - { label: イ, answer: "2" }
  - { label: ウ, answer: "2" }
  - { label: エ, answer: "1" }
  - { label: オ, answer: "2" }
  - { label: カ, answer: "2" }
  - { label: キク, answer: "-1" }
  - { label: ケ, answer: "4" }
  - { label: コサ, answer: "-1" }
  - { label: シ, answer: "1" }
solution: |
  (1) $x^2-(mx+1)^2=1\iff(1-m^2)x^2-2mx-2=0$。

  (2) $m^2=1$ のとき $-2mx-2=0$ より $x=-\dfrac{1}{m}$ のただ1つ。$H$ の漸近線は $y=\pm x$ で、$\ell$ はこれに平行。共有点は1個だが、接してはいない（直線の両側に $H$ の点がある）。

  (3) $m^2\neq 1$ のとき、$(*)$ の判別式は $\dfrac{D}{4}=m^2+2(1-m^2)=2-m^2$。接するのは $D=0$、すなわち $m=\pm\sqrt{2}$。$m=\sqrt{2}$ のとき $(*)$ は $-x^2-2\sqrt{2}x-2=0$、$(x+\sqrt{2})^2=0$ より $x=-\sqrt{2}$、$y=\sqrt{2}\cdot(-\sqrt{2})+1=-1$。接点 $(-\sqrt{2},\ -1)$。

  （検算: 点 $(-\sqrt{2},\ -1)$ における接線は $-\sqrt{2}x-(-1)y=1$、すなわち $y=\sqrt{2}x+1$。）

  (4) 共有点が1個となるのは、漸近線に平行な $m=\pm 1$ と、接する $m=\pm\sqrt{2}$ の $4$ 個。

  (5) 2点が異なる枝にある $\iff$ $(*)$ が異符号の2実数解をもつ。$m^2\neq 1$ のもとで2解の積は $\dfrac{-2}{1-m^2}$ で、これが負となるのは $1-m^2>0$、すなわち $-1<m<1$。このとき $D/4=2-m^2>0$ も成り立つ。

  （$1<|m|<\sqrt{2}$ のときは2解の積が正で、2点は同じ枝にある。）
