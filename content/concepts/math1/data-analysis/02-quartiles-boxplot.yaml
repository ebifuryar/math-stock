id: da-quartiles-boxplot
kind: method
title: 四分位数・四分位範囲と箱ひげ図
body: |
  データを小さい順に並べ、中央値 $Q_2$ を境に **下位のデータ** と **上位のデータ** に分ける。

  - $n$ が奇数のときは、中央値そのものは **どちらにも含めない**。
  - 下位のデータの中央値が **第1四分位数** $Q_1$、上位のデータの中央値が **第3四分位数** $Q_3$。

  **四分位範囲** は $Q_3-Q_1$。データの中央付近の約半数が入る区間の幅を表し、外れ値の影響を受けにくい散らばりの指標である。

  **箱ひげ図** は最小値・$Q_1$・$Q_2$・$Q_3$・最大値（5数要約）を図示したもの。箱が $Q_1$ から $Q_3$、ひげが最小値・最大値まで伸びる。

  - 箱ひげ図の各区間（ひげ・箱の左半分・右半分・ひげ）には、それぞれ全体の **約4分の1ずつ** のデータが入る。区間が長いことはデータが多いことを意味せず、**その範囲でデータがまばら** であることを意味する。
  - 箱ひげ図から **平均値は読み取れない**。
  - ヒストグラムとの対応は、「小さいほうから何番目の値が $Q_1,\ Q_2,\ Q_3$ か」を求め、その値がどの階級に入るかを累積度数で調べる。
prerequisites: [da-representative-values]
