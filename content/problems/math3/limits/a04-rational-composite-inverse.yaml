author:
  intent: |
    分数関数の基本操作（漸近線・合成・逆関数・不等式）を1つの関数で通して確認する誘導問題。(2) は合成の順序 $f\circ g$ と $g\circ f$ の区別、(3) は $f^{-1}=f$ となる関数を通して逆関数とグラフの対称性の結びつきをみる。(4) では両辺に $x-1$ を掛けて $-1\leqq x\leqq 3$ とする誤り（$x-1<0$ の場合の不等号の向きを無視）や、$x=1$ を含める誤りで差がつく。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (1) ア(ウ) 分数関数と無理関数", "数学III (1) ア(エ) 合成関数と逆関数", "数学III (1) イ(イ) 分数関数と無理関数のグラフの考察"]
  variations:
    - $f(x)=\dfrac{ax+3}{x-1}$ として、$f^{-1}(x)=f(x)$ となる $a$ の値（$a=1$）を求めさせる。
    - 不等式 $\dfrac{x+3}{x-1}\geqq x+k$ の解に整数がちょうど3個含まれる $k$ の範囲を問う。
