id: mb-st-s05
level: school
format: written
title: 母平均の推定と信頼区間の意味
stem: |
  ある高校の生徒全体から無作為に $100$ 人を選び、1日の睡眠時間を調べたところ、標本平均は $400$ 分であった。母標準偏差は $30$ 分であることがわかっているものとする。

  (1) この高校の生徒全体の睡眠時間の母平均 $m$ に対する信頼度 $95\%$ の信頼区間を求めよ。

  (2) (1) で求めた区間の「信頼度 $95\%$」とはどういう意味か、説明せよ。

  ただし、$Z$ が標準正規分布に従うとき $P(-1.96\leqq Z\leqq 1.96)=0.95$ である。
modelAnswer: |
  (1) 標本の大きさは $n=100$、母標準偏差は $\sigma=30$ である。$n$ は十分大きいので、標本平均 $\overline{X}$ は近似的に正規分布 $N\!\left(m,\ \dfrac{30^2}{100}\right)$ に従い、その標準偏差は
  $$\frac{\sigma}{\sqrt{n}}=\frac{30}{\sqrt{100}}=3$$
  である。$Z=\dfrac{\overline{X}-m}{3}$ は近似的に $N(0,\ 1)$ に従うから、$P\left(-1.96\leqq\dfrac{\overline{X}-m}{3}\leqq 1.96\right)=0.95$。これを $m$ について解くと
  $$\overline{X}-1.96\times 3\leqq m\leqq \overline{X}+1.96\times 3$$
  $\overline{X}=400$、$1.96\times 3=5.88$ を代入して、求める信頼区間は
  $$394.12\leqq m\leqq 405.88\qquad(\text{単位は分})$$

  (2) 母平均 $m$ は決まった値であり、変動するのは標本ごとに作られる区間の側である。「信頼度 $95\%$」とは、同じ方法で大きさ $100$ の標本を何度も取り直してそのたびに区間を作ると、それらの区間のうち約 $95\%$ が母平均 $m$ を含む、という意味である。「$m$ が $95\%$ の確率でこの区間に入る」という意味でも、「生徒の $95\%$ の睡眠時間がこの区間に入る」という意味でもない。
rubric:
  - id: r1
    criterion: 標本平均の標準偏差を $\dfrac{\sigma}{\sqrt{n}}=\dfrac{30}{10}=3$ と正しく求めている（$30$ のまま使っていない）
    points: 3
    keywords: ["√100", "=3"]
  - id: r2
    criterion: '$\overline{X}\pm 1.96\cdot\dfrac{\sigma}{\sqrt{n}}$ の形の区間を、$P(|Z|\leqq 1.96)=0.95$ と結びつけて立てている'
    points: 2
    keywords: ["1.96"]
  - id: r3
    criterion: 信頼区間を $394.12\leqq m\leqq 405.88$ と正しく計算している
    points: 2
    keywords: ["394.12", "405.88"]
  - id: r4
    criterion: 標本を取り直して区間を繰り返し作ると、約 $95\%$ の区間が母平均を含む、という意味を述べている
    points: 2
    keywords: ["繰り返", "95%", "含む"]
  - id: r5
    criterion: 「母平均が $95\%$ の確率で区間に入る」や「データの $95\%$ が区間に入る」という解釈ではないことを明確にしている（母平均は定数であることに触れている）
    points: 1
    keywords: ["定数", "確率"]
solution: |
  $\sigma(\overline{X})=\dfrac{30}{\sqrt{100}}=3$、$1.96\times 3=5.88$ より、信頼区間は $400-5.88\leqq m\leqq 400+5.88$、すなわち $394.12\leqq m\leqq 405.88$。

  信頼度 $95\%$ は「区間の作り方」の性質で、標本を取り直して区間を作ることを繰り返すと、約 $95\%$ の区間が $m$ を含む、という意味である。1つの具体的な区間について「$m$ が入る確率が $95\%$」と言うのではない。
concepts: [st-estimation, st-sample-mean]
misconceptions: [mc-st-sample-sd, mc-st-ci-interpretation]
targetSeconds: 420
irt: { expectedCorrectRate: 0.62, discrimination: 1.2 }
author:
  intent: |
    母平均の推定の基本手順（$\sigma(\overline{X})=\dfrac{\sigma}{\sqrt{n}}$ → $1.96$ 倍 → 区間）を答案の形で書けるか、また信頼度の意味を言葉で正しく説明できるかをみる。$\sigma$ を $\sqrt{n}$ で割り忘れると区間が $341.2\leqq m\leqq 458.8$ と極端に広くなり、r1・r3 で識別できる。(2) は誤った解釈を選択肢として見せずに自分の言葉で書かせ、r5 で「母平均は定数」という本質まで書けた答案を区別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (2) ア(ア) 標本調査の考え方（母集団と標本、標本平均の分布）", "数学B (2) ア(エ) 正規分布を用いた区間推定（母平均）"]
  variations:
    - 信頼度 $99\%$（係数 $2.58$）の区間も求めさせ、幅の違いを比較させる。
    - 区間の幅を $4$ 分以下にするための標本の大きさの最小値（$n\geqq 865$）を求めさせる。
