author:
  intent: |
    空間で「直線と平面の垂直」を平面図形に落とし込めるかをみる。三垂線の定理で $\mathrm{OH}$ が $\triangle\mathrm{OBC}$ の高さになることを見抜き、さらに「平面 $\mathrm{OAH}$ が $\mathrm{BC}$ に垂直」という見方から、点と平面の距離・2平面のなす角を同じ直角三角形 $\mathrm{OAH}$ で処理できるかを識別する。$\triangle\mathrm{ABC}$ は $\mathrm{AH}$ が整数になる三角形にして、計算量でなく空間把握で差がつくようにした。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学A (1) ア(エ) 空間図形（直線と平面の位置関係）, 数学I (2) イ(イ) 図形の計量]
  variations:
    - $\mathrm{OA}$ を $t$ として、点 $\mathrm{A}$ と平面 $\mathrm{OBC}$ の距離が $\mathrm{AH}$ の半分になる $t$ を求めさせる。
    - 三垂線の定理そのもの（$\mathrm{OA}\perp\alpha,\ \mathrm{AH}\perp\ell\Rightarrow\mathrm{OH}\perp\ell$）を記述式で証明させる。
