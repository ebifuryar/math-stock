id: m1-tg-a01
level: applied
format: choice
title: 条件を満たす三角形が2つある場合の面積
stem: |
  $\triangle\mathrm{ABC}$ において、$\mathrm{BC}=2,\ \mathrm{CA}=\sqrt{6},\ \angle\mathrm{BAC}=45^\circ$ とする。

  正弦定理により $\sin\angle\mathrm{ABC}$ の値が定まり、そこから $\angle\mathrm{ABC}$ や辺 $\mathrm{AB}$ の長さを考えることができる。このとき、$\triangle\mathrm{ABC}$ の面積 $S$ について正しく述べたものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $S=\dfrac{3+\sqrt{3}}{2}$ に限る。
    misconception: mc-tg-sin-solution-count
    rationale: |
      $\sin B=\dfrac{\sqrt{3}}{2}$ から $B=60^\circ$ だけを考えている。$B=120^\circ$ のときも $A+B=165^\circ<180^\circ$ で三角形ができ、$\mathrm{AB}=\sqrt{3}-1,\ S=\dfrac{3-\sqrt{3}}{2}$ となる。
  - id: "2"
    text: $S=\dfrac{3+\sqrt{3}}{2}$ または $S=\dfrac{3-\sqrt{3}}{2}$
    rationale: |
      正解。$\mathrm{AB}=c$ とすると余弦定理から $c^2-2\sqrt{3}c+2=0$、$c=\sqrt{3}\pm 1$（ともに正）。$S=\dfrac{1}{2}\cdot\sqrt{6}\cdot c\cdot\sin 45^\circ=\dfrac{\sqrt{3}}{2}c$。
  - id: "3"
    text: $S=\sqrt{3}$ に限る。
    misconception: mc-tg-area-angle
    rationale: |
      $S=\dfrac{1}{2}\cdot\mathrm{BC}\cdot\mathrm{CA}\cdot\sin 45^\circ$ と計算している。$45^\circ$ は辺 $\mathrm{AB}$ と $\mathrm{AC}$ の間の角であり、$\mathrm{BC}$ と $\mathrm{CA}$ の間の角ではない。
  - id: "4"
    text: 条件を満たす三角形は存在しない。
    misconception: mc-tg-cosine-sign
    rationale: |
      余弦定理を $\mathrm{BC}^2=\mathrm{AB}^2+\mathrm{CA}^2+2\cdot\mathrm{AB}\cdot\mathrm{CA}\cos A$ と符号を誤ると $c^2+2\sqrt{3}c+2=0$ となり、正の解がなくなる。
answer: "2"
solution: |
  正弦定理 $\dfrac{\mathrm{BC}}{\sin A}=\dfrac{\mathrm{CA}}{\sin B}$ より
  $$\sin B=\frac{\sqrt{6}\sin 45^\circ}{2}=\frac{\sqrt{3}}{2}$$
  $0^\circ<B<180^\circ-45^\circ=135^\circ$ なので $B=60^\circ,\ 120^\circ$ の **2通り** があり得る。

  辺 $\mathrm{AB}=c$ は余弦定理 $2^2=6+c^2-2\sqrt{6}\,c\cos 45^\circ$ から
  $$c^2-2\sqrt{3}c+2=0\qquad c=\sqrt{3}\pm 1$$
  ともに正なので、三角形は2つ存在する（$c=\sqrt{3}+1$ のとき $B=60^\circ$、$c=\sqrt{3}-1$ のとき $B=120^\circ$）。

  面積は $S=\dfrac{1}{2}\cdot\mathrm{AB}\cdot\mathrm{AC}\sin 45^\circ=\dfrac{\sqrt{3}}{2}c$ より
  $$S=\frac{3+\sqrt{3}}{2}\quad\text{または}\quad S=\frac{3-\sqrt{3}}{2}$$
concepts: [tg-law-of-sines, tg-law-of-cosines, tg-area, tg-equation-inequality]
misconceptions: [mc-tg-sin-solution-count, mc-tg-area-angle, mc-tg-cosine-sign]
targetSeconds: 300
irt: { expectedCorrectRate: 0.45, discrimination: 1.3 }
author:
  intent: |
    「2辺とその間にない角」が与えられたとき、三角形が1つに決まらない場合があることに気づけるかをみる。余弦定理で $\mathrm{AB}$ の2次方程式を立てれば2解とも正であることが確かめられ、正弦定理の側からは $B$ の鋭角・鈍角の吟味として同じ事実が見える。誤答①（鈍角の見落とし）が最も選ばれやすい設計で、ここで上位層を識別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (2) ア(ウ) 正弦定理・余弦定理, 数学I (2) イ(イ) 図形の計量]
  variations:
    - $\mathrm{CA}$ を $\sqrt{2}$ に変えて三角形が1つに決まる場合と比較させる（大辺対大角による吟味）。
    - $\mathrm{CA}=x$ として、三角形が2つ存在するような $x$ の範囲を問う（$2<x<2\sqrt{2}$）。
