id: ma-it-s01
level: school
format: choice
title: 最大公約数と最小公倍数から2数を求める
stem: |
  2つの自然数 $a,\ b\ (a<b)$ の最大公約数が $6$、最小公倍数が $360$ であるとき、このような組 $(a,\ b)$ の個数として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $2$ 個
    misconception: mc-it-coprime-ignored
    rationale: |
      $ab=L$（積が最小公倍数）と考えて $36a'b'=360$、$a'b'=10$ としている。$ab=L$ は $a,\ b$ が互いに素のときだけ成り立つ。正しくは $ab=GL$ から $a'b'=60$。
  - id: "2"
    text: $4$ 個
    rationale: |
      正解。$a=6a',\ b=6b'$（$a',\ b'$ は互いに素、$a'<b'$）とおくと $6a'b'=360$ より $a'b'=60$。互いに素な組は $(1,60),\ (3,20),\ (4,15),\ (5,12)$ の4組。
  - id: "3"
    text: $6$ 個
    misconception: mc-it-coprime-ignored
    rationale: |
      $a'b'=60$ までは正しいが、$a',\ b'$ が互いに素という条件を使わずに $(2,30),\ (6,10)$ も数えている。例えば $(a',b')=(2,30)$ だと $a=12,\ b=180$ で最大公約数は $12$ になってしまう。
  - id: "4"
    text: $8$ 個
    rationale: |
      $a<b$ の条件を無視し、$(a',b')$ と $(b',a')$ を別々に数えている（順序を区別した個数）。
answer: "2"
solution: |
  最大公約数が $6$ なので $a=6a',\ b=6b'$（$a',\ b'$ は互いに素な自然数、$a'<b'$）とおける。最小公倍数は $6a'b'$ なので
  $$6a'b'=360\quad\text{より}\quad a'b'=60=2^2\cdot 3\cdot 5$$
  $a',\ b'$ が互いに素なので、素因数 $2^2,\ 3,\ 5$ はそれぞれまとめてどちらか一方に入る。$a'<b'$ となる組は
  $$(a',b')=(1,60),\ (3,20),\ (4,15),\ (5,12)$$
  の **4個**。$(a,b)=(6,360),\ (18,120),\ (24,90),\ (30,72)$。
concepts: [it-gcd-lcm, it-prime-factorization]
misconceptions: [mc-it-coprime-ignored]
targetSeconds: 180
irt: { expectedCorrectRate: 0.62, discrimination: 1.1 }
author:
  intent: |
    $a=Ga',\ b=Gb'$ の置き方と「$a',\ b'$ は互いに素」という条件の役割を理解しているかをみる。$60$ を $2^2$ を含む数にしたことで、互いに素の条件を落とすと個数が変わる（③）。①は $ab=L$ という典型的な誤用、④は順序の扱いで、誤答から理解の欠けた箇所を特定できる。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学A (3) ア(ア) 整数の性質（約数と倍数・最大公約数と最小公倍数）]
  variations:
    - 最大公約数を $12$、和 $a+b=96$ のように「和と最大公約数」の条件に変える。
    - '$a+b=95$、最小公倍数 $450$ のように和と最小公倍数を与え、$\gcd(a+b,\ L)=G$ に気づかせる発展問題。'
