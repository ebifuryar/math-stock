id: m2-cg-a05
level: applied
format: written
title: 2円の交点を通る直線と円
stem: |
  2つの円
  $$C_1:\ x^2+y^2=5,\qquad C_2:\ x^2+y^2-6x-2y+1=0$$
  について、次の問いに答えよ。

  (1) $C_1$ と $C_2$ が異なる2点で交わることを示せ。

  (2) $C_1$ と $C_2$ の2つの交点を通る直線の方程式を求めよ。

  (3) $C_1$ と $C_2$ の2つの交点と、点 $(0,\ -1)$ を通る円の方程式を求めよ。
modelAnswer: |
  (1) $C_2$ は $(x-3)^2+(y-1)^2=9$ と変形でき、中心 $(3,\ 1)$、半径 $3$ の円。$C_1$ は中心 $(0,\ 0)$、半径 $\sqrt{5}$ の円。中心間の距離は
  $$d=\sqrt{3^2+1^2}=\sqrt{10}$$
  $2<\sqrt{5}<3$ より $3-\sqrt{5}<1<\sqrt{10}$、また $\sqrt{10}<4<3+\sqrt{5}$（$4<3+\sqrt{5}\iff 1<\sqrt{5}$）。よって
  $$3-\sqrt{5}<d<3+\sqrt{5}$$
  が成り立つので、$C_1$ と $C_2$ は異なる2点で交わる。

  (2) $f=x^2+y^2-5,\ g=x^2+y^2-6x-2y+1$ とおく。$k$ を定数として
  $$f+kg=0\qquad\cdots(*)$$
  は、2交点の座標を代入すると $0+k\cdot 0=0$ となるので、2交点を通る図形を表す。$k=-1$ とすると
  $$f-g=6x+2y-6=0$$
  これは直線なので、求める直線は **$3x+y-3=0$**。

  (3) $(*)$ が点 $(0,\ -1)$ を通るとき、$f(0,-1)=-4,\ g(0,-1)=4$ より
  $$-4+4k=0\quad\Longrightarrow\quad k=1$$
  このとき $(*)$ は $2x^2+2y^2-6x-2y-4=0$、すなわち
  $$x^2+y^2-3x-y-2=0$$
  これは $\left(x-\dfrac{3}{2}\right)^2+\left(y-\dfrac{1}{2}\right)^2=\dfrac{9}{2}$ と変形でき、確かに円を表す。よって求める円は **$x^2+y^2-3x-y-2=0$**。

  （$f+kg=0$ の形では $C_2$ 自身は表せないが、点 $(0,\ -1)$ は $g(0,-1)=4\neq 0$ より $C_2$ 上にないので、求める円は $C_2$ ではなく、この形で求めてよい。）
rubric:
  - id: r1
    criterion: 2円の中心・半径を求め、中心間の距離 $\sqrt{10}$ について $3-\sqrt{5}<\sqrt{10}<3+\sqrt{5}$ を根拠を示して確かめている
    points: 3
    keywords: ["√10", "3-√5", "3+√5"]
  - id: r2
    criterion: 2交点を通る図形を $f+kg=0$（または $f+t(\text{直線})=0$）の形で表し、それが2交点を通る理由を述べている
    points: 2
    keywords: ["f+kg=0", "k"]
  - id: r3
    criterion: $k=-1$ とするなどして、直線 $3x+y-3=0$ を得ている
    points: 2
    keywords: ["3x+y-3=0"]
  - id: r4
    criterion: 点 $(0,\ -1)$ を代入して $k=1$ を求め、円 $x^2+y^2-3x-y-2=0$ を得ている
    points: 3
    keywords: ["k=1", "x^2+y^2-3x-y-2=0"]
solution: |
  2円の位置関係は中心間の距離 $d$ と半径の和・差で判定する。2交点を通る図形は、交点を求めずに $f+kg=0$ で表せる（$k=-1$ で直線、それ以外で円）。交点の座標は $\dfrac{9\pm\sqrt{41}}{10}$ を含む値になるので、交点を求めてから3点を通る円を求めるのは計算量が大きい。
concepts: [cg-two-circles, cg-circle-equation]
misconceptions: []
targetSeconds: 600
irt: { expectedCorrectRate: 0.45, discrimination: 1.2 }
author:
  intent: |
    2円の位置関係の判定と、「2円の交点を通る図形」の考え方（束）を答案として書けるかをみる。交点の座標が無理数になるよう係数を設定し、交点を直接求める方針では時間内に処理しにくくして、$f+kg=0$ の発想の有無を識別する。(1) は無理数の大小比較を根拠付きで書けるかも評価する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (2) ア(ウ) 円の方程式・2つの円の位置関係]
  variations:
    - 共通弦の長さを、中心から直線までの距離と三平方の定理で求めさせる（$\dfrac{\sqrt{410}}{5}$）。
    - 2交点を通り、中心が直線 $x=6$ 上にある円を求めさせる（$x^2+y^2-12x-4y+7=0$）。
