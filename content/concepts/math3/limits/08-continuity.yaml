id: lm-continuity
kind: theorem
title: 関数の連続性と中間値の定理
body: |
  **連続**: 関数 $f(x)$ が $x=a$ で連続であるとは
  $$\lim_{x\to a}f(x)=f(a)$$
  が成り立つこと。すなわち (i) $f(a)$ が定義され、(ii) 右側極限と左側極限が一致して極限が存在し、(iii) その極限が $f(a)$ に等しい。場合分けで定義された関数は、**つなぎ目で左右の極限と関数値の3つ** を比べる。

  多項式・分数関数（定義域内）・無理関数・三角関数・指数関数・対数関数は、それぞれの定義域で連続。連続関数の和・差・積・商（分母 $\neq 0$）・合成も連続。

  **中間値の定理**: 関数 $f(x)$ が閉区間 $[a,\ b]$ で連続で、$f(a)$ と $f(b)$ が異符号ならば、方程式 $f(x)=0$ は $a<x<b$ の範囲に **少なくとも1つ** の実数解をもつ。
  - 「連続であること」を必ず述べる（不連続なら成り立たない。例: $\dfrac{1}{x}$ は $x=-1,\ 1$ で異符号だが $0$ にならない）。
  - 定理が保証するのは存在だけ。「ただ1つ」を示すには、単調性（増加関数など）を別に示す。
prerequisites: [lm-function-limit]
