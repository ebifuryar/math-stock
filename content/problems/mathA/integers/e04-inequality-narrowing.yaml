id: ma-it-e04
level: exam
format: mark
title: 不等式による評価で整数解を絞り込む
stem: |
  $xyz=2(x+y+z)$ を満たす自然数の組 $(x,\ y,\ z)$ で、$x\leqq y\leqq z$ であるものを求める。

  $x\leqq y\leqq z$ より $2(x+y+z)\leqq 6z$ であるから、$xyz\leqq 6z$ となり
  $$xy\leqq\boxed{\text{ア}}$$
  が得られる。

  $x=1$ のとき、与式は $(y-\boxed{\text{イ}})(z-\boxed{\text{イ}})=\boxed{\text{ウ}}$ と変形できる。

  以上の考察をもとにすべての場合を調べると、条件を満たす組 $(x,\ y,\ z)$ は全部で $\boxed{\text{エ}}$ 組あり、その中で $z$ の最大値は $\boxed{\text{オ}}$ である。
blanks:
  - { label: ア, answer: "6" }
  - { label: イ, answer: "2" }
  - { label: ウ, answer: "6" }
  - { label: エ, answer: "3" }
  - { label: オ, answer: "8" }
solution: |
  $xyz=2(x+y+z)\leqq 6z$ で $z>0$ なので $xy\leqq 6$。$x\leqq y$ より $x^2\leqq 6$、$x=1,\ 2$。

  **$x=1$ のとき** $yz=2(1+y+z)$ より $yz-2y-2z=2$、$(y-2)(z-2)=6$。$1\leqq y\leqq z$ より $-1\leqq y-2\leqq z-2$ なので、$(y-2,\ z-2)=(1,6),\ (2,3)$（負の組 $(-6,-1),\ (-3,-2)$ は $y-2\geqq -1$ に反する）。よって $(y,z)=(3,8),\ (4,5)$。

  **$x=2$ のとき** $xy\leqq 6$ より $y=2,\ 3$。
  - $y=2$: $4z=2(4+z)$ より $z=4$
  - $y=3$: $6z=2(5+z)$ より $z=\dfrac{5}{2}$（不適）

  以上より $(x,y,z)=(1,3,8),\ (1,4,5),\ (2,2,4)$ の **3組**。$z$ の最大値は **$8$**。
