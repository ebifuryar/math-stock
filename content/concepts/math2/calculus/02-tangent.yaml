id: cl-tangent
kind: method
title: 接線の方程式（曲線上の点・曲線外の点）
body: |
  曲線 $y=f(x)$ 上の点 $(a,\ f(a))$ における接線は
  $$y-f(a)=f'(a)(x-a)$$

  **曲線外の点（または「点を通る」と言われた点）から引く接線** は、点の座標をそのまま $f'$ に代入してはいけない。次の手順で求める。
  1. 接点を $(t,\ f(t))$ とおき、接線 $y=f'(t)(x-t)+f(t)$ を書く。
  2. その接線が与えられた点 $(p,\ q)$ を通る条件から $t$ の方程式を立てて解く。

  3次関数では、接点が異なれば接線も異なるので、「引ける接線の本数」は「$t$ の方程式の異なる実数解の個数」に等しい。曲線上の点 $\mathrm{P}$ を「通る」接線には、$\mathrm{P}$ における接線のほかに、別の点で接して $\mathrm{P}$ を通る接線もあり得る。
prerequisites: [cl-derivative]
