id: m2-ep-a02
level: applied
format: mark
title: 虚数解をもつ3次方程式の係数決定
stem: |
  $a,\ b$ を実数の定数とし、$P(x)=x^3+ax^2+bx+15$ とする。3次方程式 $P(x)=0$ が $1+2i$ を解にもつとき、$a,\ b$ の値と他の解を求めよう。

  (1) $P(x)$ の係数はすべて実数であるから、$1+2i$ と共役な複素数 $1-2i$ も $P(x)=0$ の解である。$1+2i,\ 1-2i$ を2つの解とする2次方程式の1つは
  $$x^2-\boxed{\text{ア}}\,x+\boxed{\text{イ}}=0$$
  である。

  (2) $P(x)$ は (1) の左辺の2次式で割り切れる。実際に $P(x)$ をこの2次式で割ったときの余りが $0$ となる条件から
  $$a=\boxed{\text{ウ}},\qquad b=\boxed{\text{エオ}}$$
  である。

  (3) このとき、$P(x)=0$ の実数解は $x=\boxed{\text{カキ}}$ である。
blanks:
  - { label: ア, answer: "2" }
  - { label: イ, answer: "5" }
  - { label: ウ, answer: "1" }
  - { label: エオ, answer: "-1" }
  - { label: カキ, answer: "-3" }
solution: |
  (1) 和 $(1+2i)+(1-2i)=2$、積 $(1+2i)(1-2i)=1-4i^2=5$ なので、$x^2-2x+5=0$。

  (2) $P(x)$ を $x^2-2x+5$ で割ると
  $$x^3+ax^2+bx+15=(x^2-2x+5)\{x+(a+2)\}+(2a+b-1)x+(5-5a)$$
  余りが $0$ となるのは、$x$ についての恒等式として
  $$2a+b-1=0,\qquad 5-5a=0$$
  のときなので $a=1,\ b=-1$。

  (3) 商は $x+(a+2)=x+3$ なので、$P(x)=(x^2-2x+5)(x+3)$。実数解は $x=-3$（他の解は $1\pm 2i$）。

  （別解）$P(1+2i)=0$ に代入して実部・虚部を比べてもよい。$(1+2i)^2=-3+4i$、$(1+2i)^3=-11-2i$ より
  $$P(1+2i)=(-11-3a+b+15)+(-2+4a+2b)i=0$$
  から $-3a+b+4=0,\ 4a+2b-2=0$ を解いて同じ結果を得る。
concepts: [ep-factor-theorem, ep-complex-quadratic, ep-division-fraction, ep-identity]
misconceptions: [mc-ep-vieta-sign]
