author:
  intent: |
    双曲線と直線の共有点を判別式だけで判定しようとすると、$x^2$ の係数が $0$ になる場合（漸近線に平行）を落とす。(4) で「共有点が1個」を「接する」と同一視すると $2$ と答えることになり、場合分けの意識と、共有点1個と接することの区別を識別する。(5) は解の符号（解と係数の関係）と双曲線の枝を結びつける発展的な読み取り。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(ア) 2次曲線と直線の位置関係]
  variations:
    - 放物線 $y^2=4x$ と直線 $y=m(x+1)$ で同様に問い、軸に平行な直線（$m=0$）で共有点が1個になる場合を考えさせる。
    - 点 $(0,\ 1)$ を通り $H$ と共有点をもたない直線の傾きの範囲を求めさせる。
