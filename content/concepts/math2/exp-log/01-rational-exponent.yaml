id: el-rational-exponent
kind: definition
title: 累乗根と有理数の指数
body: |
  $n$ を正の整数とする。$n$ 乗して $a$ になる数を $a$ の **$n$ 乗根** という。$a>0$ のとき、正の $n$ 乗根を $\sqrt[n]{a}$ で表す。

  $a>0$、$m$ を整数、$n$ を正の整数とするとき、指数を次のように定める。
  $$a^0=1,\qquad a^{-n}=\frac{1}{a^n},\qquad a^{\frac{m}{n}}=\sqrt[n]{a^m}=\left(\sqrt[n]{a}\right)^m$$

  これらは「指数法則がそのまま成り立つように」決めた定義である。たとえば $a^{-n}$ は負の数ではなく $a^n$ の **逆数**、$a^{\frac{1}{n}}$ は $a$ を $n$ で割った数ではなく **$n$ 乗根**。$\sqrt[3]{\frac{1}{4}}=\left(\frac{1}{2}\right)^{\frac{2}{3}}$ のように、底をそろえて指数で表すと計算や比較がしやすい。さらに極限の考えで、$a>0$ のとき任意の実数 $x$ に対して $a^x$ が定まる。
