id: m1-da-e01
level: exam
format: mark
title: 2つのグループの平均と分散の合併
stem: |
  あるクラスを2つの班に分けて同じテストを行った。A班は6人で、得点の平均値が $50$、標準偏差が $4$ であった。B班は4人で、得点の平均値が $60$、標準偏差が $6$ であった。

  10人全体の得点について、平均値は $\boxed{\text{アイ}}$、得点の2乗の平均値は $\boxed{\text{ウエオカ}}$ であるから、分散は $\boxed{\text{キク}}$ である。

  一方、各班の分散を人数で加重平均した値は $\boxed{\text{ケコ}}$ であり、これは全体の分散と一致しない。
blanks:
  - { label: アイ, answer: "54" }
  - { label: ウエオカ, answer: "2964" }
  - { label: キク, answer: "48" }
  - { label: ケコ, answer: "24" }
solution: |
  平均と分散から、合計と2乗の合計を復元する（$\sum x=n\bar{x}$、$\sum x^2=n(s^2+\bar{x}^2)$）。

  - 合計：$6\times 50+4\times 60=540$ より、全体の平均値は $\dfrac{540}{10}=54$
  - 2乗の合計：$6(4^2+50^2)+4(6^2+60^2)=6\times 2516+4\times 3636=15096+14544=29640$
    よって2乗の平均値は $2964$
  - 分散：$2964-54^2=2964-2916=48$

  各班の分散の加重平均は $\dfrac{6\times 16+4\times 36}{10}=\dfrac{240}{10}=24$。

  差の $48-24=24$ は、班ごとの平均（$50$ と $60$）が全体の平均 $54$ からずれていることによる散らばりであり、
  $\dfrac{6(50-54)^2+4(60-54)^2}{10}=\dfrac{96+144}{10}=24$ と計算できる。分散は「各班内の散らばり」と「班の平均どうしの散らばり」の和になる。
concepts: [da-variance-formula, da-variance]
misconceptions: [mc-da-variance-as-mean]
targetSeconds: 420
irt: { expectedCorrectRate: 0.35, discrimination: 1.4 }
author:
  intent: |
    分散の合併を、公式暗記ではなく「合計と2乗の合計に戻す」操作で処理できるかをみる。分散の加重平均 $24$ をあえて最後に計算させ、全体の分散 $48$ との差が群間の平均の差に由来することに気づかせる構成にした。人数の比を $3:2$ にして全体平均 $54$ が整数になり、かつ各班の平均と一致しないように設計している。マーク式なので、$\dfrac{50+60}{2}=55$ という単純平均で進めると2乗の平均の桁数が合わず、途中で気づける。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (4) ア(ア) 分散・標準偏差, 数学I (4) イ(ア) データの分析における問題解決]
  variations:
    - 全体の分散と各班の分散が与えられ、班の人数の比を求めさせる。
    - 2班の平均が等しい場合を扱い、そのときだけ分散の加重平均が全体の分散に一致することを確認させる。
