id: m3-lm-a02
level: applied
format: choice
title: 無限級数の収束・発散の判定
stem: |
  次の①〜④の無限級数のうち、収束するものはちょうど1つある。それを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $\displaystyle\sum_{n=1}^{\infty}\frac{1}{\sqrt{n}+\sqrt{n+1}}$
    misconception: mc-lm-term-zero-convergence
    rationale: |
      項は $0$ に収束するが、それだけでは級数は収束しない。$\dfrac{1}{\sqrt{n}+\sqrt{n+1}}=\sqrt{n+1}-\sqrt{n}$ より部分和は $S_n=\sqrt{n+1}-1\to\infty$ で、発散する。
  - id: "2"
    text: $\displaystyle\sum_{n=1}^{\infty}(-1)^{n-1}$
    misconception: mc-lm-geometric-series-condition
    rationale: |
      公比 $-1$ の無限等比級数に和の公式を当てはめて $\dfrac{1}{1-(-1)}=\dfrac{1}{2}$ としている。$|r|<1$ を満たさないので公式は使えず、部分和は $1,\ 0,\ 1,\ 0,\ \cdots$ と振動する。
  - id: "3"
    text: $\displaystyle\sum_{n=1}^{\infty}\frac{2}{n(n+2)}$
    rationale: |
      正解。$\dfrac{2}{n(n+2)}=\dfrac{1}{n}-\dfrac{1}{n+2}$ より部分和は $S_n=\dfrac{3}{2}-\dfrac{1}{n+1}-\dfrac{1}{n+2}\to\dfrac{3}{2}$ で、和は $\dfrac{3}{2}$。
  - id: "4"
    text: $\displaystyle\sum_{n=1}^{\infty}\left(\sqrt{n^2+n}-n\right)$
    misconception: mc-lm-indeterminate-form
    rationale: |
      項を $\infty-\infty=0$ と判断している。実際は $\sqrt{n^2+n}-n=\dfrac{n}{\sqrt{n^2+n}+n}\to\dfrac{1}{2}\neq 0$ なので、級数は発散する（項が $0$ に収束しない級数は収束しない）。
answer: "3"
solution: |
  無限級数の収束は部分和 $S_n$ の極限で判定する。また「収束 $\Rightarrow$ 項 $\to 0$」なので、項が $0$ に収束しなければ発散する。

  ① 項 $=\sqrt{n+1}-\sqrt{n}$ で、$S_n=\sqrt{n+1}-1\to\infty$。発散（項 $\to 0$ でも発散する例）。

  ② 部分和が $1,\ 0,\ 1,\ 0,\ \cdots$ と振動。発散。

  ③ 
  $$S_n=\sum_{k=1}^{n}\left(\frac{1}{k}-\frac{1}{k+2}\right)=1+\frac{1}{2}-\frac{1}{n+1}-\frac{1}{n+2}\to\frac{3}{2}$$
  収束。

  ④ 項 $=\dfrac{1}{\sqrt{1+\frac{1}{n}}+1}\to\dfrac{1}{2}\neq 0$。発散。

  よって収束するのは **③**（和は $\dfrac{3}{2}$）。
concepts: [lm-infinite-series, lm-sequence-limit]
misconceptions: [mc-lm-term-zero-convergence, mc-lm-geometric-series-condition, mc-lm-indeterminate-form]
targetSeconds: 300
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    無限級数の収束・発散を、部分和の極限と「項 $\to 0$ は必要条件にすぎない」という論理の両面から判定できるかをみる。①は項が $0$ に収束しても発散する典型例、②は無限等比級数の公式の適用条件、④は項の極限計算そのもの（$\infty-\infty$）の誤りを捉える。収束するものを1つ選ぶ形にすることで、4つすべてを吟味する必要がある。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (1) ア(イ) 無限級数の和", "数学III (1) イ(ア) 極限を求める方法の考察"]
  variations:
    - $\displaystyle\sum_{n=1}^{\infty}\log\frac{n+1}{n}$ を加え、対数の性質で部分和を求めさせる（$\log(n+1)\to\infty$ で発散）。
    - 無限級数 $\displaystyle\sum_{n=1}^{\infty}\left(\frac{1}{2^n}-\frac{1}{3^n}\right)$ のように、収束する2つの級数の差として和を求めさせる。
