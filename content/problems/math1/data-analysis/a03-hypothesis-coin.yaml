id: m1-da-a03
level: applied
format: mark
title: 仮説検定の考え方（実験結果による判断）
stem: |
  あるお菓子の袋には当たりくじが入っており、「当たる確率は $\dfrac{1}{2}$ である」と表示されている。Aさんがこのお菓子を20個買ったところ、当たりは15個であった。Aさんは「当たる確率は $\dfrac{1}{2}$ より大きいのではないか」と考えた。

  そこで、公正なコインを20回投げて表の出た枚数を記録する実験を1000回行い、次の結果を得た。

  | 表の枚数 | 9以下 | 10 | 11 | 12 | 13 | 14 | 15 | 16 | 17 | 18以上 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | 回数 | 413 | 176 | 160 | 120 | 74 | 36 | 15 | 5 | 1 | 0 |

  この実験結果を用いて、表が15回以上出る相対度数は $0.\boxed{\text{ア}}\boxed{\text{イ}}\boxed{\text{ウ}}$ である。

  基準となる確率を $0.05$ とすると、この値は $0.05$ より小さいので、「当たる確率は $\dfrac{1}{2}$ である」という仮説は否定され、「当たる確率は $\dfrac{1}{2}$ より大きい」と判断してよい。

  いま、当たりが15個ではなく14個だったとする。このとき表が14回以上出る相対度数は $0.\boxed{\text{エ}}\boxed{\text{オ}}\boxed{\text{カ}}$ であり、これは $0.05$ より大きいので、仮説は否定 $\boxed{\text{キ}}$。

  $\boxed{\text{キ}}$ に当てはまるものを、次の $0$ 〜 $3$ のうちから一つ選べ。

  $0$：できる　$1$：できない　$2$：でき、確率は $\dfrac{1}{2}$ だと証明される　$3$：でき、確率は $\dfrac{1}{2}$ より小さいと判断できる
blanks:
  - { label: ア, answer: "0" }
  - { label: イ, answer: "2" }
  - { label: ウ, answer: "1" }
  - { label: エ, answer: "0" }
  - { label: オ, answer: "5" }
  - { label: カ, answer: "7" }
  - { label: キ, answer: "1" }
solution: |
  表が15回以上出た回数は $15+5+1+0=21$ 回なので、相対度数は $\dfrac{21}{1000}=0.021$。これは $0.05$ より小さいので、「当たる確率は $\dfrac{1}{2}$」という仮説のもとではめったに起こらないことが起きたと考え、仮説を否定する。

  表が14回以上では $36+21=57$ 回で、相対度数は $\dfrac{57}{1000}=0.057>0.05$。この場合は「仮説のもとでも起こりうる程度」なので仮説を否定できず、**当たる確率が $\dfrac{1}{2}$ より大きいとは判断できない**。ただし、仮説が正しいと証明されたわけではない。

  （参考）公正なコインで実際に計算すると、表が15回以上となる確率は約 $0.0207$、14回以上となる確率は約 $0.0577$ で、実験結果とよく一致している。
concepts: [da-hypothesis-testing]
misconceptions: [mc-da-hypothesis-accept-null, mc-da-hypothesis-point-prob]
targetSeconds: 300
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    仮説検定の考え方の中核である「観測値以上の側をまとめて数える」操作と、「否定できない」ときの結論の書き方をみる。度数分布表は二項分布 $B(20,\ 0.5)$ の理論値（15回以上で $0.0207$、14回以上で $0.0577$）にほぼ一致するように作ってあり、15回なら否定でき14回なら否定できないという境目をまたぐ設定にした。累積の取り方を誤って「ちょうど15回」の $0.015$ で判断すると ア〜ウ が合わず、「キ」では仮説が証明されたと解釈する誤りを選択肢 $2$ として用意している。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学I (4) イ(ウ) 仮説検定の考え方, 数学I (4) ア(イ) 標本調査の考え方]
  variations:
    - 基準となる確率を $0.01$ に変えて、15個でも否定できなくなることを確認させる。
    - 「当たる確率は $\dfrac{1}{2}$ と異なる」という主張にして、両側で考える場合を扱う。
