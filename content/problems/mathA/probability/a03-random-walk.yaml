id: ma-pr-a03
level: applied
format: mark
title: さいころによる点の移動（反復試行・条件付き確率・期待値）
stem: |
  数直線上を動く点 $\mathrm{P}$ があり、最初は原点にある。$1$ 個のさいころを投げ、$3$ 以上の目が出たら $\mathrm{P}$ を正の向きに $1$ だけ動かし、$2$ 以下の目が出たら負の向きに $1$ だけ動かす。この試行を $4$ 回繰り返す。

  (1) 1回の試行で $\mathrm{P}$ が正の向きに動く確率は $\dfrac{\boxed{\text{ア}}}{\boxed{\text{イ}}}$ である。

  (2) 4回の試行後に $\mathrm{P}$ が原点にある確率は $\dfrac{\boxed{\text{ウ}}}{\boxed{\text{エオ}}}$ であり、座標が $2$ の点にある確率は $\dfrac{\boxed{\text{カキ}}}{\boxed{\text{クケ}}}$ である。

  (3) 4回の試行後に $\mathrm{P}$ が原点にあったとき、4回の試行の間（各回の移動直後）に $\mathrm{P}$ の座標が一度も負にならなかった条件付き確率は $\dfrac{\boxed{\text{コ}}}{\boxed{\text{サ}}}$ である。

  (4) 4回の試行後の $\mathrm{P}$ の座標を $X$ とする。$X$ の期待値は $\dfrac{\boxed{\text{シ}}}{\boxed{\text{ス}}}$ である。

  ただし、分数は既約分数で答えよ。
blanks:
  - { label: ア, answer: "2" }
  - { label: イ, answer: "3" }
  - { label: ウ, answer: "8" }
  - { label: エオ, answer: "27" }
  - { label: カキ, answer: "32" }
  - { label: クケ, answer: "81" }
  - { label: コ, answer: "1" }
  - { label: サ, answer: "3" }
  - { label: シ, answer: "4" }
  - { label: ス, answer: "3" }
solution: |
  (1) $3,4,5,6$ の目で $\dfrac{4}{6}=\dfrac{2}{3}$。

  (2) 正の向きに $k$ 回動くと座標は $k-(4-k)=2k-4$。原点は $k=2$、座標 $2$ は $k=3$。
  $${}_4\mathrm{C}_2\left(\frac{2}{3}\right)^2\left(\frac{1}{3}\right)^2=\frac{24}{81}=\frac{8}{27},\qquad {}_4\mathrm{C}_3\left(\frac{2}{3}\right)^3\frac{1}{3}=\frac{32}{81}$$

  (3) 原点に戻る移動の順番は ${}_4\mathrm{C}_2=6$ 通りで、どれも確率 $\left(\dfrac{2}{3}\right)^2\left(\dfrac{1}{3}\right)^2$ で等しい。そのうち座標が負にならないのは「$+,+,-,-$」「$+,-,+,-$」の $2$ 通り。よって $\dfrac{2}{6}=\dfrac{1}{3}$。

  (4) $X=2k-4$ の分布は

  | $X$ | $-4$ | $-2$ | $0$ | $2$ | $4$ |
  | --- | --- | --- | --- | --- | --- |
  | 確率 | $\dfrac{1}{81}$ | $\dfrac{8}{81}$ | $\dfrac{24}{81}$ | $\dfrac{32}{81}$ | $\dfrac{16}{81}$ |

  $$E=\frac{-4-16+0+64+64}{81}=\frac{108}{81}=\frac{4}{3}$$
  （1回の移動の期待値 $1\cdot\dfrac{2}{3}+(-1)\cdot\dfrac{1}{3}=\dfrac{1}{3}$ の $4$ 回分と一致する。）
concepts: [pr-independent-repeated, pr-conditional, pr-expected-value]
misconceptions: [mc-pr-repeated-coefficient, mc-pr-conditional-denominator, mc-pr-expectation-incomplete]
targetSeconds: 600
irt: { expectedCorrectRate: 0.48, discrimination: 1.2 }
author:
  intent: |
    共通テスト型の誘導問題。(2) で反復試行、(3) で「条件のもとでは各経路が同様に確からしい」ことを利用した条件付き確率、(4) で期待値と、1つの設定で3つの技能を段階的にみる。(3) で分母を全体にとると $\dfrac{8}{81}$、(4) で $X$ の負の値や $0$ を落とすと確率の和が $1$ にならず誤答する。(2) の ${}_4\mathrm{C}_2$ の掛け忘れ（$\dfrac{4}{81}$）も識別できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学A (2) イ(イ) 独立な試行と確率（反復試行）", "数学A (2) イ(ウ) 条件付き確率", "数学A (2) イ(エ) 期待値"]
  variations:
    - 試行を $6$ 回にして、「6回後に原点にあり、途中で一度も負にならない」経路の数（カタラン数 $5$）を数えさせる。
    - 「座標が $2$ に初めて到達するのが4回目である確率」を問い、到達時刻の考え方を導入する。
