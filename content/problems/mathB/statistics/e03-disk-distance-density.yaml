id: mb-st-e03
level: exam
format: mark
title: 円板内の点の中心からの距離の分布
stem: |
  半径 $1$ の円板の内部（周を含む）から、1点 $P$ を無作為に選ぶ。ただし、円板内の領域 $D$ に $P$ が入る確率は、$D$ の面積に比例するものとする。円板の中心 $O$ と $P$ の距離を $R$ とする。

  (1) $0\leqq r\leqq 1$ のとき $P(R\leqq r)=r^{\boxed{\text{ア}}}$ であるから、$R$ の確率密度関数は $f(r)=\boxed{\text{イ}}\,r\ (0\leqq r\leqq 1)$ である。

  (2) $E(R)=\dfrac{\boxed{\text{ウ}}}{\boxed{\text{エ}}}$、$V(R)=\dfrac{1}{\boxed{\text{オカ}}}$ である。

  (3) $P(R\leqq E(R))=\dfrac{\boxed{\text{キ}}}{\boxed{\text{ク}}}$ である。また、$P(R\leqq c)=\dfrac{1}{2}$ を満たす $c$ の値は $c=\dfrac{\sqrt{\boxed{\text{ケ}}}}{\boxed{\text{コ}}}$ である。

  (4) $O$ を中心とし $P$ を通る円の面積を $S$ とすると、$E(S)=\dfrac{\pi}{\boxed{\text{サ}}}$ である。

  ただし、分数は既約分数で、根号の中の数はできるだけ小さい自然数で答えよ。
blanks:
