id: m3-df-s04
level: school
format: mark
title: 分数関数の極値と漸近線
stem: |
  関数 $f(x)=\dfrac{x^2+3}{x+1}$ について考える。

  (1) 導関数は
  $$f'(x)=\frac{(x+\boxed{\text{ア}})(x-\boxed{\text{イ}})}{(x+1)^2}$$
  である。

  (2) $f(x)$ は $x=\boxed{\text{ウエ}}$ で極大値 $\boxed{\text{オカ}}$ をとり、$x=\boxed{\text{キ}}$ で極小値 $\boxed{\text{ク}}$ をとる。

  (3) 曲線 $y=f(x)$ の漸近線は、2直線
  $$x=\boxed{\text{ケコ}},\qquad y=x-\boxed{\text{サ}}$$
  である。
blanks:
  - { label: ア, answer: "3" }
  - { label: イ, answer: "1" }
  - { label: ウエ, answer: "-3" }
  - { label: オカ, answer: "-6" }
  - { label: キ, answer: "1" }
  - { label: ク, answer: "2" }
  - { label: ケコ, answer: "-1" }
  - { label: サ, answer: "1" }
solution: |
  (1) 商の微分により
  $$f'(x)=\frac{2x(x+1)-(x^2+3)\cdot 1}{(x+1)^2}=\frac{x^2+2x-3}{(x+1)^2}=\frac{(x+3)(x-1)}{(x+1)^2}$$

  (2) 定義域は $x\neq -1$ で、$(x+1)^2>0$ なので $f'(x)$ の符号は $(x+3)(x-1)$ の符号と一致する。

  | $x$ | $\cdots$ | $-3$ | $\cdots$ | $(-1)$ | $\cdots$ | $1$ | $\cdots$ |
  | --- | --- | --- | --- | --- | --- | --- | --- |
  | $f'(x)$ | $+$ | $0$ | $-$ | | $-$ | $0$ | $+$ |
  | $f(x)$ | $\nearrow$ | $-6$ | $\searrow$ | | $\searrow$ | $2$ | $\nearrow$ |

  $f(-3)=\dfrac{12}{-2}=-6$（極大値）、$f(1)=\dfrac{4}{2}=2$（極小値）。

  (3) $f(x)=x-1+\dfrac{4}{x+1}$ と変形できる。
  - $\displaystyle\lim_{x\to -1+0}f(x)=\infty,\ \lim_{x\to -1-0}f(x)=-\infty$ より、直線 $x=-1$ が漸近線。
  - $\displaystyle\lim_{x\to\pm\infty}\{f(x)-(x-1)\}=\lim_{x\to\pm\infty}\frac{4}{x+1}=0$ より、直線 $y=x-1$ が漸近線。

  極大値 $-6$ が極小値 $2$ より小さいのは、グラフが $x=-1$ の左右で2つの部分に分かれているからである。$x<-1$ の部分は点 $(-3,\ -6)$ を頂上とする山形で、左は直線 $y=x-1$ の下側から近づき、右は $x\to -1-0$ で $-\infty$ に下がる。$x>-1$ の部分は点 $(1,\ 2)$ を底とする谷形で、左は $x\to -1+0$ で $\infty$、右は直線 $y=x-1$ の上側から近づく。
concepts: [df-graph, df-rules]
misconceptions: [mc-df-quotient-order, mc-df-asymptote-missing]
targetSeconds: 300
irt: { expectedCorrectRate: 0.68, discrimination: 1.0 }
author:
  intent: |
    商の微分を正しく使い、分数関数の増減表と漸近線を求められるかをみる。分子の順序を逆にすると $f'(x)$ の符号が反転し、(2) で極大と極小が入れ替わる（$x=-3$ で極小 $-6$ などと答える）ので、商の公式の誤りが (2) の答えに現れる。(3) は割り算による「整式 $+$ 真分数式」への変形と、極値だけでなく漸近線まで調べてグラフをかく習慣を確認する。極大値 $<$ 極小値となることへの違和感を、グラフの形で説明できるかが理解の深さを表す。
  assessedAbilities: [知識・技能]
  curriculumRefs: ["数学III (2) イ(ア) 導関数を用いた関数の考察（グラフの概形、漸近線）"]
  variations:
    - $f(x)=\dfrac{x^2+3}{x+1}=k$ の実数解の個数を $k$ で分類させる（$k<-6,\ 2<k$ で2個、$k=-6,\ 2$ で1個、$-6<k<2$ で0個）。
    - $f''(x)=\dfrac{8}{(x+1)^3}$ を求めて凹凸を調べ、変曲点がないことを確かめさせる。
