id: mb-sq-a02
level: applied
format: choice
title: 会話から考える数学的帰納法の誤った証明
stem: |
  太郎さんと花子さんが、次の等式 $(*)$ について話している。
  $$1+2+3+\cdots+n=\frac{n^2+n+2}{2}\qquad\cdots\ (*)$$

  太郎「$(*)$ がすべての自然数 $n$ で成り立つことを数学的帰納法で示したよ。$n=k$ のとき $(*)$ が成り立つと仮定すると
  $$1+2+\cdots+k+(k+1)=\frac{k^2+k+2}{2}+(k+1)=\frac{k^2+3k+4}{2}=\frac{(k+1)^2+(k+1)+2}{2}$$
  となるから、$n=k+1$ のときも $(*)$ が成り立つ。だから $(*)$ はすべての自然数 $n$ で正しいね。」

  花子「本当かな。その議論には何か足りないところがある気がするよ。」

  太郎さんの議論および等式 $(*)$ についての記述として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: 太郎さんの議論は数学的帰納法の証明として完全であり、$(*)$ はすべての自然数 $n$ で成り立つ。
    misconception: mc-sq-induction-base-step
    rationale: |
      $n=k$ から $n=k+1$ を導く部分だけで証明が終わったと考えている。出発点 $n=1$ の確認がなければ、帰納法は何も示していない。
  - id: "2"
    text: $n=k+1$ のときの式変形に誤りがあるので、$(*)$ が成り立つかどうかはこの議論からは判断できない。
    rationale: |
      式変形は正しい。$\dfrac{k^2+k+2}{2}+(k+1)=\dfrac{k^2+3k+4}{2}$ であり、$(k+1)^2+(k+1)+2=k^2+3k+4$ である。誤りは計算ではなく論証の構成にある。
  - id: "3"
    text: $n=k$ から $n=k+1$ を導く部分は正しいが、$n=1$ のとき左辺は $1$、右辺は $2$ で $(*)$ は成り立たない。実際、$(*)$ はどの自然数 $n$ についても成り立たない。
    rationale: |
      正解。左辺は $\dfrac{n^2+n}{2}$ なので、右辺との差は常に $1$ であり、$(*)$ はどの $n$ でも成り立たない。帰納法の (2) の部分は「成り立つなら次も成り立つ」ことしか示さない。
  - id: "4"
    text: $n=k$ のとき成り立つと仮定するのは、示すべきことを仮定に使っているので循環論法であり、この方法では等式を証明できない。
    misconception: mc-sq-induction-base-step
    rationale: |
      数学的帰納法の仕組みを誤解している。仮定するのは「ある $k$ で成り立つこと」であり、そこから $k+1$ で成り立つことを導くのは循環ではない。$n=1$ の確認と組み合わせれば正しい証明法になる。
answer: "3"
solution: |
  数学的帰納法は (1) $n=1$ で成り立つこと、(2) $n=k$ で成り立てば $n=k+1$ でも成り立つこと、の両方を示して初めて完成する。

  太郎さんの (2) の計算は正しいが、(1) を確かめていない。$n=1$ のとき左辺 $=1$、右辺 $=\dfrac{1+1+2}{2}=2$ で成り立たない。そもそも左辺は $\dfrac{n(n+1)}{2}=\dfrac{n^2+n}{2}$ なので、右辺は常に左辺より $1$ 大きく、$(*)$ はどの $n$ でも成り立たない。

  この例は、(2) が成り立っても出発点がなければ何も示せないことを表している。
concepts: [sq-induction, sq-sigma]
misconceptions: [mc-sq-induction-base-step]
targetSeconds: 240
irt: { expectedCorrectRate: 0.58, discrimination: 1.2 }
author:
  intent: |
    共通テストで増えている「他者の解答を評価する」会話形式の問題。帰納法を手順として覚えているだけの受験者は、(2) の計算が正しいことから①を選ぶ。②は計算の確認を怠った受験者、④は帰納法の論理構造そのものを疑う受験者の誤解を拾う。正解③は、(2) の正しさと命題の偽を同時に認める必要があり、帰納法の2つの段階の役割を理解しているかを識別する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: ["数学B (1) ア(ウ) 漸化式と数学的帰納法（数学的帰納法）"]
  variations:
    - 「すべての自然数 $n$ について $n^2+n+41$ は素数」のように、小さい $n$ では成り立つが $n=40$ で崩れる命題と対比させる。
    - 不等式 $2^n>n^2$ を題材に、出発点を $n=5$ にとる必要があることを会話で考えさせる。
