author:
  intent: |
    「指数関数は多項式より速く増大する」という事実を、高校数学の範囲（二項定理とはさみうちの原理）で論証できるかをみる。(2) では $\dfrac{\infty}{\infty}$ の形から直観的に $0$ と書くだけの答案と、評価式を示した答案を分離する。(3) は数学Bの（等差）×（等比）の和と、(2) の極限を組み合わせて無限級数の和を求める流れで、誘導の意味（なぜ (2) が必要か）を理解しているかが問われる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (1) ア(ア) 数列の極限", "数学III (1) ア(イ) 無限級数の和", "数学III (1) イ(ア) 極限を求める方法の考察"]
  variations:
    - $\displaystyle\lim_{n\to\infty}\frac{n^2}{2^n}=0$ を、第4項 ${}_n\mathrm{C}_3$ までの評価で示させる。
    - $\displaystyle\sum_{n=1}^{\infty}n r^{n-1}=\frac{1}{(1-r)^2}\ (0<r<1)$ を、$\displaystyle\lim_{n\to\infty}nr^n=0$ の証明とあわせて一般化させる。
