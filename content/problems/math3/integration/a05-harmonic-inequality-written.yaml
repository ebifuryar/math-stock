id: m3-ig-a05
level: applied
format: written
title: 定積分による調和級数の評価
stem: |
  (1) 自然数 $k$ に対して、不等式
  $$\frac{1}{k+1}<\int_k^{k+1}\frac{dx}{x}<\frac{1}{k}$$
  が成り立つことを示せ。

  (2) $2$ 以上の自然数 $n$ に対して、不等式
  $$\log(n+1)<\sum_{k=1}^{n}\frac{1}{k}<1+\log n$$
  が成り立つことを示せ。

  (3) $\displaystyle\lim_{n\to\infty}\frac{1}{\log n}\sum_{k=1}^{n}\frac{1}{k}$ を求めよ。
modelAnswer: |
  (1) $k\leqq x\leqq k+1$ のとき $\dfrac{1}{k+1}\leqq\dfrac{1}{x}\leqq\dfrac{1}{k}$ であり、等号は $x=k+1$ または $x=k$ のときだけ成り立つ（$\dfrac{1}{x}$ は連続で、区間の内部では等号は成り立たない）。これを $k$ から $k+1$ まで積分すると
  $$\int_k^{k+1}\frac{dx}{k+1}<\int_k^{k+1}\frac{dx}{x}<\int_k^{k+1}\frac{dx}{k}$$
  すなわち
  $$\frac{1}{k+1}<\int_k^{k+1}\frac{dx}{x}<\frac{1}{k}$$

  (2) **左側**: (1) の右側の不等式を $k=1,\ 2,\ \dots,\ n$ について加えると
  $$\int_1^{n+1}\frac{dx}{x}<\sum_{k=1}^{n}\frac{1}{k}$$
  左辺は $\Big[\log x\Big]_1^{n+1}=\log(n+1)$ なので $\log(n+1)<\displaystyle\sum_{k=1}^{n}\frac{1}{k}$。

  **右側**: (1) の左側の不等式を $k=1,\ 2,\ \dots,\ n-1$ について加えると（$n\geqq 2$ なので1個以上ある）
  $$\sum_{k=1}^{n-1}\frac{1}{k+1}<\int_1^{n}\frac{dx}{x}=\log n$$
  左辺は $\displaystyle\sum_{k=2}^{n}\frac{1}{k}$ なので、両辺に $1$ を加えて $\displaystyle\sum_{k=1}^{n}\frac{1}{k}<1+\log n$。

  以上より $\log(n+1)<\displaystyle\sum_{k=1}^{n}\frac{1}{k}<1+\log n$。

  (3) $n\geqq 2$ のとき $\log n>0$ なので、(2) の各辺を $\log n$ で割ると
  $$\frac{\log(n+1)}{\log n}<\frac{1}{\log n}\sum_{k=1}^{n}\frac{1}{k}<\frac{1}{\log n}+1$$
  ここで
  $$\frac{\log(n+1)}{\log n}=\frac{\log n+\log\left(1+\frac{1}{n}\right)}{\log n}=1+\frac{\log\left(1+\frac{1}{n}\right)}{\log n}\to 1+\frac{0}{\infty}=1\quad(n\to\infty)$$
  また $\dfrac{1}{\log n}+1\to 1$。はさみうちの原理により
  $$\lim_{n\to\infty}\frac{1}{\log n}\sum_{k=1}^{n}\frac{1}{k}=1$$
rubric:
  - id: r1
    criterion: (1) で $k\leqq x\leqq k+1$ における $\dfrac{1}{k+1}\leqq\dfrac{1}{x}\leqq\dfrac{1}{k}$ を示し、等号が常には成り立たないことに触れて積分し、強い不等号を導いている
    points: 2
    keywords: ["1/(k+1)", "1/k", "等号"]
  - id: r2
    criterion: (2) の左側で、(1) の右側を $k=1$ から $n$ まで加えて $\displaystyle\int_1^{n+1}\frac{dx}{x}=\log(n+1)$ と評価している（加える範囲と積分区間が正しく対応している）
    points: 3
    keywords: ["log(n+1)", "k=1"]
  - id: r3
    criterion: (2) の右側で、(1) の左側を $k=1$ から $n-1$ まで加えて $\displaystyle\sum_{k=2}^{n}\frac{1}{k}<\log n$ とし、$1$ を加えて結論している
    points: 3
    keywords: ["n-1", "log n", "1+"]
  - id: r4
    criterion: (3) で (2) を $\log n\ (>0)$ で割ってはさみ、$\dfrac{\log(n+1)}{\log n}\to 1$ を示してはさみうちの原理から極限 $1$ を得ている
    points: 2
    keywords: ["はさみうち", "1"]
solution: |
  $y=\dfrac{1}{x}$ のグラフの下の面積 $\displaystyle\int_k^{k+1}\frac{dx}{x}$ を、高さ $\dfrac{1}{k+1}$（内側）と $\dfrac{1}{k}$（外側）の幅 $1$ の長方形ではさむのが (1)。(2) では、左側は $k=1$〜$n$ の外側の長方形（積分区間 $[1,\ n+1]$）、右側は $k=1$〜$n-1$ の内側の長方形（区間 $[1,\ n]$）に $1$ を加える。和の番号と積分区間の対応を取り違えないことが要点。(3) は $\log n$ で割ってはさみうち。調和級数 $\displaystyle\sum\frac{1}{k}$ は $\log n$ と同じ速さで発散する。
concepts: [ig-riemann-sum, ig-basic, lm-squeeze]
misconceptions: [mc-ig-riemann-range]
targetSeconds: 900
irt: { expectedCorrectRate: 0.45, discrimination: 1.3 }
author:
  intent: |
    「減少関数の定積分を長方形ではさむ」という定積分と不等式の典型を、誘導に沿って答案として書けるかをみる。(1) では等号の扱い（強い不等号にする根拠）、(2) では加える $k$ の範囲と積分区間の対応（左側は $[1,\ n+1]$、右側は $k=1$〜$n-1$ で $[1,\ n]$）が採点の要点で、右側をそのまま $k=1$〜$n$ で加えて $\log(n+1)$ と比べてしまう答案を区別する。(3) は (2) の結果を極限に使えるかをみる仕上げ。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: ["数学III (3) イ(イ) 極限や定積分の考えを基にした考察（定積分と不等式）"]
  variations:
    - $\displaystyle\sum_{k=1}^{n}\frac{1}{\sqrt{k}}$ を同様に評価し、$\displaystyle\lim_{n\to\infty}\frac{1}{\sqrt{n}}\sum_{k=1}^{n}\frac{1}{\sqrt{k}}=2$ を導かせる。
    - $\log n!$ を $\displaystyle\int_1^n\log x\,dx$ ではさみ、$\displaystyle\lim_{n\to\infty}\frac{\log n!}{n\log n}=1$ を示させる。
