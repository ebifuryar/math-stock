id: cl-equation-inequality
kind: method
title: 方程式の実数解の個数・不等式の証明への応用
body: |
  **定数分離**: 方程式 $g(x)=a$（$a$ は定数）の異なる実数解の個数は、曲線 $y=g(x)$ と直線 $y=a$ の共有点の個数に等しい。$g(x)$ の増減表からグラフをかき、直線 $y=a$ を上下に動かして数える。直線が極大値・極小値の高さを通るときは、曲線と接する点があるので個数が変わる（3次関数なら $2$ 個）。

  文字が分離できないときは、$f(x)=x^3+px+q$ などの3次関数について「極値をもち、かつ（極大値）$\times$（極小値）$<0$」が異なる3つの実数解をもつ条件になる。

  **不等式の証明**: $x\geqq c$ で $f(x)\geqq g(x)$ を示すには、$F(x)=f(x)-g(x)$ とおき、その区間での $F(x)$ の **最小値** が $0$ 以上であることを増減表で示す。
prerequisites: [cl-extremum, cl-max-min]
