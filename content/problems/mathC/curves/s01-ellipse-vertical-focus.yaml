id: mc-cv-s01
level: school
format: choice
title: 長軸が y 軸上にある楕円の焦点
stem: |
  楕円 $\dfrac{x^2}{9}+\dfrac{y^2}{25}=1$ の焦点の座標と、この楕円上の点から2つの焦点までの距離の和の組合せとして正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: 焦点 $(\pm 4,\ 0)$、距離の和 $6$
    misconception: mc-cv-major-axis
    rationale: |
      $x^2$ の分母 $9$ を $a^2$、$y^2$ の分母 $25$ を $b^2$ と決めつけ、$a>b$ の楕円と同じように焦点を $x$ 軸上に置き、距離の和を $2a=6$ としている。この楕円は $x$ 軸と $(\pm 3,\ 0)$、$y$ 軸と $(0,\ \pm 5)$ で交わり、$y$ 軸方向に長い。
  - id: "2"
    text: 焦点 $(0,\ \pm 4)$、距離の和 $10$
    rationale: |
      正解。分母の大きい $y^2$ の側が長軸なので、焦点は $y$ 軸上の $(0,\ \pm\sqrt{25-9})=(0,\ \pm 4)$、距離の和は長軸の長さ $2\cdot 5=10$。
  - id: "3"
    text: 焦点 $(0,\ \pm\sqrt{34})$、距離の和 $10$
    misconception: mc-cv-focus-c-formula
    rationale: |
      双曲線の公式 $c^2=a^2+b^2$ を使って $c=\sqrt{9+25}=\sqrt{34}$ としている。$\sqrt{34}>5$ なので、この点は楕円の頂点 $(0,\ 5)$ より外にあり、楕円の焦点（楕円の内部の点）になりえない。
  - id: "4"
    text: 焦点 $(0,\ \pm 4)$、距離の和 $6$
    misconception: mc-cv-sum-diff
    rationale: |
      焦点は正しいが、距離の和を短軸の長さ $2\cdot 3=6$ としている。距離の和は長軸の長さに等しい。たとえば頂点 $(0,\ 5)$ では、2焦点までの距離は $1$ と $9$ で、和は $10$ である。
answer: "2"
solution: |
  $25>9$ なので、この楕円は $y$ 軸方向に長く、長軸は $y$ 軸上にある（長軸の長さ $2\cdot 5=10$、短軸の長さ $2\cdot 3=6$）。焦点は $y$ 軸上にあり、
  $$c=\sqrt{25-9}=4\quad\Longrightarrow\quad\text{焦点 }(0,\ 4),\ (0,\ -4)$$
  楕円上の点から2焦点までの距離の和は長軸の長さ $10$。

  検算: 頂点 $(3,\ 0)$ では、2焦点までの距離はどちらも $\sqrt{9+16}=5$ で、和は $10$。
concepts: [cv-ellipse]
misconceptions: [mc-cv-major-axis, mc-cv-focus-c-formula, mc-cv-sum-diff]
targetSeconds: 90
irt: { expectedCorrectRate: 0.7, discrimination: 1.1 }
author:
  intent: |
    楕円の標準形から焦点と距離の和を読み取る基本操作で、「長軸がどちらの軸か」「楕円の $c^2$ は差」「距離の和は長軸の長さ」の3点を独立に確かめる。誤答①は長軸の向きを誤る、③は双曲線と混同する、④は和を短軸と取り違える、にそれぞれ対応させ、焦点と距離の和を組にすることで2つの判断を同時に識別する。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学C (2) ア(ア) 放物線・楕円・双曲線が2次式で表されること]
  variations:
    - 焦点 $(0,\ \pm 3)$、短軸の長さ $8$ の楕円の方程式を求めさせる。
    - 楕円 $4x^2+y^2=16$ のように標準形でない式から焦点を求めさせる。
