solution: |
  点 $z$ は中心 $\mathrm{C}(2i)$、半径 $1$ の円周上を動く。

  (1) $\mathrm{OC}=2$ なので、$|z|$ は $2+1=3$（$z=3i$）が最大、$2-1=1$（$z=i$）が最小。

  (2) 原点からこの円に引いた2本の接線の接点を $\mathrm{T}_1,\ \mathrm{T}_2$ とすると、$\mathrm{OT}\perp\mathrm{CT}$、$\mathrm{CT}=1$、$\mathrm{OC}=2$ より $\angle\mathrm{COT}=\dfrac{\pi}{6}$。$\mathrm{OC}$ の偏角は $\dfrac{\pi}{2}$ なので
  $$\frac{\pi}{2}-\frac{\pi}{6}\leqq\arg z\leqq\frac{\pi}{2}+\frac{\pi}{6}\qquad\text{すなわち}\qquad\frac{\pi}{3}\leqq\arg z\leqq\frac{2}{3}\pi$$
  最大値 $\dfrac{2}{3}\pi$、最小値 $\dfrac{\pi}{3}$。

  (3) $z=r(\cos\theta+i\sin\theta)$ とすると $z^3=r^3(\cos 3\theta+i\sin 3\theta)$ が実数 $\iff\sin 3\theta=0$。(2) より $\pi\leqq 3\theta\leqq 2\pi$ なので $3\theta=\pi$ または $3\theta=2\pi$、すなわち $\theta=\dfrac{\pi}{3}$ または $\dfrac{2}{3}\pi$。これらの偏角をもつ円上の点はそれぞれ接点ただ1つなので、$z$ は **2個**。

  $z^3<0$ となるのは $\cos 3\theta=-1$、すなわち $\theta=\dfrac{\pi}{3}$ の接点。$\mathrm{OT}=\sqrt{\mathrm{OC}^2-\mathrm{CT}^2}=\sqrt{3}$ なので
  $$z=\sqrt{3}\left(\cos\frac{\pi}{3}+i\sin\frac{\pi}{3}\right)=\frac{\sqrt{3}}{2}+\frac{3}{2}i,\qquad z^3=(\sqrt{3})^3(\cos\pi+i\sin\pi)=-3\sqrt{3}$$
  （$\theta=\dfrac{2}{3}\pi$ の接点 $-\dfrac{\sqrt{3}}{2}+\dfrac{3}{2}i$ では $z^3=3\sqrt{3}$。）
concepts: [cp-polar-form, cp-de-moivre, cp-figures]
misconceptions: [mc-cp-modulus-scale]
targetSeconds: 480
