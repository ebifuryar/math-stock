author:
  intent: |
    三角関数の積分で、そのままでは積分できない式を「次数下げ」「積和」「$\dfrac{f'}{f}$ 型」の3つの変形のどれで処理するかを選べるかをみる。(1) で $\dfrac{\sin^3x}{3}$ とする（合成関数の扱いの誤り）と値が $\dfrac{1}{3}$ になり、$\pi$ の形にならないことで気づける。(2) は $\cos 4x,\ \cos 2x$ の係数 $\dfrac{1}{4},\ \dfrac{1}{2}$ の付け忘れ、(3) は符号の誤り（$\log\dfrac{1}{2}$ と答えると $\log 2$ の形にならない）を区別する。
  assessedAbilities: [知識・技能]
  curriculumRefs: ["数学III (3) ア(ア) 不定積分と定積分（三角関数の積分）", "数学III (3) イ(ア) 関数の式を目的に応じて変形した積分の考察"]
  variations:
    - $\displaystyle\int_0^{\frac{\pi}{2}}\cos^3x\,dx$（$=\dfrac{2}{3}$、$u=\sin x$ の置換）を加える。
    - $\displaystyle\int_0^{\pi}\sin mx\sin nx\,dx$（$m,\ n$ は自然数）の値を $m=n$、$m\neq n$ で場合分けして求めさせる。
