id: ma-it-e02
level: exam
format: choice
title: 素数の平方から1を引いた数の約数
stem: |
  $p$ を $5$ 以上の素数とする。$p$ がどのような素数であっても $p^2-1$ を割り切る自然数のうち、最大のものとして正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $12$
    misconception: mc-it-remainder-incomplete
    rationale: |
      $p-1,\ p+1$ が「ともに偶数」であることから $2\cdot 2=4$ の倍数としか見ていない。$p$ を $4$ で割った余りで $p=4k+1,\ 4k+3$ と分類すると、連続する2つの偶数の一方は $4$ の倍数なので、$p^2-1$ は $8$ の倍数になる。
  - id: "2"
    text: $24$
    rationale: |
      正解。$p^2-1=(p-1)(p+1)$ は $8$ の倍数かつ $3$ の倍数で、$8$ と $3$ は互いに素なので $24$ の倍数。$p=5$ のとき $p^2-1=24$ なので、これより大きい数で常に割り切れることはない。
  - id: "3"
    text: $48$
    rationale: |
      $p=7$（$p^2-1=48$）や $p=7,\ 17$ など一部の素数で確かめただけで結論している。$p=5$ のとき $p^2-1=24$ は $48$ で割り切れない。「常に割り切る最大の数」は、最小の場合 $p=5$ の値を超えられない。
  - id: "4"
    text: $6$
    misconception: mc-it-remainder-incomplete
    rationale: |
      「$p$ は奇数なので $p^2-1$ は偶数」「$p$ は $3$ の倍数でないので $p^2-1$ は $3$ の倍数」の2点だけで判断し、$2$ の因数を $1$ 個しか数えていない。$p$ を $4$ や $8$ で割った余りまで分類すれば $8$ の倍数であることがわかる。
answer: "2"
solution: |
  **$8$ の倍数** $p$ は奇数なので $p=4k+1$ または $p=4k+3$（$k$ は整数）。
  - $p=4k+1$: $(p-1)(p+1)=4k\cdot(4k+2)=8k(2k+1)$
  - $p=4k+3$: $(p-1)(p+1)=(4k+2)(4k+4)=8(2k+1)(k+1)$

  **$3$ の倍数** $p\geqq 5$ は $3$ の倍数でないので $p=3m+1$ または $p=3m+2$。前者は $p-1$、後者は $p+1$ が $3$ の倍数。

  $8$ と $3$ は互いに素なので $p^2-1$ は $24$ の倍数。$p=5$ で $p^2-1=24$ なので、求める最大の数は **$24$**。
concepts: [it-remainder-classification, it-gcd-lcm]
misconceptions: [mc-it-remainder-incomplete, mc-it-coprime-ignored]
targetSeconds: 300
irt: { expectedCorrectRate: 0.38, discrimination: 1.3 }
author:
  intent: |
    「常に割り切る最大の数」を、(a) 割り切ることの証明（余りによる分類）と (b) それより大きい数では割り切れない反例（$p=5$）の両面から捉えられるかをみる。①④は分類の粗さ（$2$ の因数を数え落とす）、③は実験からの早すぎる一般化に対応する。入試ではこの結果を記述で問うことが多く、記述版への橋渡しとして使える。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学A (3) ア(ア) 整数の性質（余りによる整数の分類）]
  variations:
    - 記述式にして「$p^2-1$ が $24$ の倍数であることを証明せよ」と問う。
    - "$7$ 以上の素数 $p$ について、$p^4-1$ を常に割り切る最大の数（$240$）を問う（$p=5$ を含めると $48$ になる点も注意）。"
