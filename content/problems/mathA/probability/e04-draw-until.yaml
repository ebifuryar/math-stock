author:
  intent: |
    「途中で終了する試行」を「最後まで取り出したときの色の並び（同じものを含む順列）」に読みかえ、同様に確からしい $15$ 通りに帰着できるかをみる。(1) で読みかえを誘導し、(2) で分布、(3) で期待値、(4) で条件付き確率の分母（$X\leqq 4$ の $6$ 通り）を問う。(4) で全体を分母にすると $\dfrac{1}{5}$、条件を無視すると $\dfrac{1}{3}$ となり、条件付き確率の理解を識別できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学A (2) ア(イ) 順列・組合せ（同じものを含む順列）", "数学A (2) イ(ウ) 条件付き確率", "数学A (2) イ(エ) 期待値"]
  variations:
    - 赤玉 $m$ 個・白玉 $2$ 個に一般化し、$E=\dfrac{2(m+3)}{3}$ を導かせる。
    - 「赤玉を $2$ 個取り出した時点で終了」に変え、終了条件の色を入れかえたときの分布の違いを考察させる。
