author:
  intent: |
    垂線の足を「直線上にある（係数の和が1）」と「垂直（内積が0）」の2条件で求める、共通テスト頻出の誘導をなぞれるかをみる。$\overrightarrow{\mathrm{OH}}=(1-t)\vec a+t\vec b$ の $t$ と $\mathrm{AH}:\mathrm{HB}$ の対応（$t:(1-t)$）で比を逆に読む誤り、$|\vec b-\vec a|^2$ の展開の符号の誤りを識別する。(3) は面積から高さを求める方法と、$|\overrightarrow{\mathrm{OH}}|^2$ を直接計算する方法のどちらでも到達でき、検算の手段にもなる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (1) ア(イ) ベクトルの内積とその基本的な性質, 数学C (1) イ(イ) ベクトルを用いた平面図形の考察]
  variations:
    - 直線 $\mathrm{OH}$ に関して $\mathrm{A}$ と対称な点 $\mathrm{A}'$ の位置ベクトルを求めさせる。
    - $\mathrm{OA}=1,\ \mathrm{OB}=4,\ \angle\mathrm{AOB}=60^\circ$ に変え、$t=-\dfrac{1}{13}<0$ となって垂線の足が線分 $\mathrm{AB}$ の外（$\mathrm{A}$ の側）に出ることを確かめさせる。
