id: m2-cl-a02
level: applied
format: choice
title: 上端に x を含む定積分で表された関数の極値
stem: |
  関数 $g(x)$ を
  $$g(x)=\int_1^x(t^2-2t-3)\,dt$$
  で定める。$g(x)$ の極小値として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $-\dfrac{16}{3}$
    rationale: |
      正解。$g'(x)=x^2-2x-3=(x+1)(x-3)$ より $x=3$ で極小となり、$g(3)=\displaystyle\int_1^3(t^2-2t-3)\,dt=-\dfrac{16}{3}$。
  - id: "2"
    text: $\dfrac{16}{3}$
    misconception: mc-cl-area-sign
    rationale: |
      $\displaystyle\int_1^3(t^2-2t-3)\,dt$ を面積のように正の値にしている。$1<t<3$ では $t^2-2t-3<0$ なので定積分は負。なお $\dfrac{16}{3}$ は $x=-1$ における極大値 $g(-1)$ に等しい。
  - id: "3"
    text: $-\dfrac{32}{3}$
    rationale: |
      $\displaystyle\int_{-1}^{3}(t^2-2t-3)\,dt=-\dfrac{1}{6}\cdot 4^3$ を計算しており、下端を $1$ ではなく極大点 $-1$ にしてしまっている。$g(x)$ の下端は $1$ で固定されている。
  - id: "4"
    text: 極小値をもたない。
    misconception: mc-cl-integral-function-constant
    rationale: |
      $g'(x)=f(x)-f(1)$（$f(t)=t^2-2t-3$）として、下端の値 $f(1)=-4$ を引いている。すると $g'(x)=x^2-2x+1=(x-1)^2$ となり極値をもたないと誤る。$\dfrac{d}{dx}\displaystyle\int_1^x f(t)\,dt=f(x)$ である。
answer: "1"
solution: |
  $\dfrac{d}{dx}\displaystyle\int_1^x f(t)\,dt=f(x)$ より
  $$g'(x)=x^2-2x-3=(x+1)(x-3)$$

  | $x$ | $\cdots$ | $-1$ | $\cdots$ | $3$ | $\cdots$ |
  | --- | --- | --- | --- | --- | --- |
  | $g'(x)$ | $+$ | $0$ | $-$ | $0$ | $+$ |
  | $g(x)$ | $\nearrow$ | 極大 | $\searrow$ | 極小 | $\nearrow$ |

  極小値は
  $$g(3)=\left[\frac{t^3}{3}-t^2-3t\right]_1^3=(9-9-9)-\left(\frac{1}{3}-1-3\right)=-\frac{16}{3}$$
concepts: [cl-integral-function, cl-extremum, cl-integral]
misconceptions: [mc-cl-integral-function-constant, mc-cl-area-sign]
targetSeconds: 240
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    上端に $x$ を含む定積分を微分すると被積分関数になること、および下端の値は定数として消えることを理解しているかをみる。被積分関数の $t=1$ での値が $0$ でないように設計し、$f(x)-f(1)$ とする誤りでは極値が消えるため④を選ぶ。②は定積分の符号の扱い、③は積分区間の取り違えを識別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学II (5) ア(ウ) 不定積分と定積分", "数学II (5) イ(ア) 導関数を用いた関数の考察"]
  variations:
    - 下端を文字 $a$ にして、「$g(x)$ の極大値が $0$ となる $a$」を求めさせる。
    - $g(x)=\displaystyle\int_0^x(x-t)f(t)\,dt$ の形（$x$ をくくり出してから微分）に発展させる。
