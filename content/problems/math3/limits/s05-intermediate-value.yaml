id: m3-lm-s05
level: school
format: written
title: 中間値の定理による実数解の存在
stem: |
  方程式
  $$2^x=3x$$
  は、$0<x<1$ の範囲と $3<x<4$ の範囲に、それぞれ少なくとも1つの実数解をもつことを示せ。
modelAnswer: |
  $f(x)=2^x-3x$ とおく。$2^x$ と $3x$ はすべての実数 $x$ で連続なので、$f(x)$ はすべての実数 $x$ で連続である。

  **$0<x<1$ について**: 
  $$f(0)=2^0-0=1>0,\qquad f(1)=2-3=-1<0$$
  $f(x)$ は閉区間 $[0,\ 1]$ で連続で、$f(0)$ と $f(1)$ は異符号であるから、中間値の定理により、$f(x)=0$ は $0<x<1$ の範囲に少なくとも1つの実数解をもつ。

  **$3<x<4$ について**: 
  $$f(3)=8-9=-1<0,\qquad f(4)=16-12=4>0$$
  $f(x)$ は閉区間 $[3,\ 4]$ で連続で、$f(3)$ と $f(4)$ は異符号であるから、中間値の定理により、$f(x)=0$ は $3<x<4$ の範囲に少なくとも1つの実数解をもつ。

  $f(x)=0$ は $2^x=3x$ と同値なので、**方程式 $2^x=3x$ は $0<x<1$、$3<x<4$ の範囲にそれぞれ少なくとも1つの実数解をもつ**。（終）
rubric:
  - id: r1
    criterion: $f(x)=2^x-3x$ のように一方の辺に集めた関数を設定し、$f(x)=0$ の解を考えている
    points: 2
    keywords: ["f(x)=2^x-3x"]
  - id: r2
    criterion: $f(x)$ が連続である（閉区間 $[0,1]$, $[3,4]$ で連続である）ことを、理由（$2^x$ と $3x$ が連続）とともに明記している
    points: 2
    keywords: ["連続"]
  - id: r3
    criterion: $f(0)=1>0$、$f(1)=-1<0$ を正しく計算し、異符号であることを示している
    points: 2
    keywords: ["f(0)=1", "f(1)=-1"]
  - id: r4
    criterion: $f(3)=-1<0$、$f(4)=4>0$ を正しく計算し、異符号であることを示している
    points: 2
    keywords: ["f(3)=-1", "f(4)=4"]
  - id: r5
    criterion: 中間値の定理を名指しで適用し、それぞれの区間に「少なくとも1つ」解があると結論している
    points: 2
    keywords: ["中間値の定理", "少なくとも1つ"]
solution: |
  $f(x)=2^x-3x$ は連続関数で、$f(0)=1>0,\ f(1)=-1<0,\ f(3)=-1<0,\ f(4)=4>0$。中間値の定理を区間 $[0,1]$ と $[3,4]$ にそれぞれ用いる。連続であることを書かずに符号の変化だけを示すのは不十分（連続でない関数では成り立たない）。中間値の定理が保証するのは「少なくとも1つ」であり、「ただ1つ」とは書かない。
