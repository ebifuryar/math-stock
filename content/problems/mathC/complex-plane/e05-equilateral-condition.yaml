author:
  intent: |
    正三角形の条件を回転（$\gamma-\alpha=(\beta-\alpha)(\cos\theta+i\sin\theta),\ \theta=\pm\dfrac{\pi}{3}$）で表し、2つの向きを1本の対称式にまとめる議論を、必要十分条件として答案に書けるかをみる。上位層との差は、平行移動による簡約（$p,\ q$ への置き換え）に気づくか、$\theta=\dfrac{\pi}{3}$ の一方の向きだけで論証して十分性・必要性の一方を欠かないか（r3）に現れる。(2) では条件式の因数分解と「相異なる」条件の処理を求め、$z=1$ を答えに含める誤りを r4・r5 で検出する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(エ) 複素数平面における図形（回転と正三角形）, 数学C (2) ア(ウ) ド・モアブルの定理（1の3乗根）]
  variations:
    - 相異なる3点 $z,\ z^2,\ z^3$ が正三角形となる $z$ を求めさせる（$z\neq 0$ で割ると (2) と同じ条件になる）。
    - $\omega=\cos\dfrac{2\pi}{3}+i\sin\dfrac{2\pi}{3}$ として、$\alpha+\omega\beta+\omega^2\gamma=0$が、$\triangle\mathrm{ABC}$ が反時計回りの正三角形であるための条件であることを示させる。
