id: cg-circle-line
kind: property
title: 円と直線の位置関係・円外の点からの接線
body: |
  円（中心 $\mathrm{C}$、半径 $r$）と直線 $\ell$ の位置関係は、次の2通りで判定できる。

  | 位置関係 | 中心と直線の距離 $d$ | $y$ を消去した2次方程式の判別式 $D$ |
  | --- | --- | --- |
  | 2点で交わる | $d<r$ | $D>0$ |
  | 接する | $d=r$ | $D=0$ |
  | 共有点なし | $d>r$ | $D<0$ |

  「共有点をもつ」は $d\leqq r$（$D\geqq 0$）。距離の方法は計算が軽く、判別式の方法は交点の座標まで必要なときに向く。

  **円外の点 $\mathrm{P}(p,q)$ から引いた接線** は2本ある。
  - 傾きを $m$ とおいて $y-q=m(x-p)$ とし、$d=r$ から $m$ を求める方法では、**$y$ 軸に平行な接線 $x=p$ が表せない**。$m$ が1つしか求まらなかったら、$x=p$ が接線かどうかを必ず調べる。
  - 接点を $(x_1,y_1)$ とおいて接線の公式に $\mathrm{P}$ を代入し、円の方程式と連立する方法なら、この見落としは起きない。
prerequisites: [cg-point-line-distance, cg-circle-equation, qf-discriminant]
