id: ne-real-numbers
kind: definition
title: 実数（有理数と無理数）
body: |
  整数 $m$ と $0$ でない整数 $n$ を用いて分数 $\dfrac{m}{n}$ の形に表せる数を **有理数**、表せない実数を **無理数** という。

  - 有理数は **有限小数** か **循環小数** で表される。既約分数の分母の素因数が $2$ と $5$ だけなら有限小数、それ以外の素因数を含めば循環小数になる。
  - 逆に循環小数は分数に直せる。例えば $x=0.\dot{1}\dot{2}$ なら $100x-x=12$ より $x=\dfrac{12}{99}=\dfrac{4}{33}$。同様に $0.\dot{9}=1$。
  - 無理数は循環しない無限小数で表される。$\sqrt{2},\ \pi$ など。
  - $\sqrt{\ }$ がついていても $\sqrt{16}=4$ のように有理数のことがある。また無理数どうしの和や積は無理数とは限らない（$\sqrt{2}+(-\sqrt{2})=0$）。
