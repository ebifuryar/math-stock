id: m1-sp-e02
level: exam
format: choice
title: 「ある」と「すべて」が重なる命題の否定
stem: |
  命題
  $$P:\ \text{ある実数 }a\text{ が存在して、すべての実数 }x\text{ に対して }x^2-2ax+1>0$$
  について、$P$ の否定 $\overline{P}$ と $P$ の真偽の組合せとして正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: |
      $\overline{P}$：すべての実数 $a$ に対して、ある実数 $x$ が存在して $x^2-2ax+1\leqq 0$。$P$ は偽である。
    misconception: mc-sp-counterexample
    rationale: |
      否定は正しいが、真偽の判定を誤っている。例えば $a=2,\ x=2$ で $x^2-2ax+1=-3<0$ となることから $P$ を偽としたなら、それは $a=2$ が条件を満たさないことを示しただけ。$P$ は「ある $a$」の命題なので、条件を満たす $a$ が1つでもあれば真。
  - id: "2"
    text: |
      $\overline{P}$：すべての実数 $a$ に対して、ある実数 $x$ が存在して $x^2-2ax+1\leqq 0$。$P$ は真である。
    rationale: |
      正解。$a=0$ とすると $x^2+1>0$ がすべての $x$ で成り立つので $P$ は真。否定は「ある」と「すべて」をそれぞれ入れかえ、最後の条件だけを否定する。
  - id: "3"
    text: |
      $\overline{P}$：ある実数 $a$ が存在して、すべての実数 $x$ に対して $x^2-2ax+1\leqq 0$。$P$ は真である。
    misconception: mc-sp-negation-quantifier
    rationale: |
      「ある」「すべて」を入れかえず、最後の不等式だけを否定している。この文は下に凸の放物線がすべての $x$ で $0$ 以下になることを主張しており、$P$ と同時に偽にもなり得る（実際に偽）ので、$P$ の否定ではない。
  - id: "4"
    text: |
      $\overline{P}$：すべての実数 $a$ に対して、ある実数 $x$ が存在して $x^2-2ax+1<0$。$P$ は真である。
    misconception: mc-sp-boundary
    rationale: |
      $>0$ の否定を $<0$ としている。正しくは $\leqq 0$。例えば $a=1$ のとき、$x^2-2x+1=(x-1)^2$ は $0$ になり得るが負にはならないので、2つの文は同じ主張ではない。
answer: "2"
solution: |
  否定は前から順に「ある」$\to$「すべて」、「すべて」$\to$「ある」と入れかえ、最後の条件 $x^2-2ax+1>0$ を $x^2-2ax+1\leqq 0$ に変える。
  $$\overline{P}:\ \text{すべての実数 }a\text{ に対して、ある実数 }x\text{ が存在して }x^2-2ax+1\leqq 0$$

  真偽: $x^2-2ax+1=(x-a)^2+1-a^2$ の最小値は $1-a^2$。すべての $x$ で正となるのは $-1<a<1$ のとき。このような $a$（例えば $a=0$）が存在するので、$P$ は真（したがって $\overline{P}$ は偽）。
concepts: [sp-negation, sp-proposition-truth]
misconceptions: [mc-sp-negation-quantifier, mc-sp-boundary, mc-sp-counterexample]
targetSeconds: 240
irt: { expectedCorrectRate: 0.32, discrimination: 1.4 }
author:
  intent: |
    「ある」と「すべて」が重なった命題について、否定の作り方と真偽の判定（何を示せば真か）の両方を理解しているかをみる。①は否定の形は正しいが、「ある $a$」の命題を1つの $a$ の失敗で偽とする誤り、③は量化子を入れかえない誤り、④は等号の誤りに対応する。①と②の差は真偽判定だけなので、否定の暗記だけでは正答できない。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学I (1) ア(ウ) 集合と命題（「すべて」「ある」の否定）, 数学I (3) ア(イ) 2次不等式]
  variations:
    - 量化子の順序を入れかえた命題「すべての実数 $x$ に対して、ある実数 $a$ が存在して $x^2-2ax+1>0$」の真偽を問い、順序で意味が変わることを確認させる。
    - 「$P$ が偽となるように $x^2-2ax+1$ の定数項を変えよ」という逆向きの問いにする。
  notes: |
    2重の量化子の否定は教科書では発展的な扱いだが、「すべて」「ある」の否定の規則を順に適用すれば処理できるため数学Iの範囲内とした。
