id: mb-sq-s04
level: school
format: mark
title: 階差数列と、和から求める一般項
stem: |
  (1) 数列
  $$2,\ 3,\ 6,\ 11,\ 18,\ 27,\ \cdots$$
  の階差数列は $1,\ 3,\ 5,\ 7,\ 9,\ \cdots$ である。階差数列の第 $n$ 項が $2n-1$ であるとき、この数列の一般項は
  $$a_n=n^2-\boxed{\text{ア}}\,n+\boxed{\text{イ}}$$
  である。

  (2) 数列 $\{b_n\}$ の初項から第 $n$ 項までの和 $S_n$ が $S_n=n^2+2n+3$ で与えられている。このとき $b_1=\boxed{\text{ウ}}$ であり、$n\geqq 2$ のとき $b_n=\boxed{\text{エ}}\,n+\boxed{\text{オ}}$ である。
blanks:
  - { label: ア, answer: "2" }
  - { label: イ, answer: "3" }
  - { label: ウ, answer: "6" }
  - { label: エ, answer: "2" }
  - { label: オ, answer: "1" }
solution: |
  (1) $n\geqq 2$ のとき
  $$a_n=2+\sum_{k=1}^{n-1}(2k-1)=2+2\cdot\frac{(n-1)n}{2}-(n-1)=n^2-2n+3$$
  $n=1$ のとき $1-2+3=2=a_1$ なので、この式は $n=1$ でも成り立つ。よって $a_n=n^2-2n+3$。（上端を $n$ にすると $a_n=n^2+2$ となり、$a_2=6$ で誤り。）

  (2) $b_1=S_1=1+2+3=6$。$n\geqq 2$ のとき
  $$b_n=S_n-S_{n-1}=(n^2+2n+3)-\{(n-1)^2+2(n-1)+3\}=2n+1$$
  $n=1$ を代入すると $3$ で $b_1=6$ と一致しないので、一般項は「$b_1=6$、$n\geqq 2$ で $b_n=2n+1$」とまとめる。
concepts: [sq-difference-sum, sq-sigma]
misconceptions: [mc-sq-difference-n1, mc-sq-sum-to-term-n1]
targetSeconds: 300
irt: { expectedCorrectRate: 0.65, discrimination: 1.1 }
author:
  intent: |
    「$n\geqq 2$ で式を作り、$n=1$ を別に確かめる」という共通の手順を、階差数列と和からの一般項の両方で確認する。(1) は $n=1$ でも式が成り立つ例、(2) は成り立たない例として対にしてあり、(2) で $b_1$ を $3$ と答える受験者は $n=1$ の別扱いが身についていないと判断できる。(1) で上端を $n$ にする誤りはアが $0$ になるので識別できる。
  assessedAbilities: [知識・技能]
  curriculumRefs: ["数学B (1) ア(イ) いろいろな数列（階差数列）"]
  variations:
    - (2) で $S_n=2^n-1$ とし、$n=1$ でも一致する場合と比べさせる。
    - 階差数列が等比数列 $3^{n-1}$ の場合を扱う。
