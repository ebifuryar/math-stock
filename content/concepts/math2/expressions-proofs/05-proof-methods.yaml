id: ep-proof-methods
kind: method
title: 等式・不等式の証明
body: |
  **等式 $A=B$ の証明**
  - $A$ を変形して $B$ にする、または $A-B=0$ を示す。
  - **条件付き**: 条件式で文字を消去する（$a+b+c=0$ なら $c=-a-b$、または $b+c=-a$ などと置き換える）。
  - **比例式** $\dfrac{a}{b}=\dfrac{c}{d}$ は $=k$ とおき $a=bk,\ c=dk$ として代入する。比例式の分子・分母を足し合わせる（加比の理）ときや、式で割るときは、その式が $0$ になる場合を別に調べる。

  **不等式 $A\geqq B$ の証明**
  - **差をとる**: $A-B\geqq 0$ を示す。$A-B$ を因数分解するか平方完成する。
  - **平方の和**: 実数の2乗は $0$ 以上なので、$A-B=(\ \ )^2+(\ \ )^2$ の形にできれば $A-B\geqq 0$。等号は各平方が $0$ のとき。
  - **両辺が正（0以上）のとき**は $A\geqq B\iff A^2\geqq B^2$ なので、根号や絶対値を含む不等式は2乗の差を調べる。
  - 結論の不等式から出発して変形し「正しい式になったから成り立つ」と終えるのは、逆向きの推論で不十分。差 $A-B$ を計算する形で書く。

  不等式の証明では、**等号が成り立つ条件**も確認して書くのが原則。
prerequisites: [ep-cubic-formulas, ne-symmetric-expression]
