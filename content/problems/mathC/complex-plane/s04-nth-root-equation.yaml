author:
  intent: |
    $z^n=\alpha$ を極形式で解く標準手順（右辺の極形式化・絶対値と偏角の比較・$2k\pi$ の付加・範囲内の $k$ の列挙）を、誘導に沿って最後まで実行できるかをみる。$\boxed{\text{キ}}$ と $\boxed{\text{ク}}$ で「$2k\pi$ を $4$ で割る」ことと「解が $4$ 個ある」ことを独立に確認し、偏角の比較で $2k\pi$ を落とす誤り（解が1個になる）を検出する。最後に1つの解を具体的に書かせて、極形式から $a+bi$ への変換も確認する。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学C (2) ア(ウ) ド・モアブルの定理（方程式 zⁿ=α）]
  variations:
    - $z^3=-8i$ を解かせ、解が正三角形の頂点をなすことを確認させる（$2i,\ \pm\sqrt{3}-i$）。
    - $z^6=-64$ の解のうち実部が正のものの積を求めさせる。
