id: m2-cg-s04
level: school
format: mark
title: 3点を通る円と接線
stem: |
  3点 $\mathrm{A}(5,\ 5),\ \mathrm{B}(-2,\ 4),\ \mathrm{C}(-1,\ -3)$ を通る円を $K$ とする。

  (1) 円 $K$ の方程式は
  $$x^2+y^2-\boxed{\text{ア}}x-\boxed{\text{イ}}y-\boxed{\text{ウエ}}=0$$
  である。

  (2) 円 $K$ の中心の座標は $(\boxed{\text{オ}},\ \boxed{\text{カ}})$、半径は $\boxed{\text{キ}}$ である。

  (3) 円 $K$ 上の点 $\mathrm{A}$ における接線の方程式は $\boxed{\text{ク}}x+\boxed{\text{ケ}}y=\boxed{\text{コサ}}$ である。
blanks:
  - { label: ア, answer: "4" }
  - { label: イ, answer: "2" }
  - { label: ウエ, answer: "20" }
  - { label: オ, answer: "2" }
  - { label: カ, answer: "1" }
  - { label: キ, answer: "5" }
  - { label: ク, answer: "3" }
  - { label: ケ, answer: "4" }
  - { label: コサ, answer: "35" }
solution: |
  (1) 円を $x^2+y^2+lx+my+n=0$ とおき、3点を代入する。
  $$\begin{cases}50+5l+5m+n=0\\ 20-2l+4m+n=0\\ 10-l-3m+n=0\end{cases}$$
  第1式 $-$ 第2式: $30+7l+m=0$。第2式 $-$ 第3式: $10-l+7m=0$。これを解いて $l=-4,\ m=-2$、第3式から $n=-20$。
  $$x^2+y^2-4x-2y-20=0$$

  (2) $(x-2)^2+(y-1)^2=25$ より、中心 $(2,\ 1)$、半径 $5$。

  (3) 中心が $(2,\ 1)$ の円周上の点 $(5,\ 5)$ における接線は
  $$(5-2)(x-2)+(5-1)(y-1)=25\quad\Longrightarrow\quad 3x+4y=35$$
  （検算: 中心 $(2,\ 1)$ との距離は $\dfrac{|6+4-35|}{5}=5$ で半径に等しい。）
