id: mc-cv-e03
level: exam
format: mark
title: 楕円上の点と x 軸上の点の距離の最小値
stem: |
  $t$ を正の定数とする。楕円 $\dfrac{x^2}{4}+y^2=1$ 上の点 $\mathrm{P}$ と点 $\mathrm{A}(t,\ 0)$ の距離 $\mathrm{PA}$ の最小値を考える。

  (1) $\mathrm{P}(2\cos\theta,\ \sin\theta)$ とおくと
  $$\mathrm{PA}^2=\boxed{\text{ア}}\cos^2\theta-\boxed{\text{イ}}\,t\cos\theta+t^2+\boxed{\text{ウ}}$$
  である。

  (2) $0<t\leqq\dfrac{\boxed{\text{エ}}}{\boxed{\text{オ}}}$ のとき、$\mathrm{PA}$ の最小値は $\sqrt{\boxed{\text{カ}}-\dfrac{t^2}{\boxed{\text{キ}}}}$ である。

  (3) $t>\dfrac{\boxed{\text{エ}}}{\boxed{\text{オ}}}$ のとき、$\mathrm{PA}$ の最小値は $|t-\boxed{\text{ク}}|$ である。

  (4) $t=1$ のとき、$\mathrm{PA}$ を最小にする点 $\mathrm{P}$ の $x$ 座標は $\dfrac{\boxed{\text{ケ}}}{\boxed{\text{コ}}}$ である。
blanks:
  - { label: ア, answer: "3" }
  - { label: イ, answer: "4" }
  - { label: ウ, answer: "1" }
  - { label: エ, answer: "3" }
  - { label: オ, answer: "2" }
  - { label: カ, answer: "1" }
