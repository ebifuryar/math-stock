author:
  intent: |
    円 $|z-\alpha|=r$ 上の点について、絶対値と偏角の範囲を図形（中心までの距離・接線）から求め、それをド・モアブルの定理による $z^n$ の偏角の条件に結び付けられるかをみる。(3) では $\sin 3\theta=0$ の一般解のうち範囲 $\pi\leqq 3\theta\leqq 2\pi$ に入るものだけを選ぶ必要があり、範囲の端点が接点にちょうど対応する設定にしたので、「偏角の範囲を求めずに解く」と個数を誤る。$z^3$ の値では絶対値 $(\sqrt{3})^3=3\sqrt{3}$ の処理を確認する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(イ) 複素数の極形式, 数学C (2) ア(ウ) ド・モアブルの定理, 数学C (2) ア(エ) 複素数平面における図形]
  variations:
    - 同じ円上で $z^4$ が実数となる $z$ の個数を問う（$4\theta=2\pi$ のみで、$\theta=\dfrac{\pi}{2}$ の点 $i,\ 3i$ の2個）。
    - $\arg\dfrac{z-1}{z+1}$ の範囲を問い、円周角との関係を考えさせる。
