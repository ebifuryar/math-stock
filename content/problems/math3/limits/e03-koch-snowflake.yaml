id: m3-lm-e03
level: exam
format: mark
title: 無限に続く図形の操作と周の長さ・面積の極限
stem: |
  1辺の長さが $1$ の正三角形を図形 $P_0$ とする。図形 $P_n$（$n=0,\ 1,\ 2,\ \cdots$）から図形 $P_{n+1}$ を次の操作で作る。

  **操作**: $P_n$ の周をなす各辺を3等分し、3等分した中央の線分を1辺とする正三角形を $P_n$ の外側に付け加え、その中央の線分を取り除く。

  この操作では、付け加えた正三角形どうし、および付け加えた正三角形ともとの図形は、辺や頂点以外で重ならないことが知られている。たとえば $P_1$ は、正三角形の各辺の中央に小さな正三角形が付いた、辺の数が $12$ の星形の図形である。

  (1) $P_n$ の辺の数は $\boxed{\text{ア}}\cdot\boxed{\text{イ}}^{\,n}$、1辺の長さは $\left(\dfrac{1}{\boxed{\text{ウ}}}\right)^n$ である。したがって $P_n$ の周の長さ $L_n$ は
  $$L_n=\boxed{\text{エ}}\left(\frac{\boxed{\text{オ}}}{\boxed{\text{カ}}}\right)^n$$
  であり、$n\to\infty$ のとき $L_n$ は正の無限大に発散する。

  (2) $P_n$ の面積を $S_n$ とすると
  $$S_{n+1}-S_n=\frac{\sqrt{\boxed{\text{キ}}}}{\boxed{\text{クケ}}}\left(\frac{\boxed{\text{コ}}}{\boxed{\text{サ}}}\right)^n$$
  である。

  (3) 
  $$\lim_{n\to\infty}S_n=\frac{\boxed{\text{シ}}\sqrt{\boxed{\text{ス}}}}{\boxed{\text{セ}}}$$
  である。
