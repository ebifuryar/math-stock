solution: |
  (1) 平方完成して $(x-1)^2+(y-2)^2+(z+1)^2=9$。中心 $\mathrm{C}(1,\ 2,\ -1)$、半径 $3$。$z=0$ とおくと $(x-1)^2+(y-2)^2=9-1=8$ で、半径 $2\sqrt{2}$ の円。

  (2) $\overrightarrow{\mathrm{AB}}=(2,\ 2,\ -1)$、$\overrightarrow{\mathrm{CA}}=(-3,\ -4,\ 4)$ より $\overrightarrow{\mathrm{CP}}=\overrightarrow{\mathrm{CA}}+t\overrightarrow{\mathrm{AB}}$。
  $$|\overrightarrow{\mathrm{CP}}|^2=|\overrightarrow{\mathrm{CA}}|^2+2t\,\overrightarrow{\mathrm{CA}}\cdot\overrightarrow{\mathrm{AB}}+t^2|\overrightarrow{\mathrm{AB}}|^2=41-36t+9t^2=9(t-2)^2+5$$
  $t=2$（$\mathrm{P}(2,\ 2,\ 1)$）のとき最小値 $\sqrt{5}$。このとき $\overrightarrow{\mathrm{CP}}=(1,\ 0,\ 2)$ は $\overrightarrow{\mathrm{AB}}$ と垂直で、$\sqrt{5}$ は $\mathrm{C}$ と $\ell$ の距離 $d$ である。

  (3) $d=\sqrt{5}<3$ なので $\ell$ と $S$ は2点で交わり、線分の長さは $2\sqrt{3^2-5}=4$。（$9(t-2)^2+5=9$ より $t=\dfrac{4}{3},\ \dfrac{8}{3}$。交点は $\left(\dfrac{2}{3},\ \dfrac{2}{3},\ \dfrac{5}{3}\right)$ と $\left(\dfrac{10}{3},\ \dfrac{10}{3},\ \dfrac{1}{3}\right)$ で、距離は $|\overrightarrow{\mathrm{AB}}|\cdot\dfrac{4}{3}=4$。）

  (4) $\mathrm{C}$ から $\ell$ に下ろした垂線の足を $\mathrm{F}(2,\ 2,\ 1)$ とする（$\mathrm{CF}=\sqrt{5}$）。$S$ 上の任意の点 $\mathrm{Q}$ について
  $$(\mathrm{Q}\ \text{と}\ \ell\ \text{の距離})\leqq\mathrm{QF}\leqq\mathrm{QC}+\mathrm{CF}=3+\sqrt{5}$$
  等号は $\mathrm{Q}$ が直線 $\mathrm{FC}$ 上で $\mathrm{C}$ に関して $\mathrm{F}$ と反対側にある点、すなわち $\overrightarrow{\mathrm{OQ}}=\overrightarrow{\mathrm{OC}}+\dfrac{3}{\sqrt{5}}\overrightarrow{\mathrm{FC}}$ のときに成り立つ（このとき $\overrightarrow{\mathrm{FQ}}\parallel\overrightarrow{\mathrm{FC}}\perp\ell$ なので、$\mathrm{Q}$ と $\ell$ の距離は $\mathrm{QF}$ に等しい）。よって最大値は $3+\sqrt{5}$。
