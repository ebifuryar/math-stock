id: pr-independent-repeated
kind: theorem
title: 独立な試行と反復試行の確率
body: |
  2つの試行の結果が互いに影響を及ぼさないとき、これらの試行は **独立** であるという。独立な試行 $S,\ T$ で、$S$ で事象 $A$、$T$ で事象 $B$ が起こる確率は
  $$P(A)\times P(B)$$
  「排反」は同じ試行の中で2つの事象が同時に起こらないこと（確率を **足す** 条件）、「独立」は異なる試行が影響し合わないこと（確率を **掛ける** 条件）であり、別の概念である。

  **反復試行**: 1回の試行で事象 $A$ が起こる確率を $p$ とする。この試行を $n$ 回繰り返すとき、$A$ がちょうど $r$ 回起こる確率は
  $${}_n\mathrm{C}_r\,p^r(1-p)^{n-r}$$
  ${}_n\mathrm{C}_r$ は「$n$ 回のうちどの $r$ 回で $A$ が起こるか」の選び方で、それぞれの起こり方は排反なので足し合わせた結果である。

  「先に3勝した方が優勝」のように **最後の回が決まっている** 場合は、最後の回を除いた回だけで ${}_n\mathrm{C}_r$ を考える（例: 3勝1敗で優勝 $\to$ ${}_3\mathrm{C}_2\,p^2(1-p)\times p$）。
prerequisites: [pr-probability-basics]
