id: m2-cl-e02
level: exam
format: mark
title: 曲線外の点から引ける接線の本数
stem: |
  曲線 $C:\ y=x^3-x$ と、点 $\mathrm{P}(2,\ b)$ を考える。ただし $b$ は実数の定数とする。

  (1) $C$ 上の点 $(t,\ t^3-t)$ における接線が $\mathrm{P}$ を通るための条件は
  $$2t^3-\boxed{\text{ア}}\,t^2+b+\boxed{\text{イ}}=0$$
  である。

  (2) $\mathrm{P}$ から $C$ にちょうど3本の接線が引けるような $b$ の値の範囲は
  $$\boxed{\text{ウエ}}<b<\boxed{\text{オ}}$$
  である。

  (3) $b=0$ のとき、$\mathrm{P}$ から $C$ に引いた3本の接線の傾きの和は $\boxed{\text{カキ}}$ である。
blanks:
  - { label: ア, answer: "6" }
  - { label: イ, answer: "2" }
  - { label: ウエ, answer: "-2" }
  - { label: オ, answer: "6" }
  - { label: カキ, answer: "24" }
solution: |
  (1) $y'=3x^2-1$ より、点 $(t,\ t^3-t)$ における接線は
  $$y=(3t^2-1)(x-t)+t^3-t=(3t^2-1)x-2t^3$$
  これが $(2,\ b)$ を通るので $b=2(3t^2-1)-2t^3$、整理して $2t^3-6t^2+b+2=0$。

  (2) 3次関数のグラフでは接点が異なれば接線も異なるので、接線の本数は $t$ の方程式の異なる実数解の個数に等しい。定数を分離して $-b=2t^3-6t^2+2$ とし、$h(t)=2t^3-6t^2+2$ とおく。$h'(t)=6t(t-2)$ より $h$ は $t=0$ で極大値 $2$、$t=2$ で極小値 $-6$ をとる。直線 $y=-b$ が $y=h(t)$ と異なる3点で交わる条件は $-6<-b<2$、すなわち $-2<b<6$。

  （$b=6$ のとき $\mathrm{P}(2,\ 6)$ は $C$ 上にあり、$b=-2$ のとき $\mathrm{P}$ は原点における接線 $y=-x$ 上にある。どちらも接線は2本。）

  (3) $b=0$ のとき、$2t^3-6t^2+2=0$ の3つの解を $t_1,\ t_2,\ t_3$ とすると、解と係数の関係より
  $$t_1+t_2+t_3=3,\qquad t_1t_2+t_2t_3+t_3t_1=0$$
  よって $t_1^2+t_2^2+t_3^2=3^2-2\cdot 0=9$。傾きの和は
  $$\sum(3t_i^2-1)=3\cdot 9-3=24$$
concepts: [cl-tangent, cl-equation-inequality]
misconceptions: [mc-cl-tangent-external-point]
targetSeconds: 600
irt: { expectedCorrectRate: 0.3, discrimination: 1.4 }
author:
  intent: |
    曲線外の点から引く接線を「接点を $t$ とおく」方法で処理し、接線の本数を $t$ の3次方程式の実数解の個数に帰着できるかをみる。点の座標 $x=2$ を $f'$ に代入して傾き $f'(2)=11$ の直線を作る受験者は (1) で詰まる。(2) は定数分離（数学IIの頻出手法）の再利用、(3) は解を具体的に求めずに解と係数の関係で処理できるかをみる、難関大の誘導でよく見る構成。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学II (5) ア(ア) 微分係数と導関数（接線の方程式）", "数学II (5) イ(ア) 導関数を用いた関数の考察（方程式の実数解の個数）"]
  variations:
    - 点 $\mathrm{P}(p,\ q)$ を一般にして、3本の接線が引ける点 $\mathrm{P}$ の存在範囲を図示させる（領域、数学II「図形と方程式」との融合）。
    - 3本の接線のうち2本が直交する条件を問う。
