author:
  intent: |
    1の5乗根の性質（$\alpha^5=1$、$\alpha\neq 1$ から和が $0$）と、相反方程式を $t=\alpha+\dfrac{1}{\alpha}$ で次数を下げる手法、$\dfrac{1}{\alpha}=\overline{\alpha}$ による $t=2\cos\dfrac{2\pi}{5}$ の読み替えを、共通テスト型の誘導でつなげられるかをみる。(3) では2次方程式の2解から符号で一方を選ぶ判断を要求し、負の解を選ぶと $\boxed{\text{クケ}}$ 以降が埋まらないようにしている。$\alpha\neq 1$ を使う場面を明示させ、$z^5=1$ の解のうち $1$ 以外を扱っていることを意識させる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(ウ) ド・モアブルの定理（1のn乗根）]
  variations:
    - 同じ $\alpha$ について $(1-\alpha)(1-\alpha^2)(1-\alpha^3)(1-\alpha^4)$ の値（$5$）を求めさせる。
    - $\beta=\cos\dfrac{2\pi}{7}+i\sin\dfrac{2\pi}{7}$ について $\beta+\beta^2+\beta^4$ の値を求めさせる（$\dfrac{-1+\sqrt{7}i}{2}$）。
