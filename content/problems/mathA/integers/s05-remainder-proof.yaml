id: ma-it-s05
level: school
format: written
title: 余りによる分類を用いた倍数の証明
stem: |
  $n$ を整数とする。$n(n+1)(2n+1)$ は $6$ の倍数であることを証明せよ。
modelAnswer: |
  $N=n(n+1)(2n+1)$ とおく。

  **$2$ の倍数であること**　$n,\ n+1$ は連続する2つの整数なので、どちらか一方は偶数である。よって $N$ は $2$ の倍数である。

  **$3$ の倍数であること**　$k$ を整数とすると、$n$ は $3k,\ 3k+1,\ 3k+2$ のいずれかの形に表される。

  (i) $n=3k$ のとき、$n=3k$ は $3$ の倍数。

  (ii) $n=3k+1$ のとき、$2n+1=6k+3=3(2k+1)$ は $3$ の倍数。

  (iii) $n=3k+2$ のとき、$n+1=3k+3=3(k+1)$ は $3$ の倍数。

  いずれの場合も3つの因数のどれかが $3$ の倍数なので、$N$ は $3$ の倍数である。

  以上より $N$ は $2$ の倍数かつ $3$ の倍数であり、$2$ と $3$ は互いに素であるから、$N$ は $2\cdot 3=6$ の倍数である。$\blacksquare$

  （別解: $2n+1=(n+2)+(n-1)$ より $N=(n-1)n(n+1)+n(n+1)(n+2)$ と連続3整数の積の和で表せることを使ってもよい。）
rubric:
  - id: r1
    criterion: $n,\ n+1$ が連続する整数であることから $N$ が $2$ の倍数であることを示している
    points: 2
    keywords: ["連続", "偶数"]
  - id: r2
    criterion: $n$ を $3k,\ 3k+1,\ 3k+2$ の3通りに漏れなく分類している
    points: 3
    keywords: ["3k+1", "3k+2"]
  - id: r3
    criterion: 各場合で $3$ の倍数となる因数（$n$、$2n+1=3(2k+1)$、$n+1=3(k+1)$）を正しく示している
    points: 3
    keywords: ["3(2k+1)", "3(k+1)"]
  - id: r4
    criterion: $2$ と $3$ が互いに素であることを根拠に $6$ の倍数と結論している
    points: 2
    keywords: ["互いに素", "6の倍数"]
solution: |
  $6=2\cdot 3$ で $2$ と $3$ は互いに素なので、$2$ の倍数と $3$ の倍数であることを別々に示せばよい。$2$ の倍数は連続2整数の積から、$3$ の倍数は $n$ を $3$ で割った余りで3通りに分けて示す。
