id: m1-da-s01
level: school
format: choice
title: 四分位範囲（データが奇数個）
stem: |
  次のデータは、生徒11人が1か月に図書室で借りた本の冊数である。

  $$12,\ 5,\ 18,\ 7,\ 3,\ 10,\ 15,\ 2,\ 13,\ 8,\ 6$$

  このデータの四分位範囲として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: "$16$"
    rationale: |
      最大値 $18$ と最小値 $2$ の差である **範囲** を求めている。四分位範囲は $Q_3-Q_1$。
  - id: "2"
    text: "$5$"
    rationale: |
      第3四分位数 $13$ と中央値 $8$ の差を求めている。四分位範囲は中央値ではなく第1四分位数との差 $Q_3-Q_1$。
  - id: "3"
    text: "$8$"
    rationale: |
      正解。小さい順に並べると $2,3,5,6,7,8,10,12,13,15,18$。中央値は6番目の $8$。下位 $2,3,5,6,7$ の中央値 $Q_1=5$、上位 $10,12,13,15,18$ の中央値 $Q_3=13$ より $13-5=8$。
  - id: "4"
    text: "$7$"
    misconception: mc-da-quartile-split
    rationale: |
      中央値 $8$ を下位・上位の両方に含めて $2,3,5,6,7,8$ と $8,10,12,13,15,18$ に分け、$Q_1=5.5,\ Q_3=12.5$ としている。$n$ が奇数のときは中央値を除いて分ける。
answer: "3"
solution: |
  まず小さい順に並べる：$2,\ 3,\ 5,\ 6,\ 7,\ 8,\ 10,\ 12,\ 13,\ 15,\ 18$

  データは11個（奇数）なので中央値は6番目の $8$。中央値を除いた下位5個 $2,3,5,6,7$ の中央値が $Q_1=5$、上位5個 $10,12,13,15,18$ の中央値が $Q_3=13$。

  四分位範囲は $Q_3-Q_1=13-5=8$。
concepts: [da-quartiles-boxplot]
misconceptions: [mc-da-quartile-split]
targetSeconds: 120
irt: { expectedCorrectRate: 0.72, discrimination: 1.0 }
author:
  intent: |
    データを並べ替えてから四分位数を正しく求められるかをみる。$n$ を奇数にし、中央値の扱いを誤ると $7$ になるよう設計した。範囲・「$Q_3-$中央値」との混同もそれぞれ別の選択肢に割り当て、四分位範囲の定義のどこが曖昧かを特定できるようにしている。データは並べ替える前の順で提示し、整列の手順を省いた受験者もふるい分ける。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学I (4) イ(イ) 四分位範囲・箱ひげ図によるデータの傾向の把握]
  variations:
    - データを12個（偶数）にして、下位・上位がそれぞれ6個ずつになる場合を問う。
    - 四分位範囲を求めたうえで、外れ値の有無を判定させる。
