id: mb-sq-a05
level: applied
format: written
title: 2^n>n^2 を満たす自然数と数学的帰納法
stem: |
  不等式
  $$2^n>n^2$$
  を満たす自然数 $n$ をすべて求めよ。
modelAnswer: |
  小さい $n$ について調べると

  | $n$ | $1$ | $2$ | $3$ | $4$ | $5$ |
  | --- | --- | --- | --- | --- | --- |
  | $2^n$ | $2$ | $4$ | $8$ | $16$ | $32$ |
  | $n^2$ | $1$ | $4$ | $9$ | $16$ | $25$ |

  よって $n=1$ は不等式を満たし、$n=2,\ 3,\ 4$ は満たさない（$n=2,\ 4$ は等号、$n=3$ は $8<9$）。

  次に、$n\geqq 5$ のすべての自然数 $n$ について $2^n>n^2\ \cdots\ (*)$ が成り立つことを数学的帰納法で示す。

  (I) $n=5$ のとき、$2^5=32>25=5^2$ なので $(*)$ は成り立つ。

  (II) $k\geqq 5$ として、$n=k$ のとき $(*)$ が成り立つ、すなわち $2^k>k^2$ と仮定する。このとき
  $$2^{k+1}=2\cdot 2^k>2k^2$$
  ここで
  $$2k^2-(k+1)^2=k^2-2k-1=(k-1)^2-2\geqq 4^2-2=14>0\quad(k\geqq 5\ \text{より})$$
  なので $2k^2>(k+1)^2$。よって $2^{k+1}>(k+1)^2$ となり、$n=k+1$ のときも $(*)$ は成り立つ。

  (I), (II) より、$n\geqq 5$ のすべての自然数 $n$ について $(*)$ が成り立つ。

  以上から、求める自然数は **$n=1$ および $n\geqq 5$ のすべての自然数**。
rubric:
  - id: r1
    criterion: $n=1,\ 2,\ 3,\ 4$ を調べ、$n=1$ は満たし $n=2,\ 3,\ 4$ は満たさないことを正しく判定している
    points: 2
    keywords: ["n=1", "n=2", "n=3", "n=4"]
  - id: r2
    criterion: 帰納法の出発点を $n=5$ とし、$2^5=32>25$ を確認している
    points: 2
    keywords: ["n=5", "32>25"]
  - id: r3
    criterion: 仮定 $2^k>k^2$ を用いて $2^{k+1}=2\cdot 2^k>2k^2$ と評価している
    points: 2
    keywords: ["2^{k+1}", "2k^2"]
  - id: r4
    criterion: $k\geqq 5$ を根拠に $2k^2-(k+1)^2=(k-1)^2-2>0$（または同等の評価）を示している
    points: 2
    keywords: ["(k-1)^2-2", "k^2-2k-1"]
  - id: r5
    criterion: 帰納法の結論と小さい $n$ の結果を合わせ、「$n=1$ と $n\geqq 5$」と答えている
    points: 2
    keywords: ["n=1", "n≧5", "5以上", "n>=5"]
solution: |
  $n=1,\ 2,\ 3,\ 4$ を直接調べると、満たすのは $n=1$ だけ（$n=2,\ 4$ は等号、$n=3$ は逆向き）。$n\geqq 5$ は $n=5$ を出発点とする帰納法で示す。仮定から $2^{k+1}>2k^2$ が得られるので、あとは $2k^2>(k+1)^2$、すなわち $(k-1)^2>2$ を示せばよく、これは $k\geqq 3$ で成り立つ。$k\geqq 5$ の条件のもとでこれを使う。
concepts: [sq-induction]
misconceptions: [mc-sq-induction-base-step]
targetSeconds: 600
irt: { expectedCorrectRate: 0.45, discrimination: 1.3 }
author:
  intent: |
    出発点が $n=1$ でない帰納法を、自分で出発点を見つけるところから組み立てられるかをみる。「$n\geqq 5$ で成り立つことを証明せよ」と与えず、「すべて求めよ」とすることで、$n=1$ が解に含まれることと $n=2,\ 3,\ 4$ が除かれることの両方に気づく必要がある。帰納法の (II) では、仮定から得た $2k^2$ と目標の $(k+1)^2$ の間をつなぐ評価に $k\geqq 5$ を正しく使えているかで上位層を識別する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: ["数学B (1) ア(ウ) 漸化式と数学的帰納法（数学的帰納法）"]
  variations:
    - $3^n>n^3$ を満たす自然数をすべて求めさせる（$n=1,\ 2$ と $n\geqq 4$。$n=3$ は等号）。
    - $h>0$ のとき $(1+h)^n\geqq 1+nh+\dfrac{n(n-1)}{2}h^2$ を数学的帰納法で示させる。
