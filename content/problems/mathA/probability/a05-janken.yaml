id: ma-pr-a05
level: applied
format: written
title: 4人でじゃんけんをするときの確率と勝者数の期待値
stem: |
  $4$ 人が $1$ 回だけじゃんけんをする。各人はグー・チョキ・パーをそれぞれ $\dfrac{1}{3}$ の確率で出すものとする。

  (1) ちょうど $1$ 人だけが勝つ確率を求めよ。

  (2) あいこ（勝者が決まらない）になる確率を求めよ。

  (3) 勝つ人の人数を $X$ とする（あいこのときは $X=0$ とする）。$X$ の期待値を求めよ。
modelAnswer: |
  $4$ 人の手の出し方は $3^4=81$ 通りで、これらは同様に確からしい。

  勝者が決まるのは、出された手がちょうど $2$ 種類のときである。勝者が $k$ 人（$k=1,2,3$）となるのは、勝つ $k$ 人の選び方 ${}_4\mathrm{C}_k$ 通り、勝つ手の選び方 $3$ 通り（グー・チョキ・パーのどれで勝つか。負ける手はそれに応じて1通りに決まる）より ${}_4\mathrm{C}_k\times 3$ 通り。

  (1) $k=1$: ${}_4\mathrm{C}_1\times 3=12$ 通りなので、確率は $\dfrac{12}{81}=\dfrac{4}{27}$。

  (2) $k=2$: ${}_4\mathrm{C}_2\times 3=18$ 通り、$k=3$: ${}_4\mathrm{C}_3\times 3=12$ 通り。勝者が決まるのは $12+18+12=42$ 通り。あいこはその余事象なので
  $$1-\frac{42}{81}=\frac{39}{81}=\frac{13}{27}$$

  (3) $X$ の確率分布は

  | $X$ | $0$ | $1$ | $2$ | $3$ |
  | --- | --- | --- | --- | --- |
  | 確率 | $\dfrac{39}{81}$ | $\dfrac{12}{81}$ | $\dfrac{18}{81}$ | $\dfrac{12}{81}$ |

  （確率の和は $\dfrac{81}{81}=1$。）よって
  $$E=0\cdot\frac{39}{81}+1\cdot\frac{12}{81}+2\cdot\frac{18}{81}+3\cdot\frac{12}{81}=\frac{84}{81}=\frac{28}{27}$$
rubric:
  - id: r1
    criterion: 全事象を $3^4=81$ 通りとし、同様に確からしいことを踏まえている
    points: 2
    keywords: ["81"]
  - id: r2
    criterion: 1人だけ勝つ場合を「勝つ人の選び方 $4$ 通り × 勝つ手 $3$ 通り」と数え、$\dfrac{4}{27}$ を得ている
    points: 2
    keywords: ["12", "4/27"]
  - id: r3
    criterion: 勝者が2人・3人の場合（$18$ 通り、$12$ 通り）を数え、余事象からあいこの確率 $\dfrac{13}{27}$ を得ている（直接数える場合は、全員同じ手 $3$ 通りと3種類すべて出る $36$ 通りの和 $39$ 通り）
    points: 3
    keywords: ["18", "余事象", "13/27"]
  - id: r4
    criterion: $X=0,1,2,3$ の確率分布を、確率の和が $1$ になる形で正しく示している
    points: 2
    keywords: ["X=0", "39/81"]
  - id: r5
    criterion: 期待値 $\dfrac{28}{27}$ を正しく求めている
    points: 1
    keywords: ["28/27"]
solution: |
  $81$ 通りの手の出し方のうち、勝者 $k$ 人は ${}_4\mathrm{C}_k\times 3$ 通り（$k=1,2,3$ で $12,\ 18,\ 12$ 通り）。あいこは余事象で $81-42=39$ 通り（$\dfrac{13}{27}$）。期待値は $\dfrac{12+36+36}{81}=\dfrac{28}{27}$。
concepts: [pr-probability-basics, pr-combination, pr-expected-value]
misconceptions: [mc-pr-equally-likely, mc-pr-complement, mc-pr-expectation-incomplete]
targetSeconds: 540
irt: { expectedCorrectRate: 0.45, discrimination: 1.2 }
author:
  intent: |
    じゃんけんの確率を、手の出し方 $81$ 通りを根元事象として数えられるか、あいこを余事象で処理できるか、そして $X=0$ を含めた確率分布を作って期待値を求められるかをみる。あいこを直接数える場合、「全員同じ手」の $3$ 通りだけ、または「3種類すべて出る」の場合の数を ${}_4\mathrm{C}_2\cdot 3!=36$ 通りと数えられずに誤る受験者が多い。勝者数を「1人・2人・3人が同様に確からしい」とみなす誤りも識別できる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学A (2) イ(ア) 確率とその基本的な法則", "数学A (2) イ(エ) 期待値"]
  variations:
    - $n$ 人に一般化し、あいこの確率 $1-\dfrac{2^n-2}{3^{n-1}}$ を導かせる（入試レベル）。
    - 「あいこならもう1回じゃんけんをする」として、2回以内に勝者が1人に決まる確率を問う。
