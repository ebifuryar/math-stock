author:
  intent: |
    曲線外の点から引く接線を、接点をおいて求める手順を会話の誘導で示し、接線の公式を曲線外の点に代入する誤り（太郎さんの発言）がなぜ誤りで、その直線が何を表すのかまで理解できるかをみる。(1) の空欄で手順の運用を、(2) で2接点を結ぶ直線との関係を、(3) で焦点との関係を確認し、共通テストの「会話文から誤りを見抜く」形式に慣れさせる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (2) ア(ア) 2次曲線と直線の位置関係]
  variations:
    - 点 $\mathrm{A}$ を $(0,\ 2)$ に変え、接線の傾きが求まらない場合（$y$ 軸に平行な接線）がないか確かめさせる。
    - 放物線 $y^2=4x$ と準線上の点 $(-1,\ 2)$ で同様に問い、2接線が直交し、接点を結ぶ直線が焦点を通ることを確かめさせる。
