  intent: |
    距離の比の条件を2乗して式にし、円の方程式として読み取れるか（アポロニウスの円）をみる。$\mathrm{AP}:\mathrm{PB}=2:1$ を $2\mathrm{AP}=\mathrm{PB}$ と逆に立てると中心 $(-2,\ 0)$ の円になり、(1) の空欄で識別できる。(2) は軌跡を図形として活用する一歩目。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
