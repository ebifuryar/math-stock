- id: mc-pr-equally-likely
  title: 同様に確からしくない根元事象で数える
  description: |
    起こりやすさの異なる結果を、1通りずつ同じ重みで数えて確率を出す。例: 2個のさいころの目の和を $2$〜$12$ の $11$ 通りとみる、箱を選ぶ確率が違うのに玉の個数だけで比をとる、同じ目を含む並びと含まない並びを同じ重みとみなす。
  cause: |
    $P(A)=\dfrac{n(A)}{n(U)}$ が「根元事象がどれも同様に確からしい」という前提のもとでだけ成り立つことを意識していない。「区別できないものも区別して数える」「段階ごとに確率が違えば樹形図に確率を書き込む」という原則を、結果の見た目（和・色・目の組）を根元事象に選ぶ直感が上書きしてしまう。作問では、見た目の数え方と正しい数え方で値がずれる設定にすると識別しやすい。
  remedyConcepts: [pr-probability-basics, pr-conditional]
- id: mc-pr-order-confusion
  title: 区別する／しないの基準の混同
  description: |
    順序を考えるべきところで組合せを使う、またはその逆。円順列で回転して一致するものを別に数える（あるいは割りすぎる）、異なるものを区別せずに数える、重複を許すかどうかを取り違える、など。
  cause: |
    数え始める前に「何と何を同じとみなすか（順序・回転・重複・ものの区別）」を言葉で決めていない。公式（${}_n\mathrm{P}_r$, ${}_n\mathrm{C}_r$, $(n-1)!$）を問題文のキーワードで選んでおり、小さい場合を書き出して確かめる習慣がない。
  remedyConcepts: [pr-permutation, pr-combination]
- id: mc-pr-group-overcount
  title: 組分けで人数の同じ組を区別してしまう
  description: |
    区別のない組に分けるとき、人数が同じ組の入れかえを割らずに重複して数える。逆に、人数の異なる組まで入れかえて割りすぎる。例: $8$ 人を $4$ 人・$2$ 人・$2$ 人に分けるのに $420$ 通り（$2$ 人組を区別）や $70$ 通り（$3!$ で割る）とする。
  cause: |
    「組に名前をつけて数え、名前を外す」という2段階の考え方をしておらず、「組分けは組の数の階乗で割る」と形で覚えている。何で割るかは「入れかえても同じ分け方になる組どうし」で決まる、という理由を理解していない。
  remedyConcepts: [pr-grouping]
- id: mc-pr-complement
  title: 余事象・否定の取り違え
  description: |
    「少なくとも1回 $A$」の余事象を「すべて $A$」とする、「$4$ でも $6$ でも割り切れない」（どちらでも割り切れない）を「両方では割り切れない」と読む、「最大値が $k$」を「すべて $k$ 以下」と同一視するなど、補集合・余事象を誤ってとる。
  cause: |
    「かつ／または」「すべて／少なくとも1つ」の否定をド・モルガンの法則で機械的に処理しておらず、日本語の語感で余事象を決めている。ベン図や数直線で、どの部分を除くのかを図示していない。
  remedyConcepts: [pr-set-count, pr-probability-basics]
- id: mc-pr-add-mult-condition
  title: 排反・独立の確認なしに足す・掛ける
  description: |
    排反でない事象（共通部分のある集合）の確率・個数を単純に足す（包除原理で共通部分を引かない）、同じ試行の中の事象の確率を独立とみて掛ける、「排反」と「独立」を同じ意味だと思う。
  cause: |
    加法定理は「排反」、積の法則・独立な試行の確率は「独立」のもとでだけ成り立つ、という **適用条件** を公式と一緒に覚えていない。「または→足す、かつ→掛ける」という言葉の対応だけで計算している。
  remedyConcepts: [pr-set-count, pr-probability-basics, pr-independent-repeated]
- id: mc-pr-repeated-coefficient
  title: 反復試行で組合せの係数を掛け忘れる・誤る
  description: |
    $n$ 回中 $r$ 回起こる確率を $p^r(1-p)^{n-r}$ としてしまう。あるいは「先に3勝したら終了」のように最後の回が決まっている場合に、最後の回まで含めて ${}_n\mathrm{C}_r$ を掛ける。
  cause: |
    $p^r(1-p)^{n-r}$ が「特定の1つの順番」で起こる確率にすぎず、${}_n\mathrm{C}_r$ がその順番の選び方の数（排反な場合の数）であることを理解していない。試合の終了条件のように順番に制約がある場合に、どの回の結果が自由に並べかえられるのかを確認していない。
  remedyConcepts: [pr-independent-repeated]
- id: mc-pr-conditional-denominator
  title: 条件付き確率の分母の取り違え
  description: |
    $P_A(B)$ を求めるのに全体を分母にして $P(A\cap B)$ を答える、$P_A(B)$ と $P_B(A)$ を取り違える（例: 「陽性のとき感染している確率」に「感染者が陽性になる確率」を答える）。
  cause: |
    「何が起こったとわかっているか」（条件）と「何の確率を聞かれているか」を区別して文章から読み取っていない。条件付き確率を「新しい全体（分母）を条件の事象に取りかえた確率」として捉えておらず、樹形図の枝の確率と結果の比を混同している。
  remedyConcepts: [pr-conditional]
- id: mc-pr-expectation-incomplete
  title: 期待値で値の取りこぼし・確率の和が1にならない
  description: |
    変量のとりうる値の一部を落としたり、確率の計算を誤ったりしたまま期待値を計算し、確率の和が $1$ にならないことに気づかない。値 $0$ の場合を表から落として確率の確認を怠る例も多い。
  cause: |
    期待値を「値×確率の和」という計算手順としてだけ覚えており、「確率分布（すべての値と確率の表）を完成させる」という前段を軽視している。確率の和が $1$ になることを検算に使う習慣がない。
  remedyConcepts: [pr-expected-value, pr-probability-basics]
