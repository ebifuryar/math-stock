id: it-divisor-prime
kind: definition
title: 約数・倍数と素数
body: |
  整数 $a,\ b$ について、ある整数 $k$ を用いて $a=bk$ と表せるとき、$b$ は $a$ の **約数**、$a$ は $b$ の **倍数** といい、$b\mid a$ と書く（$b\neq 0$）。

  $2$ 以上の自然数で、正の約数が $1$ とそれ自身の2つだけであるものを **素数**、$2$ 以上で素数でないものを **合成数** という。**$1$ は素数でも合成数でもない**（正の約数が1個しかない）。

  倍数の判定法:
  - $2$ の倍数 ⇔ 一の位が偶数、$5$ の倍数 ⇔ 一の位が $0$ か $5$
  - $4$ の倍数 ⇔ 下2桁が $4$ の倍数
  - $3$ の倍数 ⇔ 各位の数の和が $3$ の倍数（$9$ も同様）
