id: m2-el-e02
level: exam
format: choice
title: ちょうどその桁数になる累乗
stem: |
  $\log_{10}2=0.3010,\ \log_{10}3=0.4771,\ \log_{10}7=0.8451$ とする。$n$ を自然数とするとき、$42^n$ がちょうど $60$ 桁の整数となるような $n$ について正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: そのような $n$ は $36$ だけである。
    rationale: |
      $59\leqq 1.6232n<60$ から $36.3\cdots\leqq n<36.9\cdots$ を得たあと、端の数を切り捨てて $n=36$ としている。実際には $36\times 1.6232=58.4352$ なので、$42^{36}$ は $59$ 桁。
  - id: "2"
    text: そのような $n$ は $37$ だけである。
    misconception: mc-el-digit-count
    rationale: |
      $60$ 桁の条件を $60\leqq\log_{10}42^n<61$ としている。$60$ 桁とは $10^{59}\leqq 42^n<10^{60}$、すなわち $59\leqq\log_{10}42^n<60$。$37\times 1.6232=60.0584$ なので $42^{37}$ は $61$ 桁。
  - id: "3"
    text: そのような $n$ は $90$ と $91$ の2つである。
    misconception: mc-el-log-sum
    rationale: |
      $\log_{10}42=\log_{10}6\cdot\log_{10}7$ と、真数の積を対数の積にしている。正しくは $\log_{10}42=\log_{10}2+\log_{10}3+\log_{10}7$（積は和になる）。
  - id: "4"
    text: そのような $n$ は存在しない。
    rationale: |
      正解。$\log_{10}42^n$ は $n$ が $1$ 増えるごとに $1.6232$ ずつ増えるので、$59$ 以上 $60$ 未満の区間（幅 $1$）を飛び越えることがある。
answer: "4"
solution: |
  $\log_{10}42=\log_{10}(2\cdot 3\cdot 7)=0.3010+0.4771+0.8451=1.6232$。

  $42^n$ が $60$ 桁 $\iff 10^{59}\leqq 42^n<10^{60}\iff 59\leqq 1.6232n<60$ より
  $$36.34\cdots\leqq n<36.96\cdots$$
  この範囲に自然数はない。

  実際、$\log_{10}42^{36}=58.4352$ より $42^{36}$ は $59$ 桁、$\log_{10}42^{37}=60.0584$ より $42^{37}$ は $61$ 桁で、$60$ 桁は飛ばされる。
concepts: [el-common-log, el-log-definition]
misconceptions: [mc-el-digit-count, mc-el-log-sum]
targetSeconds: 240
irt: { expectedCorrectRate: 0.35, discrimination: 1.3 }
author:
  intent: |
    「$n$ 桁 $\iff n-1\leqq\log_{10}N<n$」を区間の条件として扱い、その区間に自然数が含まれない可能性まで検討できるかをみる。$\log_{10}42>1$ なので桁数が1つ飛ぶことがある、という構造的な理解を問う。誤答①は区間内の整数を確かめずに丸める誤り、②は桁数の条件の取り違え、③は対数の性質の誤用に対応する。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学II (3) ア(ウ) 対数の意味とその基本的な性質, 数学II (3) イ(ア) 指数と対数を相互に関連付けて考察すること]
  variations:
    - "「$42^n$ の桁数として現れない $100$ 以下の自然数はいくつあるか」と、飛ばされる桁数を数えさせる。"
    - 底を $7^n$（$\log_{10}7<1$）に変え、すべての桁数が現れることと比較させる。
