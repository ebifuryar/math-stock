id: ep-identity
kind: method
title: 恒等式（係数比較法と数値代入法）
body: |
  文字にどんな値を代入しても成り立つ等式を **恒等式** という。

  **係数比較法** 両辺が $x$ の整式のとき
  $$ax^2+bx+c=a'x^2+b'x+c'\ \text{が恒等式}\iff a=a',\ b=b',\ c=c'$$
  展開・整理して同じ次数の係数を等しいとおく。

  **数値代入法** 都合のよい値（因数が $0$ になる値など）を代入して係数を求める。ただし代入で得られるのは **必要条件** である。$n$ 次以下の整式どうしの等式では、異なる $n+1$ 個の値で成り立てば恒等式になる（十分性）。代入した値の個数が足りないときは、求めた係数で両辺が一致することを確かめる。

  **除法との関係** 余りの次数を決めて $P(x)=B(x)Q(x)+px+q$ のようにおくと、これは恒等式なので $B(x)=0$ となる $x$ を代入して $p,\ q$ の条件が得られる。

  **部分分数分解** $\dfrac{3x+5}{(x+1)(x+3)}=\dfrac{a}{x+1}+\dfrac{b}{x+3}$ のような分解も、分母を払った式 $3x+5=a(x+3)+b(x+1)$ を恒等式として扱う。
prerequisites: [ep-division-fraction]
