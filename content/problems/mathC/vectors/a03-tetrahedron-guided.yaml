author:
  intent: |
    共通テスト数学C（ベクトル）型の誘導付き空間図形問題。基本ベクトル $\vec a,\ \vec b,\ \vec c$ とその内積を準備し（(1)）、3項の展開による大きさの計算（(2)）、直線と平面の交点を「係数の和が1」で求める処理（(3)）、垂直の判定と体積（(4)）へと進む。(2) は6つの交差項の符号処理、(3) は平面 $\mathrm{MBC}$ を張る点 $\mathrm{M},\ \mathrm{B},\ \mathrm{C}$ で書き直す段階（$\vec a=2\overrightarrow{\mathrm{OM}}$ への置き換え）がそれぞれ識別点になる。(3) で $\vec a,\ \vec b,\ \vec c$ の係数の和を $1$ とおくと $k=1$（$\mathrm{K}=\mathrm{G}$）となり、平面 $\mathrm{ABC}$ との交点と取り違えたことがわかる。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学C (1) ア(ウ) 空間座標と空間におけるベクトル, 数学C (1) イ(イ) ベクトルを用いた空間図形の考察]
  variations:
    - 線分 $\mathrm{MN}$ 上の点 $\mathrm{P}$ で $\overrightarrow{\mathrm{MP}}\perp\vec a$ となるものを求めさせ、ねじれの位置にある2直線 $\mathrm{OA},\ \mathrm{BC}$ の距離へつなげる。
    - 平面 $\mathrm{MBC}$ による正四面体の切り口の面積を求めさせる。
