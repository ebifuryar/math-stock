id: ma-it-s02
level: school
format: choice
title: 整数の性質に関する正しい記述
stem: |
  $a,\ b,\ c,\ n$ は整数とする。常に正しい記述を、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $1$ は素数である。
    misconception: mc-it-one-is-prime
    rationale: |
      素数は「$2$ 以上で、正の約数が $1$ とそれ自身の **ちょうど2個** である数」。$1$ の正の約数は $1$ だけなので素数ではない。$1$ を素数に含めると素因数分解が1通りに定まらなくなる。
  - id: "2"
    text: $a$ が $bc$ を割り切るならば、$a$ は $b$ または $c$ を割り切る。
    misconception: mc-it-coprime-ignored
    rationale: |
      $a$ が **素数** のときにだけ成り立つ性質を一般化している。反例: $a=4,\ b=2,\ c=6$ のとき $4\mid 12$ だが $4\nmid 2,\ 4\nmid 6$。
  - id: "3"
    text: $n^2$ を $3$ で割った余りは $1$ である。
    misconception: mc-it-remainder-incomplete
    rationale: |
      $n=3k+1,\ 3k+2$ の場合だけを調べ、$n=3k$ の場合（余り $0$）を落としている。反例: $n=3$ のとき $n^2=9$ は $3$ で割り切れる。
  - id: "4"
    text: $n(n+1)(n+2)$ は $6$ の倍数である。
    rationale: |
      正解。連続する2整数のどちらかは偶数なので積は $2$ の倍数。連続する3整数のどれかは $3$ の倍数なので積は $3$ の倍数。$2$ と $3$ は互いに素なので $6$ の倍数。
answer: "4"
solution: |
  ①〜③にはそれぞれ反例がある（① $1$ の正の約数は1個、② $a=4,\ b=2,\ c=6$、③ $n=3$）。

  ④ $n$ を $3$ で割った余りで分類すると、$n=3k$ なら $n$、$n=3k+1$ なら $n+2=3(k+1)$、$n=3k+2$ なら $n+1=3(k+1)$ が $3$ の倍数。また $n,\ n+1$ の一方は偶数。$2$ と $3$ は互いに素なので、積は $6$ の倍数である。
concepts: [it-divisor-prime, it-gcd-lcm, it-remainder-classification]
misconceptions: [mc-it-one-is-prime, mc-it-coprime-ignored, mc-it-remainder-incomplete]
targetSeconds: 120
irt: { expectedCorrectRate: 0.75, discrimination: 0.9 }
author:
  intent: |
    単元の基礎となる3つの概念（素数の定義、互いに素と整除、余りによる分類の網羅性）を、反例を挙げられるかという観点で一度に確認する。各誤答がそれぞれ別の誤答パターンに対応しており、診断用の導入問題として使う。
  assessedAbilities: [知識・技能]
  curriculumRefs: [数学A (3) ア(ア) 整数の性質（約数と倍数・素数）, 数学A (3) ア(ア) 整数の性質（ユークリッドの互除法と余りによる分類）]
  variations:
    - 選択肢を「正しくないものを一つ選べ」に変え、反例を記述させる小問を付ける。
    - "③を「$n^2$ を $4$ で割った余りは $0$ か $1$」（正しい）に差し替え、2択の判断を迫る。"
