author:
  intent: |
    1次の近似式と平均値の定理は、どちらも「$f(b)-f(a)$ を導関数で表す」考え方である。(1) で近似式の基本を確認し、(2)〜(3) で平均値の定理を極限の計算に使えるかをみる。(3) では $c$ が $x$ とともに変わることを意識し、$c$ の範囲からはさみうちで $c\to 0$ を導く手順が要点となる。$e^{\frac{2}{x}}-e^{\frac{2}{x+1}}$ を2つの極限に分けて $0$ と答える誤り（$\infty\times 0$ の不定形の処理の失敗）を識別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (2) ア(ウ) 平均値の定理", "数学III (2) イ(イ) 導関数の応用（近似式）"]
  variations:
    - $\displaystyle\lim_{x\to 0}\frac{e^x-e^{\sin x}}{x-\sin x}$（答 $1$）を平均値の定理で求めさせる。
    - $f(t)=\log t$ に平均値の定理を用いて、$0<a<b$ のとき $\dfrac{b-a}{b}<\log\dfrac{b}{a}<\dfrac{b-a}{a}$ を示させる。
