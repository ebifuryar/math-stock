id: m1-qf-e05
level: exam
format: written
title: 条件付きの最大・最小
stem: |
  $x\geqq 0,\ y\geqq 0,\ x+y=1$ のとき、$x^2+2y^2$ の最大値と最小値を求めよ。また、そのときの $x,\ y$ の値も答えよ。
modelAnswer: |
  $x+y=1$ より $y=1-x$。$y\geqq 0$ より $x\leqq 1$ なので、$x$ の変域は $0\leqq x\leqq 1$。

  $$x^2+2y^2=x^2+2(1-x)^2=3x^2-4x+2=3\left(x-\frac{2}{3}\right)^2+\frac{2}{3}$$

  $0\leqq x\leqq 1$ において
  - 最小値: $x=\dfrac{2}{3}$ のとき $\dfrac{2}{3}$（このとき $y=\dfrac{1}{3}$）
  - 最大値: 端点を比べると $x=0$ で $2$、$x=1$ で $1$ なので、$x=0$ のとき $2$（このとき $y=1$）

  よって **最大値 $2$（$x=0,\ y=1$）、最小値 $\dfrac{2}{3}$（$x=\dfrac{2}{3},\ y=\dfrac{1}{3}$）**。
rubric:
  - id: r1
    criterion: $y=1-x$ を代入して $x$ だけの式にしている
    points: 2
    keywords: ["y=1-x"]
  - id: r2
    criterion: $y\geqq 0$ から $x$ の変域 $0\leqq x\leqq 1$ を求めている
    points: 3
    keywords: ["x≤1", "x<=1", "0≤x≤1"]
  - id: r3
    criterion: $3\left(x-\frac{2}{3}\right)^2+\frac{2}{3}$ と平方完成している
    points: 2
    keywords: ["3x^2-4x+2", "2/3"]
  - id: r4
    criterion: 最小値 $\frac{2}{3}$ とそのときの $x=\frac{2}{3},\ y=\frac{1}{3}$ を求めている
    points: 2
    keywords: ["1/3"]
  - id: r5
    criterion: 最大値 $2$ とそのときの $x=0,\ y=1$ を求めている
    points: 2
    keywords: ["最大値2", "x=0"]
solution: |
  1文字を消去したら、消した文字の条件（$y\geqq 0$）を残った文字の変域に必ず移す。変域を忘れると最大値が存在しないことになってしまう。
concepts: [qf-max-min, qf-vertex-form]
misconceptions: [mc-domain-forgotten]
targetSeconds: 360
irt: { expectedCorrectRate: 0.45, discrimination: 1.2 }
author:
  intent: |
    条件式による文字消去と、それに伴う変域の変化を処理できるかをみる。変域を考えないと最大値が求まらないように設計しており、変域の確認漏れを確実に検出できる。
  assessedAbilities: [思考力・判断力・表現力]
  curriculumRefs: [数学I (3) ア(ア) 2次関数の最大・最小]
  variations:
    - 条件を $x^2+y^2=1$ にして、数学IIの三角関数による置換と比較させる。
