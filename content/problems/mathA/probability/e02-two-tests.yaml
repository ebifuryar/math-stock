id: ma-pr-e02
level: exam
format: choice
title: 2回の検査結果からの原因の確率
stem: |
  ある感染症に感染している人の割合は全体の $2\%$ である。この感染症の検査では、感染している人は $90\%$ の確率で陽性と判定され、感染していない人も $10\%$ の確率で陽性と判定される。

  無作為に選んだ $1$ 人にこの検査を $2$ 回行う。その人が感染している場合も感染していない場合も、$2$ 回の検査は上の確率で結果が出る独立な試行であるとする。$2$ 回とも陽性と判定されたとき、この人が感染している確率として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $\dfrac{81}{100}$
    misconception: mc-pr-conditional-denominator
    rationale: |
      感染している人が2回とも陽性になる確率 $P_I(E)=0.9^2$ を答えている（$I$: 感染している、$E$: 2回とも陽性）。問われているのは条件と結果を入れかえた $P_E(I)$。
  - id: "2"
    text: $\dfrac{81}{82}$
    misconception: mc-pr-equally-likely
    rationale: |
      $\dfrac{0.9^2}{0.9^2+0.1^2}$ と、感染している人としていない人を同じ割合として扱っている。感染率 $2\%$ と $98\%$ の違い（事前の割合）を掛けていない。
  - id: "3"
    text: $\dfrac{81}{130}$
    rationale: |
      正解。$P(I\cap E)=0.02\times 0.81=0.0162$、$P(\overline{I}\cap E)=0.98\times 0.01=0.0098$。$P_E(I)=\dfrac{0.0162}{0.0162+0.0098}=\dfrac{162}{260}=\dfrac{81}{130}$。
  - id: "4"
    text: $\dfrac{81}{5000}$
    misconception: mc-pr-conditional-denominator
    rationale: |
      $P(I\cap E)=0.02\times 0.81=0.0162$ を答えている。「2回とも陽性であった」ことがわかっているので、分母を $P(E)=0.026$ にとり直す。
answer: "3"
solution: |
  感染している事象を $I$、2回とも陽性となる事象を $E$ とする。各検査は独立なので
  $$P_I(E)=0.9^2=0.81,\qquad P_{\overline{I}}(E)=0.1^2=0.01$$
  $$P(I\cap E)=0.02\times 0.81=0.0162,\qquad P(\overline{I}\cap E)=0.98\times 0.01=0.0098$$
  $$P_E(I)=\frac{0.0162}{0.0162+0.0098}=\frac{162}{260}=\frac{81}{130}\ (\fallingdotseq 0.62)$$
  参考：検査が1回だけなら $P=\dfrac{0.018}{0.018+0.098}=\dfrac{9}{58}\fallingdotseq 0.16$ にすぎない。
concepts: [pr-conditional, pr-independent-repeated]
misconceptions: [mc-pr-conditional-denominator, mc-pr-equally-likely]
targetSeconds: 300
irt: { expectedCorrectRate: 0.38, discrimination: 1.4 }
author:
  intent: |
    原因の確率で、事前の割合（感染率）・検査の精度・独立な検査の繰り返しの3つを正しく組み合わせられるかをみる。①・④は条件付き確率の分母の誤り、②は事前の割合を無視する誤り（基準率の無視）に対応する。正解が約 $62\%$ と「90%の検査で2回陽性」という直感よりかなり低いことが、条件付き確率の理解を識別する。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学A (2) イ(ウ) 条件付き確率", "数学A (2) イ(イ) 独立な試行と確率"]
  variations:
    - 1回目陽性・2回目陰性のときに感染している確率を問い、陰性の情報の効き方をみる。
    - 「検査を $k$ 回行いすべて陽性のとき、感染している確率が $90\%$ 以上になる」最小の $k$（$k=3$）を問う（入試の記述問題に発展）。
