id: m2-tf-a02
level: applied
format: choice
title: 2θ+π/3 の方程式の解
stem: |
  $0\leqq\theta<2\pi$ のとき、方程式
  $$\sin\left(2\theta+\frac{\pi}{3}\right)=\frac{1}{2}$$
  の解の個数を $N$、最小の解を $\theta_0$ とする。$N,\ \theta_0$ の組として正しいものを、次の①〜④のうちから一つ選べ。
choices:
  - id: "1"
    text: $N=2,\quad \theta_0=\dfrac{\pi}{4}$
    misconception: mc-tf-angle-range
    rationale: |
      $u=2\theta+\dfrac{\pi}{3}$ の範囲を $\dfrac{\pi}{3}\leqq u<2\pi+\dfrac{\pi}{3}$ と1周分しか考えていない。$\theta$ が $2\pi$ 動くと $u$ は $4\pi$ 動くので、単位円を2周する。
  - id: "2"
    text: $N=4,\quad \theta_0=-\dfrac{\pi}{12}$
    misconception: mc-tf-angle-range
    rationale: |
      $u$ の範囲を $0\leqq u<4\pi$ として $u=\dfrac{\pi}{6}$ を含めている。$u$ の範囲は $\dfrac{\pi}{3}$ から始まるので $u=\dfrac{\pi}{6}$ は範囲外で、実際 $\theta=-\dfrac{\pi}{12}$ は $0\leqq\theta$ を満たさない。
  - id: "3"
    text: $N=4,\quad \theta_0=\dfrac{\pi}{4}$
    rationale: |
      正解。$\dfrac{\pi}{3}\leqq u<\dfrac{13}{3}\pi$ で $\sin u=\dfrac{1}{2}$ となるのは $u=\dfrac{5}{6}\pi,\ \dfrac{13}{6}\pi,\ \dfrac{17}{6}\pi,\ \dfrac{25}{6}\pi$ の4つで、$\theta=\dfrac{u}{2}-\dfrac{\pi}{6}$ より最小は $\dfrac{\pi}{4}$。
  - id: "4"
    text: $N=4,\quad \theta_0=\dfrac{\pi}{2}$
    rationale: |
      $u$ の値は正しく求めているが、$\theta$ に戻すときに $\theta=u-\dfrac{\pi}{3}$ として2で割っていない。$2\theta=u-\dfrac{\pi}{3}$ なので $\theta=\dfrac{1}{2}\left(u-\dfrac{\pi}{3}\right)$。
answer: "3"
solution: |
  $u=2\theta+\dfrac{\pi}{3}$ とおく。$0\leqq\theta<2\pi$ より
  $$\frac{\pi}{3}\leqq u<4\pi+\frac{\pi}{3}=\frac{13}{3}\pi$$
  この範囲（単位円を2周強）で $\sin u=\dfrac{1}{2}$ を満たすのは
  $$u=\frac{5}{6}\pi,\ \frac{13}{6}\pi,\ \frac{17}{6}\pi,\ \frac{25}{6}\pi$$
  （$u=\dfrac{\pi}{6}$ は $\dfrac{\pi}{3}$ より小さいので範囲外、$\dfrac{25}{6}\pi<\dfrac{26}{6}\pi$ なので範囲内）。

  $\theta=\dfrac{1}{2}\left(u-\dfrac{\pi}{3}\right)$ より $\theta=\dfrac{\pi}{4},\ \dfrac{11}{12}\pi,\ \dfrac{5}{4}\pi,\ \dfrac{23}{12}\pi$。$N=4$、$\theta_0=\dfrac{\pi}{4}$。
concepts: [tf-equation, tf-graph]
misconceptions: [mc-tf-angle-range]
targetSeconds: 210
irt: { expectedCorrectRate: 0.5, discrimination: 1.2 }
author:
  intent: |
    角を $u=2\theta+\dfrac{\pi}{3}$ と置き換えたとき、$u$ の範囲を「2倍にする」「ずらす」の両方で正しく求められるかをみる。誤答①は2倍し忘れ、②は始点のずらし忘れ、④は $\theta$ への戻し忘れで、置き換えの3つの段階のどこで誤ったかを特定できるように作った。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: [数学II (4) ア(イ) 三角関数を含む方程式・不等式]
  variations:
    - 不等式 $\sin\left(2\theta+\dfrac{\pi}{3}\right)\geqq\dfrac{1}{2}$ にして、解が2つの区間に分かれることを確かめさせる。
    - 右辺を $k$ にして、解がちょうど3個になる $k$ を求めさせる（$u=\dfrac{\pi}{3}$ の端点が効く）。
