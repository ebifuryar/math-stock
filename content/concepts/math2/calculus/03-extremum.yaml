id: cl-extremum
kind: theorem
title: 関数の増減と極値
body: |
  ある区間で $f'(x)>0$ ならその区間で $f(x)$ は増加し、$f'(x)<0$ なら減少する。

  $x=a$ の前後で $f'(x)$ の符号が **正から負** に変われば $f(a)$ は極大値、**負から正** に変われば極小値である。$f'(a)=0$ は極値をとるための必要条件にすぎず、十分条件ではない（例: $f(x)=x^3$ は $f'(0)=0$ だが極値をもたない）。必ず増減表で符号の変化を確かめる。

  **3次関数が極値をもつ条件**: $f(x)=ax^3+bx^2+cx+d\ (a\neq 0)$ が極値をもつ $\iff$ $f'(x)=0$ が **異なる2つの実数解** をもつ $\iff$ $f'(x)=3ax^2+2bx+c$ の判別式 $D>0$。$D=0$ のときは $f'(x)$ が符号を変えないので極値をもたない。
prerequisites: [cl-derivative, qf-discriminant]
