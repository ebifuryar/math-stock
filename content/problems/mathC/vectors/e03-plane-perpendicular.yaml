id: mc-vc-e03
level: exam
format: mark
title: 平面への垂線の足と四面体の体積
stem: |
  座標空間に4点 $\mathrm{O}(0,\ 0,\ 0),\ \mathrm{A}(-1,\ 1,\ 2),\ \mathrm{B}(1,\ -1,\ 1),\ \mathrm{C}(1,\ 1,\ 0)$ がある。

  (1) $\overrightarrow{\mathrm{AB}}\cdot\overrightarrow{\mathrm{AC}}=\boxed{\text{ア}}$、$|\overrightarrow{\mathrm{AB}}|=\boxed{\text{イ}}$、$|\overrightarrow{\mathrm{AC}}|=\boxed{\text{ウ}}\sqrt{\boxed{\text{エ}}}$ であり、$\triangle\mathrm{ABC}$ の面積は $\boxed{\text{オ}}$ である。

  (2) ベクトル $\vec n=(2,\ p,\ q)$ が $\overrightarrow{\mathrm{AB}}$ と $\overrightarrow{\mathrm{AC}}$ の両方に垂直であるとき、$p=\boxed{\text{カ}},\ q=\boxed{\text{キ}}$ である。

  (3) 点 $\mathrm{O}$ から平面 $\mathrm{ABC}$ に下ろした垂線を $\mathrm{OH}$ とする。$\mathrm{H}$ の座標は $\left(\dfrac{\boxed{\text{ク}}}{\boxed{\text{ケ}}},\ \dfrac{\boxed{\text{コ}}}{\boxed{\text{サ}}},\ \dfrac{\boxed{\text{シ}}}{\boxed{\text{ス}}}\right)$ であり、$\mathrm{OH}=\boxed{\text{セ}}$ である。したがって、四面体 $\mathrm{OABC}$ の体積は $\boxed{\text{ソ}}$ である。

  (4) $\overrightarrow{\mathrm{AH}}=\dfrac{\boxed{\text{タ}}}{\boxed{\text{チ}}}\overrightarrow{\mathrm{AB}}+\dfrac{\boxed{\text{ツ}}}{\boxed{\text{テ}}}\overrightarrow{\mathrm{AC}}$ であり、$\mathrm{H}$ は $\triangle\mathrm{ABC}$ の内部にある。
