id: df-graph
kind: method
title: 増減・凹凸・変曲点・漸近線とグラフ
body: |
  **増減と極値**: $f'(x)$ の符号の変化で判定する（$f'(a)=0$ は極値の必要条件にすぎない）。

  **凹凸**: ある区間で $f''(x)>0$ なら曲線は **下に凸**、$f''(x)<0$ なら **上に凸**。凹凸が入れ替わる曲線上の点を **変曲点** という。$f''(a)=0$ であっても、$x=a$ の前後で $f''(x)$ の **符号が変わらなければ変曲点ではない**（例: $y=x^4$ の原点）。

  **漸近線**:
  - $\displaystyle\lim_{x\to a\pm 0}f(x)=\pm\infty$ なら直線 $x=a$ が漸近線（分母が $0$ になる点などを調べる）。
  - $\displaystyle\lim_{x\to\pm\infty}\{f(x)-(mx+n)\}=0$ なら直線 $y=mx+n$ が漸近線。$m=\lim\dfrac{f(x)}{x},\ n=\lim\{f(x)-mx\}$ で求める。分数関数は割り算で「整式 $+$ 真分数式」に変形するとよい。

  **グラフの概形をかく手順**: 定義域、対称性、$f'(x)$ による増減表、必要なら $f''(x)$ による凹凸、座標軸との交点、そして **定義域の端や $x\to\pm\infty$ での極限・漸近線**。増減表だけでは、グラフがどの値に近づくか（届くのか届かないのか）がわからない。$x\to\infty$ のとき $\dfrac{x^n}{e^x}\to 0$、$\dfrac{\log x}{x}\to 0$、$x\to +0$ のとき $x\log x\to 0$ を用いることが多い。
prerequisites: [cl-extremum, df-elementary]
