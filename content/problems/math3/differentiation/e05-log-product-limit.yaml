author:
  intent: |
    $\log(1+x)$ の1次・2次の評価式を微分で証明し、それを極限の計算に応用できるかをみる。(2) では「積は対数をとって和にする」「近似 $\log(1+x)\fallingdotseq x$ の誤差を (1) の左側の不等式で制御する」という2つの発想が必要で、上からの評価 $\log(1+x)<x$ だけでは極限が確定しないことに気づけるかが上位層を識別する。各項 $\dfrac{k}{n^2}\to 0$ だから積は $1$ に近づく、と答える誤り（項数 $n$ も増えることの見落とし）も排除される。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学III (2) イ(ア) 導関数を用いた関数の考察（不等式の証明）", "数学III (1) ア(ア) 数列の極限"]
  variations:
    - $\displaystyle\lim_{n\to\infty}\prod_{k=1}^{n}\left(1+\frac{k^2}{n^3}\right)$（答 $e^{\frac{1}{3}}$）に変え、誤差項の評価を同様に行わせる。
    - (1) を用いて $\displaystyle\lim_{n\to\infty}\left(1+\frac{1}{n}\right)^{n}=e$ をはさみうちで示させる。
