- id: mc-da-quartile-split
  title: 四分位数を求めるときのデータの分け方の誤り
  description: |
    データの個数 $n$ が奇数のとき、中央値を下位・上位の両方（または一方）に含めて半分に分け、第1・第3四分位数を求めてしまう。例：11個のデータで、下位を「小さい方から6個」として $Q_1$ を求める。
  cause: |
    四分位数を「下位半分の中央値」という手順でしか覚えておらず、「中央値を境にして、中央値そのものは除いた残りを半分ずつに分ける」という定義の細部を確認していない。中学で扱った方法や情報機器（表計算ソフトの関数）ごとに流儀が異なることも混乱の原因になる。$n$ が奇数のデータで、どちらの答えも選択肢に入れておくと識別できる。
  remedyConcepts: [da-quartiles-boxplot]
- id: mc-da-boxplot-reading
  title: 箱ひげ図から読み取れない情報を読み取る
  description: |
    箱ひげ図から平均値の大小を判断する、あるいは「箱（区間）が長いほうにデータが多く入っている」と考える。
  cause: |
    箱ひげ図が5数要約（最小値・$Q_1$・中央値・$Q_3$・最大値）だけから作られた図であり、各区間に入るデータの **個数** はほぼ等しく、区間の **長さ** はデータの密度の低さを表すことを理解していない。ヒストグラムの「面積（高さ）＝度数」の感覚を箱ひげ図に持ち込んでいることが多い。
  remedyConcepts: [da-quartiles-boxplot, da-representative-values]
- id: mc-da-outlier-criterion
  title: 外れ値の基準の取り違え
  description: |
    外れ値の基準を「$Q_1-(Q_3-Q_1)$ 未満」のように $1.5$ 倍を落とす、中央値から測る、あるいは見た目で離れている値をそのまま外れ値とみなす。
  cause: |
    「$Q_1-1.5\times(Q_3-Q_1)$ 未満、$Q_3+1.5\times(Q_3-Q_1)$ 超」という基準を、どの値から（四分位数から）、どれだけ（四分位範囲の1.5倍）離れているかという意味で理解せず、うろ覚えの形で適用している。基準を計算せずに見た目で判断する習慣も原因。
  remedyConcepts: [da-outliers]
- id: mc-da-linear-transform
  title: 変量変換で分散・共分散・相関係数の変化を誤る
  description: |
    $y=ax+b$ と変換したとき、分散も $a$ 倍（あるいは $b$ を加える）とする、標準偏差を $a$ 倍（$a<0$ で負）とする、共分散は単位によらず不変とする、相関係数も $a$ 倍されるとする、など。
  cause: |
    「平均が $a\bar{x}+b$ になる」ことを他の統計量にもそのまま当てはめている。出発点である「偏差が $a$ 倍になり、$b$ は打ち消される」ことから、2乗（分散 $a^2$ 倍）・平方根（標準偏差 $|a|$ 倍）・積（共分散 $ac$ 倍）・比（相関係数は符号だけ変わる）をたどっていない。
  remedyConcepts: [da-linear-transform, da-correlation]
- id: mc-da-variance-as-mean
  title: 分散を平均と同じように合成・更新する
  description: |
    2つのグループを合併するとき分散を（重み付き）平均する、データを追加・修正したとき平均が変わったのに古い平均からの偏差で計算する、平均が変わらない修正なら分散も変わらないと考える。
  cause: |
    分散は「平均からの偏差の2乗の平均」なので、基準となる平均が変われば全員の偏差が変わること、グループ間の平均の差も散らばりに寄与することを意識していない。合計と2乗の合計に戻してから再計算する手順（$\sum x^2=n(s^2+\bar{x}^2)$）を身につけていない。
  remedyConcepts: [da-variance-formula, da-variance]
- id: mc-da-correlation-causation
  title: 相関関係を因果関係・確定的な関係と混同する
  description: |
    正の相関があることから「一方を増やせば他方も増える」と結論する、あるいは「$x$ が平均より大きい人は全員 $y$ も平均より大きい」と考える。
  cause: |
    相関係数は散布図の点の **全体的な傾向**（直線へのまとまり具合）を表すだけで、個々のデータについて何も保証しないこと、また第3の要因による見かけの相関があり得ることを理解していない。日常語の「関係がある」を因果の意味で読んでしまう。
  remedyConcepts: [da-correlation]
- id: mc-da-hypothesis-accept-null
  title: 仮説が否定されないことを「仮説が正しいと証明された」と解釈する
  description: |
    仮説検定で確率が基準（5%）より大きかったとき、「コインは公正であることがわかった」「効果がないことが確かめられた」と結論する。
  cause: |
    仮説検定は「仮説のもとで観測結果が起こりにくいなら仮説を否定する」という一方向の論理であり、起こりにくくなかった場合は「否定する根拠がない」だけだという非対称性を理解していない。「判断できない」という結論の形に慣れていない。
  remedyConcepts: [da-hypothesis-testing]
- id: mc-da-hypothesis-point-prob
  title: 観測値ちょうどの確率で判断する
  description: |
    「10回中8回表」の判断を、表が **ちょうど8回** 出る確率（約 $4.4\%$）で行い、基準の5%より小さいので仮説を否定してしまう。
  cause: |
    試行回数が増えると、どの結果も「ちょうどその値」になる確率は小さくなるので、ちょうどの確率では何でも珍しく見えてしまう。検定で評価すべきなのは「観測値 **以上に極端な** 結果がまとめて起こる確率」であるという理由を理解していない。
  remedyConcepts: [da-hypothesis-testing]
