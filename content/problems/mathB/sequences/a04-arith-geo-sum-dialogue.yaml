author:
  intent: |
    （等差）×（等比）型の和を $S-rS$ で求める手順を、会話形式の誘導で一段ずつ確認する。最もつまずきやすい「中央の等比数列の項数（$n-1$）」と「最後に余る $-(2n-1)\cdot 2^n$」を空欄イ・ウとエ〜カで分けて問い、どの段階で誤ったかを特定できるようにした。項数を $n$ として $2^{n+1}-2$ とすると $S_n=(2n-5)\cdot 2^n+3$ となり、$n=1$ で $-3$ になるので、検算で気づけるかもみる。最後のキは、得た式を具体的な数値の判断に使う力を問う。
  assessedAbilities: [知識・技能, 思考力・判断力・表現力]
  curriculumRefs: ["数学B (1) ア(イ) いろいろな数列（和の求め方）", "数学B (1) イ(ア) 数列の考えを事象の考察に活用する"]
  variations:
    - 公比を $\dfrac{1}{2}$ にした $\displaystyle\sum_{k=1}^{n}\frac{k}{2^k}$ を扱い、$S-\dfrac{1}{2}S$ で求めさせる。
    - $S_n=(an+b)\cdot 2^n+c$ とおいて $S_n-S_{n-1}$ と比較し、係数を決める別解を会話で示す。
